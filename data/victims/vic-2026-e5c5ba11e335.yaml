description: |-
  •
  جاویدنام: امید(مهدی) مهدوی اقدم،
  ۴۰ ساله و احتمالا ساکن تهران؛
  جاودانه شد: ۱۴ مهر ۱۴۰۱.

  امید روز چهارم مهر در اعتراضات سراسری ضد حکومتی در هفت‌حوض نارمک‌بر اثر ضربات باتوم نیروهای نظامی حکومت به کما رفت. او ده روز بعد در بیمارستان تجریش جان باخت.
  پیکر او را روز شانزده مهر در آرامستان بهشت زهرا تهران به خاک سپردند.
  امید متاهل و دارای فرزند بود.

