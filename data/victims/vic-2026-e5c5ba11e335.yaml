  Omid (Mehdi) Mahdavi Aghdam,
  40 years old and (probably) from Tehran;
  He was killed on 6 October 2022.

  On September 26, Omid fell into a coma due to the baton blows of the repressors during the nationwide anti-government protests in Nabovvat Square (Seven Basin), Narmak. He died ten days later in Shohadaye Tajrish Hospital.
  His body was buried in Behesht Zahra Cemetery in Tehran on October 8.
  Omid was married and had children.

