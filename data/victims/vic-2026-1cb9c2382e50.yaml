  Abdollah Narouei son of Abdul Majid,
  30 Years old from Shirabad of Zahedan.
  Was killed on Sep 30, 2022.

  Abdollah was killed on Bloody Friday of Zahedan by IRI regime security forces bullets. He was married and father of five children.

