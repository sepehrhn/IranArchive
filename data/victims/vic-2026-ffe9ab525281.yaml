  Jaber Shirozehi, son of Ahmad,
  12 years old, from Shirabad, Zahedan;
  He was killed on 30 September 2022.

  Jaber tragically lost his life on 30th September, known as #BloodyFridayZahedan, due to being struck by a military bullet fired by the Revolutionary Guards.(#IRGC)

