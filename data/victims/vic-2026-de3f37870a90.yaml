description: |-
  •
  جاویدنام: امید حسنی،
  ۲۲ ساله و اهل روستای پایگِلان، شهرستان سروآباد کردستان؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  امید حسنی در جریان اعتراضات سراسری ضد حکومتی روز ۲۶ آبان در سنندج بازداشت شد و‌ پس از انتقال به کلانتری «دوازده فروردین» در سنندج بر اثر شکنجه و ضربات باتوم ماموران امنیتی حکومت کشته شد.
  نیروهای سپاه پیکر بیهوش امید را به بیمارستان توحید سنندج منتقل کردند، اما بر اساس اظهارات یکی از پرسنل بیمارستان، امید از همان زمان انتقال به بیمارستان فاقد علائم حیاتی بود.
  بعد از چند ساعت نیروهای سپاه پیکر او را بدون اطلاع خانواده ربودند. آنها اجازه ندادند پرسنل درمان از پیکر امید که به شدت از ناحیه سر و گردن مورد ضرب و شتم قرار گرفته بود عکس بگیرند.
  پیکر امید شامگاه جمعه ۲۷ آبان، تنها با حضور دو نفر از اعضای خانواده‌اش در آرامستان «بهشت محمدی» سنندج به خاک سپرده شد.

