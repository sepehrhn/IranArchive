  Omid Hassani,
  22 years old, from Paygelan Village, Sarvabad County, Kurdistan;
  He was killed on 17th November 2022.

  Omid Hassani was arrested during the nationwide anti-government protests on the 17th of November in Sanandaj. After being transferred to the "12 Farvardin" police station in Sanandaj, he was subjected to torture and severe beatings by government security forces, which led to his death.

  The Revolutionary Guards took Omid's unconscious body to the „Tohid“Hospital in Sanandaj. However, according to a hospital staff member, Omid showed no signs of life even at the time of arrival.
  After a few hours, the Revolutionary Guards abducted Omid's body without informing his family. They didn't allow hospital staff to take photographs of Omid's body, which had been severely beaten around the head and neck.

  Omid's body was buried in the "Behesht Mohammadi" cemetery in Sanandaj on the evening of Saturday, 18th of November, with only two family members present.

