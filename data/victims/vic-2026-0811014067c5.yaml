description: |-
  •
  جاویدنام: ابراهیم شریفی‌فر،
  ۲۹ ساله، اهل بوکان، آذربایجان غربی؛
  جاودانه شد: ۸ آذر ۱۴۰۱.

  ابراهیم در اعتراضات سراسری ضد حکومتی بوکان، روز ۲۵ آبان با اصابت بیش از ۶۰ گلوله ساچمه‌ای نظامیان سپاه از فاصله نزدیک به سینه‌اش به شدت مجروح شد. او را یک روز بعد به بیمارستان «سیدالشهدا» ارومیه منتقل کردند. ابراهیم روز سه‌شنبه ۸ آذر بر اثر شدت جراحات در بیمارستان جان باخت.
  پیکر او در آرامستان شهر بوکان به خاک سپرده شد. پدر ابراهیم روز خاکسپاری فرزندش گفت: «ابراهیم بعد از زخمی شدن یک شب در خانه ماند. به من گفت: بابا! من زنده نخواهم ماند اما بعد از مرگم اعلام کنید که او در راه آزادی کردستان شهید شد.»
  ابراهیم تا مقطع راهنمایی درس خوانده بود. پس از آن شروع به کار کرد. شغل او آرماتوربندی بود. ابراهیم ورزشکار بود.

