  Ebrahim Sharififar,
  29 years old,from Bukan, West Azarbaijan,
  He was killed on 29th November 2022.

  During the nationwide anti-government protests in Bukan, on November 16, Ebrahim was severely injured when he was hit by over 60 pellets fired by the Revolutionary Guards' military forces (#IRGC) at close range, hitting his chest. He was transferred to "Seyed al-Shohada" Hospital in Urmia the next day. Ebrahim passed away on Wednesday, November 29, due to the severity of his injuries at the hospital.

  His body was laid to rest in Bukan's cemetery. On the day of his burial, Ebrahim's father said, "After being wounded, Ebrahim stayed at home for a night. He said to me, 'Father! I will not remain alive, but after my death, announce that he became a martyr on the path to the freedom of Kurdistan.'"
  Ebrahim had completed his guidance school education and began working afterward. His profession was ironworking. Ebrahim was also an athlete.

