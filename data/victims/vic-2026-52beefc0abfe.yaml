description: "•\nجاویدنام امید آلاده (ریگی)\n۲۵ ساله و اهل زاهدان\nجاودانه شد: ۲۰ آبان ۱۴۰۱\n\nامید ساکن منطقه جام جم زاهدان روز جمعه ۲۰ آبان حدود ساعت دو بعدازظهر همراه با دوستش اسماعیل ریگی با موتور در نزدیکی ورودی شهر زاهدان در حرکت بودند که توسط نیروهای نظامی و لباس شخصی حکومت، بدون هیچ دلیل و یا هشدار قبلی به رگبار بسته و کشته شدند.\n\n*چنانچه اطلاعات بیشتری دارید لطفا با ما در میان بگذارید!\n\n#امید_آلاده \n#انقلاب_ملی_ایران_۱۴۰۱ \n#انقلاب_ملی_ایران \n#زاهدان #سیستان_بلوچستان\n#مهسا_امینی \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nOmid Aladeh (Rigi),\n25 years old from Zahedan;\n\_He was killed on 11 November.\n\nOmid a resident of Jam-e-Jam in Zahedan, on Nov 11th\_22, he was driving a motorcycle near the Zahedan’s entrance along with his friend Esmaeil Rigi when the military forces and government police force start firing at them without any reason or warning and killed them both.\n\n#OmidAladeh\n#iranrevoulotion\n#IranRevolution2022\n#Zahedan #sistan_and_baluchestan\n#MahsaAmini"
