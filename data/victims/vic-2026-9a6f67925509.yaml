description: غزل قلندری، دانش‌آموز ۱۶ساله اهل یاسوج است. در سه‌شنبه ۳۰ دی‌ماه با یورش خشونت‌آمیز نیروهای امنیتی به منزلش بازداشت شد. گزارش‌ شده که چندین خودرو و مأموران نقاب‌دار، بدون ارائهٔ حکم قضایی، به خانهٔ او هجوم برده و او را با خود برده‌اند نهاد بازدداشت‌کننده‌ و محل نگهداری‌اش مشخص نیست. جانش در خطر است. صدای او باشیم.
