  Mehrdad Ghorbani,
  18 years old, from Zanjan;
  He was killed on 21th September 2022.

  During nationwide anti-government protests in following the killing of #MahsaAmini, government military forces shot Mehrdad from close range and from behind during clashes near Standard Square, in front of the Zanjan Intelligence Office. 35 rubber bullets hit his head and body. Mehrdad had heard that security forces were abducting injured protesters from hospitals, so he asked those who intended to take him to the hospital to take him home. Mehrdad lost his life before reaching home.

  Security forces told Mehrdad's family that they would deliver his body to them in exchange for blood money, silence, and not disclosing how their son had died. However, Mehrdad's family refused to remain silent.

  Mehrdad's mother said at her son's graveside, "Mehrdad's mother said, "I swear to God, even if I die, I will stand." His sister said, "Continue the path of Mehrdads! These young people don't need condolences."

