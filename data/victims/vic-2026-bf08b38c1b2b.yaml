description: |-
  ⭕️
  جاویدنام: مهرداد قربانی،
  ۱۸ ساله و اهل زنجان؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

   در جریان تظاهرات سراسری ضد حکومتی در اعتراض به کشته شدن #مهسا_امینی؛ نیروهای نظامی حکومت در حوالی میدان استاندارد، مقابل اداره اطلاعات زنجان  از فاصله نزدیک و از پشت سر به مهرداد شلیک کردند. ۳۵ گلوله ساچمه‌ای به سر و پیکر او اصابت کرد. مهرداد شنیده بود که نیروهای امنیتی مجروحان اعتراضات را در بیمارستان‌ها می‌ربایند؛ از این‌رو به کسانی که قصد داشتند او را به بیمارستان ببرند گفت که او را به خانه‌اش برسانند. مهرداد پیش از رسیدن به خانه جان باخت.
  نیروهای امنیتی به خانواده مهرداد گفتند که در ازای دریافت پول خون و سکوت و عدم اطلاع‌رسانی آنها راجع به نحوه مرگ فرزندشان پیکر او را به خانواده‌اش تحویل خواهند داد. خانواده مهرداد اما حاضر به سکوت نشدند.
  مادر مهرداد سر مزار فرزندش گفت: «به خدا قسم بمیرم هم می‌ایستم». خواهر او گفت: «راه مهرداد قربانی‌ها را ادامه بدید! این جوان‌ها نیاز به فاتحه ندارند.»

