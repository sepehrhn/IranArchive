  Hamzeh Narooie son of Mohammad,
  36 Years old from Zahedan;
  Was killed on Sep 30, 2022.

  On Friday Sep 30, Hamzeh was still in praying area that was killed by two bullets of IRI armed forces on his side and his foot. Hamzeh’s wife was pregnant and his child was born just two days after Hamzeh was killed.
