  ۲۶ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  روز «جمعه خونین» زاهدان؛ حمزه در مصلی مکی سر نماز بود که با اصابت دو گلوله ماموران سپاه به پهلو و پایش کشته شد.
  همسر حمزه حامله و پا به ماه بود. نوزاد او «لیلا» دو روز بعد از کشته شدن پدرش به دنیا آمد.

