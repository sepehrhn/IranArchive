description: |-
  ⭕️
  جاویدنام: سیاوش محمودی فرزند لیلا،
  ۱۶ ساله و اهل تهران؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  سیاوش در تظاهرات سراسری در محله علی‌آباد در منطقه ۱۶ تهران با اصابت گلوله نیروهای سرکوبگر حکومت از پشت به سرش کشته شد.
  پیکر او را در بهشت زهرا به خاک سپردند.
  چند روز پس از کشته شدن سیاوش، مادر او لیلا با در دست داشتن عکس فرزندش در محل تیر خوردن او فریاد می‌زد:
  «این سیاوش من است، او را با بی‌پدری بزرگ کردم. بچه مرا کشتند. گلوله به سرش زدند. این سیاوش من است. سیاوش محمودی.»
  مراسم چهلم سیاوش ۱۰ آبان با حضور جمعیت زیادی از مردم برگزار شد که شعارهای : «مرگ بر دیکتاتور» و «سیاوش عزیزم! خونت رو‌ پس می‌گیرم» سر دادند.

