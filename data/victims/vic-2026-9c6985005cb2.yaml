  Siavash Mahmoudi, son of Leila,
   16 years old, from Tehran;
   He was killed on 21 September 2022.

  Siavash was killed by a bullet shot in the head by the government's forces during a national demonstration in Aliabad neighborhood, Tehran.
   His body was buried in Behesht Zahra, Tehran.
  A few days after Siavash was killed, his mother Leila, holding a photo of her son in her hand, screamed at the place where he was shot:
   “This is my Sivash, I raised him without a father.  They killed my child.  They shot him in the head.  This is my Sivash.  Siavash Mahmoudi."
   The 40th mourning ceremony was held while large crowd of people chanted the slogans: "Death to the dictator" and "My dear Siavash!" We will take revenge of your blood".

