  Freshteh Ahmadi
  32 years old, from Sardasht, residing in Mahabad
  She was killed on 27 October 2022.

  Freshteh was fatally shot in the chest by the military forces of the Revolutionary Guards during the nationwide anti-government protests in Mahabad, while she was standing on the rooftop of her house on Friday evening, the 5th of Aban.
  The security forces put pressure on Freshteh's family to bury her at night, but her family strongly opposed. The security forces also did not allow Freshteh's family to take her body to her hometown of Sardasht for burial.
  Freshteh's body was finally laid to rest on Saturday, the 6th of Aban, in Hamzeabad village near Mahabad.
  Freshteh Ahmadi was the mother of two young children.

