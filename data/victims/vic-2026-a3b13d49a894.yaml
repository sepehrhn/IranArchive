description: |-
  •
  جاویدنام: فرشته احمدی،
  ۳۲ ساله و اهل سردشت، ساکن مهاباد؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  فرشته شامگاه پنجشنبه پنجم آبان؛ در جریان اعتراضات سراسری ضد حکومتی در مهاباد، در حالیکه پشت بام خانه‌اش ایستاده بود مورد اصابت گلوله نظامیان سپاه به سینه‌اش قرار گرفت و کشته شد.
  نیروهای اطلاعاتی خانواده فرشته را تحت فشار گذاشتند که شبانه پیکر او را به خاک بسپارند. اما خانواده فرشته به شدت مخالفت کردند. نیروهای امنیتی همچنین اجازه ندادند خانواده فرشته پیکر او را برای خاکسپاری به شهر زادگاهش سردشت ببرند.
  پیکر فرشته را روز جمعه ششم آبان ماه در روستای حمزه‌آباد مهاباد به خاک سپردند.
  فرشته احمدی مادر دو فرزند خردسال بود.

