  Masoud Ahmadzadeh
  27 years old, from Mahabad, Kurdistan;
  He was killed on 28 October 2022.

  Masoud was severely injured on the 27th of October during the nationwide anti-government protests in Mahabad, when he was struck by a military bullet fired by the Sepah forces. Due to the severity of his injuries, he passed away the following day.
  The funeral ceremony for Masoud, accompanied by a large gathering of mourners who chanted slogans against the government, took place on the 28th of October .

  Masoud was a dentist by profession. He was a young athlete who loved dancing and enjoying life.

