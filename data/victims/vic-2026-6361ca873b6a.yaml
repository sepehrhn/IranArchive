  جاویدنام: مسعود احمدزاده،
  ۲۷ ساله و اهل مهاباد، کردستان؛
  جاودانه شد: ۶ آبان ۱۴۰۱.

  مسعود در اعتراضات سراسری ضد حکومتی در مهاباد، روز ۵ آبان ماه با اصابت گلوله جنگی نظامیان سپاه به شدت مجروح شد. او یک روز بعد به دلیل شدت جراحات جان باخت.
  مراسم خاکسپاری پیکر مسعود روز ۶ آبان با حضور گسترده سوگواران معترضی که شعارهایی علیه حکومت می‌دادند برگزار شد.
  مسعود دکتر دندانپزشک بود. او جوانی ورزشکار و عاشق رقص و زندگی بود.

