  Sara Tabrizi
  20 years old, from Tehran;
  She was killed on March 25, 2024

  Sara was a young 20-year-old woman who, in the wake of Iran’s national uprising following the killing of #MahsaAmini, faced continuous security pressures and threats due to her protests and attempt to leave the country.
  On November 16, 2023, as she prepared to travel to the United Kingdom, Sara was detained with a companion at Imam Khomeini Airport by intelligence forces and transferred to Ward 209 of Evin Prison.
  During her first three days in solitary confinement, the stress caused her heart rate and blood pressure to spike, eventually landing her in the prison clinic.

