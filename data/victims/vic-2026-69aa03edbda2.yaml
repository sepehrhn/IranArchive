  جاویدنام: سارا تبریزی
  ۲۰ ساله، اهل تهران؛
  جاودانه شد: ۵ فروردین ۱۴۰۳

  در جریان خیزش ملی ایرانیان به دنبال کشته شدن #مهسا_امینی؛ سارا به دلیل فعالیت‌های اعتراضی و همچنین تلاش برای خروج از کشور، تحت فشار و تهدیدهای مداوم امنیتی قرار داشت. او روز ۲۵ آبان ۱۴۰۲، زمانی که قصد سفر به بریتانیا داشت، در فرودگاه «امام خمینی» به همراه یکی از نزدیکانش توسط نیروهای وزارت اطلاعات بازداشت و به بند ۲۰۹ زندان اوین منتقل شد.

  سه روز نخست بازداشتش را در انفرادی سپری کرد؛ جایی که به دلیل استرس، دچار افزایش ضربان قلب و فشار خون شد و در نهایت به بهداری زندان منتقل شد. با گذشت حدود ۱۰ روز و با پایان بازجویی‌ها، با وثیقه‌ای سنگین از زندان آزاد شد. اما این آزادی پایان فشارها نبود. پس از آزادی، بارها از سوی بازجویان تهدید شد که اگر با آن‌ها همکاری نکند، اطلاعات شخصی‌اش به طور عمومی منتشر خواهد شد.

  در تاریخ ۱۸ دی ۱۴۰۲ دوباره به اوین احضار شد، وثیقه‌اش دو برابر شد، و بار دیگر با رهایی موقت به خانه بازگشت. این فشارهای سنگین، اثرات عمیقی بر وضعیت روانی سارا داشت، و او از ترس احضارها و تهدیدات مداوم در نگرانی و هراس به سر می‌برد.

  سرانجام، پس از آخرین احضار در تاریخ ۴ فروردین ۱۴۰۳ به وزارت اطلاعات، پیکر بی‌جانش روز پنجم فروردین در خانه والدینش در تهران پیدا شد. پزشکی قانونی، علت مرگ او را «خودکشی از طریق خوردن قرص» اعلام کرد.
  پیکر سارا روز ششم فروردین در شهرک «اسکمان» استان تهران به خاک سپرده شد.

