  Parmis Hamnava
  14 years old, from Iranshahr, Sistan and Baluchestan;
  She was killed on 26th October 2022.

  Parmis was a 14-year-old student in the third grade of Parvin Etesami Middle School in Iranshahr. On Tuesday, 25th October security forces of the Islamic Republic government, with the cooperation of one of the school administrators named "Bokharaei," whose spouse works as an employee in the Ministry of Intelligence in Iranshahr, raided the school to inspect the students' books. They severely beat Parmis in front of other students because she had torn a picture of Khomeini from the first page of her book, causing her nose to bleed. She was subsequently transferred to the hospital. The following day, on Aban 4, Parmis passed away in the hospital.

  Government forces threatened Parmis's family, teachers, and classmates, stating that they would hand over Parmis's body to the family only if they remained silent. Parmis's family transported her body to Zahedan for burial.

