  ⭕️
  جاویدنام: پاریس همنوا
  ۱۴ ساله و اهل ایرانشهر؛
  جاودانه شد: ۴آبان ۱۴۰۱.

  پارمیس‌ دانش‌آموز پایه سوم‌مدرسه راهنمایی «پروین اعتصامی» ایرانشهر بود. روز سه‌شنبه ۳ آبان ماموران امنیتی حکومت جمهوری اسلامی با همکاری یکی از مدیران مدرسه به نام «بخارایی» که همسر وی کارمند وزارت اطلاعات در ایرانشهر است، به مدرسه یورش می‌برند تا کتابهای دانش‌آموزان را تفتیش کنند.
  آنها پارمیس را که عکس خمینی را از صفحه اول کتابش کنده بود مقابل دیدگان سایر دانش‌آموزان به شدت کتک زدند تا جایی که بینی‌اش خونریزی کرد و به بیمارستان منتقل شد. فردای آن روز چهارم آبان پارمیس در بیمارستان درگذشت.
  نیروهای حکومتی خانواده و معلمان و همکلاسی‌های پارمیس را تهدید کردند که پیکر پارمیس را به شرط سکوت به خانواده تحویل می‌دهند. پیکر پارمیس را خانواده‌اش برای خاکسپاری به زاهدن منتقل کردند.

