description: |-
  •
  جاویدنام: یونس (محمد) سلحشوران (میر بلوچ‌زهی)؛
  ۲۳ ساله، اهل شهرستان تفتان، سیستان و بلوچستان؛
  جاودانه شد: ۱۳ آبان ۱۴۰۱.

  یونس روز #جمعه_خونین_خاش  در تظاهرات اعتراضی بعد از نماز در مقابل فرمانداری، مورد اصابت گلوله تک‌تیراندازان سپاه که روی پشت‌بام‌ ساختمان‌های اطراف فرمانداری کمین کرده بودند قرار گرفت و کشته شد.
  پیکر او در روستای محل سکونتش «نازیل» در شهرستان تفتان به خاک سپرده شد.

