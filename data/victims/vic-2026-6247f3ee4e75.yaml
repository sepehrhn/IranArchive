  Yunes (Mohammad) Salahshuran (MirBaluch Zehi),
  23 years old, from Taftan city, Sistan and Baluchistan;
  He was killed on 4th November 2022.

  On #BloodyFridayOfKash ,during a protest demonstration after prayers in front of the governor's office, Younes was shot by #IRGC snipers who were lurking on the roofs of buildings around the governor's office and killed.
  His body was buried in the village where he lived "Nazil" in Taftan city.

