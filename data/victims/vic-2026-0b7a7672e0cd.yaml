  جاویدنام: عرفان مرادی،
  ۲۴ ساله، اهل اردبیل؛
  جاودانه شد: ۱۰ آبان ۱۴۰۱.

  در جریان خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی، روز ده آبان؛ عرفان، ستوان وظیفه یگان ویژه نیروی انتظامی زنجان، در پادگان محل خدمتش مورد اصابت گلوله از فاصله نزدیک به قلبش قرار گرفت و کشته شد.
  یک روز قبل فرمانده تیپ آنها (سرهنگ زمانی) به عرفان و یکی از هم‌خدمتی‌های او دستور داد در تظاهرات ضد حکومتی در زنجان به سمت معترضانی که قصد نزدیک شدن به بانک ملت یا دفتر امام جمعه زنجان را دارند شلیک کنند. عرفان از دستور سر باز زد.
  نیروهای امنیتی ابتدا به خانواده عرفان گفتند که او نیمه شب در برجک نگهبانی خودکشی کرده است و فیلم دوربین‌های مداربسته موجود است. اما وقتی خانواده برای دیدن فیلم به پادگان مراجعه کردند به آنها گفته شدحادثه در حیاط پادگان رخ داده و از نشان دادن فیلم دوربین مداربسته به آنها امتناع کردند.
  پیکر عرفان روز ۱۱ آبان بدون گواهی فوت و گزارش پزشکی در زنجان به خاک سپرده شد.
  خانواده عرفان بعد از کشته شدن عرفان به دستگاه قضایی اعلام شکایت کردند اما پرونده شکایت آنها بدون پیگیری و پاسخی یک ماه بعد مختومه اعلام شد.
  عرفان تنها فرزند پسر خانواده بود. او پس از اتمام دانشگاه راهی خدمت اجباری سربازی شد، اما مدت کوتاهی بعد برای اینکه حاضر نشد در سرکوب هموطنانش مشارکت کند، توسط حکومت کشته شد.

