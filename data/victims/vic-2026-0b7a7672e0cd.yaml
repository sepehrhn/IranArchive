  Erfan Moradi,
  24 years old, from Ardabil;
  He was killed on 1th November 2022.

  During the Iranian national uprising against the Islamic Republic government on November 1, Erfan, a Special Unit officer in the Zanjan law enforcement, was shot at close range in his heart inside the barracks where he served and was killed.

  A day before, their unit commander (Colonel Zamani) ordered Erfan and one of his colleagues to open fire on protesters approaching Mellat Bank or office of the Zanjan “Friday Prayer Leader” during anti-government demonstrations in Zanjan. Erfan refused to comply with the order.

