  Parisa Askari,
  26 years old, from Aligudarz, living in Tehran;
  She was killed on 13th October 2022.

  During the nationwide anti-government protests in Tehran, on October 13, Parisa was hit by military forces' gunfire and killed. In another account, it is said that Parisa suffered internal bleeding due to baton blows to her head and body and was killed.

  Parisa's body was laid to rest in the "Golzar Shohada" cemetery in Aligudarz.

  Parisa was a law student at the University of Tehran.

