description: |-
  •
  جاویدنام: پریسا عسکری،
  ۲۶ ساله، اهل الیگودرز، ساکن تهران؛
  جاودانه شد: ۲۱ مهر ۱۴۰۱.

  پریسا در جریان اعتراضات سراسری ضد حکومتی در تهران، روز ۲۱ مهر ماه مورد اصابت گلوله جنگی نیروهای نظامی حکومت قرار گرفت و کشته شد. در روایت دیگری گفته شده که پریسا بر اثر اصابت ضربات باتوم به سر و بدنش دچار خونریزی داخلی شد و کشته شد.
  پیکر پریسا در آرامستان «گلزار شهدا» الیگودرز به خاک سپرده شد.
  پریسا دانشجوی رشته حقوق دانشگاه تهران بود.

