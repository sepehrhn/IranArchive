description: |-
  •
  جاویدنام: شاهو بهمنی،
  ۲۴ ساله، اهل روستای تازآباد از توابع دیواندره، کردستان؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  شاهو در مراسم چهلم کشته‌شدگان اعتراضات سراسری ضد حکومتی در سنندج کشته شد. ماموران امنیتی نظامی حکومت به بیمارستان کوثر سنندج رفتند و خانواده بهمنی را تهدید کردند که چنانچه سوگواران معترض از جلو بیمارستان پراکنده نشوند اجازه ترخیص جسد را نخواهند داد. مردم به سختی توانستند پیکر شاهو را پس بگیرند و شبانه در آرامستان «بهشت محمدی» سنندج به خاک بسپارند.
  مراسم چهلم شاهو بهمنی روز پنجم دی ماه در قطعه ۱۲ بهشت محمدی برگزار شد.

