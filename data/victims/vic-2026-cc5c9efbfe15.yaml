  Shahoo Bahmani
  24 years old, From Tazabad Village, Divandarreh, Kurdistan
  He was Killed on 17 November 2022.

  Shahoo was killed during the 40th-day mourning ceremony for the victims of nationwide anti-government protests in Sanandaj. Military security forces of the government went to Koosar Hospital in Sanandaj and threatened the Bahmani family, stating that they would not allow the release of the body if protesting mourners did not disperse from in front of the hospital. The people struggled to retrieve Shahoo's body and finally buried him during the night in Sanandaj's "Behesht Mohammadieh" Cemetery.

  The 40th-day mourning ceremony for Shahoo Bahmani was held on the fifth day of Dey (December 26th) in Section 12 of Behesht Mohammadieh Cemetery.

