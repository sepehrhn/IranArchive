description: Father of three children from Abbar city, center of Tarom county in Zanjan province. Shot from behind with a war bullet by suppression forces firing from inside the governor's office during a night when more than half of this small city of 10,000 people had come to the streets in support of Crown Prince Reza Pahlavi's call. Suppression forces confiscated a property deed worth several billion tomans to release his body and made his family pledge not to hold funeral ceremonies.
