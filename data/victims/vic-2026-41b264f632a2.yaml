  Foad Mohammadi
  38 years old, from Kamyaran, Kurdistan;
  He was killed on 15 November 2022.

  Foad was fatally shot during the nationwide anti-government protests in Kamyaran. He was hit by a military bullet fired by the Revolutionary Guards and sustained severe injuries. After being transferred to the hospital, he succumbed to his wounds.

  Foad's body was laid to rest in the village cemetery of "Mavian" with the presence of the people of Kamyaran, who chanted anti-government slogans.

  On the day of Foad's burial, his wife Soheila Ebrahimi said, "Foad was against the class-based system and opposed the exploitation of workers. He believed that society cannot be free until women are liberated."
  Foad was married and had two children.

