description: |-
  •
  جاویدنام: فواد محمدی،
  ۳۸ ساله، اهل کامیاران، کردستان؛
  جاودانه شد: ۲۴ آبان ۱۴۰۱.

  فواد در جریان اعتراضات سراسری ضد حکومتی در کامیاران مورد اصابت گلوله جنگی نظامیان سپاه قرار گرفت و مجروح شد. او پس از انتقال به بیمارستان جان باخت.
  پیکر فواد با حضور مردم کامیاران که شعارهای ضد حکومتی می‌دادند در آرامستان روستای «ماویان» به خاک سپرده شد.
  سهیلا ابراهیمی همسر فواد روز خاکسپاری او گفت:« فواد مخالف سیستم طبقاتی بود، مخالف استثمار کارگران بود. او می‌گفت تا زن آزاد نشود جامعه آزاد نخواهد شد.»
  فواد متاهل و دارای دو فرزند بود.

