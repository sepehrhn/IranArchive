  Dastan Rasoul
  20 years old, from Sharbajir, Marouh, Kurdistan;
  He was killed on 28th October 2022.

  Dastan Rasoul, a 20-year-old resident of Sharbajir in Marouh, Kurdistan, was killed on November 28, 2022. He had set out to participate in the mourning ceremony for the fallen martyr, #Matlab_Saeedpour, who had been killed the day before by the Revolutionary Guards. Dastan's destination was the village of "Chouman" in Baneh. However, the military forces blocked the road and opened fire, resulting in his immediate death. Two others who were accompanying him sustained injuries.

