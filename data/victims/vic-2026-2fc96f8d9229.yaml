description: |-
  •
  جاویدنام: محمدحسن ترکمان،
  ۲۷ ساله، اهل شاهین‌شهر اصفهان؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  «به شخصه یه اعتراض نمادین من تو این بابل ببینم حمایت می‌کنم. لعنتیا یه کم فقط»
  این از توئیت‌های آخر محمدحسن بود. او در تظاهرات اعتراضی به قتل حکومتی #مهسا_امینی نزدیک فرمانداری بابل با اصابت ۳ گلوله به پیشانی و پهلویش کشته شد. قرار بود آنروز بعد از بستن مغازه‌اش به دیدن دوستش برود. دوستش که نگران نیامدنش شده بود چندین بار با او تماس گرفت که کسی پاسخ نداد. بعد از ساعتها مردی با تلفن  محمدحسن با دوست او تماس گرفت و گفت: «رفیقت را زده‌اند در حد موت و الان بیمارستان بهشتی بابل است» و بعد فوتش را اعلام کردند.
  پدر و برادر محمدحسن تهران بودند که با آنها تماس گرفتند و خبر کشته شدن او را دادند. وقتی به بیمارستان رسیدند پدر محمدحسن سکته کرد و به آی‌سی‌یو منتقل شد.
  ماموران امنیتی خانواده ترکمان را تحت فشار گذاشتند که بگویند او تصادف کرده وگرنه پیکر محمدحسن را تحویل نخواهند داد. آقای ترکمان جانباز جنگ ایران و عراق است و همین موجب شد نهایتا بتواند موافقت نیروهای امنیتی را برای انتقال پیکر فرزندش بگیرد.
  پیکر محمدحسن ۲مهر توسط نیروهای امنیتی به شاهین‌شهر منتقل شد. خاکسپاری ۳ مهر در شرایط امنیتی در آرامستان «بهشت معصومه» این شهر انجام شد.
  محمدحسن دانشجو رشته مدیریت بازرگانی دانشگاه آزاد بابل بود. او‌ دانشگاه را رها کرده بود اما هم‌چنان در بابل ماندگار شده بود و کار می‌کرد.

