  Mohammad Hassan Torkaman,
  27 years old and from Shahinshahr, Isfahan,
  He was killed on 21 September 2022 in Babol.

  "Personally, If I see any protest in Babol, I will definitely support it. Damn, just a little"
  This was one of Mohammad Hassan's last tweets. He was killed by three bullets in his forehead and side during nationwide protests near the governorate of Babol city. He was supposed to go to his friend's house after closing his store that day. His friend, who was worried about him, called him several times, but he did not get any answer. After hours, a man called his friend using Mohammad Hassan’s cellphone and said: "Your friend has been shot, his condition is critical and now he is in the Beheshti Hospital of Babol".
