  Najmuddin Tajik son of Hafizullah,
  Age unknown from Afghanistan;
  Was killed on Sep 30, 2022.

  Najmuddin was an Afghan labor who could find his way to Iran from tortures and suppresses of Taliban but he was killed by IRI regime suppressor’s bullets on bloody Friday of Zahedan.

