  Hassan Zahiri,
  26 years old, from Lashkar Abad, Ahvaz;
  He was killed on 22th February 2023.

  On the evening of Wednesday, 22th February, law enforcement officers stopped Hassan as he was returning home on his motorcycle from work. Hassan, who didn't hear the order to stop, continued on his way. Then, an officer from the law enforcement force, without warning, shot Hassan and killed him.
  Since the beginning of the Iranian National Uprising against the Islamic Republic government, indiscriminate and baseless shootings at vehicles on the roads and individuals labeled as "suspicious" by the government have increased multiple times.

