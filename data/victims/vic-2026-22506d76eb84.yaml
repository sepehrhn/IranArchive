description: |-
  •
  جاویدنام: حسن زهیری،
  ۲۶ ساله، اهل لشکرآباد اهواز؛
  جاودانه شد: ۳ اسفند ۱۴۰۱.

  شامگاه روز چهارشنبه ۳ اسفند ماموران نیروی انتظامی به زهیر که با موتورش از محل کار به خانه بر‌می‌گشت ایست می‌دهند. حسن که فرمان ایست را نشنیده بود به راهش ادامه می‌دهد. سپس یک مامور نیروی انتظامی بدون اخطار به سر حسن شلیک کرده و او را می‌کشد.
  از زمان آغاز خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی شلیک‌های بی‌ضابطه و بی‌دلیل به اتومبیل‌ها در جاده‌ها و افرادی که حکومت در نهایت آنها را «مشکوک» می‌خواند چندین برابر شده است.

