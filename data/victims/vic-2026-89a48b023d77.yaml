  Mohammadreza Adib Totazahi,
  25 years old, from Zahedan;
  He was killed on 30th September 2022.

  Mohammadreza was shot and killed by the Revolutionary Guards in the widespread gathering of Zahedan's people after Friday prayers at Makki Mosque on the day of #BloodyFridayZahedan. He was working as a bus driver's apprentice (chauffeur) and had a physical disability.

