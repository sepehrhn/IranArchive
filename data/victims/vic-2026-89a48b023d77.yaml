  جاویدنام: محمدرضا ادیب توتازهی،
  ۲۵ ساله، اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  محمدرضا در تجمع گسترده مردم زاهدان بعد از نماز جمعه در مصلی مکی، روز ۸ مهر ماه موسوم به #جمعه_خونین_زاهدان با اصابت گلوله نظامیان سپاه کشته شد.
  شغل او شاگردی راننده اتوبوس (شوفری) بود. محمدرضا دارای معلولیت جسمی بود.

