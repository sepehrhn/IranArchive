  جاویدنام: عبدالملک شهنوازی (کمالخان زهی)،
  سن نامشخص، ساکن خاش، سیستان و بلوچستان؛
  جاودانه شد: ۱۳ آبان ۱۴۰۱.

  عبدالملک روز جمعه ۱۳ آبان بعد از نماز جماعت همراه معترضان به سمت فرمانداری خاش تظاهرات کردند. نظامیان سپاه که روی پشت‌بام ساختمان‌های اطراف کمین کرده بودند از بالا معترضان را هدف گلوله قرار دادند.عبدالملک مورد اصابت گلوله جنگی قرار گرفت و جان باخت.

