  Abdomalek Shahnavazi (Kamalkhan Zahi)
  Age: Unknown, from Khash, Sistan and Baluchestan;
  He was killed on 4 November 2022.

  Abdolmalek participated in protests on Friday, 4 November along with other demonstrators, heading towards the Governorate of Khash after congregational prayers. Soldiers of the Revolutionary Guards, who were positioned on the rooftops of surrounding buildings, targeted the protesters from above with gunfire. Abdulmalik was hit by a military bullet and lost his life.

