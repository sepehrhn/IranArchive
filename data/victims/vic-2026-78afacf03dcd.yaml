description: |-
  اعدام مخفیانه و شتاب زده
  ‏⁧‫#اشکان_مالکی‬⁩
  ‏بازداشت شده دی ماه،
  ‏دادرسی کاملا ناعادلانه انجام گرفت
  ‏خانواده نه از روند پرونده و نه از وکیل تسخیری و
  ‏نه زمان دادگاه و حتی از زمان اجرای حکم اطلاع نداشتند، و حتی از حق اخرین دیدار و غسل و کفن،
  ‏محروم شدند،
  ‏جاویدنام ⁧‫#اشکان_مالکی‬⁩ عزیز در ۱۱ خرداد به همراه جاویدنام ⁧‫#مهرداد_محمدی‌نیا‬⁩ اعدام شدند‌.
