description: |-
  •
  جاویدنام: محسن موسوی،
  ۳۲ ساله و اهل زنجان، ساکن تهران؛
  جاودانه شد: ۱۶ مهر ۱۴۰۱.

  محسن که از کسبه بازار بزرگ تهران بود روز ۱۶ مهر مقابل متروی مولوی و نزدیک مغازه‌اش با ضربه‌های باتوم و اصابت گلوله ساچمه‌ای به قلب و ریه‌اش کشته شد.
  ماموران اطلاعات حکومت اجازه ندادند خانواده‌ محسن پیکرش را در تهران به خاک بسپارند.
  روز ۱۸ًمهر پیکر محسن موسوی در روستای درام زنجان به خاک سپرده شد.
  مراسم چهلم محسن موسوی با حضور خانواده و‌دوستان او برگزار شد. آنها در این مراسم سرود «یار دبستانی» را همخوانی کردند، حجاب اجباری از سر برداشتند و تعدادی کبوتر آزاد کردند.

