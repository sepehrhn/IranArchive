  Mohsen Mosavi,
  32 Years old form Zanjan, staying in Tehran;
  was killed on Oct 08, 2022.

  Mohsen was a tradesman in Tehran big market. He was killed by batons strikes on his head and shotgun bullets in his lung on Oct 08, 2022 near Molavi subway.
  IRI regime security forces did not permitted Mohsen’s family to bury his body in Tehran. Two days later on Oct 10 Mohsen was buried in Darram village of Zanjan. His 40 days of burial was held by his family, friends and his relatives in which they chorused the song Yar-e Dabestani (my class fellow) in unison, removed their mandatory hijab and freed some pigeons symbolically.

