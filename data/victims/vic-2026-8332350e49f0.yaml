description: |-
  ⭕️
  جاویدنام: بهاءالدین ویسی،
  ۱۶ ساله و اهل جوانرود، کرمانشاه؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  بهاءالدین در جریان اعتراضات سراسری ضد حکومتی در جوانرود با اصابت گلوله نظامیان سپاه کشته شد.
  خانواده ویسی از نگرانی ربوده شدن پیکر فرزندشان او را زیر انبوهی از یخ قرار دادند.
  پیکر بهاءالدین را روز ۳۰ آبان با حضور گسترده سوگواران معترض که شعارهای ضد حکومتی می‌دادند در آرامستان «حاج ابراهیم» در شهر جوانرود به خاک سپردند.
  نجم‌الدین ویسی برادر بهاءالدین شبی که برادرش کشته شد بازداشت شد ‌و بعد از یک ماه و وادار کردن او به اعتراف اجباری آزاد شد.

