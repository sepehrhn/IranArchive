  Bahaoddin Veisi,
  16 years old, from Javanrud, Kermanshah;
  He Was killed on 20 November 2022.

  During the nationwide anti-government protests in Javanrud, Bahauddin was killed by the bullets of the Revolutionary Guards.
  His family, concerned that his body would be taken away, placed it under a pile of ice.
  On November 21, Bahauddin‘s body was buried in the "Haj Ibrahim" cemetery in Javanrud, in the presence of a large number of mourners and protesters chanting anti-government slogans.
  Najmeddin Veisi, Bahauddin‘s brother, was arrested on the night his brother was killed and was released after a month of detention and coercive confession.

