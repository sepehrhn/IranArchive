  Morteza Sasouli,
  22 years old, from Zehak County, Sistan and Baluchestan;
  He was killed on 27th March 2023.

  On 10th February, Morteza was on his way to Bandar Abbas for work in a passing car when law enforcement officers at the entrance to the city of Bandar fired shots at the vehicle. Two bullets struck Morteza in the back and kidneys. Initially, he was taken to the "Shahid Mohammadi" Hospital in Bandar Abbas and, after a week, transferred to a hospital in Kerman for further treatment.

  On 27th March, after enduring 45 days of pain and suffering from gunshot wounds, Morteza tragically lost his life due to the severity of his injuries.

  The Sasouli family filed a complaint against the law enforcement, but they claimed that it was a conscripted soldier who had fired at the vehicle, not an officer.

  Morteza was unmarried and worked in his hometown village of "Sheeb Gooreh." He was responsible for providing for himself and his family.

