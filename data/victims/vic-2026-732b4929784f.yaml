description: |-
  •
  جاویدنام: مرتضی ساسولی،
  ۲۲ ساله، اهل شهرستان زهک، سیستان و بلوچستان؛
  جاودانه شد: ۷ فروردین ۱۴۰۲.

  مرتضی روز ۲۱ بهمن ماه برای کار، با خودروی عبوری راهی بندرعباس بود که در ورودی شهر بندر، ماموران نیروی انتظامی به خودرو شلیک کردند. دو گلوله به کمر و کلیه مرتضی اصابت کرد. ابتدا او را به بیمارستان «شهید محمدی» بندرعباس انتقال دادند و پس از یک هفته برای ادامه درمان به بیمارستانی در کرمان منتقل شد.
  مرتضی روز هفتم فروردین، پس از تحمل ۴۵ روز درد و رنج ناشی از اصابت گلوله؛ بر اثر شدت جراحات جان باخت.
  خانواده ساسولی از نیروی انتظامی شکایت کردند اما نیروی انتظامی اعلام کرد که یک سرباز وظیفه به خودرو شلیک کرده است نه مامور.
  مرتضی مجرد بود. او در روستای محل زندگیش «شیب گور» کار می‌کرد و مسئول تامین مخارج و خود و خانواده‌اش بود.

  پس از شروع خیزش ملی ایرانیان از شهریور سال گذشته؛ به دنبال کشته شدن #مهسا_امینی، آمار شلیک‌های بی‌ضابطه نیروهای نظامی و لباس شخصی‌های حکومتی چندین برابر افزایش یافته است.

