  Azizollah Kubdani, son of Habibollah,
  Age: Unknown, from Zahedan
  He was killed on 30 September 2022.

  Azizollah was shot and killed during the widespread protests of the people of Zahedan on October 8th, known as the #BloodyFridayOfZahedan, by the bullets of the Revolutionary Guards.

