  •
  جاویدنام: مختار فتحی،
  ۳۶ ساله، اهل سقز کردستان؛
  جاودانه شد: ۲۹ بهمن ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در سقز، شامگاه ۲۹ بهمن یک خودرو گشت کلانتری ۱۲ سقز کنار اتومبیل مختار ایستاد. یکی از نظامیان از خودرو پیاده شد و از فاصله ۲ متری به گردن او شلیک کرد. نیروی انتظامی پس از شلیک بلافاصله محل را ترک کردند و پیکر مختار که در دم جان سپرده بود توسط مردم به بیمارستان «شفا» انتقال یافت.
  مختار را در حالی به گلوله بستند که همراه دو نفر از دوستانش در اتومبیل خود، مقابل منزل والدینش نشسته بود.
  نهادهای حکومتی ابتدا اعلام کردند که مختار طی شب‌های گذشته در حال شعارنویسی شناسایی شده است اما پس از ساعتی مجددا اعلام کردند که اشتباه کرده‌اند و به ظن شعارنویسی به مختار شلیک کرده‌اند.
  آنها خانواده مختار را تهدید کردند که نباید با رسانه‌ها در این مورد حرف بزنند.
  پیکر مختار ساعت ۲ بامداد سی‌ام بهمن تنها با حضور ۲۰ نفر از اعضای خانواده‌اش در آرامستان «دارسیران» مریوان به خاک سپرده شد.
  مختار در بیو صفحه اینستاگرامش نوشته بود «نفسم همسرم». همسر مختار باردار بود. نگذاشتند مختار پدر شود. او را کشتند به «ظن شعارنویسی».

