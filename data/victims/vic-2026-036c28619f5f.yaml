  Mokhtar Fathi
  36 years old, from Saqqez, Kurdistan;
  He was killed on 18th February 2023.

  During the nationwide anti-government protests in Saqqez, on the night of February 18th, a police car stopped next to Mokhtar's vehicle. A military officer got out of the car and shot him at point-blank range, hitting his neck. Immediately after the shooting, the law enforcement officers left the scene. Mokhtar, who was on the verge of death, was transferred to the "Shafa" Hospital by the people.

  Mokhtar was shot while sitting in his car with two of his friends outside his parents' home. Government institutions initially claimed that Mokhtar had been identified as a slogan writer in recent nights, but after an hour, they announced that they had made a mistake and had shot Mokhtar mistakenly thinking he was involved in slogan writing.

  They threatened Mokhtar's family not to speak to the media about the incident.

