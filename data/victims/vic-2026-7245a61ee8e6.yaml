  Mehrzad (Mehdi) Behrouz,
  21 years old and from Khomam, Rasht;
  He was killed on 9 October 2022.

  Mehrzad was shot and killed by government security agents during the suppression of the protest of the prisoners in Lakan prison (unit 8) in Rasht.
  In the death certificate, the forensic pathologist stated that the cause of Mehrzad's death was hit of a metal object (i.e., bullet) to the chest. Mehrzad's face was also bruised.
  Mehrzad's body was handed over to his family on the 15th of October and buried on the same day in the presence of security officers.

