description: |-
  •
  جاویدنام: مهرزاد (مهدی)بهروز،
  ۲۱ ساله و اهل خمام از توابع رشت؛
  جاودانه شد: ۱۷ مهر ۱۴۰۱.

  مهرزاد در جریان سرکوب اعتراضات زندانیان بند هشت زندان لاکان رشت، با اصابت گلوله ماموران امنیتی حکومت کشته شد.
  پزشکی قانونی در برگه فوت علت مرگ مهرزاد را شکافته شدن سینه در اثر برخورد جسم فلزی سخت قید کرده بود. صورت مهرزاد هم کبود بود.
  پیکر مهرزاد را روز ۲۳ ماه مهر به خانواده‌اش تحویل دادند و همان روز هم با حضور ماموران امنیتی به خاک سپردند.

