description: "•\nجاویدنام: محمد عبداللهی،\n۳۶ ساله و اهل ایلام؛\nجاودانه شد: ۲۱ مهر ۱۴۰۱.\n\nمحمد در جریان اعتراضات سراسری ضد حکومتی در ایلام، روز چهارشنبه مقابل ساختمان فرمانداری بازداشت شد.\nساعت ۱:۳۰ صبح از نیروی انتظامی با پدر محمد تماس گرفتند و گفتند پسرشان محمد زخمی شده و در بیمارستان «خمینی» ایلام بستری است. وقتی خانواده به بیمارستان رسیدند مسئولان بیمارستان گفتند چنین کسی آنجا بستری نیست. یک ساعت بعد مجدد با خانواده عبداللهی تماس گرفتند و گفتند پسر شما فوت کرده است و فردا صبح از سردخانه بهشت زهرا در ایلام پیکرش را تحویل بگیرید. به گفته یکی از بستگان محمد آثار کبودی بر تمام بدن محمد مشهود بود و سر او در اثر اصابت جسمی سخت به شدت دچار جراحت شده بود.»\nهنگام تحویل پیکر محمد از پدر او تعهد گرفتند که بگویند محمد به مرگ طبیعی درگذشته است و با هیچ رسانه‌ای گفتگو نکنند.\nپیکر محمد را صبح روز پنجشنبه ۲۱ مهر در آرامستان «بهشت رضا» و با تدابیر شدید امنیتی به خاک سپردند.\n\n#محمد_عبداللهی\n#انقلاب_ملی_ایران\n#ایلام\n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nMohammad Abdollahi,\n36 Years old from Ilam;\nwas killed on Oct 13, 2022.\n\nMohammad was arrested during the nationwide protest against IRI regime right in front of governor office building.\nAt 01:30 of that day, his father receive a call from enforcement police regarding his son situation that was describing he was taken to the khomeini hospital of Ilam. Immediately, they reach the hospital and look for Mohammad. “No one with such information is registered by us” says information desk of the hospital. Later Mohammad’s family receive another call that inform them Mohammad passed away and gave them address and instruction of when, where and how to get his body from Behesht Zahra morgue of Ilam.\nAccording to one of Mohammad’s relatives, wounds and bruises were clearly seen on his body. Mohammad was beaten to death.\nMohammad’s father were plighted forcedly not to interviews any media and to announce that his son passed away by a natural death.\nMohamad burial ceremony was held on Oct 13, 2022 under a high security precaution.\n\_\n#MohammadAbdollahi\n#iranrevolution \n#Ilam"
