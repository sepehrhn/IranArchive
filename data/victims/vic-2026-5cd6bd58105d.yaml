description: |-
  •
  جاویدنام: مسعود تیموری،
  سن نامشخص، اهل جوانرود، کرمانشاه؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  مسعود و پدرش در قیام سراسری ضد حکومتی مورد اصابت گلوله جنگی نظامیان سپاه قرار گرفتند. پدر مسعود، محمود تیموری مجروح شد و مسعود جان باخت.
  خانواده مسعود پیکر او را از ترس ربوده شدن توسط نیروهای امنیتی از بیمارستان خارج کردند.
  پیکر مسعود با حضور سوگوارانی خشمگین که شعار «مرگ بر خامنه‌ای، مرگ بر جاش و مرگ بر سپاه» می‌دادند در آرامستان «حاجی‌ابراهیم» جوانرود به خاک سپرده شد.
  پدر مسعود یک ماه بعد از کشته شدن پسرش باخبر شد.

