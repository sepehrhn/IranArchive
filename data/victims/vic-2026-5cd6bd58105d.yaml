  Masoud Teimory,
  Age unknown, from Javanrud, Kermanshah;
  He was Killed on 20th November 2022.

  Masoud and his father were shot during the nationwide anti-government uprising by the military forces of the Revolutionary Guards. Masoud lost his life, while his father, Mahmoud Timouri, was injured.
  Due to fear of being abducted by security forces, Masoud's family took his body out of the hospital.
  Masoud's body was buried in Haji-Ibrahim Cemetery in Javanrud, amidst angry mourners chanting slogans such as "Death to Khamenei, Death to the regime, and Death to the Revolutionary Guards."
  His father learned of his son's death one month later.

