  زلیخا زنی بلوچ و تبعه افغانستان بود که کارت اقامت در زاهدان داشت. روز «جمعه خونین زاهدان» هنگام بازگشت از مسجد مکی در اثر استنشاق گاز اشک‌آور دچار خفگی و کشته شد.
