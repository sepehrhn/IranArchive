  Zoleikha Torzehi,
  A citizen of Afghanistan and resident of Zahedan;
  She was killed on 30 September 2022.

  Zoleikha was a Baloch woman and a citizen of Afghanistan who had a residence permit to live in Zahedan. On the Bloody Friday of Zahedan, she was suffocated and killed by inhaling tear gas while returning from Makki Mosque.
  Zoleikha was the mother of two boys.

