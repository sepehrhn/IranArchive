  Shahin Moradi,
   29 years old, from Kuhdasht, Lorestan province, residing in Tehran;
   He was killed on 9 December 2022.

   During the protests against the execution of #MohsenShekari in Tehran, Shahin was hit in the thigh by a bullet by the military forces of the government. He died due to severe bleeding.  His family did not inform the media about the reason of his death under the pressure of the security forces.
   Shahin's body was buried after two days in the cemetery of Domrustan village.
  Shahin was from Kuhdasht and worked in Tehran.

