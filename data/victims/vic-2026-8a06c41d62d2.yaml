description: |-
  •
  جاویدنام: شاهین مرادی،
  ۲۹ ساله، اهل کوهدشت استان لرستان، ساکن تهران؛
  جاودانه شد: ۱۸ آذر ۱۴۰۱.

  شاهین در جریان اعتراضات خیابانی به اعدام جاویدنام #محسن_شکاری در تهران مورد اصابت گلوله جنگی نیروهای نظامی حکومت به ران پایش قرار گرفت و بر اثر شدت خونریزی جان باخت. خانواده او تحت فشار نیروهای امنیتی راجع به کشتن او اطلاع‌رسانی نکردند.
  پیکر شاهین روز ۲۰ آذر در آرامستان روستای «دم‌روستان» به خاک سپرده شد.
  شاهین اهل کوهدشت بود و در تهران کار می‌کرد.

