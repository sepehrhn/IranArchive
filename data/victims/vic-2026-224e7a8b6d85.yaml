description: "•\nجاویدنام: جبار فرقی‌زاده،\n۳۶ ساله، اهل روستای آسن‌آباد (آسن‌آوی) سنندج، ساکن مریوان\nجاودانه شد: ۳ آذر ۱۴۰۱.\n\nجبار شامگاه پنجشنبه ۳ آذر هنگام راندن اتومبیلش از مریوان به سمت روستای آسن‌آباد با اصابت دو گلوله نیروهای هنگ مرزی به سرش کشته شد.\n\n#جبار_فرقی_زاده\n#انقلاب_ملی_ایران\n#مریوان #سنندج\n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nJabbar Farghizadeh,\n\_36 years old, from Asn-Av (Asn-Abad) Village, Sanandaj\n\_Resident in Marivan;\n\_He was killed on 24th November 2022.\n\_\nJabbar was fatally shot by border security forces with two bullets to his head while driving his car from Marivan towards Asn-Abad Village on Friday evening, 24th November.\n\_\n#JabbarFarghizadeh\n#IranRevolution \n#IranRevolution2022 \n#Marivan #Sanandaj\n#MahsaAmini"
