description: |-
  ⭕️
  جاویدنام: ملیکا مهدوی،
  ۱۶ ساله، اهل کرمان، ساکن قشم؛
  جاودانه شد: ۷ بهمن ۱۴۰۱.

  ملیکا در اعتراضات سراسری ضد حکومتی مهر ماه در قشم روسری‌اش را مقابل ماموران حکومت آتش زد. روز بعد از آن بازداشت شد.
  او پس از آزادی هم به دلیل سکوت نکردن تحت نظر بود. در نهایت او را از ساختمانی بلند پرت کردند و کشتند.
  پیکر ملیکا در آرامستان شهر بابک از توابع استان کرمان به خاک سپرده شد.
  از آنجا که ملیکا می‌خواست تئاتر و سینما بخواند؛ خانواده او یک سال پیش از کشته شدنش از کرمان به قشم رفته بودند.
  مادر ملیکا در اینستاگرامش نوشت:
  «ملیکای عزیزم تا دیروز نگران شکنجه‌های زندان بودم و امروز ناراحت نبودنت. مگر زندگی و شادی و لبخند دختر ۱۶ ساله چقدر براتون سخت و عذاب‌آور بود یا که ترس بود. خنده را جرم می‌دانید و گریه را ستایش می‌کنید. بی شک می‌رسد روز انتقام.»
  ملیکا متولد ۱۸ خرداد سال ۱۳۸۵ بود. مادرش روز تولد ۱۷ سالگی‌اش نوشت:
  «امروز ملیکا ۱۷ ساله می‌شد اگر خنده‌هاش، فکرهاش، عقیده‌هاش و هدفش از نظر کشورش جرم نبود.»

