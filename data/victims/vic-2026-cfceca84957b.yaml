  Melika Mahdavi
  16 years old, from Kerman, Living in Qeshm
  She was killed on 27th January 2023.

  During the nationwide anti-government protests in September 2022 on Qeshm Island, Melika set her headscarf on fire in front of government agents. She was arrested the next day. After her release, she remained under surveillance due to her refusal to remain silent. Eventually, she was thrown from a tall building and killed.

  Melika's body was laid to rest in the cemetery of Babak city, Kerman province. Since Melika wanted to study theater and cinema, her family had moved from Kerman to Qeshm a year before her tragic death.

  Melika's mother wrote on her Instagram:

  "My dear Melika, until yesterday, I was worried about the prison tortures, and today, I'm saddened by your absence. How hard and torturous it must have been for you, the life, the happiness, and the smile of a 16-year-old girl, or was it just fear? You consider laughter a crime and praise tears. Surely, the day of revenge will come."

  Melika was born on June 7, 2006. On her 17th birthday, her mother wrote:

