  Jamal Abdul-Naser Mohammad Hassani (Barahooie),
  Age unknown from Zahedan
  Was killed on Oct 02, 2022.

  It was on Sunday evening that Jamal Abdul-Naser was killed. He was shot in his head by IRI plainclothes polices. IRI lobbyer websites claimed that Jamal Abdul-Naser was IRGC agent who was killed by protestors.

