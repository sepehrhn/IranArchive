  جاویدنام: جمال عبدالناصر محمدحسنی (براهویی)،
  سن نامشخص، اهل زاهدان؛
  جاودانه شد: ۱۰ مهر ۱۴۰۱.

  ناصر محمدحسنی بعدازظهر روز یکشنبه دهم مهر در اثر اصابت گلوله ماموران لباس شخصی حکومت به سرش کشته شد.
  سایت‌های حکومتی ناصر محمدحسنی (براهویی) را بسیجی معرفی کردند که توسط معترضان کشته شد.
  ناصر محمدحسنی مغازه شال‌فروشی داشت.

