description: |-
  •
  جاویدنام: مهرشاد تلاتوف،
  ۲۲ ساله، اهل نصیرآباد سرباز، سیستان و بلوچستان؛
  جاودانه شد: ۲۰ آبان ۱۴۰۱.

  مهرشاد که بعد از نماز جمعه روز ۲۰ آبان در ایرانشهر به اعتراضات سراسری ضد حکومتی پیوسته بود در شلوغی حمله نظامیان حکومت به معترضان ربوده شد. فیلمی چند ثانیه‌ای در فضای مجازی موجود است که لحظه ربوده شدن جوانی توسط نیروهای لباس شخصی حکومت را نشان می‌دهد. گفته شده است شخصی که ربوده شده مهرشاد است.
  پیکر مهرشاد روز شنبه ۲۱ آبان در محور بمپور به پهره توسط پرسنل شهرداری کشف شد. روی گردن او آثار کبودی و رد طناب مشهود بود.
  پیشتر، اردی‌بهشت سال ۱۳۹۰ نعیم تلاتوف برادر بزرگ‌ مهرشاد با شلیک مستقیم و بی‌دلیل ماموران اطلاعات حکومت کشته شده بود. شلیک‌های بی‌ضابطه و بی‌دلیل ماموران حکومت بعد از شهریور ۱۴۰۱ و به دنبال خیزش سراسری ملی در سیستان و بلوچستان چندین برابر افزایش یافته است.

