  Mehrshad Telatouf
  22 years old,from Nasirabad Sarbaz, Sistan and Baluchestan;
  He was killed on 11th November 2022.

  Mehrshad, who had joined the nationwide anti-government protests after Friday prayers on the 20th of Aban in Iran Shahr, was abducted by government forces during the crackdown on protesters. There is a brief video circulating on social media showing the moment a young person is being seized by plainclothes government agents. It is said that the abducted person is Mehrshad.
  Mehrshad's body was discovered on Sunday, 21st Aban, along the Bam-Pahré road by municipal personnel. There were visible signs of bruising and rope marks on his neck.
  Earlier, in Ardibehesht 1390 (April/May 2011), Mehrshad's elder brother, Na'im Telatouf, was killed by government intelligence agents through direct and unjustified gunfire. The indiscriminate and arbitrary shootings by government agents have increased several times since Shahrivar 1401 (August/September 2022) following the nationwide uprising in Sistan and Baluchestan.

