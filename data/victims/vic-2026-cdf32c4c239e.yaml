  Reza Ghaderi,
  19 years old, from Khvorasgan, Isfahan;
  He was Buried on 22th January
  2023.

  Reza was abducted by security forces during the nationwide anti-government protests (October or December ) in Isfahan.
  On January 21 , security forces contacted the Ghaderi family and told them that their son's body was in his father's garden. Visible signs of torture were present on Reza's body, and his hands and feet were broken.
  Reza's body was laid to rest on January 22 under secure conditions in a cemetery in Khvorasgan.

