description: |-
  •
  جاویدنام: رضا قادری،
  ۱۹ ساله، اهل خوراسگان، اصفهان؛
  جاودانه شد: خاکسپاری دوم بهمن ۱۴۰۱.

  رضا در جریان اعتراضات سراسری ضد حکومتی (آذر یا دی) در اصفهان توسط نیروهای امنیتی ربوده شد.
  روز اول بهمن نیروهای امنیتی با خانواده قادری تماس گرفتند و به آنها گفتند پیکر فرزندشان در باغ پدرش است. روی پیکر رضا آثار شکنجه مشهود بود و دست و پایش را شکسته بودند.
  پیکر رضا روز ۲ بهمن در شرایط امنیتی در آرامستانی در خوراسگان به خاک سپرده شد.

