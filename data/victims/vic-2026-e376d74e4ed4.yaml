description: |-
  وحید زند ۳۸ سال دارد و اهل روستای قلعه‌چم قم است. او در تاریخ ۱۸ دی توسط ماموران امنیتی بازداشت و به زندان مرکزی قم معروف به زندان لنگرود قم منتقل شده است. او در تماس با خانواده اعلام کرده که شرایط نگهداری در زندان بسیار نامساعد است و تحت فشار و شکنجه روانی قرار دارد. صدایش باشیم.

