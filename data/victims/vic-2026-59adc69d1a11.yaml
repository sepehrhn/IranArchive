description: |-
  جاویدنام #محمد_کیانی_هرچگانی ، ۳۲ ساله و اهل اصفهان، روز ۱۹ دی‌ماه در خیابان کشاورزی این شهر هدف شلیک مستقیم نیروهای سرکوب جمهوری اسلامی قرار گرفت و کشته شد.

  گلوله به ناحیه قلب او اصابت کرده و باعث مرگ فوری‌اش شد. پس از این جنایت، نیروهای امنیتی خانواده او را تحت فشار و تهدید قرار داده‌اند. همچنین برادر کوچکتر محمد توسط مأموران بازداشت شده است.

  #جاویدنام
