  Saman Rahmani
  28 years old, from Takab, West Azarbaijan, Resident of Qal'eh Hasan Khan (Shahr-e-Qods), Tehran
  He was killed on 11th November 2022.

  On the 11th November , Saman and several other citizens who were engaged in chanting slogans in Qal'eh Hasan Khan were attacked by government security forces. During Saman's arrest, security forces repeatedly struck him on the head with batons.
  The next day, government intelligence forces contacted the Rahmani family and asked them to go to the forensic medicine of Qal'eh Hasan Khan to identify his body. They also threatened the Rahmani family to prevent them from informing others about his death.
  Saman's body was transferred to Takab on 13 November under secure conditions. Without the opportunity for his family to wash him, he was buried in Sharifabad Cemetery in Takab.

