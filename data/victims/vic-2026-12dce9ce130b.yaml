  جاویدنام: سامان رحمانی،
  ۲۸ ساله، اهل تکاب، آذربایجان غربی، ساکن قلعه‌حسن‌خان (شهر قدس)، تهران؛
  جاودانه شد: ۲۰ آبان ۱۴۰۱.

  روز ۲۰ آبان، سامان و تعدادی دیگر از شهروندان که مشغول شعارنویسی در قلعه حسن‌خان بودند مورد حمله نیروهای امنیتی حکومت قرار گرفتند. نیروهای امنیتی هنگام بازداشت سامان با باتوم بارها به سر سامان ضربه زدند.
  فردای آنروز نیروهای اطلاعات حکومت با خانواده رحمانی تماس گرفتند و از آنها خواستند جهت شناسایی پیکر او به پزشکی قانونی قلعه‌ حسن‌خان مراجعه کنند. آنها همچنین خانواده سامان را تهدید کردند تا مانع خبررسانی راجع به مرگ او بشوند.
  پیکر سامان روز ۲۲ آبان در شرایط امنیتی به تکاب منتقل شد و بدون اینکه خانواده او بتوانند او را شستشو کنند در آرامستان «شریف‌آباد» تکاب به خاک سپرده شدنیروهای امنیتی برای جلوگیری از حضور مردم در مراسم خاکسپاری سامان مسیر منتهی به آرامستان را بستند. اداره اطلاعات تکاب کانال‌های مجالس ترحیم تکاب را وادار کردند آگهی ترحیم سامان را حذف کنند.
  سامان از دو سال پیش همراه خانواده‌اش در قلعه ‌حسن‌خان ساکن بودند و تنها پدر او در تکاب زندگی می‌کرد.

