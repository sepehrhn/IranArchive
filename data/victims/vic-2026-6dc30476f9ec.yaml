description: |-
  •
  جاویدنام: حیدر عظیمی قیه‌ باشی
  ۳۶ ساله، اهل تبریز؛
  جاودانه شد: ۱۲ دی ۱۴۰۱.

  حیدر در جریان اعتراضات سراسری ضد حکومتی در تبریز، در ماه آذر توسط اداره اطلاعات تبریز ربوده شد. او در یک تماس تلفنی با خانواده‌اش اطلاع داد که برای اعتراف به قتل یک بسیجی به نام «حسین اجاقی» تحت فشار و‌شکنجه است و سرانجام نیز زیر شکنجه بازجویان حکومت جان باخت.
  پیکر حیدر روز ۱۲ دی ماه به خانواده‌اش تحویل داده شد و بلافاصله در شرایط امنیتی به خاک سپرده شد. نیروهای امنیتی خانواده عظیمی را تحت فشار گذاشته‌اند تا راجع به جان باختن حیدر اطلاع‌رسانی نکنند.
  حیدر متاهل و دارای سه فرزند بود.

