  Heydar Azimi Qayah Bashi,
  36 years old, from Tabriz;
  He was killed on 2th January 2023.

  Heydar was abducted by the Tabriz Intelligence Department during the nationwide anti-government protests in Tabriz in November.
  In a phone call to his family, he reported that he was being pressured and tortured to confess to the murder of a Basij member named #HosseinOjaghi and eventually lost his life under the torture of government interrogators.
  Heydar's body was handed over to his family on 2th January, and he was immediately buried under security conditions. Security forces have pressured Heydar’s family not to provide information about his death.
  Heydar was married and had three children.

