  Abdol Jalil Ghanbarzehi (Shah-Bakhsh),
  Age unknown, from Zahedan,
  He was killed on 30th September 2022.

  Abdol Jalil, on the evening of 30th September, knows as #BloodyFridayZahedan, was struck by a military bullet after a clash with the Revolutionary Guards (#IRGC) and lost his life.

