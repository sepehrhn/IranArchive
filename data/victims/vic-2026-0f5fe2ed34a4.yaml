description: |-
  میثم حبیبی از شهرستان لنده در استان کهگیلویه و بویراحمد در تاریخ ۱۹ دی ماه بازداشت شده و هم‌اکنون در زندان دهدشت می‌باشد. میثم وضعیت مناسبی در زندان ندارد و سه روز است که دست به اعتصاب غذا زده و به نشانهٔ اعتراض لبهایش را دوخته است. او لیسانس شیمی دارد و شغلش آزاد است و پدر یک دختر شش ساله است. صدایش باشیم.

