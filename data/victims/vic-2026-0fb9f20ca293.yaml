  Sepideh (Bigard) Ghalandari,
  28 years old, from Mahabad, West Azarbaijan, Residing in Tehran;
  She was killed on 1th January 2023.

  During the nationwide anti-government protests in Tehran, in October, Sepideh was abducted by government security forces and tortured to death. Her body was handed over to her family on January 1st, who had been searching for her, unaware of her fate, under the condition that they declare her cause of death as a heart attack.

  Sepideh's body was buried on January 2nd in Mahabad cemetery.

  Government media, quoting Sepideh's family, falsely claimed that she had suffered a heart attack and passed away at her home in Tehran.

  Sepideh was a graduate of the field of Historic Preservation from the College of Fine Arts in Shiraz. She had been accepted at the "#Sapienza" University in #Italy and was planning to migrate soon for further studies.

  She was an artist and had an Instagram page dedicated to "Nature and Floral Photography."

