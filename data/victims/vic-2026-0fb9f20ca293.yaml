description: |-
  •
  جاویدنام: سپیده (بی‌‌گرد) قلندری،
  ۲۸ ساله، اهل مهاباد؛
  جاودانه شد: ۱۱ دی ۱۴۰۱.

  سپیده در جریان اعتراضات سراسری ضد حکومتی تهران، در ماه آبان توسط نیروهای امنیتی حکومت ربوده شد و زیر شکنجه کشته شد. پیکر او را نیروهای امنیتی روز ۱۱ دی ماه به خانواده‌اش که تا آن زمان بی‌خبر از فرزندشان و در جستجوی او بودند، به این شرط تحویل دادند که علت مرگ او را سکته قلبی اعلام کنند.
  پیکر سپیده روز ۱۲ دی ماه در آرامستان مهاباد به خاک سپرده شد.
  رسانه‌های حکومتی از قول خانواده سپیده نوشتند که سپیده در خانه‌خودش در تهران ایست قلبی کرده و درگذشته است.
  سپیده فارغ‌التحصیل رشته مرمت باستانی دانشکده هنر شیراز بود. او در دانشگاه «سپینزا» در ایتالیا پذیرش گرفته بود و قرار بود به زودی برای تحصیل مهاجرت کند.
  او هنرمند بود و در اینستاگرام یک صفحه «عکاسی از طبیعت و گل و گیاه داشت.»

