  Farhad Baleshzar,
  55 years old, from Sorkhak Sanjabi village, living in Pardis Town, Kermanshah;
  Killed on: January 8, 2026

  During the National Revolution against the Islamic Republic, Farhad was shot in the right side of his face with live ammunition by government security forces on the evening of Thursday, January 8, on Shaqayegh Jan Boulevard in Pardis Town, Kermanshah, and was killed.

  Farhad was buried in the cemetery of his hometown, Sorkhak Sanjabi village.

  Farhad was a husband and the father of two teenage children, Reza and Andia.

