description: |-
  •
  جاویدنام: فرهاد بالش‌زر،
  ۵۵ ساله، اهل روستای سرخک سنجابی، ساکن شهرک پردیس کرمانشاه؛
  جاودانه شد: ۱۸ دی ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ فرهاد شامگاه پنجشنبه ۱۸ دی‌ماه در بلوار شقایق جان، شهرک پردیس کرمانشاه هدف اصابت گلوله جنگی نیروهای سرکوب حکومت به سمت راست صورتش قرار گرفت و جان باخت.
  پیکر فرهاد در آرامستان روستای زادگاهش «سرخک سنجابی» به خاک سپرده شد.
  فرهاد همسر و پدر دو فرزند نوجوان به نام‌های رضا و آندیا بود.

