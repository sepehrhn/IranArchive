description: |-
  •
  جاویدنام: وحید خانی،
  سن نامشخص، اهل لنجان، اصفهان؛
  جاودانه شد: ۲۴ آبان ۱۴۰۱.

  وحید در اعتراضات سراسری ضد حکومتی در زرین‌شهر اصفهان، روز سه‌شنبه ۲۴ آبان با اصابت گلوله به سرش کشته شد. سرش کاملا متلاشی و چشمهایش کور شده بود. نیروهای امنیتی پیکرش را ربودند و مخفیانه در آرامستان «بیستجان» شهرستان لنجان به خاک سپردند. حضور ماموران اطلاعاتی در مراسم خاکسپاری آنقدر پر رنگ بود که هیچ‌کس نتوانست سختی بگوید.
  آنها از خانواده خانی خواستند راجع به کشته شدن وحید اطلاع‌رسانی نکنند؛ گفتند علت مرگ او را تصادف اعلام کنند.
  وحید نامزد داشت و قرار بود آنها اسفند ماه ازدواج کنند.

