  Vahid Khani
  Age: Unknown, from Lenjan, Isfahan
  He was killed on 15th November 2022.

  Vahid was killed during nationwide anti-government protests in Zarinshahr, Isfahan, on Tuesday, 15th November , when he was shot in the head. His head was completely destroyed, and his eyes were blinded. Security forces took his body and secretly buried him in the "Bistajan" cemetery in Lenjan. The presence of intelligence agents at the funeral was so intense that nobody could express their grief openly.

  They asked the Khani family not to inform anyone about Vahid's death and instructed them to announce it as an accident. Vahid was engaged, and they were planning to get married in the month of Esfand.

