  Hamid Saneipour,
  30 years old, from Hamedan;
  He was killed on 29th September 2022.

  On September 21, during the nationwide protests against the government's murder of #MahsaAmini in Hamedan, Hamid was wounded as a result of a close-range gunshot fired from behind by motorcycle-mounted suppressive forces. He was hit by 14 bullets in the head, chest, and back. Hamid was transferred to the "Bu- Ali" Hospital in Hamedan by the people and that same night, he was transferred to the "Besat" Hospital with the presence of his father, via an ambulance.

  He spent one week in the ICU in a coma. Finally, on the September 29, he succumbed to his severe injuries.

  Due to the pressure from security forces and their presence, his body was quietly laid to rest on the ninth day of Mehr in the "Bagheh Behesht" cemetery in Hamedan.

  On his gravestone, they wrote: "From the blood of young patriots, tulips bloom."
