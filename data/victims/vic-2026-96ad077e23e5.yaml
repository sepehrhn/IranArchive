description: |-
  •
  جاویدنام: حمید صانعی‌پور،
  ۳۰ ساله و اهل همدان؛
  جاودانه شد: ۷ مهر ۱۴۰۱.

  حمید ۳۰ شهریور در اعتراضات سراسری به قتل حکومتی #مهسا_امینی در همدان؛ بر اثر شلیک گلوله ساچمه‌ای از پشت سر و فاصله نزدیک توسط نیروهای سرکوب موتورسوار، مجروح شد. ۱۴ گلوله به سرش اصابت و تعداد زیادی به سینه و پشتش. حمید توسط مردم به بیمارستان «بوعلی» همدان منتقل شد و همان‌شب توسط اورژانس بیمارستان «بوعلی» و با همراهی پدرش به بیمارستان «بعثت».
  او مدت یک هفته در آی‌سی‌یو و در کما بود. سرانجام روز هفتم مهر بر اثر شدت جراحات جان سپرد.
  پیکر او به دلیل شدت فشار نیروهای امنیتی و حضورشان،  روزنهم مهر در سکوت و بی‌خبری در آرامستان «باغ بهشت» همدان، قطعه پنج به خاک سپرده شد.
  روی سنگ مزارش نوشته‌اند: «از خون جوانان وطن لاله دمیده».
  حمیدرضا دانش‌آموخته رشته فناوری اطلاعات (IT) بود. اما به دلیل نبود شغل در حرفه خودش به عنوان بازاریاب در شرکت‌های مختلف کار می‌کرد. او همانقدر که مهربان بود ظلم‌ستیز بود. آرزویش تحقق عدالت اجتماعی بود و در حد امکان دستگیر آدم‌های دیگر. او فرزند دوم خانواده بود.

