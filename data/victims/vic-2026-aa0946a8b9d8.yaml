  Abdolmanan Rakhshani,(Name on ID: Abdulrahman Baluchi-Khah), Son of Sattar,
  29 years old, from Shirabad, Zahedan;
  He was killed on 30th September 2022.

  Abdolmanan was killed on 30th September, Known as #BloodyFridayZahedan in Makki Mosque by the agents of the government's Sepah (#IRGC).

  Abdolmanan was married and had three children: an eight-year-old son and twins named Yasna and Yasin.

