  Aso Ghaderi,
  22 years old, from Basreh village, Sardasht, West Azarbaijan;
  He was killed on 17th November 2022.

  On the evening of the 17th of November , Aso and her brother were returning in a car from their maternal grandmother's house when they were struck by three bullets fired by #IRGC.
  Two bullets hit her head and one hit her shoulder. After firing the shots, the security forces pulled Aso, who was wounded, out of the car and subjected her to physical assault.

  With the presence of her family and under security pressures, Aso's body was buried in "Hormozabad" cemetery in the Rabt neighborhood at 2 AM.

  Aso's last Instagram story was the repost of this sentence by Mohammad Hassan Zadeh:
  "Maybe today is the last day of my life, for the happiness of the nation..."

  Aso was killed one day after Mohammad Hassan Zadeh.

