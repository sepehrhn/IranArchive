description: |-
  •
  جاویدنام: آسو قادری،
  ۲۲ ساله و اهل روستای بصره، سردشت، آذربایجان غربی؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  شامگاه ۲۶ آبان؛ آسو و برادرش با ماشین از منزل مادربزرگشان برمی‌گشتند که توسط ماموران سپاه مورد اصابت سه گلوله قرار گرفت. دو گلوله به سر و یک گلوله به شانه.  ماموران بعد از شلیک بدن مجروح آسو را از ماشین بیرون کشیدند و مورد ضرب و شتم قرار دادند.
  پیکر آسو با فشارهای امنیتی ساعت دو بامداد با حضور خانواده‌اش در آرامستان «هرمزآباد» در شهرک ربط به خاک سپرده شد.
  آخرین استوری آسو بازنشر این جمله محمد حسن زاده بود:
  «شاید امروز روز آخر زندگیم باشه، برای خوشبختی ملت..»
  آسو یک روز بعد از محمد حسن‌‌زاده کشته شد.

