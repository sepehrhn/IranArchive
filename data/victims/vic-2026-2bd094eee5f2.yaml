description: |-
  •
  جاویدنام: عبدالصمد براهویی،
  ۳۴ ساله، اهل زاهدان
  جاودانه شد: ۸ مهر ۱۴۰۱.

  عبدالصمد در جریان تجمع گسترده مردم زاهدان، روز هشتم مهر ماه موسوم به #جمعه_خونین_زاهدان با اصابت گلوله نظامیان سپاه کشته شد.
  یکی از برادران عبدالصمد با شنیدن خبر کشته شدن او به اورژانس بیمارستان خاتم‌الانبیا مراجعه کرد و پیکر برادرش را روی زمین بیمارستان پیدا کرد. کارکنان بیمارستان به خانواده‌های کشته‌شدگان گفتند پیکر عزیزانشان را خودشان ببرند. آقای براهویی کاوری از کارکنان بیمارستان گرفت و پیکر بی‌جان برادرش را داخل آن گذاشت و به خانه برد.
  خانواده براهویی فردای آن روز، شنبه ۹ مهرماه پیکر عبدالصمد را به خاک سپردند.
  عبدالصمد سه ماه پیش از کشته شدن ازدواج کرده بود. او تنها با یک جانماز به مسجد مکی رفته بود.

