   Abdolsamad Brahui
  34 years old, from Zahedan
  He killed on 30 September 2022.

  Abdolsamad was shot and killed by the Revolutionary Guards during the widespread protests in Zahedan on the 30th of September , known as #BloodyFridayOfZahedan . One of his brothers went to the emergency room at Khatam al-Anbiya Hospital and found his lifeless body on the floor. The hospital staff told the families of the victims to take the bodies themselves. Mr. Brahui borrowed a cover from the hospital staff and placed his brother's lifeless body inside it and took it home.

  The Brahui family buried Abdolsamad on the next day, Saturday, October 1th.
  He had only been married for three months before he was killed. He had gone to the mosque with only a prayer rug.

