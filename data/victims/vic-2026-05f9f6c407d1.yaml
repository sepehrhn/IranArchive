  Ariana Seif,
  21 years old, from Rudsar, Lahijan, residing in Tehran;
  She was killed on 1th December  2022.

  During the nationwide anti-government protests, on December 1th, Ariana drove her personal car to the Chitgar protests. Security forces, who had identified Ariana from previous protests in Ekbatan and Chitgar, abducted her after the protests that day. Her mobile internet was online until 6 PM, but she didn't answer calls after 5 PM.
  Ariana was killed due to torture and severe blows to her head and body. Security forces then staged her lifeless body in her car and threw it down from one of the hills around Tehran to make her death appear as an accident.
  Ariana's body was buried in the "Vadi  va  Aramgah Rudsar" cemetery in Rudsar.
  She had obtained a diploma in tourism and wanted to study veterinary medicine because of her love for animals.
