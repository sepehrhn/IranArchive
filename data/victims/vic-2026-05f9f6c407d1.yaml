description: |-
  •
  جاویدنام: آریانا سیف،
  ۲۱ساله، اهل رودسر لاهیجان، ساکن تهران؛
  جاودانه شد: ۱۰ آذر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی، روز ۱۰ آذر ماه آریانا با ماشین شخصی خود راهی تظاهرات چیتگر شد. نیروهای امنیتی که آریانا را از پیش در اعتراضات اکباتان و چیتگر شناسایی کرده بودند؛ پس از پایان اعتراضات آن روز او را ربودند. اینترنت تلفن همراه او تا ساعت شش عصر آنلاین بود اما از ساعت پنج دیگر پاسخگوی تماسهایش نبود.
  آریانا بر اثر شکنجه و اصابت ضربات باتوم به سر و بدنش کشته شد. نیروهای امنیتی سپس با صحنه‌سازی پیکر بی‌جان او را در ماشینش گذاشتند و از یکی از دره‌های اطراف تهران به پایین پرت کردند تا علت مرگ او را تصادف جلوه دهند.
  پیکر آریانا در آرامستان «وادی و آرامگاه رودسر» در رودسر به خاک سپرده شد.
  آریانا در رشته گردشگری دیپلم گرفته بود و به دلیل عشقی که به حیوانات داشت می‌خواست در دانشگاه دامپزشکی تحصیل کند. خانواده او بارها به او پیشنهاد مهاجرت و تحصیل در کانادا را داده بودند اما او بین رفتن و ماندن مردد بود.
  او در یکی از پست‌های اینستاگرامی‌اش نوشته بود:
  «بعضی‌وقتها باید از ترست بگذری تا زیبایی اون سمت ترس رو ببینی».

