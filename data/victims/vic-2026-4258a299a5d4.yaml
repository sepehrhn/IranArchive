  صدرالدین در جریان خیزش ملی ایرانیان به دنبال کشته شدن #مهسا_امینی، شامگاه چهارشنبه در اشنویه مورد اصابت گلوله نیروهای نظامی حکومت قرار گرفت و کشته شد.

