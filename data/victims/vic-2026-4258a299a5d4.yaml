  Sadreddin Litani (Rivas)
  27 years old, from Sheno (Oshnavieh) of West Azarbaijan;
  He was killed on September 21, 2022.

  Sadreddin, amid the Iranian national uprising following the killing of #MahsaAmini, was fatally shot by the military forces of the government in Sheno on Wednesday night.

