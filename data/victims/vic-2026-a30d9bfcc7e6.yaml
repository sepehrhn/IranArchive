description: |-
  •
  جاویدنام: کمال احمدپور،
  سن نامشخص، اهل مهاباد، آذربایجان غربی؛
  جاودانه شد: ۲۷ آبان ۱۴۰۱.

  کمال در جریان اعتراضات سراسری ضد حکومتی در خیابان «منبع» مهاباد مورد اصابت سه گلوله قرار گرفت و در حین انتقال به بیمارستان «خمینی» مهاباد جان باخت.
  پیکر کمال روز ۲۸ آبان ماه با شعار : «کرد، بلوچ، آذری/آزادی و برابری» مردم سوگوار به خاک سپرده شد.
  در مراسم چهلم کمال، کژال دختر او همراه حاضران در مراسم شعار می‌داد:
  «کاک کمال قارمانه/ شهیدی کوردستانه»
  کاک کمال قهرمان است/ شهید کردستان است.
  کمال احمدپور متاهل و دارای دو دختر خردسال بود.

