  Kamal Ahmadpour,
  Age Unknown, from Mahabad, West Azarbaijan;
  He was killed on November 18, 2022.

  During the nationwide anti-government protests on "Manba" Street in Mahabad, Kamal was hit by three bullets and lost his life while being transferred to "Khomeini" Hospital in Mahabad.

  Kamal's body was laid to rest on November 19th with the slogan: "Kurds, Baluchis, Azarbaijanis/Freedom and Equality" amidst mourning crowds.

  During Kamal's 40th-day memorial ceremony, his daughter „Kajal“ chanted along with the attendees:
  "Kak Kamal Ghahramane/ Shahidi Kurdistane"
  Kak Kamal is a hero/ A martyr of Kurdistan.

  Kamal Ahmadpour was married and had two young daughters.

