description: |-
  •
  جاویدنام: لال‌محمد (لال‌بخش) آنشینی فرزند شریف،
  سن نامشخص، اهل زاهدان
  جاودانه شد: ۸ مهر ۱۴۰۱.

  لال‌محمد روز #جمعه_خونین_زاهدان با شلیک گلوله جنگی ماموران سپاه به سینه‌اش کشته شد.
  او کارگر ساختمانی بود و  تامین هزینه زندگی پدر نابینا است و دو خواهرش بر عهده او بود.
  لال‌محمد شناسنامه ندارد. حتی عکسی از او وجود ندارد الا تصویر پیکر بی‌جانش بعد از کشته شدن. سهم لا‌ل‌محمد از شهروندی کشور ثروتمند ایران گلوله‌ ماموران حکومت جمهوری اسلامی بود که قلبش را شکافت و جانش را گرفت.

