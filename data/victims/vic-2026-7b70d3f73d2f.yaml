  Laal Mohammad (Laal Bakhsh) Anshini son of Sharif,
  Age Unknown from Zahedan
  Was killed on Sep 30, 2022.

  Laal Mohammad was shot in his chest and killed by IRI armed forces on bloody Friday of Zahedan. He was a labor and responsible to support his blind father and his two sisters. Laal Mohammad did not have any ID card, there is not even a photo of him but a photo of his death body. Laal Mohammad’s share from the wealth of his country was only a bullet which pierced his heart and took his life.

