description: "⁨\t•\nجاویدنامان: علی (۳۸ ساله) و شیوا (۱۸ ساله)،\nاهل و ساکن مشهد؛\n\nجاودانه شدند:\nعلی: ۱۸ دی‌ماه ۱۴۰۴\nشیوا: ۱۹ دی‌ماه ۱۴۰۴\n\nدر جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ علی شامگاه پنجشنبه ۱۸ دی‌ماه در منطقه هفت‌تیر مشهد هدف اصابت گلوله به گلویش قرار گرفت و کشته شد.\n\nدختر هجده‌ساله او، شیوا جاوید، که همراه پدرش بود، همان شب ناپدیدسازی قهری شد و پیکر بی‌جانش را ده روز بعد به خانواده‌اش تحویل دادند. علت مرگ در گواهی فوت شیوا «ضربه مغزی» و زمان مرگ ۱۹ دی‌ماه ۱۴۰۴ ثبت شده بود.\n\nبه مادر شیوا تنها اجازه دادند چهره او را ببیند؛ چهره‌ای کبود با آثار ضربات شدید به سر و بینی. سر او را نیز باندپیچی کرده بودند و اجازه ندادند مادرش آن را باز کند. تصور آنچه در لحظات و ساعات پایانی زندگی از سوی سرکوبگران حکومت بر شیوا گذشته است آسان نیست؛ دختری که پدرش را مقابل دیدگانش کشتند و خودش را با ضرب‌وشتم و خشونت ربودند.\n\nعلی، پدر شیوا، پدر دو فرزند بود و به‌عنوان کامپوزیت‌کار نمای ساختمان کار می‌کرد.\nشیوا به رشته معماری علاقه داشت و قرار بود از ترم جدید تحصیلش را آغاز کند. او آرزو داشت در کنسرت گروه BTS شرکت کند و به یونگی (شوگا) علاقه زیادی داشت.\n\n#علی_جاوید\n#شیوا_جاوید\n#انقلاب_ملی_ایران_۱۴۰۴\n#انقلاب_شیر_و_خورشید\n#مشهد #ایران\n#ناپدیدسازی_قهری\n#کامپوزیت\n#نیمکت_خالی #دانشگاه\n#دانشجو\n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nAli Javid, 38 years old, and Shiva Javid, 18 years old,\nfrom and living in Mashhad;\n\nKilled on:\nAli: 8 January 2026\nShiva: 9 January 2026\n\nDuring the National Revolution against the Islamic Republic, Ali was shot in the throat by regime forces on the evening of Thursday, 8 January in the Haft-e Tir area of Mashhad and was killed.\n\nHis 18-year-old daughter, Shiva Javid, who was with him that night, was forcibly disappeared. Her body was returned to the family ten days later. The cause of death on her death certificate was listed as “head trauma,” and the date of death was recorded as 9 January 2026.\n\nHer mother was only allowed to see her face, which was bruised and showed signs of severe blows to her head and nose. Her head had been bandaged, and they did not allow her mother to remove it. It is difficult to imagine what she endured in her final hours—after witnessing her father being killed, she herself was abducted and subjected to violence.\n\nContinue in the Comments\n👇👇👇⁩"
