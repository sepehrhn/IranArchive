  Mahsa Zarrin Chang
  34 years old,  from Ilam, residing in Tehran
  She was killed on 26th April 2023.

  Mahsa was arrested during nationwide anti-government protests in the September-October and was summoned multiple times after her release.

  On 3th March, she set off for a mountain trek with a group but disappeared before reaching the destination, and her phone went silent since March 5th. Simultaneously with her disappearance, security forces raided her home, confiscating her personal belongings. Mahsa's family searched everywhere for her, even in mental hospitals, but there was no sign of her.

  On April 26th, the Legal Medicine Organization contacted the Zarrin Chang family to collect Mahsa's body.

