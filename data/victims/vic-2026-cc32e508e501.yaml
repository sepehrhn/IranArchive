  جاویدنام: مهسا زرین‌چنگ،
  ۳۴ ساله، اهل ایلام، ساکن تهران؛
  جاودانه شد: ۶ اردیبهشت  ۱۴۰۱.

  مهسا در جریان اعتراضات سراسری ضد حکومتی در ماه مهر بازداشت شد. پس از آزادی هم چند بار احضار شد.
  او روز ۱۲ اسفند همراه مجموعه گردشگری دماوند راهی کوه می‌شود اما پیش از رسیدن به کوه ناپدید شده و از ۱۵ اسفند گوشی‌اش خاموش می‌شود. هم‌زمان با ناپدید شدن مهسا نیروهای امنیتی به خانه‌اش هجوم می‌برند و اموال شخصی او را ضبط می‌کنند. خانواده مهسا در پی یافتن او به هر نهادی سر زدند اما خبری از مهسا نبود. آنها حتی به بیمارستان‌های روانی هم سر زدند.
  روز ۶ اردیبهشت از پزشکی قانونی با خانواده زرین‌چنگ تماس گرفتند تا برای تحویل پیکر مهسا مراجعه کنند. اگرچه در برگه فوت مهسا علت و زمان مرگ او نامشخص ذکر شده اما نیروهای امنیتی خانواده زرین‌چنگ را وادار کردند علت مرگ او را سقوط از ارتفاع اعلام کنند. نیروهای امنیتی در ازای تحویل پیکر مهسا به خانواده‌اش ۱۰۰ میلیون از آنها گرفتند.
  پیکر مهسا روز ۱۰ اردیبهشت تحت تدابیر شدید امنیتی در «بهشت رضا» ایلام به خاک سپرده شد.
  روز مراسم یادبود چهلمین روز کشته شدن مهسا نیروهای لباس شخصی حکومت با مسدود کردن ورودی آرامستان مانع از حضور مردم در مراسم شدند. آنها از چند روز قبل در سطح شهر اقدام به پاره کردن اعلامیه‌های مراسم کردند تا مردم از روز مراسم اطلاع پیدا نکنند.
  مهسا ورزشکار حرفه‌ای و کوهنورد بود.

