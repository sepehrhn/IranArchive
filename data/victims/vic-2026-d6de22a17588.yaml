  Hafez Olad Amrali
  25 years old, from Andimeshk, Khuzestan;
  He was killed on 1 November 2022.

  Hafez was shot in the leg and abdomen during a confrontation with the chief of the police station in Andimeshk. He sustained injuries and was subsequently arrested by security forces, who subjected him to beatings and violence. This resulted in Hafez falling into a coma. After three days, on the 11th of Aban, he passed away at Imam Ali Hospital in Andimeshk.
  Hafez's body was laid to rest in the cemetery of“ Sarnamak Dar Kol „village in Andimeshk.
  Under pressure from government security forces, Hafez's family did not disclose the information about their son's killing.

