description: |-
  •
  جاویدنام: حافظ اولاد امرعلی،
  ۲۵ ساله، اهل اندیمشک، خوزستان؛
  جاودانه شد: ۱۱ آبان ۱۴۰۱.

  حافظ در درگیری با رئیس پاسگاه نیروی انتظامی اندیمشک از ناحیه پا و شکم مورد اصابت گلوله قرار گرفت ‌و مجروح شد. نیروهای امنیتی در همان حال اقدام به بازداشت او با ضرب و شتم و خشونت کردند که موجب شد حافظ به کما برود. او بعد از سه روز، روز یازدهم آبان ماه در بیمارستان «امام علی» اندیمشک جان باخت.
  پیکر حافظ اولاد امر علی را در آرامستان روستای «سرنمک درکول» شهرستان اندیمشک به خاک سپرده شد.
  خانواده حافظ تحت فشار نیروهای امنیتی حکومت راجع به کشته شدن فرزندشان اطلاع‌رسانی نکردند.

