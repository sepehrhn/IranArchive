description: Shot in the chest and heart in front of the Intelligence Office of Sirjan in Sanaei Square. He was a 25-year-old footballer and head of his family, an athlete and member of the Najafshahr Sirjan Municipality football team. He was born into a working-class family and his father died last year. Since then, he was the sole breadwinner of the house. He worked at the Ezzat-Abadi Najafshahr gas station, was studying, and pursuing sports professionally.
