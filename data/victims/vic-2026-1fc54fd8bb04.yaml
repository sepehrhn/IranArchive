  Mehrdad Avazpour Kakroudi (Behnam Rad),
  32 years old,from Nowshahr, Mazandaran province;
  He was killed on 21 September 2022.

  Mehrdad was shot and killed during nationwide protests in Nowshahr.
  His body was buried in Behesht Reza cemetery of Nowshahr.
  His 40th ceremony was held on 31st of October.
  Mehrdad was married and the father of a young daughter.

