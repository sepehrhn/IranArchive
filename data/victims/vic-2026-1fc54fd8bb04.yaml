  جاویدنام: مهرداد عوض‌پور کاکرودی (بهنام راد)،
  ۳۲ ساله، اهل نوشهر چالوس؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  مهرداد در اعتراضات سراسری در نوشهر مورد اصابت گلوله قرار گرفت و‌ کشته شد،
  پیکر او در آرامستان «بهشت رضا» نوشهر به خاک سپرده شد.
  مراسم چهلم او نهم آبان ماه برگزار شد.
  مهرداد متاهل و پدر یک دختر خردسال بود.

