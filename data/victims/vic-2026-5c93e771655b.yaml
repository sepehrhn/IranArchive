description: |-
  •
  جاویدنام: عباس لویمی،
  ۲۲ ساله، اهل اهواز، خوزستان؛
  جاودانه شد: ۱۴ آبان ۱۴۰۱.

  عباس شامگاه ۱۴ آبان ماه در جریان اعتراضات سراسری ضد حکومتی در اهواز در حالیکه سوار موتور بود در کوی زیتون اهواز مورد تعقیب نیروهای امنیتی قرار می‌گیرد. وقتی او از مرکز تجمع دور می‌شود نیروهای امنیتی حکومت با ماشین، با سرعت بالا او را به عمد زیر می‌گیرند و همانجا در خیابان رهایش می‌کنند. عباس که توسط مردم به بیمارستان «امام» در اهواز منتقل شده بود پیش از رسیدن به بیمارستان جان باخت.
  عباس ساکن منطقه تصفیه شکر اهواز بود. او سه ماه پیش از کشته شدن خدمت اجباری سربازی‌اش را تمام کرده بود.

