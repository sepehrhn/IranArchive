  Abbas Louimi
  22 years old, from Ahvaz
  He was killed on 5 November 2022.

  Abbas was being chased by security forces while riding his motorcycle in the Zeytoon neighborhood of Ahvaz during the nationwide anti-government protests on the evening of November 5, 2022. When he turned away from the protest center, government security forces intentionally hit him with their car at high speed and left him on the street. Abbas was taken to the Imam Hospital in Ahvaz by the people, but he passed away before arriving at the hospital.

  Abbas lived in the sugar refinery area of Ahvaz. He had completed his mandatory military service three months before he was killed.

