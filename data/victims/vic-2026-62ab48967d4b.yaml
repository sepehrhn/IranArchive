description: "•\nجاویدنام: امیرحسین مصدق شریف‌پور،\n۲۰ ساله، اهل مشهد\nجاودانه شد: ۱۹ آذر ۱۴۰۱.\n\nدر جریان اعتراضات سراسری ضد حکومتی در بجنورد؛ امیرحسین روز  ۱۵ آذر مورد اصابت ضربات متعدد باتوم نیروهای امنیتی به سرش قرار گرفت. وقتی به خانه برگشت از آن‌جا که نمی‌خواست والدینش را نگران کند به آنها چیزی نگفت، اما حالش خوب نبود؛ زیاد سرفه می‌کرد و در پاسخ مادرش که نگران زخم سر و حال بدش شده بود گفت که چیزی نشده و سرش به دیوار خورده است.\nروز ۱۹ آذر حال امیرحسین رو به وخامت گذاشت. وقتی او را به بیمارستان رساندند به کما رفت و پس از چند ساعت جان باخت.\nپزشکان علت مرگ را ضربه شدید به سر و ضربه مغزی اعلام کردند.\nپیکر او به شرط پذیرش «تصادف» به عنوان علت مرگ به خانواده‌اش تحویل داده شد.\nپیکر امیرحسین در آرامستان «بهشت رضا» شهر مشهد به خاک سپرده شد.\nامیرحسین تک فرزند خانواده بود. او دانشجوی ورودی سال ۹۹ رشته مهندسی برق دانشگاه بجنورد بود. امیرحسین ورزشکار بود و دوستدار حیوانات و بسیار مهربان.\nمادر امیرحسین با انتشار عکس جاویدنام #مجیدرضا_رهنورد در صفحه اینستاگرامش نوشت:\n«عزیز دل مامان امیرحسینم من واسه تک‌تک این عزیزان گریه و عزاداری کردم و از خدا واسه دل مادراشون آرامش و صبر می‌خواستم… حالا عزیز دل مامان، دیگران برای من آرزوی صبر و آرامش می‌کنند. امیرحسینم مامان برو پیش حمیدرضا، مهرشاد، کیان، نیکا برو پیش همشون سلام منو بهشون برسون و اونجا رفیقای خوبی برای هم باشین…می‌دونم که اونجا بهترین زندگی رو دارین…فقط مامانم به دوستاتم بگو برای قلب مادراشون که میسوزه دعا کنن»\n\n#امیرحسین_مصدق_شریف‌پور\n#امیرحسین_مصدق\n#انقلاب_ملی_ایران_۱۴۰۱\n#انقلاب_ملی_ایران\n#مشهد #بجنورد\n#مهسا_امینی #نیکا_شاکرمی #حمیدرضا_روحی #کیان_پیرفلک #مهرشاد_شهیدی \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nAmirhossein Mosadegh Sharifpour,\n20 years old, from Mashhad,\nHe was killed on 10th December 2022.\n\_\nDuring the nationwide anti-government protests in Bojnourd, Amirhossein was struck multiple times on the head by the batons of security forces on the 6th of December. When he returned home, he didn't want to worry his parents and didn't tell them anything, but he wasn't feeling well.\n\n👇👇👇\nContinue in 