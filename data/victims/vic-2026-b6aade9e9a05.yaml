description: |-
  •
  جاویدنام: حسین‌علی کیاکجوری،
  ۲۳ ساله، اهل نوشهر، چالوس؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  در جریان خیزش ملی ایرانیان به دنبال کشته شدن #مهسا_امینی، روز چهارشنبه ۳۰ شهریور در نوشهر ؛ حسین‌علی  در میدان آزادی و‌ در مقابل کلانتری مورد اصابت گلوله نظامیان حکومت به طحالش قرار گرفت. به دلیل شدت تیراندازی کسی نمی‌توانست به او که در حال خونریزی روی زمین افتاده بود کمک کند. وقتی او را به بیمارستان رساندند هنوز زنده بود اما کمی بعد بر اثر شدت خونریزی جان باخت.
  نیروهای امنیتی پیکر او را دو روز بعد به خانواده‌اش تحویل دادند تا در شرایط امنیتی و بدون حضور دوستان و فامیل در آرامستان «کورکورسر» معروف به «الجواد» بین چالوس و نوشهر به خاک بسپارند.
  مزار حسین‌علی در کنار مزار #حنانه_کیاکجوری است. آنها از بستگان یکدیگر بودند.
  مراسم یادبود چهلمین روز کشته شدن حسین‌علی در حالی برگزار شد که ماموران امنیتی ورودی‌های مزار کورکورسر را بستند تا مردم نتوانند خود را به آنجا برسانند.حاضران در مراسم با خواندن سرود «ای ایران» یاد او را گرامی داشتند.

  حسینعلی دانشجوی مهندسی برق دانشکده برق مازندران بود. او عاشق طبیعت بود و آرزو داشت روزی در رشته مورد علاقه‌اش، طراحی برق ساختمان کار کند.

