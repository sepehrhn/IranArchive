  Hossein Ali Kiakojouri,
  23 years old and from Nowshahr, Mazandaran province;
  He was killed on September 21, 2022.

  During the Iranian national uprising following the killing of #MahsaAmini, on Wednesday, September 21th, in Nowshahr; HosseinAli found himself in the crossfire in Azadi Square and was hit in the spleen by government military bullets. Due to the intensity of the shooting, no one could help him as he lay on the ground bleeding. When they took him to the hospital, he was still alive, but he later succumbed to severe bleeding.
  Security forces handed over his body to his family two days later, and they buried him in a secure and secluded manner at "Kurkursar" Cemetery, also known as "Al-Javad," between Chalus and Nowshahr, without the presence of friends and relatives.
  HosseinAli's grave is next to #HananehKiakojouri's. They were relatives.

