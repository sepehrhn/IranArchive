  Milad Saeedi,
  17 years old, from Siavraz Shahsavar, Tonekabon;
  He was killed on November 15, 2022.

  Milad was in traffic on West Ferdowsi Street in Shahsavaran, Tonekabon, along with his sister when he threw a firecracker. Some Basij forces pulled him out of the car and confronted him. They shocked him. When he tried to escape, they shot him from behind with a shotgun, in front of his sister's eyes.

  A driver picked up his unconscious and injured body and took him to the Habib ibn Mazaher Complex. The next day, Milad's body was transported by a Red Crescent helicopter.

