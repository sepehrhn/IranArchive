description: |-
  ⭕️
  جاویدنام: میلاد سعیدی،
  ۱۷ ساله و‌ اهل سیاورز شهسوار، تنکابن؛
  جاودانه شد: ۲۴ آبان ۱۴۰۱.

  میلاد همراه خواهرش در خیابان فردوسی غربی شهسوار در ترافیک بودند که میلاد ترقه‌ای انداخت. تعدادی بسیجی او را از ماشین بیرون کشیدند و درگیر شدند. با شوکر زدندش. وقتی فرار کرد از پشت سر با شاتگان به او شلیک کردند، در مقابل چشمان خواهرش.
  یک راننده پیکر بیهوش و مجروح او را سوار کرد و به مجتمع حبیب‌بن مظاهر برد. فردای آن روز با هلیکوپتر هلال احمر پیکر میلاد را بردند.

