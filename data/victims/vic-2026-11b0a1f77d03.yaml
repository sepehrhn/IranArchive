description: |-
  •
  جاویدنام: عباس شفیعی،
  ۴۲ ساله و ساکن کرج؛
  جاودانه شد: ۱۴ آبان ۱۴۰۱.

  عباس روز چهلم #حدیث_نجفی (۱۲ آبان) از محل کارش خارج شده بود که نیروهای لباس شخصی و ماموران یگان ویژه به او حمله کردند و با باتوم مورد ضرب و شتم قرار دادند. بعد هم با تفنگ ساچمه‌ای از فاصله نزدیک به او شلیک کردند.
  عباس در بیمارستان مدنی کرج مورد عمل جراحی رگ قرار گرفت. او روز ۱۴ آبان در بیمارستان جان باخت.
  ماموران امنیتی ابتدا تلاش کردن خانواده شفیعی را تطمیع کنند و وقتی با مخالفت آنها روبرو شدند به مدت یک هفته پیکر عباس را ربودند تا مانع به خاک سپردن او در آرامستان «بهشت سکینه» بشوند.
  پیکر عباس را روز ۲۰ آبان و چند روز قبل از تولد ۴۳ سالگی او در روستایی دور افتاده در کرج به خاک سپردند.

