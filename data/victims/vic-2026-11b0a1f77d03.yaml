  Abbas Shafiei,
  42 years old, residing in Karaj;
  He was killed on 5th November 2022.

  On the 40th day of the killing of #HadisNajafi by the government of the Islamic Republic, on 3th November; Abbas had left his workplace when plainclothes agents and special forces attacked him and subjected him to beating. Afterwards, they shot him with a pellet gun from close range.

  Abbas underwent surgery for his injuries at Karaj Civil Hospital. Unfortunately, he passed away on the 14th of Aban at the hospital.
  Security forces initially tried to convince Abbas's family, and when faced with their resistance, they forcibly took his body for a week to prevent his burial at "Behesht Sakineh" cemetery.

  Abbas's body was finally laid to rest on 11th November , just a few days before his 43rd birthday, in a remote village in Karaj.

