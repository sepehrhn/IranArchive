  Aref Ashouri,
  27 years old, from Rasht, Gilan;
  He was killed on 9th October 2022.

  Aref was imprisoned in Rasht's Lakan Prison for paying a dowry. He was supposed to be released on 11th October after settling legal matters, but on the afternoon of 9th October, he was killed by anti-riot guards in the prison.

