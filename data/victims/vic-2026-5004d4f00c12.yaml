description: |-
  •
  جاویدنام: عارف عاشوری،
  ۲۷ ساله، اهل رشت؛
  جاودانه شد: ۱۷ مهر ۱۴۰۱.

  عارف به خاطر پرداخت مهریه در زندان لاکان رشت بود. او بعد از قسط‌بندی کردن و انجام امور حقوقی قرار بود ۱۹ مهر از زندان آزاد بشود، اما عصر روز ۱۷ مهر به دست گارد ضد شورش زندان کشته شد.
  عارف و تعدادی از زندانیان به شکنجه و آزار بازداشتی‌های تظاهرات سراسری ضد حکومتی اعتراض کردند و با ماموران زندان درگیر شدند. نیروهای گارد زندان  برای خواباندن اعتراض زندانیان، آنقدر گاز اشک‌آور زدند که بسیاری از زندانیان بیهوش شدند. بعد به آنها تیر خلاص زدند. عده‌ای از زندانیان هم که خواستند از دود و گاز فرار کنند از پشت به گلوله بستند.
  عارف در اثر استنشاق گاز بیهوش شد. او موقع بیهوش شدن، مدام مادرش را صدا می‌کرد.
  در حالی که آمبولانس‌ها مقابل زندان بودند، اما رئیس زندان تا ساعت یک بامداد اجازه نداد مجروحان را به بیمارستان منتقل کنند.
  به پدر و مادر عارف گفتند عارف زنده است. آنها سه روز تمام بیمارستان‌های رشت را گشتند اما نهایتا پیکر بی‌جان پسرشان را در پزشکی قانونی رشت پیدا کردند در حالی که کالبدشکافی شده بود. به آنها گفتند عارف بر اثر اصابت گلوله جان باخته است اما تاکنون گزارش کالبدشکافی را به خانواده تحویل نداده‌اند.
  زیر گوش عارف بخیه خورده بود و دو بازویش سوخته بود. اما صورتش سالم بود. موقع شستن پیکر عارف به پدرش اجازه ندادند او را ببیند. تنها توانستند یک عکس بگیرند.
  پیکر  عارف در  آرامستان «بهشت جلالیه» در آستانه اشرفیه به خاک سپرده شد.
  عارف تک فرزند بود. او ام‌دی‌اف کار بود و نگهبان مسکن مهر کیش در رشت. به شنا علاقه داشت و شناگر خوبی بود. بدنسازی می‌کرد و هیکل ورزیده‌ای داشت.

  از تعداد دقیق کشته شدگان ۱۷ مهر در زندان لاکان رشت اطلاعی در دست نیست. تنها نام چند نفر از آنان موجود است.

