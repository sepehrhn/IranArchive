description: "⁨\t⁨\t⭕️\nجاویدنام: بهار شادمهری،\n۱۷ ساله، اهل نیشابور، استان خراسان؛\nجاودانه شد: ۱۹ دی ۱۴۰۴\n\nدر جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ بهار روز جمعه ۱۹ دی ماه در حالی که در کوچه خلوتی برای نجات زندگی‌اش فرار می‌کرد از پشت مورد اصابت گلوله تک‌تیرانداز حکومت قرار گرفت. فیلم کوتاهی از لحظه تیر خوردن و به زمین افتادن بهاره منتشر شده است که در اسلاید دوم می‌بینید.\n\n#بهار_شادمهری\n#انقلاب_ملی_ایران\n#انقلاب_ملی_ایران_۱۴۰۴\n#نیشابور #استان_خراسان \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nBahar Shadmehri,\n17 years old, from Neyshabur, Khorasan Province;\nKilled: January 19, 2026\n\nDuring the national uprising against the Islamic Republic, Bahar Shadmehri was shot and killed on Friday, January 19, while running through a quiet alley to save her life. She was shot from behind by a regime sniper.\nA short video showing the moment she was shot and fell to the ground has been published and can be seen in the second slide.\n\n#Bahar_Shadmehri\n#NationalRevolutionIran\n#NationalRevolutionIran2026\n#Neyshabur\n#Khorasan\n#Iran\n\n‪‪@realDonaldTrump‪@SenateGOP‪@SenatorGraham‪@ManotoOfficial‬ficial‬ficial\n\n#DonaldTrump\n#LindseyGraham\n#SenatorGraham\n#BBC\n#BBCWorld\n#CNN\n#FoxNews\n#Reuters\n#AlJazeeraEnglish⁩⁩"
