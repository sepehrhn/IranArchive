  Rahim Kalij,
  25 years old, from Qaemshahr;
  He was killed on 21 September 2022.

  Rahim was shot and killed by security forces during the nationwide protests against the government's murder of #MahsaAmini in  Qaemshahr. His body was laid to rest in the "Abulhassan Khoshroo" cemetery in the village of „Saru Kola“
  Rahim had hoped to one day become the biggest LCD repairman in Qaemshahr.
  His dog's name was "Sita". Rahim's mother said at his grave, "After Rahim's death, Sita became restless. Whenever we visit his grave, she barks and looks for her owner. After Rahim, Sita has become our companion."

