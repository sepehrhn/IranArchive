description: |-
  •
  جاویدنام: رحیم کلیج،
  ۲۷ ساله و اهل قائم‌شهر، مازندران؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  رحیم در اعتراضات سراسری به قتل حکومتی #مهسا_امینی در قائم‌شهر با شلیک گلوله ماموران امنیتی به پهلوی راستش کشته شد.
  پیکر او را در آرامستان «ابوالحسن خوشرو» در روستای ساروکلا به خاک سپردند.
  رحیم آرزو داشت روزی بزرگ‌ترین تعمیرکار ال‌سی‌دی قائمشهر بشود.
  اسم سگ رحیم «سیتا» بود. مادر رحیم سر مزار فرزندش گفت: «بعد از مرگ رحیم جان، سیتا بی‌قراری می‌کنه.  هر وقت می‌ریم سر مزارش له‌له می‌زنه و دنبال صاحبش می‌چرخه. بعد رحیم، سیتا همدم ما شده.»

