  Seyedeh Mona Hosseini Kazemi,
  55 years old, from and living in Malek Shahr, Isfahan;
  Killed on: January 9, 2026

  During the National Revolution against the Islamic Republic, Mona was shot by security forces using a shotgun on the evening of Friday, January 9, in Malek Shahr, Isfahan. She was struck in her hands, head, and face.

  Her daughter and son-in-law, who were with her, were also injured.

  They were transferred by ambulance to Gharazi Hospital. During the transfer, Mona complained of severe burning pain in her face and body.

  Minutes after all three were admitted, medical staff announced that Mona had died.

  Security forces asked her husband to register her as a “martyr” and bury her in the martyrs’ section of Bagh-e Rezvan Cemetery, but he refused.

  Mona was a wife and a mother. She was a radiology specialist and worked at the charitable Dar al-Shafa of Imamzadeh Abolabbas in Khorasgan.

