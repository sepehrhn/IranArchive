description: |-
  •
  جاویدنام: سید منا حسینی کاظمی،
  ۵۵ ساله، اهل و ساکن ملک‌شهر اصفهان؛
  جاودانه شد: ۱۹ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی، منا شامگاه جمعه ۱۹ دی‌ماه در ملک‌شهر اصفهان هدف اصابت گلوله‌های شاتگان نیروهای سرکوب به دست، سر و صورتش قرار گرفت.

  دختر و دامادش نیز که همراه او بودند، مجروح شدند.

  آنها را با آمبولانس به بیمارستان «غرضی» منتقل کردند. منا در طول مسیر از سوزش شدید در صورت و بدنش شکایت داشت.

  دقایقی پس از پذیرش هر سه در بیمارستان، کادر درمان اعلام کردند که منا جان باخته است.

  نیروهای امنیتی از همسر منا خواستند نام او را «شهید» ثبت کنند و در قطعه شهدا در آرامستان «باغ رضوان» به خاک بسپارند، که با مخالفت او مواجه شدند.

  منا همسر و مادر بود. او کارشناس رادیولوژی بود و در دارالشفای خیریه «امامزاده ابوالعباس» خوراسگان شاغل بود.

