  Zar BiBi (Sangin) Esmaeilzahi,
  60 years old, from Zahedan;
  She was killed on 20th February 2023.

  During the nationwide anti-government protests in Zahedan, on the day known as #BloodyFridayZahedan on the 30th September, Zar BiBi, while trying to comfort her one-year-old grandchild, carried the child in her arms and stepped out of her home in the courtyard of her house on Azadi Street, Shiraabad neighborhood. She hadn't walked two steps further when a bullet from the military Kalashnikov of the Revolutionary Guards struck the left side of her neck, and she fell to the ground. Her family rushed her to Khatam Hospital, where they were told she had internal bleeding. Surgery was performed to remove the bullet, but due to spinal cord damage, Zar BiBi became paralyzed. She spent over two weeks in the hospital and then returned home, where her children took care of her.

