description: |-
  •
  جاویدنام: زر بی‌بی (سنگین) اسماعیل‌زهی،
  ۶۰ ساله، اهل زاهدان؛
  جاودانه شد: اول اسفند ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در زاهدان، روز ۸ مهر موسوم به #جمعه_خونین_زاهدان ؛ زر بی‌بی برای آرام کردن نوه‌ یک ساله‌اش او را در آغوش گرفت و از در حیاط منزلش در خیابان آزادی، محله شیرآباد خارج شد. دو قدم از خانه دورتر نشده، مورد اصابت گلوله کلاشنیکف نظامیان سپاه به سمت چپ گردنش قرار گرفت و به زمین افتاد. خانواده‌اش او را به بیمارستان خاتم بردند. آنجا به آنها گفتند که خونریزی داخلی کرده است. عمل جراحی روی او انجام شد. گلوله را خارج کردند اما به دلیل آسیب نخاعی، زر بی‌بی فلج شد. او بیش از دو هفته در بیمارستان بستری بود. سپس به خانه آمد و فرزندانش مراقبت از او‌ را به عهده گرفتند. زر بی‌بی در گفتگوی ویدیویی گفته بود: «…این گلایه را دارم که خدا آنها را هدایت کند!؛ مرا نمی‌زدند. بعداز ظهر همان روز آنقدر بالای سر ما تیراندازی کردند که تیرها مثل سنگ بالای سر ما می‌ریخت…»
  زربی‌بی بعد از تحمل ۱۴۳ روز رنج ناشی از جراحت گلوله و عفونت ناشی از زخم بستر، روز اول اسفند ماه جان باخت.

