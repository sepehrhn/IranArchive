  Saeed Bouyeri,
  18 years old, from Izeh, residing in Fooladshahr, Isfahan;
  He was killed on 19th December 2022.

  Saeed, along with his two close friends, #ArvinMalmaliGolzari and #AmirHosseinMalmaliGhorbani, all from Izeh and residing in Fooladshahr, Isfahan.
  Arvin was abducted by security forces during the funeral of  #MahsaMogouei, and her body was found in the waters of „Bagh-e Baharan“ in the city on
  September 25.
  AmirHossein was abducted by security forces during the 40th-day memorial ceremony for Arvin's killing, and his body was found on the rooftop of their house in Izeh on November 4.
  Saeed was abducted by security forces a few days before the 40th-day memorial ceremony for the killing of AmirHossein.

