description: |-
  ⭕️
  جاویدنام: سعید بویری،
  ۱۸ ساله، اهل ایذه، ساکن فولادشهر اصفهان؛
  جاودانه شد: ۲۸ آذر ماه ۱۴۰۱

  سعید و دو دوست صمیمی‌اش جاویدنام #آروین_ململی_گلزاری و #امیرحسین_ململی_قربانی
  هر سه اهل ایذه و ساکن فولادشهر اصفهان بودند. آروین در مراسم خاکسپاری جاویدنام #مهسا_موگویی توسط نیروهای امنیتی ربوده شد و پیکرش روز ۳ مهر در آب‌های شهر «باغ بهاران» پیدا شد.
  امیرحسین در مراسم چهلمین روز کشته شدن آروین توسط نیروهای امنیتی ربوده شد و پیکرش روز۱۳ آبان روی پشت‌بام منزل‌شان در ایذه پیدا شد.
  سعید چند روز قبل از مراسم یادبود چهلمین روز کشته شدن امیرحسین توسط نیروهای امنیتی ربوده شد. پیکر او در حالی که ورم کرده و کبود بود و آثار شکنجه روی آن مشهود بود در پارکی در فولادشهر پیدا شد. روی پاهای سعید هم آثار تزریق وجود داد.
  خانواده سعید پیکر فرزندشان را به ایذه منتقل کردند و در آرامستان روستای «تاکوتر» به خاک سپردند.
  سعید دیپلم‌ش را گرفته بود و در یک بستنی‌فروشی در محله‌شان کار می‌کرد. کار و درس هر دو برای او مهم بودند. سعید بسیار بلندپرواز بود و آرزوهای زیادی داشت. می‌خواست مهندس و در کنار آن خواننده بشود. او در اعتراضات #آبان_۹۸ هم حضور فعال داشت. می‌گفت: «نسل ما دهه هشتادی‌ها باید یه کاری بکنند برای آینده.»
  پدر سعید مدت کوتاهی پیش از کشته شدن او درگذشته بود.

