  Shahoo Khezrie
  21 years old, from Mahabad, West Azarbaijan
  She was killed on 27 October 2022.

  Shahoo was killed during the nationwide anti-government protests in Mahabad, following the burial of Ismail Mouloudi, when he was struck by a bullet from the military forces of the Revolutionary Guards, hitting his forehead. His body was transferred to the hospital morgue. The security forces even refused to hand over Shahou's death certificate to his family. In exchange for their silence and not disclosing the cause of Shahou's death, the security forces offered a large sum of money to the Khedrie family, which was strongly rejected.

  Shahoo's body was laid to rest on Saturday, the 6th of Aban, in his hometown of "Shilanabad" with the presence of the people of Mahabad.

