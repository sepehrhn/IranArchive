  جاویدنام: شاهو خضری،
  ۲۱ ساله و اهل مهاباد، آذربایجان غربی؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  شاهو در اعتراضات سراسری ضد حکومتی در مهاباد، بعد از خاکسپاری #اسماعیل_مولودی، با اصابت گلوله کلاشنیکف نظامیان سپاه به پیشانیش کشته شد. پیکر او را به سردخانه بیمارستان منتقل کردند. نیروهای امنیتی حتی برگه فوت شاهو را به خانواده‌اش تحویل ندادند. آنها به خانواده خضری در ازای سکوت و اعلام نکردن علت مرگ شاهو پیشنهاد مبلغ زیادی پول دادند که با مخالفت شدید خانواده مواجه شدند.
  ‌پیکر شاهو روز جمعه ششم آبان با حضور مردم مهاباد در روستای زادگاهش «شیلان‌آباد» به خاک سپرده شد.

