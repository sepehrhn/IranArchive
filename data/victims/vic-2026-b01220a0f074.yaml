description: "•\nجاویدنام: هیمن آمان،\n۲۵ ساله، اهل بوکان، کردستان؛\nجاودانه شد: ۲ آذر ۱۴۰۱.\n\nهیمن از دوستان نزدیک جاویدنامان #محمد_حسن‌زاده و #شهریار_محمدی بود. او روز ۲۶ آبان ماه در جریان اعتراضات سراسری ضد حکومتی در بوکان مورد اصابت گلوله‌های ساچمه‌ای قرار گرفت و مجروح شد. دوستانش او را به منزل والدینش بردند. فردای همان روز ماموران اطلاعات سپاه او را در خانه و در حالی که مجروح بود بازداشت کردند. نیروهای امنیتی روز ۲ آذر ماه با خانواده آمان تماس گرفتند و از آنها خواستند جهت تحویل پیکر هیمن به بازداشتگاهی امنیتی در ارومیه مراجعه کنند.\nپیکر هیمن شامگاه آنروز تحت فشار نیروهای حکومتی در سکوت به خاک سپرده شد.\n\n#هیمن_آمان\n#انقلاب_ملی_ایران۱۴۰۱\n#انقلاب_ملی_ایران \n#بوکان #کردستان\n#مهسا_امینی \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nHaiman Aman,\n25 years old, from Bukan, Kurdistan;\nHe was killed on 23th November 2022.\n\_\nHaiman was a close friend of the immortalized Javidnamans, #MohammadHassanzadeh, and #ShahriarMohammadi . On 17th November, during the nationwide anti-government protests in Bukan, he was hit by live bullets and injured. His friends took him to his parents' home. The next day, intelligence agents of the Sepah #IRGC arrested him at his home while he was still wounded. On 23th November, security forces contacted Haiman's family and asked them to come to a security detention center in Urmia to deliver Haiman's body.\n\_\nUnder the pressure of government forces, Haiman's body was buried in silence on that evening.\n\_\n#HaimanAman\n#IranRevolution \n#IranRevolution2022 \n#Bukan #Kurdistan #Urmia\n#MahsaAmini"
