description: |-
  ⭕️
  جاویدنام: کیانا آتش‌زر،
  ۱۵ ساله، ساکن تهران؛
  جاودانه شد: ۱۷ مهر ۱۴۰۱.

  کیانا در جریان اعتراضات سراسری ضد حکومتی روز ۱۷ مهر در هفت‌حوض با اصابت ضربات باتوم نیروهای نظامی حکومت به سرش جان باخت.
  او روز یکشنبه بعد از تعطیلی مدرسه به خانه رفت، لباس‌هایش را عوض کرد و همراه چند نفر از دوستانش به خیابان رفت. خانواده کیانا را تحت فشار گذاشتند تا علت مرگ فرزندشان را سقوط در چاه اعلام کنند.

