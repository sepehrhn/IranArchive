  Kiana Atashzar,
  15 years old, residing in Tehran;
  She was killed on 9th October 2022.

  Kiana lost her life on October 8th during the nationwide anti-government protests when she was hit by baton strikes from government military forces in HaftHoz.
  On the Monday after school, she went home, changed her clothes, and went to the streets with some of her friends. Kiana's family was pressured to declare her cause of death as a fall into a well.

