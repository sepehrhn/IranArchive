description: "Young man from Shirvan who was either executed by the regime or was previously arrested and killed in detention on 18 Dey month. In a video he had posted on Instagram, he said: 'Come out, what more do you want? Worse than this? Come, I have one life to sacrifice for you.' These words were his last message to the people to continue the struggle."
