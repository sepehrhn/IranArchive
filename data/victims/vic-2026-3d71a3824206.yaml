  Behzad Rigi,
  30 years old, from Zahedan;
  He was killed on 30 September 2022.

  Behzad was killed by a bullet from the Revolutionary Guards during the widespread anti-government protests of the people of Zahedan on September 30, known as the #BloodyFridayZahedan. He was participating in the demonstrations at the time of his death.

