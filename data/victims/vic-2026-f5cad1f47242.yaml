description: |-
  پوریا لطف آبادی ۲۳ سال دارد و دانشجوی رشته‌ی کامپیوتر دانشگاه خیام مشهد است. او در تاریخ ۱۰ بهمن بازداشت شده و از آن زمان تاکنون تنها یک بار با خانواده تماس داشته. پوریا اکنون در زندان وکیل آباد در بازداشت به سر می‌برد. نگرانی جدی درباره  وضعیت سلامت و امنیت جانی او وجود دارد. صدایش باشیم.

