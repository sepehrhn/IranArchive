  Mohammad Riyahi,
  20 years old, from Fariman County, Isfahan Province,
  He was killed on 23th September 2022.

  During the nationwide anti-government protests in Isfahan, on September 22, Mohammad was identified by government security forces.
  Early in the morning on September 23, Mohammad and two of his friends, who were riding motorcycles on Kharazi Highway, realized that they were being pursued by a Sepah (Revolutionary Guard) vehicle. The Sepah vehicle collided with Mohammad and his two friends on the motorcycles intentionally. In this deliberate accident, Mohammad and his friend, #SiyavashBahrami, lost their lives, and their other friend, Amir, went into a coma. Just before this deliberate accident, Mohammad's friend, Siyavash, who had realized they were being pursued, had sent his location to his father, asking for help. When Siyavash's father arrived at the designated location, he found the lifeless bodies of his son and Mohammad.

