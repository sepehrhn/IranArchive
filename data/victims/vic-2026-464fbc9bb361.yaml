  جاویدنام: محمد ریاحی،
  ۲۰ ساله، اهل شهرستان فریمن، اصفهان،
  جاودانه شد: اول مهر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در اصفهان، روز ۳۱ شهریور، محمد توسط نیروهای امنیتی شناسایی می‌شود.
  بامداد اول مهر محمد و دو نفر از دوستانش که در اتوبان خرازی با موتورسیکلت در حرکت بودند متوجه می‌شوند تحت تعقیب خودروی سپاه هستند. خودروی سپاه موتورسیکلت محمد را زیر گرفت. در این تصادف عمدی محمد و دوستش #سیاوش_بهرامی جان باختند و دوست دیگرشان امیر به کما رفت. مدت کوتاهی قبل از این تصادف عمدی دوست محمد (سیاوش) که متوجه شده بود تحت تعقیب هستند، با فرستادن موقعیت خود (لوکیشن) برای پدرش از او درخواست کمک می‌کند. وقتی پدر سیاوش به محل مورد نظر می‌رسد با پیکر بی‌جان فرزندش و محمد روبرو می‌شود.
  نیروهای امنیتی به خانواده ریاحی گفتند که آنها از روی موتورسیکلت به زمین پرت شده‌اند. علیرغم وجود چندین دوربین در محل حادثه ماموران اطلاعات حکومت حاضر نشدند فیلم دوربین‌ها را به خانواده ریاحی نشان بدهند.
  پیکر محمد در آرامستان روستا «نوغان» در شهرستان فریدن از توابع اصفهان به خاک سپرده شد.
  محمد و سیاوش از دوران کودکی دوستان صمیمی هم بودند.

