description: |-
  سارا سپهری شهروند بهایی در تاریخ ۲۰ فروردین ۱۴۰۵ در خانه‌ی خود پس از ضبط وسایل شخصی، توسط نیروهای امنیتی بازداشت شده. اطلاعی از دلیل بازداشت او در دست نیست. مادر سارا نیازمند مراقبت مستمر است. سارا نیز قبل بازداشت تحت مراقبت پزشکی بوده و نگرانی جدی در مورد سلامتش وجود دارد.صدایش باشیم.

