description: |-
  امیرعلی مرادی زاویه کرد ۴۳ سال دارد . او در تاریخ ۲۱ دی در محل کارش بازداشت و پس از ۱۹ روز بازجویی در زندان اوین، به زندان تهران بزرگ منتقل شده. قاضی افشاری تودیع وثیقه را به دلیل تتوی «نیکا شاکرمی» روی دستش، رد کرده است. او در زندان دچار اگزما و حساسیت شدید پوستی شده. ‌صدایش باشیم.

