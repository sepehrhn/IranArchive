description: تارا ساربان‌ زاده متواد ۱۳۸۵ و دانشجوی رشته خلبانی‌ست. در اصفهان نجف‌آباد همراه با مادرش معصومه ساربان‌زاده (متولد ۱۳۵۲) در تاریخ ۴ شهریورماه ۱۴۰۴ از خانه ربوده شدند. در یک ماه بی‌خبریِ محض، شکنجهٔ شدید شدند و اعتراف اجباری کردند. بعد از یک ماه آنها را در زندان زنان اصفهان پیدا کردند. هر یک به ۵ سال زندان محکوم شده‌اند.
