  Jalil Rakhshani (Khalil Qanbarzahi Tanha on his ID card),
  25 Years old from Zahedan;
  Was killed on Sep 30, 2022.

  Jalil was a draper in Khayam Street who was killed by IRI regime armed forces. He was standing on roof of his house when he was shot in his chest by IRI regime sniper.
