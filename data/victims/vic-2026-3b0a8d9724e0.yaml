  جاویدنام: جلیل رخشانی (نام شناسنامه: خلیل قنبرزهی تنها)،
  ۲۵ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.
  جلیل در جمعه خونین زاهدان با شلیک گلوله جنگی مامور سپاه
  کشته شد.
  جلیل در خیابان خیام پارچه‌فروشی داشت. او روی پشت‌بام خانه‌اش ایستاده بود که مورد اصابت گلوله تک‌تیرانداز سپاه قرار گرفت. گلوله به قفسه سینه‌اش اصابت کرد.

