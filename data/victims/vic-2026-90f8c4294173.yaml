description: |-
  جاویدنام #علیرضا_خاربور ⁩، ۲۰ ساله، وزنه‌بردار و تازه‌ عقد کرده، در تاریخ ۱۸ دی‌ماه در شهر دیزیچه اصفهان توسط نیروهای سرکوبگر جمهوری اسلامی کشته شد.

  &rlm;بر اساس گزارش‌ها، علیرضا ابتدا با شلیک گلوله به پا زخمی شد و پس از آن توسط نیروهای بسیج بازداشت گردید. وی در حالی‌ که بی‌دفاع و مجروح بود، با شلیک مستقیم به گلو هدف قرار گرفت و جان خود را از دست داد.

  &rlm;در طول ۸ روز پس از بازداشت، نهادهای امنیتی به خانواده او اعلام می‌کردند که علیرضا زنده است. خانواده‌اش در این مدت تمامی بیمارستان‌ها را جست‌وجو کردند، اما پس از گذشت هشت روز، سرانجام به آن‌ها اطلاع داده شد که برای تحویل پیکر بی‌جان فرزندشان مراجعه کنند.

  #جاویدنام

  @JavidnamaneVatan
