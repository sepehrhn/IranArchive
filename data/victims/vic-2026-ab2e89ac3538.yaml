  Mohammad Khajavinia (Darreh-Balaei),
  From Dezful, Khuzestan province;
  He was killed on 22 October 2022.

  During the nationwide anti-government protests in Modares Square of Dezful, Mohammad was shot by the government oppressors from close range and was killed. His body was buried in the new cemetery of Yazdanshahr in the city of Najafabad, Isfahan in silence and with the presence of security forces.
  At his 40th ceremony held on the 1st of December, Mohammad's brother said: “My brother was sacrificed for our country, Iran. My brother was sacrificed for the oppressed people of Iran.” He blamed the regime of the Islamic Republic of Iran for this crime.

