description: |-
  •
  جاویدنام: محمد خواجوی‌نیا (دره‌بالایی)،
  سن نامشخص، اهل دزفول. خوزستان؛
  جاودانه شد: ۳۰ مهر ۱۴۰۱.

  محمد در اعتراضات سراسری ضد حکومتی در میدان مدرس دزفول از فاصله نزدیک مورد اصابت گلوله سرکوبگران حکومت قرار گرفت و کشته شد. پیکر او ‌در آرامستان جدید یزدانشهر در شهر نجف‌آباد اصفهان در سکوت و با حضور نیروهای امنیتی به خاک سپرده شد.
  برادر محمد در مراسم چهلم او که دهم آذر بر مزارش برگزار شد گفت: «برادر من فدای مملکت ایران شد. برادرم فدای مردم مظلوم ایران شد.» او رژیم جمهوری اسلامی را مسبب این جنایت دانست.

