description: |-
  ⭕️
  جاویدنام: اسماعیل حیدری،
  ۱۸ ساله، اهل روستای گونئی کندی، مشکین‌شهر، اردبیل؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  اسماعیل در تظاهرات ضد حکومتی در تنکابن از فاصله نزدیک مورد اصابت گلوله جنگی نظامیان حکومتی قرار گرفت. گلوله به قلبش اصابت کرد ‌و از پشتش خارج شد. برادر اسماعیل شاهد کشته شدن او بود.پیکر او ۲۰ روز گروگان ماموران اطلاعات حکومت بود. آنها چنان خانواده اسماعیل را تهدید کرده بودند که حتی سراغی از پیکر فرزندشان نگرفتند. آنها اصلا نمی‌دانستند چگونه و از کجا باید سراغ پیکر فرزندشان را بگیرند. از تنکابن با آنها تماس گرفتند که بروند جنازه اسماعیل را تحویل بگیرند. پدر اسماعیل، سردار حیدری گفت دادستان تنکابن چند برگه به او داد که امضا کند تا آنها به نیابت از خانواده پیگیر شکایت آنها بشوند. پدر اسماعیل قادر به خواندن به فارسی نیست و مشخص نیست چه چیزی را امضا کرده است.
  اسماعیل در متل‌قو در نشتارود مازندران؛ دور از خانواده زندگی می‌کرد. او در یک نانوایی کار می‌کرد و برای خانواده‌اش در روستا پول می فرستاد.
  پیکر او در روستای محل تولدش به خاک سپرده شد.

