  Ismail Heydari,
  18 years old, from a village in Ardabil province;
  He was killed on 21 September 2022.

  Esmaeil was shot up close during the anti-government demonstration in Tankabon.  The bullet passed through his heart while his brother witnessed his death. Ismail's body was kept by government intelligence agents for 20 days.  They threatened Ismail's family to remain in silence. Not knowing where to look for his body, finally,the family were called to collect Esmaeil’s body. Esmaeil’s father, said that Tonekabon’s prosecutor gave him some papers to sign so that they could pursue the family's complaint.  This is despite the fact that he can not even read Farsi and it is not clear what he signed.
   Esmaeil lived far from his family in Mazandaran. He was working in a bakery and used to send money to his family in the village.
   His body was buried in the village where he was born.  His 40th ceremony was held also in the same place.

