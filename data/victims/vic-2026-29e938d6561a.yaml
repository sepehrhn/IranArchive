  Omid Narooi, son of Gholam-Nabi,
  16 years old, from Zahedan;
  He was killed on 27 October 2022.

  "They shot three arrows into his head. He had gone to the bakery to buy bread. When he came back, he saw that it was crowded. He stopped and looked. They had shot three arrows into my son's head. They shot my child in the head. They took him to the hospital. There were several young people there, several children. They took my child from the mosque to the Social Security hospital.
  On Wednesday, they took his picture to make his ID card with a photo on Saturday. The pictures they took for the ID card are still in my child's pocket..."

  These are the words of Gholam-Nabi Narooi, Omid's father, describing the day his son was killed by the Revolutionary Guards with three bullets to his head during the nationwide anti-government protests in Zahedan.

