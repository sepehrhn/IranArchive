description: |-
  ⭕️
  جاویدنام: امید نارویی فرزند غلام‌نبی،
  ۱۶ ساله و اهل زاهدان؛
  جاودانه شد: ۶ آبان ۱۴۰۱.

  «سه تا تیر زده بودند تو سرش. رفته بود نونوایی که نون بگیره. نون گرفته اومده دیده شلوغِ . از همونجا که داشته رد می‌شده وایستاده نگاه می‌کرده. سه تا تیر زده بودن تو سر بچه‌م. بچه من رو شلیک کردن به مغزش. بردنش بیمارستان، چند تا جوان بودند؛ چند تا بچه، بچه من را بردند مسجد مکی؛ از مسجد مکی بردند بیمارستان تامین اجتماعی.
  سه‌شنبه عکس گرفته که روز شنبه بره شناسنامه‌ش رو عکس‌دار بکنه. عکس‌هایی که برای شناسنامه گرفته هنوز توی جیب بچه‌م مانده…»
  اینها روایت غلام‌نبی نارویی، پدر امید است از روزی که فرزندش کشته شد.
  امید نارویی روز ششم آبان ماه، اطراف مسجد مکی زاهدان با اصابت سه گلوله نظامیان سپاه به سرش کشته شد.

