description: |-
  •
  جاویدنام: سیاوش (ابوالفضل) بهرامی،
  ۲۰ ساله، اهل اصفهان؛
  جاودانه شد: اول مهر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در اصفهان، روز ۳۱ شهریور، سیاوش توسط نیروهای امنیتی حکومت شناسایی می‌شود.
  بامداد اول مهر سیاوش و دو نفر از دوستانش که در اتوبان خرازی با موتورسیکلت در حرکت بودند متوجه می‌شوند تحت تعقیب خودروی سپاه هستند. خودروی سپاه موتورسیکلت سیاوش و دو دوستش را زیر گرفت. در این تصادف عمدی سیاوش و دوستش #محمد_ریاحی جان باختند و دوست دیگرشان امیر به کما رفت. مدت کوتاهی قبل از این تصادف عمدی؛ سیاوش که متوجه شده بود تحت تعقیب هستند، با فرستادن موقعیت خود (لوکیشن) برای پدرش از او درخواست کمک می‌کند. وقتی پدرش به محل مورد نظر می‌رسد با پیکر بی‌جان سیاوش و محمد روبرو می‌شود.
  نیروهای امنیتی به خانواده سیاوش گفتند که آنها از روی موتورسیکلت به زمین پرت شده‌اند. علیرغم وجود چندین دوربین در محل حادثه ماموران اطلاعات حکومت حاضر نشدند فیلم دوربین‌ها را به خانواده بهرامی نشان بدهند.
  امیر دوست سیاوش و محمد بعد از اینکه به هوش آمد وانمود کرد چیزی از حادثه به یاد ندارد و رفت و آمدش را با خانواده دوستانش قطع کرد.
  پیکر سیاوش در آرامستان «البک دده» در شهرستان فریدن از توابع اصفهان به خاک سپرده شد.

  سیاوش در یک مکانیکی کار می‌کرد. او دلش می‌خواست از ایران برود.
  به خوانندگی و نوازندگی گیتار علاقه داشت، ورزشکار بود و در رشته بوکس در کنار پدرش که مربی کیک‌بوکس بود فعالیت می‌کرد. او یک برادر کوچکتر از خودش داشت که هنوز لباسهای برادر را بر تن می‌کند.
  سیاوش پدربزرگ پدری‌اش را عاشقانه دوست داشت. او آرزو داشت روزی در تولیدی لباس پدرش برند خودشان را تولید کنند.

