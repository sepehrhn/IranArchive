description: |-
  •
  جاویدنام: هاجر عباسی،
  ۷۰ ساله، اهل مهاباد، آذربایجان غربی،
  جاودانه شد: ۲۹ شهریور ۱۴۰۱.

  هاجر عباسی (دایه هاجر) در اعتراضات سراسری به قتل حکومتی #مهسا_امینی، روز ۲۸ شهریور ماه با اصابت گلوله نظامیان سپاه مجروح شد. او یک روز بعد بر اثر شدت جراحات جان سپرد.
  ادمین صفحه اینستاگرامی «مهاباد-ترحیم» با انتشار تصویر اعلامیه فوت هاجر عباسی علت مرگ او را «سرطان ریه» اعلام کرده است. این در حالی است که عده زیادی از همشهریانش و آشنایان خانم عباسی با نوشتن جملاتی همچون «مرگ بر جاش» و اطلاق عنوان «شهید» به هاجر عباسی کشته شدن او توسط حکومت را تایید کرده‌اند.

