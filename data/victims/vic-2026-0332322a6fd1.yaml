  Hajar Abbasi,
  70 years old, from Mahabad, West Azarbaijan;
  He was killed on 20th September 2022.

  Hajar Abbasi (Dayeh Hajar) was injured during the nationwide protests against the government's killing of #MahsaAmini on the 19th of September . She was wounded by the bullets of Sepah's forces ( #IRGC).
  She passed away the following day due to the severity of her injuries.

  The administrator of the Instagram page "Mahabad-Tarhim" announced the cause of her death as "lung cancer," but many of her fellow citizens and acquaintances have confirmed her killing by the government, using phrases like "death to the oppressor" and bestowing the title of "martyr" upon Hajar Abbasi.

