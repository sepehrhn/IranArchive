  Mehdi Salehipour
  52 years old, Residence in Karaj
  He was killed on 3 November 2022.

  "In the path of the revolution, we are heading towards it. I swear to God, I have become a martyr, definitely, definitely play this song! I want to go and revolutionize," Mehdi says with a laugh to the camera while driving in his car towards "Behesht-e Sakineh" for the 40th-day memorial ceremony of the martyrdom of Javidnam #HadisNijafi. He sings along with Ahmad Azad's song "Mizadam o Lolam" (I used to hit and roll) in his car.

  Mehdi, during the nationwide anti-government protests after the memorial ceremony of Hadi Nijafi, on November 3, while intending to help a girl who had been shot, was shot by 7 bullets from government forces from behind. He was severely injured and abducted by security forces.

