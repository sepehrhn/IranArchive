description: |-
  •
  جاویدنام: مهدی صالحی‌پور،
  ۵۲ ساله، ساکن کرج،
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  «در مسیر انقلاب به سر می‌بریم، خداوکیلی من شهید شدم حتما حتما همین آهنگ‌و بذارید! می‌خوام برم انقلاب‌و کنترات کنم.»؛ اینها را مهدی با خنده رو به دوربین می‌گوید وقتی ترانه «می‌ زدم و لولم» احمد آزاد را در اتومبیلش در راه راندن به سمت «بهشت سکینه»، برای شرکت در مراسم یادبود چهلمین روز کشته شدن جاویدنام #حدیث_نجفی همخوانی می‌کند.
  مهدی در اعتراضات سراسری ضد حکومتی بعد از مراسم یادبود حدیث نجفی، روز ۱۲ آبان وقتی قصد داشت به دختری که تیر خورده بود کمک کند از پشت سر مورد اصابت ۷ گلوله نظامیان حکومت قرار گرفت. ماموران امنیتی او را که به شدت مجروح شده بود ربودند.
  معلوم نیست آیا مهدی همان روز جان باخته است یا خیر اما آنچه مشخص است این است که وقتی خانواده او بعد از پرداخت ۲۵۰ میلیون تومان پیکرش را تحویل گرفتند علاوه بر آثار گلوله‌ها پایش را هم شکسته بودند. نیروهای امنیتی حتی اتومبیل و تلفن همراه او را توقیف کردند. آنها خانواده مهدی را تحت فشار گذاشتند تا راجع به کشته شدن او اطلاع‌رسانی نکنند.
  پیکر مهدی در آرامستان «بهشت زهرا» تهران به خاک سپرده شد.
  مهدی سرپرست مادر و پسر نوجوانش بود. او مهندس برق بود. مهدی پدر غزاله صالحی‌پور بازیکن سابق تیم ملی فوتبال ایران است.

