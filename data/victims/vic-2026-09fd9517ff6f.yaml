  جاویدنام: عبدالله شه‌بخش فرزند جمعه،
  سن نامشخص، اهل زاهدان؛
  جاودانه شد: مهر ۱۴۰۱- روز نامشخص.

  عبدالله در اعتراضات سراسری ضد حکومتی نهم مهر در زاهدان شرکت کرده بود. او‌ در خیابان کوثر که یکی از محله‌های تجمعات بود ناپدید شد.
  بیستم‌مهر ماه پیکر عبدالله در بیمارستان تامین اجتماعی زاهدان پیدا شد.
  عبدالله شه‌بخش دارای معلولیت بود.

