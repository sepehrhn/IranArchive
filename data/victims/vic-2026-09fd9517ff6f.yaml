  Abdollah Shahbakhsh
  From Zahedan;
  He was killed on October 2022.

  Abdollah had participated in nationwide anti-government protests on the 1st of October in Zahedan. He disappeared in Kowsar Street, which was one of the gathering areas.
  On the 12th of October, Abdollah's body was found in Tamin Ejtemaee Hospital of Zahedan.
  Abdollah Shahbakhsh had a disability.

