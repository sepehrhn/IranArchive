description: حسین عفراوی ۱۸ سال دارد و اهل اهواز است. شاهدان می‌گویند او شب ۹ دی ماه در مسیر بازگشت به خانه، با شلیک گلوله به پا مجروح و پس از آن توسط نیروهای امنیتی دستگیر شده. تاکنون هیچ اطلاعی از محل بازداشت، وضعیت سلامت و امنیت جانی او در دست نیست. صدایش باشیم.
