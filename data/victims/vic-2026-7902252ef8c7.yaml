description: |-
  •
  جاویدنام: عماد حیدری،
  ۳۱ ساله و اهل ملاشیه اهواز،
  جاودانه شد: ۴مهر ۱۴۰۱.

  عماد فعال سیاسی-مدنی عرب اهوازی روز پنجم مهرماه به اتهام شرکت در اعتراضات سراسری به قتل حکومتی #مهسا_امینی توسط اداره اطلاعات اهواز احضار و بازداشت شد. روز ۱۴ مهرماه ماموران وزارت اطلاعات به خانواده عماد اطلاع دادند که عماد بر اثر سکته قلبی درگذشته است. آنها پیکر عماد را ساعت شش صبح و تنها با حضور برادرش در آرامستان «باغ فردوس» به خاک سپردند.
  عماد زیر شکنجه در بازداشتگاه وزارت اطلاعات اهواز کشته شد.
  او که به تازگی ازدواج کرده بود پیشتر نیز چند بار به دلیل فعالیت سیاسی بازداشت شده بود.

