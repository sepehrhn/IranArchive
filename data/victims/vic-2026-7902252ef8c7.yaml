  Emad Heidari,
  31 years old and from Malashieh, Ahvaz.
  He was killed on 6 October 2022.

  Emad, the Arab political and civil activist, who was from Ahvaz, was summoned and arrested by the Ahvaz intelligence department on 27th of September on the charge of participating in nationwide protests against the government murder of #MahsaAmini. On 6th of October, the intelligence agents informed Emad's family that he died due to a heart attack. They buried Emad's body at six in the morning in the presence of his brother in "Bagh Ferdous" cemetery.
  Imad was killed under torture in the custody of the IRGC Intelligence in the southwestern Iranian city of Ahvaz.
  He, who was recently married, had been arrested several times before because of his political activities.

