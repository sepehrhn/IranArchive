description: |-
  •
  جاویدنام: هیوا جانان (جان‌ جان)،
  ۳۲ ساله و اهل بوکان؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  هیوا را نظامیان حکومتی در اعتراضات سراسری ضد حکومتی در بوکان با شلیک گلوله جنگی کشتند.
  پیکر هیوا بامداد ۲۷ آبان تحت فشار نیروهای امنیتی با حضور تعداد اندکی از اعضای خانواده‌اش برگزار شد.
  مراسم چهلم او اما با وجود تهدید و تدابیر شدید امنیتی، روز ششم دی ماه با حضور گسترده عزاداران معترض که شعارهای ضد حکومتی می‌دادند برگزار شد.
  هیوا قبل از رفتن به خانواده‌اش گفته بود: «این بار فرق می‌کند و آزادی قطعی است.»
  هیوا جوشکار بود و در یک اتاق‌سازی جوشکاری می‌کرد. او عاشق شعر و موسیقی بود و صدای خوبی داشت.
  هیوا یعنی امید.

