  Hiwa Janan (Jan Jan)
  32 years old, From Bukan
  He was Killed on 17 November 2022.

  Hiwa was shot and killed by government forces during nationwide anti-government protests in Boukan. His body was leid under the pressure of security forces with the presence of a few family members on the morning of November 18, 2022.

  However, despite threats and strict security measures, his 40th-day mourning ceremony was held on the sixth day of Dey (December 27th) with the presence of a large number of protesting mourners chanting anti-government slogans.

  Before going to his family, Hiwa had said, "This time it's different, and it's the definitive freedom."
  Hiwa was a welder and worked in a fabrication workshop. He loved poetry and music and had a beautiful voice.

  Hiwa means hope.

