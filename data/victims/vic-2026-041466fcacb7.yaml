  جاویدنام: ابراهیم میرزایی،
  ۴۲ ساله، اهل شهرستان دهگلان، ساکن سنندج، کردستان؛
  جاودانه شد: ۴ آبان ۱۴۰۱.

  ابراهیم در جریان قیام مردمی ضد حکومتی در سنندج؛ روز ۴ آبان در چهارراه عباس‌آباد بر اثر استنشاق گاز اشک‌آور دچار اختلال تنفسی شد و پس از بازگشت به خانه به دلیل شدت آسیب جان باخت. او ساکن خیابان شش متری در سنندج بود.

