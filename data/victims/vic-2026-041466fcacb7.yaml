  Ebrahim Mirzaei
   42 years old, born in Dehgolan County, residing in Sanandaj, Kurdistan.
  He was killed on 26th October 2022.

  Ebrahim, during the anti-government popular uprising in Sanandaj, on the 26th of October, at the Abbasabad crossroads, suffered respiratory distress due to inhaling tear gas. After returning home, due to the severity of the injuries, he lost his life. He lived on Six-Meter Street in Sanandaj.

