  Aylar Haqqi,
  23 years old, from Malekan, Tabriz, East Azarbaijan
  She was killed on 16 November 2022.

  Aylar was killed during the nationwide anti-government protests on Thursday, the 16th of November when he was shot in the back of his head by the military forces of the government from close range using shotgun bullets. The security forces put pressure on the Haghani family to claim that Aylar had died due to a fall from a height. Ebrahim Mahmoudi, the Chief of Police of East Azarbaijan Province, claimed, "Aylar lost his life in an incident of falling at the excavation site near Shahran Tower in Tabriz."

