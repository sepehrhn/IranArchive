description: |-
  •
  جاویدنام: آیلار حقی،
  ۲۳ ساله و اهل ملکان، تبریز؛
  جاودانه شد: ۲۵ آبان ۱۴۰۱.

  آیلار در اعتراضات سراسری ضد حکومتی روز چهارشنبه ۲۵ آبان، با شلیک گلوله ساچمه‌ای ماموران نظامی حکومت از فاصله نزدیک به پشت سرش کشته شد.
  نیروهای امنیتی خانواده حقی را برای تحویل پیکر فرزندشان تحت فشار گذاشتند و تهدید کردند که اعلام کنند آیلار به دلیل سقوط از ارتفاع جان باخته است.
  ابراهیم محمودی رئیس پلیس آگاهی استان آذربایجان شرقی ادعا کرد: «آیلار در حادثه افتادن در محل گودبرداری جنب برج شهران تبریز جان باخته است.»
  پیکر آیلار روز جمعه ۲۷ آبان تحت فشار نیروهای امنیتی در آرامستان «وادی رحمت» تبریز به خاک سپرده شد.نیروهای امنیتی تنها به مادر آیلار اجازه دادند چند لحظه پیکر بی‌جان دخترش را در آغوش بگیرد.
  مراسم یادبود چهلمین روز کشته شدن آیلار روز ششم دی ماه برگزار شد.
  پدر آیلار در مراسم یادبود دخترش گفت شاید از خون دخترش می‌گذشت اما از گزارشگر صدا و سیما که آبروی دخترش را برده نمی‌گذرد: «از خدا می‌خواهم از حق گزارشگر صدا و سیمایی که در عرض دو دقیقه هم بازجو شد، هم قاضی شد و رای داد و آبروی کل خانواده آیلار حقی را پایمال کرد، نگذرد.»
  سوگواران معترض با شعار «مرگ بر خامنه‌ای» و «مرگ بر دیکتاتور» از سخنان پدر آیلار حمایت کردند. پدر و مادر آیلار و تعدادی دیگر از حاضران در مراسم با ضربات باتوم و شوکر بازداشت شدند.
  آیلار حقی ملکی دانشجوی سال چهارم پزشکی دانشگاه آزاد تبریز بود.

