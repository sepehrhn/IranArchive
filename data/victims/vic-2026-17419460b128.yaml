description: |-
  جاویدنام #حمیدرضا_همتی‌لر_بهمئی شهرستان لیکک
  ساکن اصفهان در ۱۸ دی ماه ۱۴۰۴ به مدت چهار روز ربوده شد و پس از چهار روز پیکر بی جانش را به خانواده تحویل دادند.
  حمیدرضا مدرس زبان آلمانی و مسلط به سه زبان خارجی، در آرامگاه لیکک  به خاک سپرده شد.

  #جاویدنام

