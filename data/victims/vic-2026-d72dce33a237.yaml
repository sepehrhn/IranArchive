  Farzin Farokhi,
  Age unknown, from Saqez of Kurdistan Province;
  Was killed on Nov 10, 2022.

  Farzin was a cabinet-maker who was living in Saadi area of Saqez. It was on Sep 30 that Farzin was injured in the nationwide protest against IRI regime and was carried to a hospital in Tabriz. On Nov 10 he lost his life due to injuries and wounds he received in the protest. Farzin was buried in Aychi graveyard.

