  جاویدنام: فرزین فرخی،
  سن نامشخص، اهل سقز، استان کردستان؛
  جاودانه شد: ۱۹ مهر ۱۴۰۱.

  فرزین در اعتراضات سراسری ضد حکومتی روز ۸ مهر ۱۴۰۱ زخمی شد و به بیمارستانی در تبریز منتقل شد.
  او رو نوزده مهر بر اثر شدت جراحات وارده جان سپرد.
  پیکر فرزین را در آرامستان «آیچی» به خاک سپردند.
  فرزین فرخی کابینت‌ساز بود و در منطقه سعدی سقز زندگی می‌کرد.

