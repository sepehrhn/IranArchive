  Mohammad Keshavarz (Saremi),
  34 years old , from Borujerd;
  He was killed on 31th October 2022.

  During the nationwide anti-government protests on the 28th of October, intense clashes erupted between the people and Law Enforcement Command of the Islamic Republic  in the Ghaani neighborhood of Borujerd. Mohammad and his brother returned to their village after the protests ended. On the 31th of October, government forces, who had identified them, attacked the village of “Haft Cheshmeh”, 25 kilometers from Borujerd, and besieged the area. They shot Mohammad in the head, killing him, and arrested his brother Davood.

  Quoting the commander of the law enforcement in Lorestan, the government-affiliated newspapers wrote: "One of the factors of the unrest in Borujerd was that someone committed suicide after clashing with law enforcement."

