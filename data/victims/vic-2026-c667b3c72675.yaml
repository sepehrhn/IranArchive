description: |-
  •
  جاویدنام: محمد کشاورز (صارمی)،
  ۳۴ ساله، اهل بروجرد، لرستان؛
  جاودانه شد: ۹ آبان ۱۴۰۱.

  در اعتراضات سراسری ضد حکومتی روز ششم آبان در محله قاآنی بروجرد درگیری شدیدی بین مردم و نیروی انتظامی رخ داد. محمد و برادرش پس از پایان تظاهرات به روستایشان برگشتند. روز نهم آبان ماموران نظامی حکومت که آنها را شناسایی کرده بودند به روستای هفت چشمه در ۲۵ کیلومتری بروجرد حمله کردند و آنجا را محاصره کردند. آنها با شلیک گلوله به سر محمد او را کشتند و برادرش داوود را بازداشت کردند.
  از قول فرمانده انتظامی لرستان در روزنامه‌های حکومتی نوشتند: «یکی از عوامل اغتشاشات در بروجرد پس از درگیری با نیروهای انتظامی خودکشی کرد.»

