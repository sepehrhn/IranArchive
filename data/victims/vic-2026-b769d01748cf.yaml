  Seyed Shahabeddin Hashemi,
  25 years old, From Hamedan, residing in Tehran,
  He was killed on 7th december 1401.

  Shahabeddin was a ninth-semester law student at Allameh Tabatabai University, enrolled in 2017.

  He was a freedom-loving and secular youth who actively participated in nationwide anti-government protests following the government's murder of #MahsaAmini.

