description: |-
  •
  جاویدنام: سید شهاب‌الدین هاشمی،
  ۲۵ ساله، اهل همدان، ساکن تهران
  جاودانه شد: ۱۶ آذر ۱۴۰۱.

  شهاب‌الدین دانشجوی ترم ۹ رشته حقوق دانشگاه علامه‌طباطبایی، ورودی سال ۱۳۹۶ بود. او که جوانی آزادی‌خواه و سکولار بود در اعتراضات سراسری ضدحکومتی به دنبال قتل حکومتی #مهسا_امینی شرکت فعالانه داشت. نیروهای امنیتی او را شناسایی کرده بودند و حراست دانشگاه اسکان او در خوابگاه دانشگاه را لغو کرده بود. او در نمازخانه خوابگاه می‌خوابید.
  شهاب‌الدین شامگاه ۱۵ آذر توسط نیروهای امنیتی ربوده شد و به دنبال آن گوشی‌اش از دسترس خارج شد. نیروهای امنیتی شهاب‌‌الدین را در کتابخانه خوابگاه دانشجویی همت به دار آویختند.
  مشخص نیست که آیا او را با ضرب و شتم و زیر شکنجه کشتند و بعد پیکرش را برای صحنه‌سازی خودکشی به دار آویختند؛ یا او را زنده دار زدند.
  روز ۱۷ آذر از طرف دانشگاه با خانواده هاشمی که به شدت نگران فرزندشان بودند تماس گرفتند و‌ گفتند حال او‌ بد است و آنها باید به بیمارستان بیایند.
  نیروهای اطلاعات حکومت پیکر شهاب‌الدین را ربودند و خانواده او به سختی توانستند آن را پس بگیرند.
  معاون دانشجویی دانشگاه علامه روز ۱۷ آذر در مورد مرگ‌ شهاب‌الدین اعلام کرد: «دانشجوی مرحوم ما از سنوات گذشته مشکلاتی داشت که تحت نظر متخصصان مرکز مشاوره دانشگاه قرار داشت.»
  سید مهدی هاشمی، برادر شهاب‌الدین این بیانیه دانشگاه را کثیف و سرشار از دروغ و تهمت خواند و مرگ برادرش را قتل مشکوک. پدر شهاب‌الدین که جانباز ۵۰ درصد جنگ ایران و عراق است اعلام کرد پسرش را نیروهای امنیتی ربوده و کشته‌اند.
  پیکر شهاب‌الدین در آرامستان «علی‌آباد» همدان به خاک سپرده شد.
  شهاب ورزشکار و استاد بوکس بود.

