description: |-
  •
  جاویدنام: محمد حاجی‌رسول‌پور،
  ۵۷ ساله، اهل بوکان، آذربایجان غربی؛
  جاودانه شد: ۲۸ آذر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی؛ محمد روز ۲ آذر در مقابل مغازه‌اش در بوکان بازداشت شد. روز ۲۲ آذر ماه از زندان بوکان با خانواده حاجی‌ رسول‌پور تماس گرفتند و گفتند برای آزادی موقت او با وثیقه ۵۰۰ میلیونی به زندان مراجعه کنند.
  وقتی به زندان رسیدند محمد را در حالی که به کما رفته بود و روی ویلچر نشانده شده بود به آنها تحویل دادند. محمد را در بخش مراقبت‌های ویژه بیمارستان «قلی‌پور» در بوکان بستری کردند. او بامداد ۲۸ آذر بر اثر شدت جراحات ناشی از شکنجه جان باخت.
  پیکر محمد همان روز در آرامستان روستای «آلی‌کند» از توابع بوکان به خاک سپرده شد.
  محمد قبل‌تر هم به دلیل شرکت در اعتراضات بازداشت شده بود. یکبار ۹ مهر ماه و بار دیگر ۲۵ مهر ماه؛ هر دو بار هم با قرار وثیقه آزاد شده بود.
  سال پیش هم او را به اتهام «تبلیغ علیه نظام به نفع یکی از احزاب کرد» به ۵ ماه زندان محکوم کرده بودند. او فروردین امسال پس از گذراندن دوره محکومیتش آزاد شده بود.

