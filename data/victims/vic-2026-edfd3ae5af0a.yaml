  Mohammad Haji Rasoolpour,
   57 years old, from Bukan, West Azarbaijan;
  He was killed on 19 December 2022.

  During nationwide anti-government protests;  Mohammad was arrested in front of his shop in Bukan On November 23rd, they contacted the family of Haji Rasoolpour from Bukan prison and asked them to go to the prison with a bail of 500 million for his temporary release.
  When they reached the prison, they received Mohammad on a wheelchair and in a state of coma. They admitted him to the Qalipur Hospital in Bukan.
   He died in the morning of december 19 due to severe injuries caused by torture.
   Mohammad's body was buried on the same day in the cemetery of "Ali Kand" In the village of Bukan.
   Mohammad was arrested  two times earlier  for participating in protests and Both times he was released on bail.
  Once he was in prison for 5 months  on the charge of "advertising against the regime in favor of one of the Kurdish parties"

