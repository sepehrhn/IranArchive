  Somayeh Rezaei, 41 years old;
  Morteza Zompoosh, 49 years old;
  Residents of Hamedan;
  Killed on: January 8, 2026

  During the National Revolution against the Islamic Republic, Somayeh and her husband Morteza were targeted by gunfire and baton attacks by government security forces at Meydan-e Daneshgah in Hamedan and were killed.
  The suppressive forces first fired shotgun pellets into Morteza’s face and then crushed his head with repeated baton blows. Somayeh tried to shield and help her husband, but she too was shot in the head from behind with a shotgun and then beaten severely with batons.

