description: |-
  •
  جاویدنامان: سمیه رضایی، ۴۱ ساله؛
  مرتضی ذوم‌پوش، ۴۹ ساله؛
  ساکن همدان،
  جاودانه شدند: ۱۸ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی، سمیه و همسرش مرتضی در میدان دانشگاه همدان هدف اصابت گلوله و ضربات باتوم نیروهای سرکوب حکومت قرار گرفتند و جان باختند.

  سرکوبگران ابتدا با شاتگان به صورت مرتضی شلیک کردند و سپس سر او را با ضربات متعدد باتوم متلاشی کردند. سمیه تلاش کرد خود را سپر همسرش کند و به او کمک کند، اما از پشت با شاتگان به سر او نیز شلیک کردند و سپس با ضربات باتوم سرش را در هم کوبیدند.

  نیروهای امنیتی پیکر آنها را ربودند و پس از پنج روز، با ثبت نام آنها به عنوان «شهید» و «شهیده» و سناریوسازی حکومتی، پیکرها را تحت فشار و تهدید به خانواده تحویل دادند. مسئولان شهری و بازیگران حکومتی نیز در مراسم تشییع پیکر آنها حضور یافتند.

  برای وادار کردن خانواده‌ها به پذیرش این شرایط، «سهیل» تنها فرزند نوجوان سمیه و مرتضی را تهدید کردند؛ از جمله اینکه اجازه نخواهند داد در هیچ مدرسه‌ای تحصیل کند، و همچنین تهدیدهای جانی علیه او مطرح کردند.

  پیکرهای سمیه و مرتضی در کنار یکدیگر در آرامستان «باغ بهشت» همدان به خاک سپرده شدند.

  سهیل در یک لحظه هر دو والد خود را از دست داد و پس از آن، دو خانواده در برابر ظلمی مضاعف، ناچار شدند تحریف حقیقت را تحمل کنند و حضور قاتلان عزیزانشان را بر مزار آنها تاب بیاورند.

