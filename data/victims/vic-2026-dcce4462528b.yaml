  Rahā (Zahra) Bohlooli-Pour,
  23 years old, from Firouzabad, Fars Province, resident of Tehran;
  Killed: 18 January 2026

  During the national uprising against the Islamic Republic, Rahā was shot in the head by security forces in Fatemi Square, Tehran, on the evening of Thursday, 18 January, and killed.
  Her body was buried in Firouzabad.
  Rahā was a student of Italian language at the Faculty of Language and Literature, University of Tehran. She was of Qashqai Turk origin and lived in a student dormitory in Tehran.

  Nearly a year earlier, she had written on the X platform:
  “I told Aria honestly: every morning when I leave the dormitory, deep down I’m not sure whether I’ll come back at night or not. Living under the shadow of the Islamic Republic.”

