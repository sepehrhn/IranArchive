  جاویدنام: رها (زهرا) بُهلولی‌پور،
  ۲۳ ساله، اهل فیروزآباد، استان فارس، ساکن تهران؛
  جاودانه شد: ۱۸ دی ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ رها شامگاه پنجشنبه ۱۸ دی ماه در میدان فاطمی تهران مورد اصابت گلوله جنگی به سرش قرار گرفته و کشته شد.
  پیکر او در شهر فیروزآباد به خاک سپرده شد.
  رها دانشجوی رشته زبان ایتالیایی در دانشکده زبان و ادبیات دانشگاه تهران بود. او ترک‌ قشقایی بود و در خوابگاه دانشجویی در تهران ساکن بود.

  او نزدیک به یک سال قبل در پلتفرم ایکس نوشته بود:
  «به آریا گفتم صادقانه هر روز صبح که از خوابگاه میرم بیرون ته دلم مطمئن نیستم که شب برمی‌گردم یا نه. زیستن زیر سایه جمهوری اسلامی.»

