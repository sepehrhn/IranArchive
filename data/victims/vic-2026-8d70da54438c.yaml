  Zahra Lori,
  57 years old, from Kerman;
  She was killed on 26th November 2022.

  Following nationwide anti-government protests after the killing of #MahsaAmini, the scope of protests extended to schools. After one of the student protests and chanting slogans by the students of #RezvaniNejad Girls' High School in Kerman, security forces pressured Zahra Lori, the school's principal, to provide them with the names of protesting students and the CCTV footage from the school. However, Zahra opposed their request, deleted the footage, and didn't hand over the names. She was summoned to the Department of Education and removed from her position as the school's principal. Under the pressure and intimidation of security forces, Zahra Lori suffered a stroke and lost her life.

  Zahra was married and had two children. She held a master's degree in sociology from Shiraz University and a doctorate in urban management from Arak University. She was also a member of Kerman City Council during the second to fifth terms.

