  جاویدنام: زهرا لری،
  ۵۷ ساله، اهل و ساکن کرمان؛
  جاودانه شد: ۵ آذر ۱۴۰۱.

  با شروع اعتراضات سراسری ضد حکومتی به دنبال کشته شدن #مهسا_امینی؛ دامنه اعتراضات به مدارس نیز کشیده شد. پس از یکی از تجمعات اعتراضی دانش‌آموزی و شعار دادن دانش‌آموزان دبیرستان دخترانه #رضوانی‌_نژاد کرمان، نیروهای امنیتی زهرا لری مدیر این دبیرستان را تحت فشار گذاشتند تا اسامی دانش‌آموزان معترض و فیلم‌های دوربین مداربسته دبیرستان را به آنها تحویل بدهد. زهرا اما با درخواست آنها مخالفت کرد. فیلم‌ها را پاک کرد و اسامی را تحویل نداد. او را به اداره آموزش و پرورش احضار کردند و از سمت مدیریت دبیرستان عزل کردند. زهرا لری در پی فشار و ارعاب نیروهای امنیتی سکته کرد و جان باخت.
  زهرا متاهل و دارای دو فرزند بود. او دارای مدرک کارشناسی ارشد جامعه‌شناسی از دانشگاه شیراز و دکترای مدیریت شهری از دانشگاه اراک بود. او همچنین در دوره‌های دوم تا پنجم عضو شورای شهر کرمان بود.

