description: |-
  •
  جاویدنام؛ مرتضی نوروزی،۲۲ساله و اهل لنگرود گیلان؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  مرتضی نوروزی در جریان اعتراضات سراسری به قتل حکومتی #مهسا_امینی در شهر لنگرود با اصابت گلوله ماموران امنیتی به سرش کشته شد.
  ماموران امنیتی پیکر او را از لنگرود به رشت منتقل کردند ‌‌و خانواده  او را تحت فشار گذاشتند تا پیکر فرزندشان را در سکوت به خاک بسپارند و با هیچ رسانه‌ای مصاحبه نکنند.  پیکر مرتضی را دوم مهر به خانواده‌اش تحویل دادند و در سکوت به خاک سپرده شد.
  در مراسم یادبود چهلمین روز کشته شدن مرتضی مادر او مویه‌کنان گفت: «مرتضی من مظلوم بود. آه مرتضی من شما رو می‌گیره. تیر زدن تو سر مرتضی من..» و سوگواران در جواب شعار «مرگ بر خامنه‌ای» سر دادند.

  مرتضی تک فرزند خانواده بود. او به تازگی دیپلم گرفته بود.

