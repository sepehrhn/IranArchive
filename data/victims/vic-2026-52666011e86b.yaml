  Morteza Norouzi,
  22 yearold from Langroud, Gilan,
  has was killed on September 21, 2022.

  During the nationwide protests against the government's killing of #MahsaAmini in Langroud, Morteza Norouzi was shot in the head by security forces and killed. The security forces transferred his body from Langroud to Rasht and pressured his family to bury their son in silence and not speak to any media outlets. Morteza's body was delivered to his family on the second day of Mehr and buried in silence.

  At the fortieth-day memorial of Morteza's death, his grieving mother said, "Morteza was innocent. Oh, Morteza, they took you away from me. They shot you in the head, my Morteza..." and mourners chanted "Death to Khamenei" in response.

  Morteza was the only child of his family. He had recently graduated from high school.


