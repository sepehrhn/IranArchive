  Azad Rezaei,
  25 years old, from Dalahu County, Kermanshah, residing in Dareh Dezhir; (Follower of the Yarsan faith)
  He was killed on 27th March 2023.

  On the evening of Tuesday, the 27th March , Azad was in his car with three of his friends, driving on the streets when they were shot by bullets fired by law enforcement officers from behind, near Niayesh Police Station. A bullet hit Azad in the head, and he tragically lost his life.

  The commander of the police claimed that Azad and his friends were armed robbers who, without stopping, had ignored a police checkpoint. He said that when they were signaled to stop, one of them fired at the police with a handgun.

  In addition to the fact that the police commander's claim has been rejected by Azad's family and friends, there is no evidence to support this allegation.

  Azad's body was laid to rest on the 9th of Farvardin.

  Azad had recently gotten married, and only one year had passed since the beginning of his married life.
