description: |-
  •
  جاویدنام: آزاد رضایی،
  ۲۵ ساله، اهل شهرستان دالاهو، کرمانشاه، ساکن دره دریژ؛ ( پیرو آیین یارسان)
  جاودانه شد: ۷ فروردین ۱۴۰۱.

  شامگاه دوشنبه هفتم فروردین؛ آزاد در ماشین شخصی‌اش همراه سه نفر از دوستانش در حال تردد در خیابان بودند که حوالی میدان نیایش از پشت سر مورد اصابت گلوله ماموران نیروی انتظامی کلانتری ۲۱ نیایش قرار گرفتند. گلوله به سر آزاد اصابت کرد و او در دم جان باخت.
  فرمانده نیروی انتظامی ادعا کرد آزاد و دوستانش سارق مسلح بودندکه بدون توقف، ایست بازرسی را رد کردند.او گفت وقتی به آنها ایست داده شد یکی از آنها با کلت کمری به پلیس تیراندازی کرد.
  علاوه بر این که ادعای فرمانده نیروی انتظامی توسط خانواده و دوستان آزاد رد شده است، هیچ مدرکی دال بر این ادعا وجود ندارد.
  پیکر آزاد روز نهم فروردین به خاک سپرده شد.
  آزاد به تازگی ازدواج کرده بود و تنها یک سال از آغاز زندگی مشترکش می‌گذشت.

  پس از شروع خیزش ملی ایرانیان از شهریور سال گذشته؛ به دنبال کشته شدن #مهسا_امینی، آمار شلیک‌های بی‌ضابطه نیروهای نظامی و لباس شخصی‌های حکومتی چندین برابر افزایش یافته است.

