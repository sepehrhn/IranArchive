description: |-
  •
  جاویدنام: عبدالغفور نور براهویی،
  ۳۹ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  عبدالغفور در تجمع گسترده مردم زاهدان روز #جمعه_خونین_زاهدان مورد اصابت گلوله نظامیان سپاه به قلبش قرار گرفت و کشته شد. به گفته برادر عبدالغفور که همراه او بود، وقتی عبدالغفور تیر خورد یکی از نمازگزاران مسن با دیدن او گفت که او جان باخته است. اما برادرش باور نکرد. او عبدالغفور را در ماشینش گذاشت و به بیمارستان خاتم‌الانبیا برد. در بیمارستان به او گفتند برادرش پیش از رسیدن به بیمارستان جان سپرده است. گلوله به قلب عبدالغفور اصابت کرده بود و از پشت کمرش خارج شده بود.
  پیکر عبدالغفور روز شنبه ۹ مهر در آرامستان «بهشت محمد رسول‌الله» زاهدان به خاک سپرده شد.
  عبدالغفور کارگر بود. او متاهل و دارای ۳ فرزند بود.

