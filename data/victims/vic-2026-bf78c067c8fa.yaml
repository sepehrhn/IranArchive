  Abdolghafoor Noor Brahui,
  39 years old from Zahedan;
  He was killed on 30 September 2022.

  Abdolghafoor was shot in the heart by the IRGC soldiers during the massive anti-government gathering of the people of Zahedan on the day known as the #BloodyFridayOfZahedan .According to his brother who was with him, when Abdolghafoor was hit by a bullet, an elderly worshipper saw him and said that he had lost his life. But his brother didn't believe it. He put Abdolghafoor in his car and took him to the Khatam Al-Anbiya hospital. At the hospital, they told him that his brother had passed away before arriving at the hospital. The bullet had hit Abdolghafoor‘s heart and exited from his back.

  Abdolghafoor's funeral was held on Saturday, October 1, at the "Behesht-e-Mohammad Rasulallah" cemetery in Zahedan. He was a worker, married and had three children.

