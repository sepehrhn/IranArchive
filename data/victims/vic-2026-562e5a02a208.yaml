  Sattar Rahimi,
  Age unknown, from Marivan, Kurdistan;
  He was killed on 20th November 2022.

  Sattar was fatally shot on November 20 during the nationwide anti-government protests at the Mosk intersection in Marivan by the military forces of the Revolutionary Guards.

