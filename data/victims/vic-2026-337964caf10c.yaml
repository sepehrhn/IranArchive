  Mohammad Fallah,
  33 years old and from Amol, Mazandaran province, Iran;
  He was killed on 21 September 2022.

  Mohammad was a nurse at Khomeini Hospital in Amol. After finishing work, he was on the way to his home in Mahmoud Abad city, where he saw the people who had attended the nationwide protests against the murder of #MahsaAmini and some were injured during the protest. He went to help one of them, but he was hit by security agents' bullets and he was killed himself.
  He was the father of a six-year-old son and married. By pressuring his family, the security agents called him a Basiji martyr and asked his father to say that he was killed by protesters.

