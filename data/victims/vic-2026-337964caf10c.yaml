description: |-
  •
  جاویدنام: محمد فلاح،
  ۳۳ ساله و اهل آمل استان مازندران؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  محمد پرستار بیمارستان خمینی آمل بود. او پس از پایان کار عازم‌ منزلش در شهرستان محمود‌آباد که مصدومان اعتراضات سراسری به قتل حکومتی #مهسا_امینی را می‌بیند و برای کمک به سمت یک مصدوم می‌رود. اما مورد اصابت گلوله‌های ساچمه‌ای ماموران امنیتی قرار گرفته و کشته می‌شود.
  او پدر یک پسر شش ساله و متاهل بود. ماموران امنیتی با تحت فشار گذاشتن خانواده فلاح او را بسیجی شهید خواندند و از پدرش خواستن بگوید که توسط معترضان کشته شده است.

