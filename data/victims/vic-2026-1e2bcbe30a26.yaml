  Ali Akbar Rabiei,
  From Khundab village, Najafabad, Isfahan;
  He was killed on 2 October 2022.

  Ali Akbar Rabiei was killed on the 2nd of October in the Shapour-e Jadid of Isfahan by a bullet fired by the special unit of the police force.
  He and a number of protesters of nationwide anti-government protests had taken refuge inside a garage when they were shot.
  Ali Akbar Rabiei was a worker and married.
  His body was buried in the cemetery of Khundab, the village he was from.

