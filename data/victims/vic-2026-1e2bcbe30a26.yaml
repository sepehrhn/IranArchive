description: |-
  •
  جاویدنام: علی‌اکبر ربیعی،
  سن نامشخص، اهل روستای خنداب، نجف‌آباد اصفهان؛
  جاودانه شد: ۱۰ مهر ۱۴۰۱.

  علی‌اکبر ربیعی دهم مهر در منطقه شاپور جدید اصفهان با شلیک گلوله جنگی یگان ویژه نیروی انتظامی به سرش کشته شد.
  او و تعدادی از معترضان اعتراضات سراسری ضد حکومتی به داخل گاراژی پناه برده بودند که به آنها شلیک کردند.
  علی‌اکبر ربیعی کارگر و متاهل بود.
  پیکر او را در آرامستان روستای زادگاهش «خنداب» به خاک سپردند.

