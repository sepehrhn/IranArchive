  Mohammad Hossein Faraji Shivyari
  18 years old, Residence in Tehranpars
  He was killed on 28 October 2022.

  On the fourth of Aban, Mohammad Hossein left his home to attend the 40th-day memorial of the government's assassination of #MahsaAmini and never returned. His phone was on until the evening but went  silent afterward.
  In the midnight of the ninth of Aban, Mohammad Hossein's father received a phone call informing him that his son's body had been found in a park in Zafaranieh. When the Faraji family went to identify their son's body, security forces forced them to sign a document stating that Mohammad Hossein had died of a heart attack. Not only did the security forces deny the family the right to see their son's body, but they also handed over the body, wrapped in a shroud, to an ambulance in Behesht Zahra. The family was only able to catch a glimpse of their son's face during the burial. The forensic medicine announced the date of death as the sixth of Aban.
  Mohammad Hossein's body was quietly laid to rest on the eleventh of Aban.

