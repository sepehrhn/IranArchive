description: |-
  ⭕️
  جاویدنام: محمدحسین فرجی شیویاری،
  ۱۸ ساله و ساکن تهرانسر؛
  جاودانه شد: ششم آبان ۱۴۰۱.

  محمدحسین روز چهارم آبان؛ یادبود چهلمین روز قتل حکومتی #مهسا_امینی به قصد شرکت در اعتراضات سراسری از خانه خارج شد و هرگز بازنگشت. تلفن او تا شب روشن بود اما بعد از آن از خاموش شد.
  نیمه‌شب نهم آبان ماه طی یک تماس تلفنی به پدر محمدحسین اطلاع دادند که پیکر پسرش در پارکی در زعفرانیه پیدا شده است. هنگامی که خانواده فرجی برای شناسایی پیکر فرزندشان مراجعه می‌کنند، نیروهای امنیتی آنها را وادار به امضای برگه‌ای می‌کنند با این محتوا که محمدحسین بر اثر سکته درگذشته است. نیروهای امنیتی نه تنها به خانواده فرجی اجازه دیدن پیکر فرزندشان را نمی‌دهند، بلکه پیکر کفن‌پوش شده محمدحسین را در بهشت زهرا تحویل آمبولانس می‌دهند. خانواده محمدحسن تنها توانستند هنگام خاکسپاری صورت فرزندشان را ببینند. پزشکی قانونی زمان مرگ را ششم آبان اعلام کرد.
  پیکر محمدحسین یازده آبان ماه در سکوت به خاک سپرده شد.

