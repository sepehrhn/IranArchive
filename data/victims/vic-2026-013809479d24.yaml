description: |-
  •
  جاویدنام: عدنان کمالی،
  ۲۹ ساله و اهل روستای کناردان، استان هرمزگان؛
  جاودانه شد: ۱۳ آبان ۱۴۰۱.

  عدنان در جریان اعتراضات سراسری ضد حکومتی روز ۱۳ آبان مورد ضرب و شتم نظامیان حکومت با باتوم قرار گرفت و کشته شد. آنها پیکر عدنان را ربودند و در بیابان‌های اطراف روستا رها کردند.
  آثار ضربات جسم سخت بر سر عدنان حکایت از این دارد که او را شکنجه کرده و کشتند. ماموران امنیتی خانواده عدنان را تحت فشار قرار دادند که جسد را به پزشکی قانونی تحویل ندهند و سریع به خاک بسپارند.

