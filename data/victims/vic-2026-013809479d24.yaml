  Adnan Kamali
  29 years old, from Konardan Village, Hormozgan Province
  He was killed on 4th November 2022.

  Adnan was beaten and assaulted by government forces with batons during the nationwide anti-government protests on 4th November and was killed. They abducted Adnan's body and abandoned it in the surrounding deserts of the village.

  The severe injuries on Adnan's body indicate that he was tortured before being killed. Security forces pressured Adnan's family not to hand over the body to the forensic medicine department and to quickly bury it.

