description: |-
  •
  جاویدنام: ایمان محمدی،
  ۲۲ ساله و اهل شاباد استان کرمانشاه؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  ایمان محمدی در جریان اعتراضات سراسری ضد حکومتی کرمانشاه از پشت سر مورد اصابت گلوله نیروهای مسلح حکومتی به گردنش قرار گرفت و کشته شد.
  پیکر او‌ در آرامستان «باغ رضوان» به خاک سپرده شد.

