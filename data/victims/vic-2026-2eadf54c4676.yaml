  Iman Mohammadi,
  22 years old and from Shabad, Kermanshah province;
  He was killed on 21 September 2022.

  Iman Mohammadi was shot in the back of his neck by government forces during the anti-government protests in Kermanshah and was martyred.
  His body was buried in "Bagh-e Rezvan" cemetery.

