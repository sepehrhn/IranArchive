  Ali Nazari,
  21 years old, residing in Bilavar area, Kermanshah;
  He was killed on December 2022.

  During the nationwide anti-government protests in mid-December in Kermanshah, Ali was abducted by security forces. He was temporarily released two weeks later following his family's efforts.
  Less than a week after his release, Ali passed away in his sleep. The forensic medical examination declared Ali's cause of death suspicious, attributing it to a cerebral stroke.
  Many of the protesters who were detained following the start of the Iranian National Revolution, according to reports, were given drugs or injections by interrogators, which resulted in their deaths shortly after their release.

  #ArshiaEmamgholiZadeh, #AbbasMousavi, #Mohabat_Mozafari and #YaldaAghafazli were among the young individuals who lost their lives in such circumstances.

