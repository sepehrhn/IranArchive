  •
  جاویدنام: علی نظری،
  ۲۱ ساله. ساکن منطقه بیلوار، کرمانشاه؛
  جاودانه شد: دی ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی اواسط آذر ماه در کرمانشاه؛ علی توسط نیروهای امنیتی ربوده شد. او دو هفته بعد با پیگیری‌های خانواده‌اش موقتا آزاد شد.
  علی کمتر از یک هفته بعد از آزادی در خواب جان باخت. پزشکی قانونی پس از کالبد‌شکافی علت مرگ مشکوک علی را سکته مغزی اعلام کرد.
  به تعداد بسیاری از معترضانی که پس از آغاز انقلاب ملی ایران بازداشت شدند، توسط بازجویان داروهایی خورانده یا تزریق شد که مدت کوتاهی پس از آزادی موجب مرگ آنها شد. #عرشیا_امامقلی_زاده، #عباس_موسوی و #یلدا_آقافضلی از نوجوانانی بودند که اینگونه جان باختند.

