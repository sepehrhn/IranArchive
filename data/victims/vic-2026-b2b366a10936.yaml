description: "•\nجاویدنام: مونا چمنی،\n۲۸ ساله، اهل رشت،\nجاودانه شد: ۸ آذر ۱۴۰۱.\n\nمونا روز اول آذر در اعتراضات سراسری ضد حکومتی در تهران با اصابت ضربات متعدد باتوم نیروهای نظامی حکومت به کما رفت. او پس از یک هفته، روز ۸ آذر ماه بر اثر شدت جراحات جان باخت. پیکر مونا یک روز بعد در آرامستان «تازه آباد» رشت به خاک سپرده شد.\nنیروهای امنیتی حکومت خانواده چمنی را تحت فشار قرار دادند تا علت مرگ مونا را ایست قلبی اعلام کنند.\nمونا هنرمند و هنرپیشه تئاتر بود. او عاشق حیوانات بود. \n\n#مونا_چمنی\n#انقلاب_ملی_ایران۱۴۰۱\n#انقلاب_ملی_ایران \n#رشت #تهران\n#مهسا_امینی \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nMona Chamani,\n28 years old, from Rasht;\nShe was killed on 29th November 2022.\n\_\nOn 22th November, during the nationwide anti-government protests in Tehran, Mona fell into a coma due to multiple baton strikes by government military forces. After one week, on 29th November, she succumbed to her severe injuries and passed away. The day after, Mona's body was laid to rest in \"Tazehabad\" Cemetery in Rasht.\n\_\nThe government security forces pressured Mona's family to declare her cause of death as a cardiac arrest.\n\_\nMona was an artist and theater actress. She had a deep affection for animals.\n\_\n#MonaChamani\n#IranRevolution \n#IranRevolution2022 \n#Rasht #Tehran\n#MahsaAmini"
