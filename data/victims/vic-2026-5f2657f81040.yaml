  جاویدنام: سعید(محمد) انوشه‌نیا،
  ۳۰ ساله و اهل رشت؛
  جاودانه شد: ۱۷ مهر ۱۴۰۱.

  سعید در جریان سرکوب اعتراضات در زندان لاکان رشت توسط ماموران امنیتی کشته شد.
  او قرار بود همان هفته از زندان آزاد بشود.
  پیکر سعید در آرامستان «باغ رضوان» رشت به خاک سپرده شد.

