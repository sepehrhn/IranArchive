  Saead (Mohammad) Anoushe Nia,
  30 years old and from Rasht;
  He was killed on 9 October 2022.

  Saead was killed by security agents during the suppression of protests in Lakan prison in Rasht.
  He was supposed to be released from prison the same week.
  Saead‘s body was buried in "Bagh Rezvan" cemetery in Rasht.

