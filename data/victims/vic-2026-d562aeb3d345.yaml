description: |-
  •
  جاویدنام: محمدجواد فرمانی،
  ۲۴ ساله و اهل شهر ری، تهران؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  محمد در تظاهرات سراسری در شهر ری به ضرب گلوله ماموران امنیتی حکومت به پایش و خونریزی شدید کشته شد.
  به گفته نزدیکان برای تحویل پیکر محمد خانواده او را تحت فشار گذاشتند تا طی مصاحبه‌ای بگویند فرزندشان عابر پیاده بوده و معترضان با گلوله او را کشته‌اند.
  محمدجواد هشت ساله بود که پدرش را از دست داد و از دوازده سالگی نان‌آور خانواده شد. او در بازار شوش کار می‌کرد. محمدجواد تنها پسر خانواده بود. او دلش می‌خواست دختردار بشود و اسمش را «گندم» بگذارد.

