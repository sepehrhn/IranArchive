  Mohammad Javad Farmani,
  24 years old and from Shahr-e-Rey, Tehran province;
  He was killed on 21 September 2022.

  Mohammad was killed by security forces' bullets during the nationwide protests in Rey city, leading to severe bleeding.
  According to his family, they were pressured to say that their son was just a pedestrian and was killed by protesters' bullets during an interview in order to receive his body.
  Mohammad Javad was eight years old when he lost his father, and from the age of twelve, he became the breadwinner of the family. He worked in the Shush bazaar. He was the only son of the family and he wished to have a daughter and name her "Gandom."

