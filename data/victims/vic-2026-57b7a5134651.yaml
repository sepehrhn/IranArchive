  (Seyed) Farshid Mousavi
  24 years old, from Amol, Mazandaran;
  He was killed on 20th November 2022.

  Farshid was shot by government forces during the nationwide protests against the government's murder of Mahsa Amini in Amol on 21th September. He spent over a month in the hospital receiving treatment. Farshid's mother, tearfully speaking at her son's grave, said, "He couldn't speak to tell me what he wanted. He would write letters for me. He said, 'Mom, they came and they were going to kill me. Move me somewhere else.' I thought my child was hallucinating."

  After being discharged from the hospital, Farshid was arrested by security forces. They threatened his father, stating that if he informed anyone about his son's arrest, they would also detain his other son.

  Farshid was released on 16th November with a battered body from torture, a broken skull, and signs of multiple injections. Two days later, he fell into a coma and on 2oth November, he passed away in the hospital due to brain damage.

