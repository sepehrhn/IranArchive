description: |-
  •
  جاویدنام: (سید) فرشید موسوی،
  ۲۴ ساله، اهل آمل، مازندران؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  فرشید در جریان اعتراضات سراسری به قتل حکومتی #مهسا_امینی در آمل؛ روز ۳۰ شهریور مورد اصابت گلوله نظامیان حکومت قرار گرفت. او بیش از یک ماه در بیمارستان تحت درمان بود. مادر فرشید سر مزار پسرش مویه‌کنان می‌گفت: «زبون نداشت به من بگه چی می‌خوام. برای من نامه می‌نوشت. گفت مامان اینا اومدن داشتن منو می‌کشتن. منو جابجا کنید. فکر کردم بچه‌م داره هذیون میگه.»
  فرشید پس از مرخص شدن از بیمارستان توسط نیروهای امنیتی بازداشت شد. نیروهای امنیتی پدرش  را تهدید کردند که در صورت اطلاع‌رسانی پسر دیگرش را هم بازداشت خواهند کرد. او روز ۲۵ آبان با بدنی مضروب از شکنجه، سر شکسته و آثار تزریق‌های متعدد آزاد شد. دو روز بعد به کما رفت و  روز ۲۹ آبان ماه به دلیل ضربه مغزی در بیمارستان جان باخت.
  علت مرگ فرشید در گواهی فوت نامشخص ذکر شد.
  نیروهای امنیتی خانواده موسوی را تحت فشار گذاشتند که علت مرگ فرزندشان را بیماری اعلام کنند.
  پیکر فرشید در آرامستان «امام‌زاده عبدالله» به خاک سپرده شد.

