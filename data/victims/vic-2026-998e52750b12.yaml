description: |-
  •
  جاویدنام: غزال (رکسانا) امیری‌ کیا،
  ۲۲ ساله و اهل شیراز؛
  جاودانه شد: ۱۹ مهر ۱۴۰۱.

  غزال دانشجوی ترم یک دندانپزشکی دانشگاه شیراز بود. او در جریان اعتراضات سراسری ضد حکومتی روز ۱۸ مهر در معالی‌آباد شیراز توسط نیروهای امنیتی حکومت به شدت مورد ضرب و شتم با باتوم قرار گرفت. او از ترس بازداشت به بیمارستان نرفت. روز ۱۹ مهر با وخیم شدن حالش توسط هم خوابگاهی‌هایش به بیمارستان رسانده شد. اما به دلیل شدت جراحات جان سپرد.
  حکومت پدر غزال، علی‌برز امیری‌کیا را وادار کرد بگوید علت مرگ غزال کرونا بوده است و او در اعتراضات شرکت نکرده است.
  خاکسپاری غزال تحت تدابیر شدید امنیتی برگزار شد.

