  Ghazaal (Roxana) Amirikia,
  22 years old and from Shiraz;
  She was killed on 11 October 2022.

  Ghazaal was a dental student in the first semester of Shiraz University. She was severely beaten with a baton by government security forces during the nationwide anti-government protests on 10th of October in Moali'Abad, Shiraz. She did not go to the hospital because she was afraid that they will arrest her there. On the 11th of October, her condition worsened and she was taken to the hospital by her roommates of the student the dormitory. But she died due to the severity of her injuries.
  The government forced Ghazaal's father, Aliborz Amirikia, to say that the cause of Ghazaal's death was the corona virus and that she did not participate in the protests.
  Ghazaal's funeral was held under strict security measures.

