description: |-
  •
  جاویدنام: اسماعیل گل‌عنبر،
  ۳۹ ساله و اهل جوانرود؛
  جاودانه شد: ۳۰ آبان ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی روز ۳۰ آبان در جوانرود اسماعیل برای تشییع پیکر عرفان‌ کاکایی (از کشته شدگان انقلاب ۱۴۰۱) به آرامستان شهر رفت. وقتی که دید نظامیان حکومت مردم را با تیربار و دوشکا به رگبار بسته‌اند به کمک زخمی‌ها رفت. او شجاعانه برای متوقف کردن حمله نظامیان به سمت ‌وانتی رفت که دوشکا روی آن‌سوار بود. همین که دستش به مامور پشت دوشکا رسید، یک تک‌تیرانداز به سر او شلیک کرد. اسماعیل در دم جان باخت.
  ماموران اطلاعات حکومت پیکر اسماعیل را به کرمانشاه منتقل کردند و به خانواده او گفتند که تنها به این شرط که مراسم خاکسپاری در جوانرود نباشد به آنها تحویل خواهند داد. خانواده گل‌عنبر مجبور شدند پیکر او را در یکی از روستاهای اطراف جوانرود به خاک بسپارند.
  اسماعیل با دست خالی در اعتراض به کشتار همشهریانش مقابل گلوله سینه سپر کرد.
  او متاهل و دارای یک کودک دو ساله بود و در شهر جوانرود مغازه داشت.

