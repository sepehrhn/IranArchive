  Esmaeil Gol-Anbar,
  39 years old, from Javanrud;
  He was killed on 21th November 2022.

  Esmaeil attended the funeral of #ErfanKakaei (one of the martyrs of the 2022 Revolution in Iran ) in the city cemetery. Government forces had surrounded the people attending with tear gas and batons. Esmaeil went to help the wounded.
  He went towards the van with a machine gun mounted on it to stop the military's attack. When his hand reached the officer behind the van, a sniper shot him in the head.
  Esmaeil was killed instantly.
  His body was taken by government intelligence agents to Kermanshah. Esmaeil's family repeatedly sought to retrieve his body, but they were only allowed to have it under the condition that he wouldn't be buried in Javanrud. Consequently, his family was forced to lay him to rest in a village near Javanrud.

  Esmaeil stood empty-handed against the bullets, resisting the slaughter of his fellow citizens.

  He was a married man with a two-year-old child. He owned a shop in Javanrud and was a tradesman.

