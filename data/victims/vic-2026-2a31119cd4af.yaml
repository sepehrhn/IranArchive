  Mehran Shekari,
  21 years old, From Qushachai, Miandoab, Urmia
  He was killed on 3 November 2022.

  Mehran lived in Karaj with his uncle and  learned plastering from him. On the 12th of Aban, they went to “Behesht-e Sakineh “ cemetery to commemorate the 40th day since the death of #HadisNajafi  and later joined anti-government protests. Mehran was killed by military forces of the Revolutionary Guards when he was hit by a military bullet, and his uncle was severely beaten. The Guards' officers abducted Mehran's body and stated that they would only return it to the family at their own discretion, with the condition that Mehran be buried according to the Guards' instructions.

  The Revolutionary Guards' intelligence officers demanded two hundred million tomans from Mehran's family in exchange for delivering his body. Finally, on the 17th of Aban at 4:00 am, they handed Mehran's body to the family and informed them that only twenty elderly family members were allowed to participate in the burial ceremony.

