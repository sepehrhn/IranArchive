description: |-
  •
  جاویدنام: مهران شکاری،
  ۲۱ ساله و اهل میاندواب ، ارومیه؛
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  مهران با دایی‌اش در کرج زندگی می‌کرد و از او گچ‌کاری یاد می‌گرفت. آنها روز ۱۲ آبان، یادبود چهلمین روز کشته شدن #حدیث_نجفی به بهشت سکینه رفتند و بعد از پایان مراسم به تظاهرات ضد حکومتی پیوستند. مهران با اصابت گلوله جنگی نظامیان سپاه کشته شد و دایی‌اش هم به شدت مورد ضرب و شتم قرار گرفت. ماموران سپاه پیکر مهران را ربودند و گفتند هر وقت خودشان بخواهند آن را به خانواده تحویل می‌دهند و خانواده مهران هم باید مطابق دستورات سپاه او را دفن کنند.
  ماموران اطلاعات سپاه از خانواده مهران در ازای تحویل پیکر او درخواست دویست میلیون تومان کردند.
  سرانجام روز ۱۷ آبان ساعت چهار صبح پیکر مهران را به خانواده تحویل دادند و گفتند فقط بیست نفر از افراد مسن خانواده اجازه دارند در مراسم خاکسپاری شرکت کنند.
  پیکر مهران نیمه‌شب نوزده آبان و در خفا در آرامستان «گلشن زهرا» قوشاچای به خاک سپرده شد.
  مهران تک فرزند خانواده بود.

