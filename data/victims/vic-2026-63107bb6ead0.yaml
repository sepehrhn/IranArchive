description: |-
  •
  جاویدنام: شعیب (احمد) حیدری،
  ۲۴ ساله، اهل هرات، افغانستان، ساکن منطقه شاندیز مشهد؛
  جاودانه شد: بین ۱۷-۱۳ آبان ۱۴۰۱.

  شعیب بعد از اشغال افغانستان به یاری دولت بایدن و توسط طالبان برای کار به ایران مهاجرت کرد و به کار مبل‌سازی مشغول شد. شعیب در جریان خیزش سراسری مردمی علیه حکومت به دنبال قتل حکومتی #مهسا_امینی، روز ۱۳ آبان ناپدید شد. خانواده او آخرین بار روز ۱۲ آبان با او تماس داشتند. گفته شده آنروز او چندین تماس تلفنی داشته که محور گفتگویشان شناسایی شدن او بوده است. پنج روز پس از ناپدید شعیب با خانواده‌اش تماس گرفتند و گفتند که او کشته شده است بدون اینکه هیچ اطلاعات دیگری به آنها بدهند.
  پیکر او را بدون اوراق هویتش که همراه داشت به خانواده‌اش در افغانستان تحویل دادند. از گردن تا زیر شکم او را پاره کرده بودند و اندام‌های داخلی‌‌اش را ربوده بودند. از وسایل شخصی‌اش تنها دو تلفن همراهش را به خانواده‌اش تحویل دادند.
  پزشکی قانونی علت مرگ شعیب را «تحت بررسی» اعلام کرد. تاریخ مرگ در گواهی فوت پزشکی قانونی و بیمارستان دو تاریخ متفاوت ذکر شده است.
  پیکر شعیب در زادگاه او شهر هرات در افغانستان به خاک سپرده شد.

  شعیب دانشجوی رشته پزشکی بود. او ورزشکار بود و در رشته هنرهای رزمی ترکیبی (MMA) صاحب پنج کمربند قهرمانی سرتاسری بود.

