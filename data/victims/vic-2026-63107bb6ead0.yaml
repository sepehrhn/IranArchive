  Shoaib (Ahmad) Heydari
  24 years old,from Herat, Afghanistan; Resident of Shandiz, Mashhad
  He was killed Between 4th-8th November 2022.

  After the occupation of Afghanistan, Shoaib migrated to Iran with the help of the Biden administration and in opposition to the Taliban. He found work as a furniture maker.
  He had recently made the decision to visit his family in Afghanistan and was working at a restaurant in Shandiz, Mashhad, in preparation for his journey.
  During the nationwide popular uprising against the government following the murder of #MahsaAmini, Shoaib disappeared on the 4th November. The Heydari family had last spoken to him on the 3th November. It is said that he had multiple phone calls that day, with the focus of their conversations being his identification.

