description: |-
  •
  جاویدنام: امید (ابوالفضل) مرادپور،
  ۲۵ ساله، اهل شیراز؛
  جاودانه شد: ۶ خرداد ۱۴۰۲.

  امید در جریان خیزش ملی ایرانیان به دنبال کشته‌ شدن #مهسا_امینی بازداشت و به #زندان_عادل_آباد شیراز منتقل شد. مدتی بعد برای آزادی او ۴۵۰ میلیون تومان وثیقه تعیین کردند اما به دلیل اینکه خانواده او از پس تامین آن برنیامدند امید مدت بیشتری در زندان ماند. او هفته پایانی اردیبهشت آزاد شد و دو هفته بعد، روز شنبه ششم خرداد به شکل مشکوکی جان باخت.
  پیکر امید روز یکشنبه هفت خرداد به خاک سپرده شد.

  *چنانچه اطلاعات بیشتری دارید لطفا با ما در میان بگذارید!

