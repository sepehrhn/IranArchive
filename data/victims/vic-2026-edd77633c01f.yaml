  Omid (Abolfazl) Moradpour,
  25 years old, from Shiraz;
  He was killed on 27th May 2023.

  Omid, following the Iranian people's uprising after the killing of #MahsaAmini, was detained and transferred to #AdelabadPrison in Shiraz. Later, they set a bail of 450 million tomans for his release, but since his family couldn't afford it, Omid remained in prison for a longer period. He was released in the last week of Ordibehesht (May) and two weeks later, on Saturday, 27th May , he tragically lost his life under suspicious circumstances.

  Omid's body was laid to rest on Monday, 28th May.

