  Mohammad Sadegh Aramesh (Barahouie)
  Age: Unknown, from Khash, Sistan and Baluchestan
  He was killed on 4 November 2022.

  During the nationwide anti-government protests on 13th Aban, known as the "Bloody Friday of Khash," Mohammad Sadegh was hit by a military bullet fired by the Revolutionary Guards and lost his life.
  Mohammad Sadegh was the muezzin of Maraj Mosque in Khash.

