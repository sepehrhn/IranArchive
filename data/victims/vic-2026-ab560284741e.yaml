  جاویدنام: احسان خان‌محمدی،
  ۲۹ ساله و ساکن محله هاشم‌آباد، تهران؛
  جاودانه شد: ۹ مهر ۱۴۰۱.

  احسان در اعتراضات سراسری ضد حکومتی در خیابان جمهوری تهران با ضربات باتوم و شلیک گلوله جنگی به سر و گردنش کشته شد.
  پیکر او را ۱۲ مهر در بهشت زهرا تهران به خاک‌ سپردند. مراسم چهلم او ۲۰ آبان بر سر مزار او برگزار شد.

