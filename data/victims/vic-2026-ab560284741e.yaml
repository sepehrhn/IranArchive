  Ehsan Khan Mohammadi,
  29Years old from Hashem Abad of Tehran;
  Was killed on Oct 01, 2022.

  Ehsan was killed in Jomhoori Street during the protest against IRI regime. He was killed by gun shooting and batons strikes on his head and neck.
  He was buried in Behesht Zahra graveyard of Tehran on Oct 03 and his 40 days on funeral was held on his grave on Nov 11, 2022.

