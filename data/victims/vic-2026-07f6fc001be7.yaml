  Meysam Padidar,
  32 years old, residing in Rasht;
  He was killed on 10th October 2022.

  Meysam was shot by special prison forces during the suppression of protests by prisoners at the „Lakan“ Prison in Rasht, where detained protesters were being subjected to harassment and torture for participating in nationwide protests against the government. After being transferred to the hospital, he lost his life.

  His body was laid to rest in the cemetery of the village of „Paeen Roodposht“, in the outskirts of Lahijan.

  Meysam was the youngest child in his family. He had lost his mother years ago and took care of his father.

  The exact number of casualties in this extensive suppression is unknown. Many of them were buried at night, and cement has been poured over their graves. There are 14 unknown graves in the "Bagh Rezvan" cemetery in Rasht, belonging to the victims of this tragedy. Some others were buried in the villages of Golestan, Chushl, and Liyalestan.

