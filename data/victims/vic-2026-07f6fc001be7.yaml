description: |-
  •
  جاویدنام: میثم پدیدار،
  ۳۲ ساله، اهل رشت؛
  جاودانه شد: ۱۸ مهر ۱۴۰۱.

  میثم در سرکوب اعتراض زندانیان زندان لاکان رشت به آزار و شکنجه بازداشتی‌های اعتراضات سراسری علیه حکومت، مورد اصابت گلوله یگان ویژه زندان قرار گرفت و پس از انتقال به بیمارستان جان باخت.
  پیکر او در آرامستان روستای پایین رودپست از توابع لاهیجان به خاک سپرده شد.
  میثم فرزند آخر خانواده بود. او که سالها پیش مادرش را از دست داده بود با پدرش زندگی و از او مراقبت می‌کرد.
  از تعداد دقیق کسانی که در این سرکوب گسترده کشته شدند اطلاع دقیقی در دست نیست. بسیاری از آنها شبانه به خاک سپرده شدند و روی مزارشان سیمان ریخته‌اند. ۱۴ قبر مجهول‌الهویه در آرامستان «باغ رضوان» رشت وجود دارد که متعلق به کشته‌شدگان این فاجعه است. تعدادی نیز در روستای گلستان، چوشل و لیالستان.

