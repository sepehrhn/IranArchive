description: |-
  •
  جاویدنام: علیرضا کاکامحمدی،
  سن نامشخص، اهل هرسین، کرمانشاه، ساکن کرج؛
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  علیرضا در اعتراضات سراسری ضد حکومتی در کرج، بعد از مراسم یادبود چهلمین روز قتل حکومتی #حدیث_نجفی؛ مورد اصابت گلوله نظامیان حکومت قرار گرفت و کشته شد. نیروهای حکومتی علیرضا را پس از اصابت گلوله به او به شدت مورد ضرب و جرح قرار دادند.
  پیکر علیرضا در آرامستانی در کرج به خاک سپرده شد.

