  Alireza Kakamohamadi,
  Age unknown, from Harsin, Kermanshah, living in Karaj;
  He was killed on 3th November 2022.

  During the nationwide anti-government protests in Karaj, Alireza was shot by government forces and killed after the 40th-day memorial of the government's murder of #HadiNajafi. Government forces severely beat Alireza after he was shot. His body was buried in a cemetery in Karaj.

