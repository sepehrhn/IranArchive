  Kasra Vafapour,
  17 years old, from Kermanshah, living in Fardis, Karaj;
  Killed on: 9 January 2026

  During the National Revolution against the Islamic Republic, Kasra was shot in the heart by regime forces on the evening of Friday, 9 January.

  He died before reaching the hospital.

  Kasra was laid to rest on Monday, 12 January in Behesht-e Bibi Sakineh cemetery in Safadasht, Karaj.

  Kasra was an 11th-grade technical high school student studying mechanics. He was an automotive content creator (#CarEnthusiast) and owned a car he had named “Kasra’s Pearl.”

  He was the only son in his family and had a younger sister with intellectual and physical disabilities.

