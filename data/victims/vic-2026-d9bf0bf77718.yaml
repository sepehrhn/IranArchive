description: |-
  ⭕️
  جاویدنام: کسرا وفاپور،
  ۱۷ ساله، اهل کرمانشاه، ساکن فردیس، کرج؛
  جاودانه شد: ۱۹ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ کسرا شامگاه جمعه ۱۹ دی‌ماه هدف اصابت گلوله جنگی نیروهای سرکوب به قلبش قرار گرفت.

  او پیش از رسیدن به بیمارستان جان باخت.

  پیکر کسرا روز دوشنبه ۲۲ دی‌ماه در آرامستان «بی‌بی سکینه» صفادشتِ کرج به خاک سپرده شد.

  کسرا دانش‌آموز پایه یازدهم هنرستان در رشته مکانیک بود. او بلاگر حوزه خودرو (#ماشین_باز) بود و خودرویی داشت که نامش را «مرواریدِ کسرا» گذاشته بود.

  کسرا تک‌پسر خانواده بود و یک خواهر کوچک‌تر داشت که دارای معلولیت ذهنی-حرکتی است.

