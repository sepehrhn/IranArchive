  Marzieh Doshmanziari,
  22 years old and from Deylam, Bushehr province;
  She was killed on 17 October 2022.

  Marzieh was a management student at Sadra campus of Azad University in Shiraz. She was killed in the nationwide anti-government protests in Shiraz by batons of government forces.
  In exchange for handing over Marzieh's body to her family, the security forces forced them to announce that their daughter had an accident with a passing car while crossing the street in Shiraz and died.
  Marzieh's body was buried on October 19th at five in the morning and secretly in "Daralrahmeh" cemetery of Deylam.
  In addition to government news agencies, many cyber accounts pretended that they are her cousins or other relatives of Marzieh and tried to question her death.

