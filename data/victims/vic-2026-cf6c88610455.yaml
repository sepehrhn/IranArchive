description: |-
  •
  جاویدنام: مرضیه دشمن‌زیاری،
  ۲۲ ساله و اهل دیلم، استان بوشهر؛
  جاودانه شد: ۲۵ مهر ۱۴۰۱.

  مرضیه دانشجوی مدیریت دانشگاه آزاد پردیس صدرا در شیراز بود. او در اعتراضات سراسری ضد حکومتی شیراز با ضربات باتوم نظامیان حکومتی به سرش کشته شد.
  نیروهای امنیتی در ازای تحویل پیکر مرضیه به خانواده‌اش آنها را وادار کردند که اعلام کنند دخترشان در حال عبور از خیابانی در شیراز با یک خودروی سواری عبوری تصادف کرده و جان سپرده است.
  پیکر مرضیه روز ۲۷ مهرماه ساعت پنج صبح و در خفا در آرامستان «دارالرحمه دیلم» به خاک سپرده شد.
  علاوه بر خبرگزاری های حکومتی، اکانت‌های سایبری زیادی با عنوان دختر دایی، دختر عمه و سایر بستگان مرضیه دشمن‌زیاری تلاش کردند کشته شدن او را زیر سوال ببرند.

