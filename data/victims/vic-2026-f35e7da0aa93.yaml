  Nima Noori
  17 years old, residing in Karaj;
  He was killed on 12th November 2022.

  During the nationwide anti-government protests on the 3th of November in Karaj, Nima was hit by a bullet fired by plainclothes government agents while attending the 40th day ceremony of #HadisNajafi's death on the path to „Behesht Sakineh“.

