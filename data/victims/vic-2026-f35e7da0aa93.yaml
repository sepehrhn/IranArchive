description: |-
  ⭕️
  جاویدنام: نیما نوری،
  ۱۷ ساله و اهل کرج؛
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی روز ۱۲ آبان در کرج، نیما در در مراسم چهلمین روز کشته شدن #حدیث_نجفی در مسیر کمال شهر به سمت بهشت سکینه مورد اصابت گلوله ماموران لباس شخصی حکومت قرار گرفت و مجروح شد. او را به درمانگاه وصال در کرج‌ منتقل کردند اما به دلیل شدت خونریزی از آن‌جا به بیمارستان مدنی منتقل شد. خانواده نیما حدود ساعت پنج عصر از تیر خوردن او با خبر می‌شوند. به آنها گفتند یک تیر جنگی به پای نیما خورده و در اتاق عمل است اما به آنها اجازه ندادند وارد بیمارستان بشوند. نزدیک ساعت دوازده شب به خانواده نیما خبر دادند که فرزندشان  فوت کرده و اینکه علاوه بر پا به جناغ سینه او هم شلیک شده است.
  پدر نیما گفته است در بیمارستان شاهد بوده که از سینه تا ناف نیما را شکافته و بخیه زده بودند.
  ماموران امنیتی پیکر نیما را بعد از پنج روز، روز ۱۸ آبان بدون رضایت خانواده در آرامستان «بهشت علی» در جاده اشتهارد به خاک سپردند. در حالی که خانواده نیما می‌خواستند پیکر فرزندشان را در بهشت سکینه به خاک بسپارند.
  مراسم چهلم نیما روز ۲۵ آذر بر سر مزار او برگزار شد. پدر و مادر او در حالی که نامش را فریاد می‌زدند دو کبوتر صلح را در آسمان رها کردند. مادر نیما فریاد می‌زد: «خدایا خون بچه‌م پایمال نشه، هدر نره ایشالله!»
  روی سنگ مزار نیما نوشتند:
  قرار بود ۸۰ سال عمر کنم اما تو ۱۸ سالگی تو راه آزادی کشته شدم. قول بده به جای منم آزاده زندگی کنی!

  نیما تک‌فرزند بود. او دیپلم گرفته بود و از آنجا که علاقه شدیدی به زبان انگلیسی داشت، بدون اینکه آموزش ببیند؛ خودآموز آن را آموخته بود و تدریس خصوصی می‌کرد. او عاشق ماشین و رانندگی بود. نیما بسیار مهربان بود.

