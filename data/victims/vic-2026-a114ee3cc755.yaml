description: |-
  •
  جاویدنام: امیرحسین (اشکان) تروال ایمان،
  ۲۲ ساله، ساکن تهران؛
  جاودانه شد: ۲۵ اردیبهشت ۱۴۰۲.

  در جریان خیزش ملی ایرانیان علیه حکومت، روز دوم آبان ماه امیرحسین در پی یورش ماموران سپاه به منزلش در منطقه علی‌آباد تهران بازداشت شد. او پس از چند روز تحمل شکنجه در بازداشتگاه به #زندان_مرکزی_تهران_بزرگ (#فشافویه) منتقل شد.
  امیرحسین در تاریخ ۲۹ آذر ۱۴۰۱ به اتهام #محاربه محاکمه شد.
  او که بعد از تحمل هشت ماه حبس در دادگاه عفو و سپس آزاد شد ه بود؛ یک هفته بعداز آزادی، روز ۲۵ اردیبهشت با مرگی مشکوک (ایست قلبی در خواب) درگذشت.
  معین شریفی پدر #سپهر_شریفی از کشته شدگان انقلاب ملی ایران در ماه مهر راجع به امیرحسین نوشت:
  «مدت کوتاهی با هم هم‌بند بودیم…ولی انگار یه عمر می‌شناسمش. از دیروز چقدر گریه کردم…روحت شاد.»
  مادر امیرحسین هم در یک پست اینستاگرامی زیر عکس پسرش نوشت: «چقدر برایم‌ سخت است وقتی می‌شنوم چگونه تو را شکنجه کرده‌اند. قلبم از درد مچاله می‌شود. نفسم بند می‌آید.»
  پیکر امیرحسین در آرامستان «بهشت زهرا» قطعه ۳۲۸ به خاک سپرده شد.
  امیرحسین دو سال قبل پدرش را از دست داده بود.

