  Amirhossein Mahdavi, 24 years old, from Rasht, Guilin
  He was killed on 21 September 2022 .

  Amir Hossein was killed in Rasht by the government agents during nationwide protests against murder of #MahsaAmini by the regime. He was beaten up by baton and shot to death. Amir Hossein's face was unrecognizable because of the severe injuries, his sister only could recognie him from his clothes.
  His body was buried in secret and silence due to severe security pressure on the family.

