  جاویدنام: امیرحسین مهدوی،
  ۲۴ ساله و اهل رشت، گیلان؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  امیرحسین در اعتراضات سراسری به قتل حکومتی #مهسا_امینی در رشت با ضربات باتوم و قنداق اسلحه به دست ماموران حکومت کشته شد. شدت ضربات تا اندازه‌ای بود که صورت امیرحسین قابل شناسایی نبود و خواهرش از روی لباسهای تنش او را شناسایی کرد.
  پیکر او به دلیل فشارهای شدید امنیتی در خفا و سکوت به خاک سپرده شد.

