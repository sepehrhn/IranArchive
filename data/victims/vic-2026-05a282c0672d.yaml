description: |-
  سیاوش بهروش ۲۳ بهمن در منزل خود در شهر نیشابور بازداشت شده و اکنون با اتهام سنگین تبانی علیه نظام روبروست. او نجار است، فرزند دارد و پیش از این هیچ سابقه کیفری نداشته. سیاوش بیماری حادی کلیوی دارد. با توجه به انتساب اتهام سنگین، نگرانی‌ بسیاری در مورد سلامت و امنیت جانی او وجود دارد. صدایش باشیم.

