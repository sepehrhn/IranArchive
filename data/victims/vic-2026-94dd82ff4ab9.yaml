  جاویدنام محسن رشیدی زراسوند
  سن: ۴۲
  محل: بهارستان، اصفهان
  تاریخ کشته‌شدن: ۱۹ دی ۱۴۰۴
  شرح واقعه: با شلیک مستقیم مأموران جمهوری اسلامی کشته شد.
  &rlm;​بر اساس گفته های حاضرین در محل، او زمانی مورد اصابت قرار گرفت که برای کمک به همراه خود که زخمی شده بود، وارد محل درگیری شده بود.
  &rlm;​پیکر این جاوید نام پس از پنج روز جست‌وجو و فشار و آزار خانواده توسط نیروهای امنیتی، سرانجام در روز چهارشنبه ۲۴ دی‌ماه در باغ رضوان اصفهان به خاک سپرده شد.
  &rlm;​محسن رشیدی متأهل بود و یک دختر چهار ساله داشت. همچنین سرپرستی دو دخترخوانده ۱۸ و ۱۹ ساله را بر عهده داشت که از سه‌سالگی تحت حمایت و مراقبت او بزرگ شده بودند.
