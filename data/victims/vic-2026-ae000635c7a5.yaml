description: |-
  •
  جاویدنام: محمدحسین حاجیانی (حسین حاجیان)،
  ۲۷ ساله و اهل بوشهر؛
  جاودانه شد: ۲۰ آبان ۱۴۰۱.

  محمدحسین روز جمعه ۲۰ آبان ماه در اعتراضات سراسری ضد حکومتی در جاده ساحلی بوشهر بر اثر اصابت ضربات باتوم نیروهای نظامی حکومت به سرش کشته شد. نیروهای امنیتی خانواده حاجیان را وادار کردند که در ازای تحویل پیکر فرزندشان اعلام کنند که او تصادف کرده است.
  پیکر محمدحسین روز ۲۲ آبان ماه در آرامستان «امامزاده قاسم» بوشهر به خاک سپرده شد.
  محمدحسین عضو کادر نیروی دریایی ارتش بود. او متاهل و پدر دختری است که هنوز یکساله نشده است.

