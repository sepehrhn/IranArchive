  Mohammad Hossein Hajiani (Hossein Hajian),
  27 years old,from Bushehr
  He was killed  on 11 November 2022.

  Mohammad Hossein was killed on Friday, the 11th November , during the nationwide anti-government protests on the coastal road of Bushehr, as a result of being struck by military forces' batons. Security forces compelled Hajian's family to announce that he had died in an accident in exchange for handing over his body. Hossein's body was laid to rest on the 13th November in „Imamzadeh Ghasem Cemetery“ in Bushehr.

  Mohammad Hossein was a member of the Navy of the Army. He was married and a father to a daughter who hasn't yet reached the age of one.

