description: |-
  •
  جاویدنام: فاطمه حاتم (سنگری)،
  ۶۴ ساله، اهل و ساکن رشت؛
  جاودانه شد: ۲۲ دی ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ فاطمه شامگاه جمعه ۱۹ دی‌ماه در خیابان سعدی رشت هدف اصابت گلوله شاتگان به پایش قرار گرفت.

  یکی از همراهانش تلاش کرد او را به یکی از کوچه‌های اطراف شهرداری منتقل کند تا به درمانگاه برساند، اما نیروهای سرکوب سر رسیدند و پس از ضرب‌وشتم آنها، به شکم فاطمه شلیک کردند.

  او دو روز در بیمارستان بستری بود، اما به دلیل شدت جراحات جان باخت.

  پیکر فاطمه بامداد سه‌شنبه ۲۳ دی‌ماه، تحت شرایط امنیتی به خاک سپرده شد.

  فاطمه مادر دو فرزند و مادربزرگ بود. او به موسیقی علاقه داشت و هنرجوی دف بود.

