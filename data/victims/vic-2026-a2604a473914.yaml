  Fatemeh Hatem (Sangari),
  64 years old, from and living in Rasht;
  Killed on: January 12, 2026

  During the National Revolution against the Islamic Republic, Fatemeh was shot in the leg with a shotgun on the evening of Friday, January 9, on Saadi Street in Rasht.

  One of her companions tried to take her to a nearby alley to transfer her to a medical center, but security forces arrived, beat them, and then shot Fatemeh in the abdomen.

  She remained hospitalized for two days but lost her life due to the severity of her injuries.

  Fatemeh was buried under heavy security in the early hours of Tuesday, January 13.

  Fatemeh was a mother of two and a grandmother. She loved music and was learning to play the daf.

