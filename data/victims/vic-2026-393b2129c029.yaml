  Ali Kurd Kalahori Moradzahi,
  25 years old, from Zahedan, Sistan and Baluchestan;
  He was killed on 4th November 2022.

  Ali was killed during the nationwide anti-government protests on the #BloodyFridayOfKhash due to being hit by bullets fired by government forces.

  He was a primary school teacher in „Borta Paien“ village in the outskirts of Mirjaveh county and a bachelor's degree student.

