description: |-
  جاویدنام #سبا_نگهبان (ونوس نگهبان)، ۲۴ ساله، مربی بدنسازی در تهران، شامگاه جمعه ۱۹ دی‌ماه ۱۴۰۴ در جریان اعتراضات در خیابان اندرزگو با شلیک گلوله مأموران جمهوری اسلامی کشته شد.

  در این حادثه دو گلوله جنگی به او اصابت کرد؛ یکی به گلو و دیگری به شکم. بنا بر گزارش‌ها، خاله او که همراهش بود نیز به شدت مجروح شد و یکی از چشمان خود را از دست داد. ونوس تنها فرزند خانواده بود.

  #جاویدنام
