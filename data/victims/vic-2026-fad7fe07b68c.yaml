description: |-
  •
  جاویدنام: مریم آروین،
  اهل سیرجان، کرمان
  جاودانه شد: ۱۹ بهمن ۱۴۰۱.

  مریم وکیل بود و در یک روز کاری بعد از شروع #انقلاب_مهسا در صحن دادگاه در حال دفاع از موکلی ۱۵ ساله و دبیر دبیرستانش ( معترضان اعتراضات سراسری ضد حکومتی سیرجان) بود که با قاضی پرونده وارد بحث شد. قاضی او را با خشونت از دادگاه بیرون کرد. مدتی بعد از این دادگاه از آگاهی با مریم تماس گرفتند و گفتند برای پاره‌ای توضیحات به آنجا مراجعه کند. وقتی مریم به آگاهی مراجعه کرد پس از تعدادی پرسش و پاسخ پرونده‌ای مقابل او گذاشتند و گفتند تو در یک گروه حقوقی فراخوان داده‌ای و در اعتراضات حضور داشته‌ای. یک کارشناس دادگستری به نام زیدآبادی که مدتها بود مریم را تحت نظر داشت این مدارک را جمع‌آوری کرده بود). در پایان از مریم خواستند روز شنبه ۵ مهرماه خود را به دادسرا معرفی کند. مریم و خانواده‌اش که به دادسرا رفتند ماموری با خشونت به دست مریم دستبند زد و او را با کشیدن مقنعه‌اش به سمت اتاق قاضی هل داد. مریم و مادرش که اعتراض کردند حلقه دیگر دستبند مریم را به دلیل به هم ریختن نظم دادگاه به مادر او «طیبه نظری دبیر ادبیات دبیرستان «بنت‌الهدی» سیرجان» زدند و در حالی که آنها را می‌کشیدند به پاهایشان لگد می‌زدند. آنروز بعد از یک جلسه کوتاه برای مریم حکم بازداشت موقت و برای مادرش ۲۴ ساعت بازداشت بریدند. مادر مریم از خانواده‌اش خواست برایش کفیل نبرند تا او را هم همراه دخترش به زندان ببرند. مریم و مادرش ۲۱ روز در زندان «کهن‌شهر» سیرجان زندانی بودند.
  مریم به روایت دوستانش در مدت بازداشت مورد آزار شدید جسمی و روحی قرار گرفته بود. به او دارو خوراندند و تزریق کردند. «مریم بعد از آزادی بسیار لاغر شده بود. استخوان‌های دست و پایش از شدت لاغری بیرون زده بود ولی می‌خندید. احساس غرور داشت.» او بعد از آزادی دچار اختلال تنفسی شده بود.
  نیروهای امنیتی بعد از آزادی هم دست از آزار و اذیت مریم و خانواده‌اش برنداشتند. آنها بدون تشکیل دادگاه و صدور حکم قضایی کانون وکلای استان کرمان را تحت فشار قرار دادند تا پروانه وکالت او را لغو کنند.
  علیرغم همه شکنجه‌ها و آزارهای دوران بازداشت و پس از آن مریم همچنان امیدوار و فعال زندگی می‌کرد و به کسانی که نیاز به مشاوره حقوقی داشتند و استطاعت نداشتند مشاوره رایگان می‌داد.

