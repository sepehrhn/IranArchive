description: |-
  •
  جاویدنام: فواد قدیمی،
  ۴۰ ساله و اهل دیواندره کردستان؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  در جریان خیزش ملی ایرانیان به دنبال کشته شدن #مهسا_امینی؛ فواد ظهر ۲۸ شهریور از بالای برجک سپاه هدف دو گلوله قناسه نظامیان حکومت به دست و شکمش قرار گرفت. هم‌محلی‌ها او را به آرایشگاه همسرش که نزدیک خشکشویی خودش بود بردند تا به زخمش رسیدگی کنند اما ماشینی با سه سرنشین فواد را به زور از آنها گرفته و سوار ماشین می‌کنند. آنها فواد را که خونریزی شدید داشت کنار جدولی مقابل بیمارستان «خمینی» دیواندره رها کرده و می‌روند. او تلاش می‌کند بلند شده و خود را به بیمارستان برساند اما داخل جوب می‌افتد. از زمانی که فواد زخمی شد تا زمانی که او را دیده و به بیمارستان بردند بیش از یک ساعت طول کشید. وقتی همسر و برادر فواد به بیمارستان رفتند به آنها گفتند گلوله به دست او اصابت کرده و آنها را به داخل بیمارستان راه ندادند. پدر فواد که پاسدار بازنشسته سپاه است وقتی متوجه وخامت حال پسرش شد علیرغم دلخوری از حضور او در اعتراضات، از فرمانده دیواندره درخواست کرد او را جهت درمان به تهران یا سنندج انتقال بدهند. نیروهای امنیتی فواد را از در پشتی بیمارستان خارج کرده و با هلی‌کوپتر به بیمارستان «کوثر» سنندج منتقل کردند.
  فواد ساعت چهار صبح ۳۰ شهریور به دلیل شدت جراحات و عدم رسیدگی کافی کارکنان بیمارستان جهت درمان او، کوثر جان باخت.
  در گواهی فوت علت مرگ فواد را «نامعلوم» ذکر کردند.
  ماموران امنیتی پدر فواد را مقابل دوربین صدا و سیما نشاندند و او اعلام کرد که پسرش را ضد انقلاب کشته است.
  پس از آن پیکر فواد را به خانواده‌اش تحویل دادند و آنها را تهدید کردند که نباید مراسم خاکسپاری برگزار کنند.
   پیکر فواد نیمه‌شب پنج‌شنبه ۳۱ شهریور در آرامستان «بهشت محمدی» دیواندره با حضور ماموران امنیتی به خاک سپرده شد.

  فواد متاهل و پدر دو فرزند بود. اوخیاط و صاحب یک
  خشکشویی بود.

  فواد به گفته دوستانش مردی  شوخ‌طبع، عاشق طبیعت، کوهنوردی، شنا و فوتبال بود.

