description: |-
  •
  جاویدنام: جلال قربانی (کوتال)،
  سن نامشخص، اهل شین‌آباد، پیرانشهر؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  جلال شامگاه ۲۹ آبان در اعتراضات سراسری ضد حکومتی در پیرانشهر بعد از خاکسپاری نوجوان ۱۶ ساله جاویدنام #کاروان_قادرشکری، در اثر شلیک گلوله نظامیان سپاه کشته شد.
  ماموران امنیتی پیکر جلال را روز ۳۰ آبان مخفیانه در آرامستان «کونه‌خانی» در پیرانشهر به خاک سپردند.

