  Jalal Ghorbani (Kootal)
  Age unknown, from Shinabad, Piranshahr,
  He was killed on19 November 2022.

  Jalal was killed on the evening of 19 November during the burial ceremony of #KarvanGhaderShokri in Piranshahr due to being shot by military forces of the Sepah (Islamic Revolutionary Guard Corps). The security forces secretly buried Jalal's body on 30 November in the “Kounehkhani “Cemetery in Piranshahr.

