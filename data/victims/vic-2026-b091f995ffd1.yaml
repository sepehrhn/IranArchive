  ایزد آقابیگی متولد ۱۳۴۹، پدر دو فرزنذ و کارمند بازنشسته وزارت امور خارجه، در تاریخ ۳ فروردین در خانه خود توسط نیروهای امنیتی بازداشت، لوازم شخصی‌اش ضبط و به مکان نامعلومی منتقل  شده. او در سال ۱۴۰۱ نیز به مدت سه روز در بند ۲۰۹ اوین در بازداشت بوده است. صدایش باشیم.

