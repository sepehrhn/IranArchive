disappearance_circumstances: 45-year-old Bahai citizen residing in Mashhad, arrested by intelligence agents at her workplace on Sunday, January 11, 2026, and transferred to an unknown location. After several days of interrogation, she was transferred to Vakil-Abad prison where she remains in unclear conditions. She has been held in quarantine ward initially, then moved to other wards with limited phone contact. Has undergone trial inside the prison and is awaiting sentencing. Her temporary detention period expired on February 10, 2026, but she continues to be held without clear legal status.
