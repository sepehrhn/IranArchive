description: |-
  •
  جاویدنام: جوهر فتاحی (میرکی)،
  سن نامشخص، اهل جوانرود، کرمانشاه؛
  جاودانه شد: ۳۰ آبان ۱۴۰۱.

  روز سی‌ام آبان ماه نظامیان سپاه در خیابان بهداری جوانرود، سوگوارانی را که از مراسم خاکسپاری #عرفان_کاکایی و #بهاء‌الدین_ویسی برمی‌گشتند به رگبار گلوله جنگی بستند. جوهر فتاحی یکی از کسانی بود که بر اثر اصابت گلوله کشته شد.
  مراسم یادبود چهلمین روز کشته شدن جوهر و شش نفر دیگر از کشته‌شدگان روزهای ۲۹ و ۳۰ آبان روز دهم دی ماه در حالی برگزار شد که نیروهای امنیتی و سپاهی از روز قبلش برای سرکوب شرکت‌کنندگان در مراسم راهی جوانرود شده بودند. نیروهای حکومتی از همان ابتدای مراسم به حاضران حمله‌ور شدند و داخل خانه‌های مجاور آرامستان و اتومبیل‌های پارک شده در محل گاز اشک‌آور شلیک کردند. در این کشتار حکومتی که فضای جنگی در آرامستان ایجاد کرده بود تعداد زیادی از مردم زخمی شدند و #برهان_الیاسی، جوان ۲۲ ساله اهل جوانرود هم کشته شد.

