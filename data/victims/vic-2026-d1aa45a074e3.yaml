  Johar Fattahi (Miraki),
  Age unknown, from Javanrud, Kermanshah;
  He was killed on 21th November 2022.

  On 21th November , the Revolutionary Guards' forces opened fire on mourners returning from the funeral procession of #ErfanKakayi and #BahauddinVeysi on Behadari Street in Javanrud. Johar Fattahi was one of the individuals who was killed as a result of being shot.
  The 40th-day memorial ceremony for Johar and six other victims of the killings on the 20th and 21 November was held on 31 Dezember. Security forces and Basij members had already been deployed to Javanrud to suppress the participants of the ceremony. Government forces attacked the attendees from the beginning of the event and fired tear gas into nearby houses and parked cars. In this government massacre that created a war-like atmosphere in the cemetery, a large number of people were injured, and #BorhanEliasi, a 22-year-old from Javanrud, was also killed.

