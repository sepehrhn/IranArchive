description: |-
  •
  جاویدنام: حامد ملایی،
  ۳۰ ساله و اهل شهر دشتی پارسیان، استان هرمزگان؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  حامد در اعتراضات سراسری ضد حکومتی در شهر دشتی بر اثر اصابت گلوله‌های نظامیان حکومت کشته شد.
  پیکر او را روز ۲۷ آبان به خاک سپردند. جمعیت سوگوارانی که روز پنجم دی ماه در مراسم چهلم حامد شرکت کرده بودند پس از مراسم تظاهرات کردند و شعارهایی علیه حکومت دادند.
  حامد مولایی متاهل و پدر دو دختر خردسال بود.

