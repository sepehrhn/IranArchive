  Hamed Moulaei
  30 years old, from
  Dashti Parsian, Hormozgan Province;
  He was killed on 17th November 2022.

  Hamed was killed in the nationwide anti-government protests in Dashti due to being hit by bullets fired by government forces. His body was buried on 18th November. Mourners who had attended Hamed's 40th-day commemoration ceremony on the fifth day of Dey month later participated in demonstrations and chanted slogans against the government.

  Hamed was married and the father of two young daughters.

