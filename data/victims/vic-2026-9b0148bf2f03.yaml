description: |-
  •
  جاویدنام: علی مولایی،
  ۲۳ ساله و اهل ایذه؛
  جاودانه شد: ۲۵ آبان ۱۴۰۱.

  علی ۲۴ آبان ماه عقد کرده بود، درست یک روز قبل از اینکه با اصابت کلوله نظامیان حکومت به سرش کشته شود.
  روز ۲۵ آبان ماشین علی و همسرش در چهارراه هلال احمر شهر ایذه مورد حمله نیروهای امنیتی قرار گرفت. مردم آنها را به بیمارستان رساندند. علی هوشیار بود اما کم کم سطح هوشیاریش افت کرد. او را با آمبولانسی غیرمجهز به بیمارستان گلستان اهواز اعزام و در بخش آی‌سی‌یو بستری کردند. صبح فردا به خانواده علی خبر می‌دهند که علی فوت کرده و پیکر او به سردخانه منتقل شده است. اما هنگامی که خانواده برای تحویل جنازه می‌روند متوجه می‌شوند پیکر علی را به پزشکی قانونی منتقل کرده‌اند.
  به گفته یکی از بستگان، گلوله به سر علی اصابت کرده بود اما در پزشکی قانونی کل محوطه شکمش را شکافته بودند.
  ماموران امنیتی به خانواده علی گفتند پیکر او را با هفت نفری که آنروز کشته شدند به آرامستان ایذه منتقل خواهند کرد؛ اما خانواده علی با اصرار توانستند پیکر علی را تحویل بگیرند.
  مراسم خاکسپاری علی در روستای زادگاهش «باغلمک» برگزار شد. همسر علی با لباس عروسی در مراسم خاکسپاری تازه دامادش حضور یافت.

