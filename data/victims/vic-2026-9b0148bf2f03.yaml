  Ali Molaei,
  23 years old, from Izeh;
  He was killed on 16th November  2022.

  Ali had just gotten married on the 15th of November . He was tragically killed the following day, struck by a bullet from government forces.

  On the 16th of November , as Ali and his wife were driving through the Helal Ahmar (Red Crescent) intersection in Izeh, their car was attacked by security forces. The people around them rushed them to the hospital. Ali was conscious at first, but his level of consciousness gradually declined. An inadequately equipped ambulance transferred him to „Golestan“ Hospital in Ahvaz, where he was placed in the intensive care unit. The next morning, his family received news that Ali had passed away, and his body had been transferred to the morgue. However, when they went to retrieve his body, they discovered that it had been taken to the forensic medical center.

