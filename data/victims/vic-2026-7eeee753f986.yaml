description: |-
  ⭕️
  جاویدنام: سامر هاشمزهی،
  ۱۶ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  سامر در جمعه خونین زاهدان در مسجد مکی از پشت سر مورد اصابت گلوله نیروهای نظامی حکومت قرار گرفت و کشته شد.
  روی سنگ مزارش نوشتند:
  پیش چشمم سامرم شد ناپدید
  نوجوانم ظهر جمعه شد شهید
  در عزایش زاهدان افسرده شد
  او که گلبرگی از این دنیا نچید.

