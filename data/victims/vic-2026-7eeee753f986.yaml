  Samer Hashemzahi,
  16 years old and from Zahedan;
  He was killed on 30 September 2022.

  On the Bloody Friday of Zahedan, Samer was shot in the back of the head by government military forces and killed.
  They wrote a piece of poem on his tombstone:
  “Samer disappeared from my eyes
  My teenager was martyred on Friday afternoon
  Zahedan became gloomy in mourning
  He did not pluck a petal from this world”

