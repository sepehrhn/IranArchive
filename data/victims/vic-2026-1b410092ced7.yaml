  Javad Pousheh,
  13 years old and from Zahedan;
  He was killed on 30 September 2022.

  In the "Bloody Friday of Zahedan," government military forces shot Javad from behind. The bullet went through his face and exited.
  Javad's grave does not have a headstone, but some white stones are placed on his grave with the words "Martyr Javad" written on them.
  On the fortieth day after the #BloodyFridayOfZahedan on November 18, one of those who lost their lives was 13-year-old Javad Pousheh.

