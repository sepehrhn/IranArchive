description: |-
  ⭕️
  جاویدنام: جواد پوشه،
  ۱۳ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  در «جمعه خونین زاهدان» ماموران نظامی حکومت از پشت به سر جواد شلیک کردند. گلوله صورت جواد را شکافت و خارج شد.
  مزار جواد سنگ ندارد. با تعدادی قلوه سنگ سفید روی مزارش نوشته‌اند: «شهید جواد».
  ۱۸ آبان چهلم کشته شدگان «جمعه خونین زاهدان» از جمله نوجوان ۱۳ ساله، جواد پوشه بود.

