description: |-
  •
  جاویدنام: امان‌الله باجی‌زهی براهویی (مینگل)؛
  سن نامشخص، اهل زاهدان
  جاودانه شد: ۳ آذر ۱۴۰۱.

  امان‌الله از سران یکی از طوایف بلوچستان بود. پسر او #حامد_باجی_زهی ۱۰ مهر توسط نیروهای سپاه بازداشت و زیر شکنجه کشته شد. امان‌الله شامگاه روز پنج‌شنبه ۳ آذر مقابل مسجد «اسلام‌آباد» در خیابان بعثت زاهدان با اصابت گلوله نیروهای لباس شخصی منتسب به سپاه پاسداران کشته شد. امان‌الله پس از کشته شدن پسرش مواضع ضد حکومتی گرفته بود و علیه سپاه پاسداران سخن می‌گفت.

