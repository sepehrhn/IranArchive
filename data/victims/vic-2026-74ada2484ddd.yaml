  Amanollah Baji Zahi Barahui (Mengal)
  Age: Unknown,Resident in Zahedan,
  He was killed on 24th November 2022.

  Amanollah was a leader among one of the Baloch tribes. His son, Hamed Baji Zahi, was arrested by the Sepah forces on 2nd October and was killed under torture. Amanollah was killed on Thursday evening, 24th November, in front of the "Islamabad" Mosque on B'asat Street in Zahedan, by bullets fired by plainclothes forces affiliated with Sepah Pasdaran #IRGC . After the death of his son, Amanollah had taken anti-government positions and spoke against the IRGC.

