description: |-
  مهران عارف‌پور در روزهای پس فراخوان در نیشابور بازداشت شده. او موزیسین و دی‌جِی است. از او تحت شکنجه اعتراف اجباری گرفته‌اند و در رسانه‌های سپاه پخش کرده‌اند. اتهامات بی‌اساس و سنگینی علیه او مطرح کرده‌اند. محل نگهداری‌اش معلوم نیست و اطلاعی از وضعیت در دست نیست. جان مهران عارف‌پور در خطر است. صدایش باشیم.

