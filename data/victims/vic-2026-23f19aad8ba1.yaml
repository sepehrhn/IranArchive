  Shahriar Mohammadi,
  30 years old, from Bukan, Kurdistan;
  He was killed on November 18, 2022.

  On the 16th November, during the nationwide anti-government protests in Bukan, Shahriar's friend Mohammad Hassan Zadeh was killed by government military forces. Shahriar, fearing that his friend's body would be taken away, sat beside it until morning.
  During Mohammad's funeral, clashes erupted between Revolutionary Guard forces and the people in Bukan. Shahriar was hit by a bullet during the people's resistance. After being transferred to Gholi Pour Hospital in Bukan, he passed away.

  Around fifty government agents forcibly took Shahriar's body and buried him overnight in the Bukan cemetery.

  On the 40th day after Shahriar's passing, a widespread ceremony was held on 28th December, attended by many people. In a symbolic gesture, Shahriar's mother released a dove.

