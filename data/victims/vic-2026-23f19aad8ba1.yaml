description: |-
  •
  جاویدنام: شهریار محمدی،
  ۳۰ ساله و اهل بوکان، کردستان؛
  جاودانه شد: ۲۷ آبان ۱۴۰۱.

  روز ۲۵ آبان ماه و در جریان اعتراضات سراسری ضد حکومتی در بوکان، ماموران نظامی حکومت دوست شهریار، محمد حسن‌زاده را کشتند. شهریار از بیم ربوده شدن پیکر دوستش تا صبح کنار آن نشست.
  روز خاکسپاری محمد تبدیل به صحنه درگیری ماموران سپاه با مردم شد و شهریار در جریان مقاومت مردمی در بوکان مورد اصابت گلوله قرار گرفت. او پس از انتقال به بیمارستان «قلی‌پور» بوکان درگذشت.
  نزدیک به پنجاه مامور حکومتی با تیراندازی به نزدیکان شهریار پیکر او را ربودند و شبانه در آرامستان شهر بوکان به خاک سپردند.
  مراسم چهلم شهریار چهارشنبه هفتم دی ماه با حضور گسترده مردم برگزار شد و مادر شهریار در اقدامی نمادین کبوتری آزاد کرد.

