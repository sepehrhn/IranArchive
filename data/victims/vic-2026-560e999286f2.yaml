  در رابطه با کشته شدن صائب سرقلی دو روایت وجود دارد.
  در روایتی صائب در اعتراضات سراسری ضد حکومتی پس از درگیری با نظامیان حکومتی کشته شد. در روایت دیگری صائب در جریان اعتراضات سراسری ضد حکومتی بازداشت و زیر شکنجه کشته شد.
  پیکر صائب روز دوم آبان ماه در آرامستان شهر ایذه به خاک سپرده شد.

