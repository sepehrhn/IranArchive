  Saeb Sargholi
  29 years old, from Izeh
  He was killed on 24th October 2022.

  There are two accounts about the death of Saeb Sargholi. In one account, he was killed during nationwide anti-government protests after a confrontation with government forces. In another account, he was arrested during the protests and died under torture.
  Saeb's body was buried on the second of Aban in the cemetery of Izeh city.

