description: |-
  محمود باقری را در تاریخ ۲۵ بهمن ماه از منزلش در شهر هنگویه در استان هرمزگان بازداشت کرده‌اند. متأسفانه تا کنون اطلاعاتی از وضعیت او در دسترس نیست و به خانواده‌اش اجازهٔ ملاقات با او را نمی‌دهند. محمود معلم است و ۲۵ سال سابقهٔ تدریس دارد. پسر او حسین نیز علی‌رغم بیماری و وجود دستگاه در سر در تاریخ ۲ اسفند ماه بازداشت شده است. صدایش باشیم.

