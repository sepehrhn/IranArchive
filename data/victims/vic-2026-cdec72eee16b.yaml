  Hediyeh Naimani,
  25 years old, from Nowshahr Chaloos;
  She was killed on 23 september 2022

  Hediyeh was shot during the nationwide demonstration in Nowshahr and was taken to Beheshti Hospital in the same city. She died the next day due to the severe injuries.

