  Khodarahm Mandazehi (Barahui),
  Age: unknown, from Sistan and Baluchestan ;
  He was killed on 27 January 2023.
  Khodarahm was one of the highly respected elders of the Mandazehi clan. He was against the Islamic Republic and was trusted by the people of Zahedan;
  In the evening of 27th january, he was shot several times by undercover agents and was killed.  The shooters ran away after killing him.

