description: |-
  •
  جاویدنامان: مریم و مجید صالحی سیاوشانی،
  ۳۵ و ۴۰ ساله، اهل آشتیان، استان مرکزی، ساکن محله پیروزی، تهران؛
  جاودانه شدند: ۱۸ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ مریم و مجید شامگاه پنجشنبه ۱۸ دی‌ماه در تهرانپارس هدف اصابت گلوله نیروهای سرکوب قرار گرفتند.

  گلوله سرکوبگران ابتدا به مریم اصابت کرد و زمانی که مجید خود را سپر همسرش کرد تا از او محافظت کند، به او نیز شلیک کردند. مریم در دم جان باخت و مجید ساعاتی بعد از او.

  پیکر آنها روز یکشنبه ۲۱ دی‌ماه، با حضور جمعیت سوگوار و خشمگینی که در میان شعارهایشان «مرگ بر خامنه‌ای» سر داده بودند، در آرامستان «بهشت‌زهرا» تهران به خاک سپرده شد.

  مریم و مجید سه سال بود که ازدواج کرده بودند. آنها دست در دست هم، شجاعانه در راه آزادی ایران کشته شدند.

