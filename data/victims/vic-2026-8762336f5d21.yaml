  Maryam and Majid Salehi Siavashani,
  35 and 40 years old, from Ashtian, Markazi Province, living in Pirouzi neighborhood, Tehran;
  Killed on: 8 January 2026

  During the National Revolution against the Islamic Republic, Maryam and Majid were shot by regime forces on the evening of Thursday, 8 January in Tehranpars.

  The first bullet struck Maryam. When Majid tried to shield his wife to protect her, he was also shot. Maryam died instantly, and Majid passed away hours later.

  They were laid to rest on Sunday, 11 January, in Behesht-e Zahra Cemetery in Tehran, in the presence of a large grieving and angry crowd chanting “Death to Khamenei.”

  Maryam and Majid had been married for three years. Hand in hand, they were killed courageously on the path to Iran’s freedom.

