description: |-
  22-year-old computer engineering student shot in the head with a bullet in Fardis, Karaj. Regime agents committed a massacre in Fardis like many other parts of Iran, killing this student with direct gunfire using war bullets. Family searched for him for more than a week before being contacted to receive his body. He was a triplet with his brother and sister and had lost his father at age 3.

  Persian Name: عرشیا رضایی

  Killed during protests.
