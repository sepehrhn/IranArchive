  Hamid Reza Nokhbehzaeim
  32 years old, residing in Karaj
  He was killed on 18th November 2022.

  During the nationwide anti-government protests on the 14rd of November in Karaj, Hamid Reza went to help a protester who was about to be abducted by government intelligence agents. He successfully rescued that individual. He himself also managed to escape successfully.

  A few days later, on the 18th of November , Hamid Reza disappeared after leaving his home. His family searched for him through all the known channels but received no answers.

  On the 21th of November , Sepah intelligence ( #IRGC) contacted Nokhbehzaeim's family and informed them that they had found a body on the train tracks matching Hamid Reza's description.

