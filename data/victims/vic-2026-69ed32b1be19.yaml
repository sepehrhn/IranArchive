description: |-
  •
  جاویدنام: حمیدرضا نخبه‌زعیم،
  ۳۲ ساله، ساکن کرج؛
  جاودانه شد: ۲۷ آبان ۱۴۰۱.

  در اعتراضات سراسری ضد حکومتی روز ۲۳ آبان در کرج؛ حمیدرضا به کمک معترضی رفت که ماموران اطلاعاتی حکومت قصد ربودنش را داشتند. او پس از نجات آن فرد موفق به فرار شد.
  چند روز بعد؛ روز  ۲۷ آبان حمیدرضا بعد از خروج از خانه ناپدید شد.
  خانواده او در جستجویش به تمام نهادهایی که می‌شناختند سر زدند بی آنکه هیچ پاسخی دریافت کنند.
  روز ۳۰ آبان از طرف اطلاعات سپاه با خانواده نخبه زعیم تماس گرفتند و گفتند روی ریل قطار جنازه‌ای پیدا کرده‌اند که مشخصاتش با حمیدرضا همخوانی دارد.
  پیکر حمیدرضا را در حالی به خانواده تحویل می‌دهند که یکی از پاهایش قطع شده و روی سرش آثار ضربات متعدد مشهود است. ماموران اطلاعات سپاه به خانواده نخبه زعیم گفتند که  حمیدرضا خودش را به قصد خودکشی زیر قطار انداخته است. این در حالی است بدن حمیدرضا به جز پای او که قطع شده و سرش که آثار ضربه روی آن مشهود بود، سالم به نظر می‌رسید.
  وقتی خانواده نخبه‌زعیم زیر بار سناریو حکومت نرفتند؛ ماموران حکومتی تهدیدشان کردند که تنها در صورت پذیرش و اعلام این سناریو ، پیکر حمیدرضا را تحویل خواهند داد.
  پیکر حمیدرضا روز ۳۰ آبان تحت تدابیر شدید امنیتی و حضور پر رنگ ماموران لباس شخصی در هشتگرد به خاک سپرده شد.

