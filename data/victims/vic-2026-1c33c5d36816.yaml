description: |-
  •
  جاویدنام حمیدرضا مالمیر،
  ۲۹ ساله، اهل محمدشهر کرج، استان البرز؛
  جاودانه شد: ۴ آبان ۱۴۰۱.

  حمیدرضا در جریان اعتراضات سراسری ضد حکومتی در ملارد کرج  روز ۴ آبان مورد اصابت گلوله نظامیان حکومت به سرش قرار گرفت و کشته شد.
  نیروهای امنیتی پدر حمیدرضا را مجبور کردند علت مرگ پسرش را تصادف اعلام کند.
  حمیدرضا متاهل بود.

