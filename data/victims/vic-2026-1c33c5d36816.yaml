  Hamidreza Malmir,
  29 years old, from Mohammadshahr, Karaj, Alborz Province;
  He was killed on 26th October 2022.

  Hamidreza was fatally shot by government forces during the nationwide anti-government protests in Malard, Karaj, on October 26th. Security forces compelled Hamidreza's father to declare his son's death as an accident.
  Hamidreza was married.

