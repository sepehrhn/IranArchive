description: |-
  •
  جاویدنام: علیرضا کریمی،
  ۲۰ ساله و اهل کرمانشاه؛
  جاودانه شد: ۱۸ آبان ۱۴۰۱.

  علیرضا پس از اینکه در اعتراضات دانشجویی دانشگاه اراک، روز چهارشنبه ۱۸ آبان با ضربات باتوم ماموران نظامی حکومت مجروح شد، به منزل اجاره‌‌ایش برگشت. او پس از چند ساعت بر اثر ضربه مغزی جان باخت. وقتی پیرزن صاحبخانه پیکرش را یافت از گوشش خون جاری بود.
  ماموران امنیتی خانواده کریمی را تهدید کردند که چنانچه دلیل واقعی مرگ علیرضا را اعلام کنند هر دو را از محل کارشان اخراج خواهند کرد.( پدر و مادر علیرضا هر دو در شهرشان شاه‌آباد معلم هستند). ماموران امنیتی همچنین اصرار داشتند پیکر علیرضا پنجشنبه شب (۱۹ آبان) به خاک سپرده شود که خانواده کریمی زیر بار نرفتند. خانواده علیرضا می‌خواستند پیکر او را در آرامستان خانوادگی‌شان «امامزاده حسن» به خاک بسپارند اما ماموران امنیتی حکومت مانع شدند. پیکر علیرضا سرانجام صبح روز جمعه ۲۰ آبان در میان تدابیر شدید امنیتی در آرامستان «باغ رضوان» شاه‌آباد به خاک سپرده شد.
  علیرضا دانشجوی رشته میکروبیولوژی اراک، ورودی ۱۴۰۰ بود.
  رسانه‌های حکومتی علت مرگ علیرضا را مسمومیت در آور سوء‌مصرف مواد اعلام کردند.

