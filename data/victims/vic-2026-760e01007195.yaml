  Alireza Karimi
  20 years old, From: Kermanshah
  He was kinded on 9 November 2022.

  After being injured by baton strikes from the military forces of the government during the student protests at Arak University on Thursday, 18th of Aban, Alireza returned to his rented house. After a few hours, he lost his life due to a brain injury. When the landlady found his body, blood was flowing from his ear.

  Security forces threatened Karimi's family that if they revealed the real cause of Alireza's death, both parents would be dismissed from their jobs (both Alireza's parents are teachers in their hometown, Shahabad).

  Government intelligence forces also insisted that Alireza's body be buried on Friday night (19th of Aban), but the Karimi family did not comply. Alireza's family wanted to bury his body in their family cemetery, "Imamzadeh Hassan," but government security forces prevented them.

