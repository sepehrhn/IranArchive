description: |-
  ⭕️
  جاویدنام: احمدرضا قلجی،
  ۱۷ ساله و اهل اسدآباد همدان، ساکن تهران؛
  جاودانه شد: ۳۱ شهریور ۱۴۰۱.

  احمدرضا شامگاه ۳۱ شهریور ۱۴۰۱ در جریان اعتراضات سراسری به قتل حکومتی #مهسا_امینی در حوالی میدان فلسطین تهران مورد اصابت گلوله نظامیان حکومت قرار گرفت و کشته شد.
  خانواده و نزدیکان او سه روز از او بی‌خبر بودند تا اینکه به آنها اطلاع دادند برای تحویل پیکر فرزندشان به پزشکی قانونی مراجعه کنند.
  احمدرضا برای اینکه کمک خرج خانواده باشد از همدان به تهران آمده بود. او در یک غذاپزی کار می‌کرد. روزی که کشتندش برای تعمیر شیشه شکسته موبایلش از محل کارش خارج شد و دیگر بازنگشت.

  پیکر احمدرضا سوم مهر ماه در آرامستان «بهشت زهرا» اسدآباد در روستای خاکریز همدان به خاک سپرده شد.

