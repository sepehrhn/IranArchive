  Ahmadreza Qalji,
  17 years old and from Asadabad Hamedan, living in Tehran;
  He was killed on 22 September 2022.

  Ahmadreza was shot by government soldiers in the evening of 22nd of September during nationwide protests against the government killing of #MahsaAmini near Palestine Square in Tehran and was killed.
  His family and relatives did not know about him for three days until they were informed to go to the forensic doctor to receive the body of their son.
  Ahmadreza came to Tehran from Hamedan to financially support his family. He worked in a restaurant. On the day he was killed, he left his workplace to repair the broken glass of his mobile phone and never returned.
  The body of Ahmadreza was buried in the "Behesht Zahra" cemetery of Asadabad in Khakriz village of Hamedan on 25th of September.

