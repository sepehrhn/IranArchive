  Mazdak Mariane Hamedani,
  17 years old, residing in Rasht;
  He was killed on 23th March 2023.

  During the nationwide anti-government protests in Rasht, Mazdak was abducted by security forces on 29th October 2022. He was accused of "assaulting law enforcement officers." They took Mazdak to the #LakanPrison, and despite being under 18 years old, they incarcerated him in the adult prisoner section. During two weeks of interrogation, he was tortured to the point that they had to transfer him to the hospital once, with handcuffs and leg irons. To force him into a coerced confession, they medicated and threatened him, warning that if he ever spoke later, they would kill his family. On 12th November 2022, Mazdak was temporarily released on bail. On 23th March, he died under suspicious circumstances.

