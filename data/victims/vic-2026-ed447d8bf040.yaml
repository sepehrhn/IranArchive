description: |-
  ⭕️
  جاویدنام: مزدک مریانه همدانی،
  ۱۷ ساله، ساکن رشت؛
  جاودانه شد: ۳ فروردین ۱۴۰۲.

  در جریان اعتراضات سراسری ضد حکومتی در رشت، مزدک روز ۷ آبان توسط نیروهای امنیتی ربوده شد. اتهام او «کتک زدن ماموران کلانتری» عنوان شد.
  مزدک را به زندان لاکان رشت بردند و علیرغم اینکه زیر ۱۸ سال سن داشت در بخش زندانیان بزرگسال حبسش کردند. در مدت دو هفته بازجویی آنقدر شکنجه‌اش کردند که یکبار با دستبند و پابند به بیمارستان منتقلش کردند. برای اینکه وادار به اعتراف اجباری‌اش کنند به او دارو خورانده و تزریق کردند و تهدیدش کردند که اگر بعدها حرفی بزند خانواده‌اش را خواهند کشت. مزدک روز ۲۱ آبان با سپردن وثیقه به طور موقت آزاد شد. او روز سوم فروردین با مرگ مشکوکی جان باخت.
  پیکر مزدک در شرایط امنیتی و با حضور تعداد اندکی از نزدیکان در یکی از روستاهای گیلان به خاک سپرده شد. نیروهای امنیتی به دوستان مزدک حتی اجازه ورود به روستا را ندادند.
  مزدک کوچکترین فرزند خانواده بود. او دوم دبیرستان را به پایان رسانده بود و تابستان‌ها کار می‌کرد.

