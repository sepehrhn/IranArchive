description: |-
  وحید رستمی دانشجوی رشته‌ی آمار دانشگاه تهران است. او اوایل فروردین ماه  توسط نیروهای امنیتی بازداشت شده و اطلاعی از وضعیت پرونده و محل بازداشت او در دست نیست. او پیش‌تر در جریان جریان حماسه‌ی اسفندماه ۱۴۰۴ انجمن‌های دانشجویی شیر و خورشید،  مورد تهدید و آزار نیروهای امنیتی قرار گرفته بود. صدایش باشیم.

