  Mehrdad Malek,
  17 years old, residing in Qazvin;
  He was killed on 26th December 2022.

  On the evening of December 26, while Mehrdad and his friend were driving from a farm towards their home, they were pursued by the police in the Dashtabi region of Qazvin province. During the pursuit, the police car got stuck in the mud, and as the chase came to a halt, a law enforcement officer fired at their car from behind without warning. The bullet struck Mehrdad in the head. His friend rushed him to the "Shafa" hospital in #Takestan, but unfortunately, it was too late, and Mehrdad lost his life due to bleeding and severe injuries.

  Mehrdad's body was laid to rest in the “Ardaq” cemetery in Qazvin on December 28.

  Security forces threatened Mehrdad's family to prevent them from holding a memorial ceremony on the 40th day of his death. They even removed and took away the gravestone of Mehrdad.

  The head of the Qazvin judiciary, while confirming the death of this teenager, claimed that the law enforcement officers had become suspicious of Mehrdad and his friend, who were in a pickup truck, and had fired at their vehicle.

