description: |-
  ⭕️
  جاویدنام: مهرداد ملک،
  ۱۷ ساله، ساکن قزوین؛
  جاودانه شد: ۵ دی ۱۴۰۱.

  شامگاه ۵ دی در حالی که مهرداد و دوستش با اتومبیل از مزرعه‌ای به سمت خانه در حرکت بودند مورد تعقیب پلیس منطقه دشتابی استان قزوین قرار گرفتند. در حین تعقیب ماشین پلیس در گل گیر کرد و چون تعقیب نیمه تمام ماند مامور نیروی انتظامی بدون اخطار از پشت به ماشین شلیک کرد. گلوله به سر مهرداد اصابت کرد. دوست مهرداد او را به بیمارستان «شفا» در تاکستان منتقل کرد اما فایده‌ای نداشت و او در اثر خونریزی و شدت جراحت جان باخت.
  پیکر مهرداد روز ۷ دی ماه در آرامستان ارداق قزوین به خاک سپرده شد.
  نیروهای امنیتی خانواده ملک را تهدید کرد تا مانع برگزاری مراسم یادبود چهلمین روز کشته شدن او بشوند. آنها حتی سنگ مزار مهرداد را کندند و بردند.
  رئیس دادگستری قزوین ضمن تایید جان باختن این این نوجوان مدعی شد که نیروی انتظامی به این نوجوان و دوستش که سرنشین وانت بودند مشکوک شده و به خودرو آنها تیراندازی کرده است.

