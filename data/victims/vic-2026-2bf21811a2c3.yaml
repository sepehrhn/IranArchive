description: |-
  •
  جاویدنام: حامد باقری،
  ۲۲ ساله، اهل شاه‌آباد، کرمانشاه، ساکن کرج؛
  جاودانه شد: ۲۲ شهریور ۱۴۰۲.

  در ادامه خیزش ملی ایرانیان و در آستانه سالگرد کشته شدن #مهسا_امینی، حامد در یکی از خیابان‌های گلشهر کرج ضمن دعوت مردم به برگشتن به خیابان با ماموران نظامی حکومت درگیر شد. آنها ۴ گلوله جنگی به حامد شلیک کردند و او را کشتند.
  نیروهای امنیتی با گروگان گرفتن پیکر حامد برادرش را مقابل دوربین صدا و سیمای حکومت نشاندند تا بگوید برادرش حامد مبتلا به بیماری روانی بوده و چند روز داروهایش را نخورده بود. از این‌رو با چاقو به ماموران امنیتی حمله کرد و آنها علیرغم میلشان او را کشتند. آنهم با شلیک چهار گلوله جنگی به سر و سینه و پاهای او.
  پیکر حامد دو روز بعد در آرامستان روستا «تجر اکبر» کلهر از توابع کرمانشاه به خاک سپرده شد.

