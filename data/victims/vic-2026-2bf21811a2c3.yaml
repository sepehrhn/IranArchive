  Hamed Ghorbani,
  22 years old, from Shahabad, Kermanshah, residing in Karaj;
  He was killed on 13th September 2023.

  Following the Iranian national uprising and on the eve of the anniversary of #MahsaAmini’s killing, Hamed, in one of the streets of Golshahr in Karaj, got into a confrontation with government military personnel while calling on the people to return to the streets. They fired four military bullets at Hamed, killing him.

  Security forces, after taking Hamed’s body hostage, put his brother in front of the government’s cameras to claim that Hamed had a mental illness and had not taken his medication for several days. As a result, he attacked the security forces with a knife and, despite their reluctance!, they killed him, shooting him with four military bullets in the head, chest, and legs.

  Hamed’s body was laid to rest two days later in the cemetery of „Tajjar Akbar“ village in the Kalhor district of Kermanshah.

