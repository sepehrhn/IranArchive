description: |-
  •
  جاویدنام: ملیحه حسن‌نژاد،
  سن نامشخص، اهل سقز، کردستان؛
  جاودانه شد: ۱۸ تیر ۱۴۰۲.

  در جریان خیزش ملی ایرانیان علیه حکومت، روز ۲۷ مهر در سقز #سیدمحمد_حسینی فرزند ملیحه و هادی توسط ماموران امنیتی حکومت ربوده شد و یک روز بعد پیکر بی‌جانش با آثار ضرب و شتم و شکنجه روی آن در ماشین خودش پیدا شد. خانواده محمد به شدت تحت فشار نیروهای امنیتی قرار داشتند. آنها بارها برادر دیگر محمد را تهدید جانی کردند تا مانع خبررسانی راجع به کشته شدن محمد بشوند. همه این فشارها و تهدیدها موجب شد ملیحه در همان روزهای اول پس از کشته شدن پسرش دچار ضربه‌مغزی بشود.
  ملیحه پس از نزدیک به ده ماه کما؛ روز ۱۸ تیر ماه در بیمارستان رجایی تهران جان باخت.
  پیکر او در آرامستان «آیچی» سقز به خاک سپرده شد.

