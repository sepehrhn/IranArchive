  Maliheh Hassannejad,
  Age unknown, from Saqqez, Kurdistan;
  She was killed on 9th July 2023.

  During the Iranian people's uprising against the government, on 19th October, in Saqqez, #SeyedMohammadHosseini, the son of Maliheh and Hadi, was abducted by government security agents, and a day later, his lifeless body, bearing signs of beating and torture, was found in his own car. Mohammad's family was under intense pressure from the security forces. They repeatedly threatened to kill Mohammad's other brother to prevent them from reporting Mohammad's death. All these pressures and threats led Maliheh to suffer a brain injury in the early days following her son's killing.

  After nearly ten months in a coma, Maliheh lost her life on 9th July in “Rajaee” Hospital in Tehran. Her body was laid to rest in the "Aychi" cemetery in Saqqez.

