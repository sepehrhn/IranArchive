  جاویدنام: داریوش انصاری بختیارند،
  ۲۷ ساله، ساکن فولادشهر، اصفهان؛
  جاودانه شد: ۱۰ دی  ۱۴۰۴

  داریوش در جریان خیزش ملی ایرانیان در بسیاری از شهرهای ایران در دی ماه ۱۴۰۴،  روز ۱۰ دی ماه در فولادشهر اصفهان مورد اصابت گلوله نیروهای نظامی حکومت جمهوری اسلامی قرار گرفت و پیش از رسیدن به بیمارستان جان باخت. ویدیویی از پیکر بی‌جان او روی تخت بیمارستان وجود دارد که در آن فردی داریوش را معرفی می‌کند و می‌گوید که او توسط نیروهای حکومت کشته شده است.
  خانواده انصاری تحت فشار نیروهای امنیتی در قالب اعلامیه‌ای از مردم خواستند که به دلایل امنیتی از حضور در مراسم خاکسپاری فرزندشان خودداری کنند.  اما مراسم خاکسپاری روز ۱۲ دی با حضور گسترده مردم و همشهریان برگزار شد و پیکر او در حالی که مردم شعار می‌دادند: «این گل پرپر شده- هدیه به میهن شده» در آرامستان گلزار شهدای شهر فلاورجان به خاک سپرده شد.

