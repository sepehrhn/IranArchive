  Darius Ansari Bakhtiarvand,
  27 years old, from Fooladshahr, Isfahan;
  He was killed on January 10, 2026.

  During the national uprising of Iranians across many cities in Iran in January 2026, Darius was shot by military forces of the Islamic Republic government on January 10 in Fooladshahr, Isfahan, and died before reaching the hospital.
  A video exists of his lifeless body on a hospital bed, in which a person identifies him as Darius and states that he was killed by government forces.
  The Ansari family was placed under pressure by security forces and, through a public statement, asked people to refrain from attending their son’s funeral due to security concerns. However, the funeral was held on January 12 with a large presence of people and fellow citizens.
  His body was buried at the Golzar-e Shohada cemetery in the city of Falavarjan, as people chanted:
  “This flower has been torn apart — it has been offered to the homeland.”

