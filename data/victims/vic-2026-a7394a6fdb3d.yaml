description: |-
  •
  جاویدنام: برهان کرمی،
  ۳۲ ساله، اهل کامیاران، کردستان؛
  جاودانه شد: ۲۵ آبان ۱۴۰۱.

  برهان ظهر چهارشنبه ۲۵ آبان در جریان تجمع مردم مقابل منزل جاویدنام #فواد_محمدی؛ از فاصله نزدیک هدف اصابت گلوله نظامیان سپاه به صورتش قرار گرفت و کشته شد.
  پیکر برهان همان شب با حضور گسترده مردم کامیاران که شعار می‌دادند: «مرگ بر جاش» در آرامستان روستای «چروسانه» به خاک سپرده شد.
  برهان متاهل و دارای یک کودک خردسال بود.

