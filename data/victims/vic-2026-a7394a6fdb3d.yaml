  Borhan Karami
  32 years old, from Kamyaran, Kurdistan;
  He was killed on 16 November 2022.

  Borhan was killed on Thursday, 16 November , during a gathering of people in front of Foad Mohammadi's residence. He was targeted by a bullet fired by the Revolutionary Guards from a close range, resulting in his death.

  On the same night, Borhan's body was laid to rest in the village cemetery of "Chersaneh" with the widespread presence of people from Kamyaran, chanting, "Death to the regime."
  Borhan was married and had a young child.

