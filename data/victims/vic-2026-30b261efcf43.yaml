description: "⁨\t⁨\t⭕️\nجاویدنام: سیدعلی‌اصغر حسینی،\n۱۸ ساله، اهل و ساکن کرمان؛\nجاودانه شد: ۱۸ دی ۱۴۰۴\n\nدر جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ علی‌اصغر شامگاه پنجشنبه ۱۸ دی‌ماه هدف اصابت گلوله جنگی نیروهای سرکوب حکومت به کنار قلبش قرار گرفت.\nاو را به بیمارستان باهنر کرمان منتقل کردند. در بیمارستان، یک رزیدنت اقدام به شکافتن قفسه سینه و خارج کردن قلب برای خارج کردن گلوله کرد که این اقدام موجب جان باختن علی‌اصغر شد. به روایت کادر درمان، در صورت انجام جراحی توسط جراح مجرب، امکان زنده ماندن او وجود داشت.\n\nعلی‌اصغر آن شب دو هودی (لباس کلاه‌دار) پوشیده بود تا در صورت اصابت گلوله ساچمه‌ای آسیب نبیند، اما نیروهای سرکوب با سلاح جنگی به او شلیک کردند.\nپیکر علی‌اصغر در سکوت و تحت تدابیر شدید امنیتی به خاک سپرده شد.\nاو دانش‌آموز بود، اما به دلیل ناچار بودن به کار، به‌صورت غیرحضوری تحصیل می‌کرد.\n\n#سید_علی_اصغر_حسینی\n#انقلاب_ملی_ایران_۱۴۰۴ \n#انقلاب_شیر_و_خورشید\n#کرمان #ایران \n#بیمارستان_باهنر_کرمان\n#نیمکت_خالی #کودک_و_نوجوان\n#حکومت_کودک_کش #دبیرستان\n#دانش_آموز \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nSeyed Ali Asghar Hosseini,\n18 years old, from and resident of Kerman;\nKilled on: 7 January 2026\n\nDuring the National Revolution against the Islamic Republic, Ali Asghar was shot with live ammunition by government suppressive forces on the evening of Thursday, 7 January 2026. The bullet struck near his heart.\n\nHe was transferred to Bahonar Hospital in Kerman. At the hospital, a medical resident opened his chest and removed his heart in an attempt to extract the bullet, which resulted in his death. According to medical staff, had he been operated on by an experienced surgeon, he might have survived.\n\nThat night, Ali Asghar was wearing two hooded sweatshirts (hoodies) to protect himself in case of pellet gunfire, but suppressive forces used live ammunition against him.\nHis body was buried in silence under strict security measures.\nAli Asghar was a student, but due to financial necessity, he was studying through distance education.\n\n#SeyedAliAsgharHosseini\n#NationalRevolutionIran2026\n#LionAndSunRevolution\n#Kerman\n#BahonarHospital\n#Iran\n\n‪‪@realDonaldTrump‪@senategop‬op‬op \n\n#DonaldTrump\n#LindseyGraham\n#SenatorGraham\n#BBC\n#BBCWorld\n#CNN\n#FoxNews\n#Reuters\n#AlJazeeraEnglish⁩⁩"
