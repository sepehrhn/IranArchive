description: |-
  محمدرضا مجیدی اصل از بازداشت‌شدگان اعتراضات دی ۱۴۰۴، از سوی دادگاه انقلاب تهران به اعدام محکوم شده است. پرونده‌ی او به صورت مشترک همراه با همسرش بیتا همتی، بهروز زمانی‌نژاد و کوروش زمانی نژاد بررسی و برای هر چهار نفر حکم اعدام صادر شده. نگرانی جدی در مورد امنیت جانی او وجود دارد. صدایش باشیم.
