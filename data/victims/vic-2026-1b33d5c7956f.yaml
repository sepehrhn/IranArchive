  Abdolsalam Gholvan (Abdolsalam Ghavani),
  32 years old from Oshnabieh, West Azarbayjan;
  Hi was killed on 26 September 2022.

  Abdolsalam was shot and injured by government military forces during the protests against the government's murder of #MahsaAmini on September 21. He was transferred to Khomeini Hospital in Urmia. He passed away due to the severity of his injuries on October 4.
  His 40th-day ceremony was held on November 3 with the wide presence of people. Shopkeepers and merchants in Oshnavieh went on strike on this day.

