description: |-
  •
  جاویدنام: عبدالسلام قادر گلوَن ( عبدالسلام گلوَنی)،
  ۳۲ ساله و اهل اشنویه، آذربایجان غربی؛
  جاودانه شد: ۴ مهر ۱۴۰۱.

  عبدالسلام در تجمعات اعتراضی به قتل حکومتی #مهسا_امینی در سی‌ام شهریور به ضرب گلوله ماموران نظامی حکومت زخمی و به بیمارستان «خمینی‌شهر» ارومیه منتقل شد.
  او دوشنبه چهارم مهر به دلیل شدت جراحات جان باخت.
  مراسم چهلم عبدالسلام ۱۳ آبان با حضور گسترده مردم برگزار شد. کسبه و بازاریان اشنویه در این روز اعتصاب کردند.

