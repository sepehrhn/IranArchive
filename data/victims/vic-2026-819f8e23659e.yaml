description: |-
  •
  جاویدنام: شیرین علیزاده،
  ۳۶ ساله و اهل اصفهان؛
  جاودانه شد: ۳۱ شهریور ۱۴۰۱ در مازندران.

  شیرین همراه خانواده‌اش از اصفهان به مازندران سفر کرده بود. او در خودرویی در مسیر تنکابن به چالوس در حرکت بود که در نزدیکی متل‌قو به ضرب گلوله ماموران امنیتی کشته شد.
  قبل از برخورد گلوله شیرین در حال فیلم‌برداری با تلفن همراه خود از ضرب و شتم معترضین توسط نیروهای پایگاه بسیج بود و اینگونه لحظه برخورد گلوله و کشته شدن او روی تلفن همراهش ضبط شد. پسر هفت ساله شیرین هم هنگام کشته شدن او در خودرو و شاهد مرگ مادرش بود.
  پیکر شیرین در آرامستان «باغ رضوان» اصفهان به خاک سپرده شد.
  در مراسم چهلم او که با حضور گسترده مردم معترض برگزار شد؛ معترضان شعار می‌دادند:
  «هر یه نفر کشته شه- هزار نفر پشتشه».

