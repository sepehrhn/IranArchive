  Shirin Alizadeh,
  36 years old, from Isfahan;
   She was killed on 22 September 2022 in Mazandaran.

  Shirin was on a trip with his family from Isfahan to Mazandaran. She was in the car on the way from Tonkabon to Chalus, when she was shot by security agents.
   She was recording Basij resistance forces beating up the protesters.  She was shot while recording and this is how she recorded her death too. Shirin's seven-year-old son was in the car she was killed and witnessed his mother's death.
   Shirin's body was buried in "Bagh Rizvan" cemetery in Isfahan.
   In her 40th mourning ceremony, large number of protesters attended;  The protesters chanted:
   "If you kill one of us, a thousand of will stand against you".

