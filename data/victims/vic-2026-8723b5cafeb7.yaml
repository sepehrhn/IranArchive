  Kamran Shahbazi,
  35 Years old from Karaj of Alborz province;
  Was killed on Oct 03, 2022.

  Kamran was killed by batons strikes of IRI suppressors on his head during the nationwide protest on Oct 03, 2022 in Krarj. IRI intelligence agency did not return his death body to his family until they accepted to announce that Kamran died by a natural death in his home.
  Kamran was buried in Behesht Sakineh graveyard of Karaj in a situation which intelligence agents were all around during his burial ceremony. On Nov 11 which was coincide with 40 days of Kamran funeral, his family broke their silence with the truth. His mother shouted the women, life, and freedom slogan and while she was ululating she said her son was one of the martyrs of freedom.
  Kamran 40 days of burial was held on his grave by his family in which many other people have contributed and shouted against IRI regime.

