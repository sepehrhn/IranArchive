description: |-
  •
  جاویدنام: کامران شهبازی،
  ۳۵ ساله و ساکن کرج، استان البرز؛
  جاودانه شد: ۱۱ مهر ۱۴۰۱.

  کامران در اعتراضات سراسری ضدحکومتی در کرج، روز ۱۱ مهر با اصابت ضربات باتوم ماموران امنیتی حکومت به سرش کشته شد.
  ماموران اطلاعات حکومت با تعهد اعلام «مرگ در منزل» پیکر کامران را به خانواده‌اش تحویل دادند. خانواده شهبازی پیکر کامران را با حضور ماموران امنیتی در آرامستان «بهشت سکینه» کرج به خاک سپردند. آنها در مراسم چهلم فرزندشان در روز ۲۰ آبان بر سر مزار او سکوت خود را شکستند. مادر کامران در حالی که کِیل می‌کشید و بر مزار فرزندش گل می‌ریخت، شعار «زن، زندگی، آزادی» سر داد و گفت: «شهادتت مبارک کامران!»
  مراسم چهلم کامران شهبازی با حضور گسترده مردم و سر دادن شعارهای ضدحکومتی برگزار شد.

