description: |-
  •
  جاویدنام: یاسر نارویی فرزند عبدالله،
  ۲۵ ساله و اهل زاهدان؛
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  یاسر دانشجوی رشته پزشکی دانشگاه علوم پزشکی زاهدان بود. یاسر را روز ۱۲ آبان در خیابان مشرف به دانشگاه هدف تیراندازی نظامیان حکومت به سینه‌اش قرار گرفت و کشته شد.
  آنروز در آن منطقه تظاهرات نبود. احتمالا یاسر به دلیل شرکت در اعتراضات شناسایی شده بود و تحت تعقیب بود.

