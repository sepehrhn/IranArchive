  Yaser Naroui, son of Abdullah,
  25 years old, from Zahedan,
  He was killed on 3th November 2022.

  Yaser was a medical student at Zahedan University of Medical Sciences. On 3th November, he was shot in the chest by government forces on a street near the university and tragically lost his life.
  There were no protests in that area on that day. It is possible that Yaser was targeted due to his participation in previous protests and was under surveillance.

