  Kambiz Rigi son of Allah Bakhsh.
  25 years old,from Zahedan;
  He was killed on 4th November, 2022.

  Kambiz was killed during the #BloodyFridayOfKash protest in front of the governor's building by IRGC snipers who were stationed on the roofs of the houses around the governor's office.
  Kambiz's job was Taxi driver.

