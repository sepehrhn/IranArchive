  Mohsen Armak,
  from Hafshejan, Chaharmahal and Bakhtiari;
  Killed on: January 4, 2026

  During the National Revolution against the Islamic Republic, Mohsen was shot by security forces on Saturday, January 3.

  He was severely injured but, due to the lack of safety in medical centers, did not go to a hospital and went into hiding.

  On the morning of Sunday, January 4, Mohsen died as a result of severe blood loss.

  Security forces pressured his family to declare that the cause of his death was “gas suffocation.”

  It has been reported that the individual who killed Mohsen was a government force named Farhad Jahanbin.

  He was buried secretly under heavy security in Golestan Shohada Cemetery in Hafshejan.

  In his Instagram bio, Mohsen had written:
  “In a land where one cannot live with dignity… dying with dignity is better than living…?”

