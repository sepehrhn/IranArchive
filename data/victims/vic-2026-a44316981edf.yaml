description: |-
  •
  جاویدنام: محسن آرمک،
  اهل هفشجان، چهارمحال و بختیاری؛
  جاودانه شد: ۱۴ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی، محسن روز شنبه ۱۳ دی‌ماه هدف اصابت گلوله نیروهای سرکوب حکومت قرار گرفت.

  او که به‌شدت مجروح شده بود، به دلیل نبود امنیت در مراکز درمانی به بیمارستان مراجعه نکرد و مخفی شد.

  محسن صبح روز یکشنبه ۱۴ دی‌ماه بر اثر شدت خونریزی جان باخت.

  نیروهای امنیتی خانواده محسن را تحت فشار گذاشتند تا اعلام کنند علت مرگ او «خفگی با گاز» بوده است.

  گفته شده فردی که محسن را به قتل رسانده، از نیروهای حکومتی با نام فرهاد جهانبین بوده است.

  پیکر او مخفیانه و در شرایط امنیتی در آرامستان «گلستان شهدا» هفشجان به خاک سپرده شد.

  محسن در بیوی صفحه اینستاگرامش نوشته بود:
  «در سرزمینی که نتوان مردانه زیست… مردانه مردن بهتر از زندگی‌ست…؟»

