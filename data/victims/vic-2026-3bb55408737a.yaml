description: |-
  •
  جاویدنام: عرفان (امیررضا) اولادی،
  ۲۴ ساله، اهل و ساکن شیراز؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  عرفان در جریان اعتراضات سراسری به کشته شدن #مهسا_امینی، روز ۳۰ شهریور در شیراز به دست نظامیان حکومت کشته شد.
  در یکی از یورش‌های نظامیان حکومت به جمعیت معترض و عقب‌نشینی آنها، عرفان در یکی از کوچه‌های محله «چاتار» گیر چهار مامور حکومت افتاد. آنها با گلوله‌ ساچمه‌ای از نزدیک به ریه او شلیک کردند و با قنداق تفنگ به صورتش کوبیدند.
  عرفان مقابل چشمانی که از پشت پنجره‌ها مخفیانه بیرون را زیر نظر گرفته بودند، مظلومانه و با دستان خالی جان باخت.
  نیروهای امنیتی حکومت با تحت فشار گذاشتن خانواده عرفان آنها را وادار کردند که بگویند او «شهید مدافع امنیت» بوده است و معترضان او را کشته‌اند. سپس نیروهای سپاه طی مراسمی پیکرش را همراه با دو «شهید مدافع حرم» در آرامستان «دارالرحمه» شیراز، در قطعه «گلزار شهدا» به خاک سپردند.
  عرفان ورزشکار بود. او فارغ‌التحصیل رشته مکانیک خودرو بود.

