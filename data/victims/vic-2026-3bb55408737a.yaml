  Erfan (Amir Reza) Oladi
  24 years old, from Shiraz, residing in Shiraz.
  He was killed on 21th September 2022.

  Erfan was killed on September 21th in Shiraz during the nationwide protests following the Killing of Mahsa Amini by government forces.

  During one of the government forces' raids on the protesting crowd and their retreat, Erfan was trapped by four government agents in one of the alleys of the "Tachara" neighborhood. They fired close-range shotgun pellets into his chest and struck him in the face with a rifle butt.

  In front of the eyes that had secretly watched from behind the windows, Erfan lost his life, helpless and with empty hands.

  Under pressure from the government, Oladi's family was coerced into stating that Erfan was a "martyr defending security" and that the protesters had killed him.

  Then, during a ceremony, the Revolutionary Guard forces ( #IRGC ) buried his body in „Dar al-Rahmeh“ Cemetery in Shiraz, in the section known as the "Golzar Shohada," along with two "martyrs of the defense of the shrine."

  Erfan was a sports enthusiast and a graduate in automotive mechanics.

