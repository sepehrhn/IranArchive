  Mohammad Shahbakhsh, son of Nader,
  Age: Unknown, from Zahedan, Residing in Bayatabad;
  He was killed on 4th November 2022.

  Mohammad was a student at Khash Azad University. During the people's resistance on the day of the #BloodyFridayOfKhash, he was struck by a bullet fired by government forces and tragically lost his life.

