description: |-
  •
  جاویدنام: حبیب‌الله یعقوبی نجیب(براهویی)،
  ۳۶ ساله، اهل شهرستان زهک، ساکن زاهدان؛
  جاودانه شد: ۲۱ آذر ۱۴۰۱.

  حبیب‌الله روز ۸ مهر، #جمعه_خونین_زاهدان داخل مصلی مکی مورد اصابت گلوله جنگی نظامیان سپاه به شکم و لگنش قرار گرفت و به شدت مجروح شد. او پس از تحمل ۷۵ روز رنج ناشی از جراحت گلوله جان باخت.
  پیکر حبیب‌الله در آرامستان «محمد رسول‌الله‌» زاهدان به خاک سپرده شد.

