  Habibollah Yaghoobi Najib (Barahui),
  36 years old, from Zahak County, residing in Zahedan;
  He was killed on 12th  December 2022.

  Habibollah was shot in the abdomen and pelvis by the military's bullets during the #BloodyFridayOfZahedan on September 30. He suffered severe injuries and endured the pain for 75 days before losing his life.
  Habibollah's body was laid to rest in "Mohammad Rasoulollah" Cemetery in Zahedan.

