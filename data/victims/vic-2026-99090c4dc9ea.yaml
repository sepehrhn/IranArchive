description: |-
  •
  جاویدنام: میلاد استادهاشم،
  ۳۷ ساله و اهل تهران؛
  جاودانه شد: ۴ مهرماه ۱۴۰۱.
  میلاد در تظاهرات سراسری ضد حکومتی در تهران، حوالی هفت حوض از پشت مورد اصابت گلوله ماموران امنیتی قرار گرفت. او سوار موتور بود. بعد از  این‌که تیر خورد موتورش را کنار خیابان متوقف کرد، روی زانوهایش نشست و  جانش را از دست داد.
  ماموران اطلاعات حکومت همان شب در بیمارستان همسر و خانواده میلاد را تحت فشار گذاشتند تا اعلام کنند میلاد بسیجی بوده و معترضان او را کشته‌اند وگرنه پیکر میلاد را تحویلشان نمی‌دهند و اجازه نخواهند داد او را در تهران به خاک بسپارند. آنها دو پسر دیگر خانواده را نیز تهدید به قتل می‌کنند. وقتی خانواده با فشار و ارعاب تن به خواسته آنها می‌دهند مراسم تشییع حکومتی او را از صدا و سیمای جمهوری اسلامی پخش می‌کنند.
  در نهایت برای تحویل پیکر میلاد به خانواده‌اش ۲۰ میلیون از آنها پول می‌گیرند و بر خلاف وعده‌شان اجازه دفن او را در قطعه شهدا نمی‌دهند و میلاد استادهاشم قربانی پروژه «بسیجی‌سازی» حکومت می‌شود که بعدتر توسط نزدیکان و دوستان او فاش می‌شود.
  میلاد فروشنده لوازم خانگی در میدان شوش تهران بود. او متاهل و پدر یک دختر هشت ساله بود.

