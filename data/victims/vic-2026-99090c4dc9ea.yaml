  Milad Ostadehashem,
  37-year-old resident of Tehran,
  was killed on September 26, 2022.

  Milad was hit by a bullet fired by security forces during nationwide anti-government protests in Tehran, near Haft Hoz Square. He was riding a motorcycle. After being shot, he stopped his motorcycle on the side of the street, sat on his knees, and passed away.
  Government intelligence agents pressured Milad's family and spouse at the hospital that night, demanding that they declare Milad as a member of the Basij paramilitary force who was killed by protesters. Otherwise, they would not release Milad's body to them and would not allow them to bury him in Tehran. They also threatened to kill Milad's other two brothers. Under duress, the family complied with their demands and the government broadcasted a funeral procession for him on state TV.
  Finally, in exchange for delivering Milad's body to his family, they extorted 20 million tomans (about $800) from them.

