description: |-
  ⭕️
  جاویدنام: زکریا خیال (سلیمانی)،
  ۱۶ ساله ‌‌و اهل پیرانشهر، آذربایجان غربی؛
  جاودانه شد: ۲۹ شهریور ۱۴۰۱.

  زکریا در تظاهرات سراسری در اعتراض به کشته شدن #مهسا_امینی ساعت ۹ شب ۲۹ شهریور در خیابان سی متری، نزدیک پاسگاه نظامی سپاه مورد اصابت دو گلوله جنگی نظامیان حکومت به سینه‌اش قرار گرفت و کشته شد. والدین او از قاتلین پسرشان شکایت کردند اما نتیجه‌ای نگرفتند.
  زکریا دانش‌آموز بود.
  مادر او؛ آمنه عبدالله‌نژاد سر مزار فرزندش لالایی به زبان کردی خواند که در بخشی از آن می‌گفت:

  فرزندم نخوابیده
  او حاصل رنج حیاتم است
  نقل و‌نباتم!
  خواب خیرت باشد!
  بخواب دیر شده!
  تا خروس‌خوان سحر بی‌صداست.
  هی لای لای فرزندم!
  آخر به من بگو چرا خوابت نمی‌برد؟
  شهید هستی ای جوان من!
  پدر پدرم بخواب!
  بخواب قربانت!

