  Zakaria Khial (Soleimani),
  16 years old, from Piranshahr, West Azarbaijan;
  He was killed on September 20, 2022.

  Zakaria was struck by two military bullets in his chest and killed by government soldiers near the 30-Metri Street, close to the Sepah Military Base, at 9 PM on September 20, in nationwide protests against the killing of #MahsaAmini.
  His parents filed a complaint against their son's killers but received no results.

  Zakaria was a student.

  His mother, Ameneh Abdollahnejad, recited a lullaby in Kurdish at her son's grave, part of which said:

  "My son is not asleep,
  He is the fruit of my life’s suffering,

  O my love and delight!
  May your sleep be peaceful!

  Sleep! It's getting late.
  Until the rooster's crow is silent.

  Hey Lai Lai, my son!
  Tell me, why won't you sleep?

  You're a martyr, my young one!
  Father of my father, sleep!
  Sleep! I sacrifice myself for you!"

