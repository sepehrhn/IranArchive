description: |-
  •
  جاویدنام: مختار احمدی،
  ۱۹ ساله، اهل مریوان، کردستان؛
  جاودانه شد: ۹ مهر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی روز ۹ مهر در مریوان؛ نیروهای نظامی حکومت به مختار که از سر کار برمی‌گشت، در کوچه بن‌بست محل زندگی‌اش شلیک کردند و او را کشتند.
  نیروهای امنیتی حکومت بلافاصله به منزل والدین مختار رفتند تا با تطمیع و تهدید مانع اطلاع‌رسانی آنها راجع کشته شدن مختار شوند. آنها به خانواده احمدی گفتند: «اگر از کسی شکایت دارید یا قاتل را می‌شناسید به ما معرفی کنید! مختار از نظر ما شهید است و شما را به بنیاد شهید معرفی می‌کنیم.»
  تن ندادن خانواده مختار به خواست حکومت موجب شد نیروهای امنیتی به آنها اجازه برگزاری مراسم خاکسپاری و یادبود ندهند.
  پیکر مختار در سکوت و شرایط کاملا امنیتی در آرامستان «دارسیران» مریوان به خاک سپرده شد.
  مختار با کارگری و دست‌فروشی روزگار می‌گذراند. او در مریوان عروسک می‌فروخت.

