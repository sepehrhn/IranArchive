  Mokhtar Ahmadi,
  19 years old, from Marivan, Kurdistan;
  He was killed on 1th October 9 2022.

  During the nationwide anti-government protests on 1th October in Marivan, government military forces shot Mokhtar as he was returning home from work in a dead-end alley where he lived, killing him.
  Government security forces immediately went to Mokhtar's parents' home to prevent them from informing others about Mokhtar's death, using both persuasion and threats. They told the Ahmadi family, "If you have any complaints or know the killer, introduce them to us! As far as we are concerned, Mokhtar is a martyr, and we will present you to the Martyrs Foundation."
  The Ahmadi family's refusal to comply with the government's demands led to the security forces denying them permission to hold a funeral and memorial service.
  Mokhtar's body was quietly laid to rest in the "Darsiran" Cemetery in Marivan under strict security conditions.

  Mokhtar earned a living through labor and selling dolls. He used to sell dolls in Marivan.

