  Mahmoud Keshvari,
  35 years old and from Dorud, Lorestan province;
  He was killed on 4 October 2022.

  Mahmoud worked in Karaj. He disappeared on 24th of September in the nationwide anti-government protests in Karaj. In the middle of the night on 4th of October, the government intelligence agents buried his body without the presence of his family aside of his mother's grave in the "Khazr" cemetery in front of the 12th Behesht plot in Khorramabad and did not allow his family to hold the funeral ceremony.
  Mahmoud Keshvari’s 40th ceremony was held on 4th of November. According to witnesses, the security agents had closed all the roads to Khazr's cemetery so that people could not attend the ceremony.

