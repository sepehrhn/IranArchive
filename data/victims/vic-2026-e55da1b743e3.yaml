description: |-
  •
  جاویدنام: محمود کشوری،
  ۳۵ ساله و اهل شهرستان دورود، خرم‌آباد؛
  جاودانه شد: تاریخ خاکسپاری: ۱۲ مهر ۱۴۰۱.
  محمود در کرج کار می‌کرد. او روز دوم مهر در اعتراضات سراسری ضد حکومتی در کرج ناپدید شد. ماموران اطلاعات حکومت نیمه شب ۱۲ مهر پیکر او را بی‌حضور خانواده‌اش داخل مزار مادرش در آرامستان «خضر» مقابل قطعه ۱۲ بهشت در خرم‌آباد به خاک سپردند و به خانواده‌اش اجازه برگزاری مراسم ختم ندادند.
  مراسم چهلم محمود کشوری روز ۱۳ آبان برگزار شد. به گفته شاهدان عینی ماموران امنیتی تمام مسیرها به آرامستان خضر را بسته بودند تا مردم نتوانند خود را به مزار محمود برسانند.

