description: |-
  •
  جاویدنام: عزیز مرادی،
  سن نامشخص، اهل سنندج، کردستان؛
  جاودانه شد: ۲۰ مهر ۱۴۰۱.

  عزیز مرادی مالک غذای آماده «کل گندم» در نایسر سنندج بود. عزیز در اعتراضات سراسری سنندج، در چهار راه حاجی فرضیه، ساعت ۲۲:۱۵ با گلوله اسلحه کلاشنیکف نیروهای سپاه مجروح شد. پس از مجروح شدن ماموران‌ او را به داخل جوب آبی پرت و دوره‌اش می‌‌کنند. آنها اجازه نمی‌دهند حاضرین عزیز را به بیمارستان برسانند. وقتی او را به بیمارستان می‌رسانند دیر شده بود و او بر اثر شدت جراحات درگذشت.
  ماموران امنیتی پیکر عزیز را شامگاه ۲۱ مهر تنها با حضور خانواده‌اش در آرامستان «بهشت محمدی» سنندج‌ به خاک سپردند و بتن‌ریزی کردند.

