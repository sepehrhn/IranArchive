  Aziz Moradi,
  From Sanandaj, Kurdistan;
  He was killed on 12 October 2022.

  Aziz Moradi was the owner of "Gol Gandom" catering in Naysar, Sanandaj. Aziz was injured by a Kalashnikov bullet from IRGC forces during the nationwide protests in Sanandaj, at Haji Feiz intersection, at 22:15. After being injured, the officers threw him into the ditch at the side of the street and surrounded him. They did not allow the attendees to take Aziz to the hospital. By the time he was taken to the hospital, it was too late and he died from his injuries.
  The security agents buried Aziz's body in the evening of 13th of October in the presence of his family in "Behesht Mohammadi" cemetery in Sanandaj and covered it with concrete.

