  Abdolkhalegh (Omar) Shahnavazi, son of Sharif,
  30 years old, from Zahedan, Sistan and Baluchestan;
  He was killed on 30 September 2022.

  Abdolkhalegh was fatally shot during nationwide protests against the government; on 30 September, known as #BloodyFridayZahedan, he was hit by bullets from government military forces in Maki Mosque and lost his life.

  Abdolkhalegh's family contacted his cousin #EsmaeilHassanZahi, who is a member of the ‏Islamic Republic Parliament, to retrieve his body. He replied, "I have no connection to this. Don't tell anyone you're related to me; I'm being questioned."

  Abdolkhalegh was married. He was almost two weeks away from his first wedding anniversary when he was killed.

  On Friday, 30th September 2022, in Zahedan, more than 50 people of Sistan and Baluchestan were killed by gunfire from government law enforcement and Sepah (#IRGC) snipers. Among the casualties were over ten children.

