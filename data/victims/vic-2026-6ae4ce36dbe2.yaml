description: |-
  •
  جاویدنام: عبدالخالق (عمر) شهنوازی فرزند شریف،
  ۳۰ ساله، اهل زاهدان، سیستان و بلوچستان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  عبدالخالق در جریان اعتراضات سراسری علیه حکومت؛ روز ۸ مهر موسوم به #جمعه_خونین_زاهدان در مسجد مکی مورد اصابت گلوله نظامیان حکومت قرار گرفت و کشته شد.
  خانواده عبدالخالق برای تحویل گرفتن پیکر او با پسرعمویش #اسماعیل_حسن_زهی که نماینده مجلس است تماس گرفتند و گفتند کاری کن پیکر عمر را تحویل بدهند. او در پاسخ گفت به من ربطی ندارد. به کسی هم نگویید فامیل من هستید، زیر سوال می‌روم.
  عبدالخالق متاهل بود. نزدیک به دو هفته مانده بود به اولین سالگرد ازدواجش که کشته شد.

  روز جمعه ۸ مهر ۱۴۰۱ در زاهدان بیش از ۵۰ نفر از مردم با شلیک گلوله ماموران انتظامی حکومت و تک‌تیراندازان سپاه کشته شدند. در میان کشته شدگان بیش از ده کودک وجود داشت.

