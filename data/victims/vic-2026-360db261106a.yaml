description: |-
  ⭕️
  جاویدنام: محمدرضا نصرالهی،
  ۱۷ ساله، ساکن شیراز؛
  جاودانه شد: ۳۰ آبان ۱۴۰۱.

  ساعت هشت صبح روز دوشنبه ۳۰ آبان به خانواده نصرالهی خبر دادند که محمدرضا همراه سه نفر از دوستانش به اسامی #یوسف_قنبرزادگان، #ماهان_سرگوان و #ابوالفضل_دادگر در حالی که هر چهار نفر سوار موتورسیکلت محمدرضا بوده‌اند در یکی از کوچه‌های خیابان قصرالدشت شیراز تصادف کردند و محمدرضا و ماهان به دلیل شدت جراحات در همان محل سانحه جان باخته‌اند.
  محمدرضا ساعت ۲۴:۰۰ یعنی یک ساعت قبل از مرگ با خانواده‌اش تماس گرفت و گفت تا یک ربع دیگر به خانه خواهد آمد.
  تمام بدن محمدرضا زخم بود. ران سمت چپش شکسته و پایش از جا در رفته بود. تمام صورتش زخم بود و قسمت کوچکی از پشت سرش له شده بود. پشت ماهیچه پایش یک زخم بزرگ بود و هر دو دستش خشک شده بود.
  تصادف سناریوی ساختگی نیروهای امنیتی بود و رسانه‌های حکومتی نیز راجع به آن نوشتند. علیرغم همه این‌ها وقتی خانواده نصرالهی درخواست کردند فیلم‌های دوربین‌های مداربسته منطقه حادثه را ببینند به آنها گفته شد که تمامی دوربین‌ها پاک شده است و فیلمی موجود نیست.
  خانواده نصرالهی نیز همچون خانواده سرگوان و قنبرزادگان نمی‌دانند فرزندشان چگونه کشته شده است. آنچه مسلم است آنها توسط نیروهای امنیتی حکومت و در جریان اعتراضات سراسری ضد حکومتی در شیراز کشته شده‌اند.
  ابوالفضل نیز که تنها بازمانده است، به دلیل تهدیدهای امنیتی تمایلی به گفتگو راجع به موضوع نشان نمی‌دهد.

  پیکر محمدرضا روز اول آذر همراه پیکر ماهان در آرامستان «بهشت فاطمیه» قصرالدشت شیراز به خاک سپرده شد.

  محمدرضا تا کلاس نه درس خوانده بود. او عاشق سفر بود. می‌خواست امسال در مراسم چهلم امام سوم شیعیان به کربلا سفر کند.
  او دلش می‌خواست آنقدر تمکن مالی داشته باشد که علاوه بر حمایت مالی خانواده‌اش به نیازمندان هم کمک کند. محمدرضا آرزو داشت دایی بشود. دلش می‌خواست خانواده تشکیل بدهد.
  محمدرضا عاشق اسب بود و آرزو داشت روزی خودش اسطبل داشته باشد.

