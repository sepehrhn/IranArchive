description: |-
  •
  جاویدنام: مهراب دولت‌پناه،
  سن نامشخص، اهل روستای تازه‌آباد تالش؛
  جاودانه شد: ۹ مهرماه ۱۴۰۱.

  مهراب در تظاهرات سراسری ضدحکومتی تالش در روز ۳۰ شهریور از ناحیه سر مورد اصابت گلوله ساچمه‌ای قرار گرفت. او‌ پس از ده روز کما روز نهم مهرماه درگذشت. ماموران اطلاعات حکومت در ازای تحویل پیکر مهراب ۸۰۰ میلیون تومان از خانواده او طلب کردند. در نهایت پس از دو روز با گرفتن ۱۵۰ میلیون تومان پیکر مهراب را به خانواده‌اش تحویل دادند.
  پیکر مهراب تحت فشار امنیتی شامگاه یازدهم مهر در روستای تازه‌آباد تالش به خاک سپرده شد.
  در مراسم خاکسپاری مهراب و در میان خشم و اشک حاضران مادر برای پسرش شاباش پخش می‌کرد و‌ پدر می‌رقصید.

