  Mehrab Dolatpanah,
   Age: unknown, from the village of Taze Abad Talesh.
   He was killed on 1 October 2022.

  Mehrab was shot in the head during the anti-government demonstration and died after being in a coma for ten days.  Government intelligence agents demanded 800 million tomans from Mehrab's family in exchange for handing over Mehrab's body.  Finally, after two days, Mehrab's body was handed over to his family after receiving 150 million tomans.
   Mehrab's body was buried under security pressure in his village.
  During Mehrab's funeral ceremony, his mother was spreading gift and his father was dancing in the anger and tears among the gifts (a tradition done in weddings and when a young unmarried boy dies the family do in the mourning ceremony)

