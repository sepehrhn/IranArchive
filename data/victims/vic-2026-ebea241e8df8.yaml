  Omid Barzegar,
  29 years old, from Golestan, Tehran;
   He was killed on 21st  September 2022

  Omid was injured by a bullet during the nationwide protests on the Savah-Golestan highway. According to witnesses in a private meeting, a member of the Tehran's "Mohammad Rasoulallah" Revolutionary Guard Corps, named Mehrzad Koohi, sat on Omid's back and shot him in the head.
  Security forces took his body and his family was able to receive him and bury him after three days.


