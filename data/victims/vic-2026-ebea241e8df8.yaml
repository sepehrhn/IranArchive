  جاویدنام: امید برزگر،
  ۲۹ ساله، اهل شهر گلستان، تهران؛
  جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  امید در تظاهرات اعتراضی به قتل حکومتی #مهسا_امینی در جاده ساوه گلستان با اصابت گلوله مجروح شد. به گفته حاضران در صحنه فردی به نام #مهرزاد_کوهی از اعضا #سپاه محمد رسول‌الله تهران روی کمرش نشست و به سرش شلیک کرد.
  نیروهای امنیتی پیکر امید را ربودند و خانواده او بعد از سه روز توانستند آن را تحویل بگیرند و به خاک بسپارند.

