  Mehrdad Behnam Asal,
  21 years old and from Dehdasht of Kohgiluyeh and Boyer-Ahmad Province;
  He was killed on 22 September 2022.

  During the protests against the government murder of #MahsaAmini in Dehasht, Mehrdad was killed by the security agents of the Islamic Republic of Iran.
  His body was buried on the 24th of September in the cemetery of Kelayeh village in Kohgiluyeh and Boyer-Ahmad. He was buried in the presence of a large crowd of people.

