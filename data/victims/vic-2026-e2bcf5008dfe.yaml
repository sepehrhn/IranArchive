description: |-
  •
  جاویدنام: مهرداد بهنام‌اصل،
  ۲۱ ساله و اهل دهدشت استان کهگیلویه و بویراحمد؛
  جاودانه شد: ۳۱ شهریور ۱۴۰۱.

  در جریان تظاهرات اعتراضی به قتل حکومتی #مهسا_امینی در دهشت؛ مهرداد با شلیک گلوله جنگی توسط ماموران امنیتی حکومت جمهوری اسلامی کشته شد.
  پیکر او دوم مهرماه در آرامستان روستا «کلایه» کهگیلویه و بویراحمد؛ با حضور جمع گسترده مردم به خاک سپرده شد.

