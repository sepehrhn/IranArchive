description: |-
  •
  جاویدنام: رامین کرمی،
  ۳۱ ساله ‌و اهل سر پل ذهاب، کرمانشاه؛
  جاودانه شد: بین روز ۲۰ مهر تا ۲۸ مهر ۱۴۰۱.

  رامین روز چهارشنبه ۲۰ مهر و در جریان اعتراضات سراسری ضد حکومتی در سر پل ذهاب ناپدید شد. خانواده او نتوانستند هیچ خبری در جستجوهایشان از رامین به دست بیاورند.
  روز ۲۸ مهر نهادهای امنیتی در تماس با خانواده رامین به آنها گفتند : « فرزند شما شامگاه چهارشنبه ۲۰ مهر در اعتراضات تیر خورده و پس از چند روز بستری بودن جانش را از دست داده است.»
  آنها خانواده کرمی را تهدید کردند که در صورت رسانه‌ای کردن اینکه رامین بر اثر تیراندازی کشته شده است از آنها ۷۰۰ میلیون تومان خواهند گرفت. نیروهای امنیتی پس از اخذ تعهد از خانواده مبنی بر اینکه بگویند رامین در اثر سکته قلبی جان باخته است، پیکر رامین را به خانواده تحویل دادند.
  پیکر رامین روز ۲۸ مهر تحت تدابیر شدید امنیتی در آرامستان «گل داوود» به خاک سپرده شد.

