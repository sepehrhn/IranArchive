  Ramin Karami,
  31 Years old, from Sar-e Pol Zahab, Kermanshah;
  was killed between dates Oct 12 to 20, 2022.

  It was on Oct 12 that Ramin Karimi disappeared around Sar-e Pol Zahab during the nationwide protest against IRI regime. His family start an investigation to find him but they could not find any sign of their son.
  Eight days later on Oct 20 Ramin’s family receive a call from security department of the city regarding the death of Ramin. “Ramin was shot on Oct 12 during the protest and passed away few days after it in a hospital” said the guy on other side of the line.
  It is not ended here. Ramin’s family was warned about opening this case through the media. So if this happens, they needed to pay 7,000,000,000 IRR for receiving Ramin’s dead body. Security department made Ramin’s family to announce heart attack as cause of his death when delivering Ramin’s body to his family.
  Ramin was buried on Oct 20 under a high security precaution in Gol-e Davood graveyard.

