description: University student originally from Harmoud village in the Sahra-ye Bagh district of Larestan County, Fars Province. Son of Abdulhamid Mollaei, a well-known Sunni religious figure in Larestan. Shot and killed by direct gunfire from government forces while returning home with his brother on the evening of Thursday, January 8, 2026. Authorities have refused to hand over his body to his family and have warned them to repeat the official narrative, which falsely claims he was killed by protesters.
