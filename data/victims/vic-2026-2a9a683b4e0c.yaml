  Hammad Rigi Kooteh (Galandarzehi),
  16 years old, from Khash, Sistan and Baluchestan;
  He was killed on 12th May 2023.

  Hammad, on May 12, was hit in the abdomen by bullets fired by the occupants of a Peugeot 405 in the Karvandar area and was injured. He lost his life while being transported to the hospital. Hammad was the son of the Imam of #MosqueAlKhalil in Khash, Mohammad Osman Rigi (Galandarzehi), who, with his critical sermons, was a serious critic of the government during the Iranian National Uprising.
  Hammad's body was buried with the help of the people several hours after his death.

  The judiciary, by denying the cause of Hammad's death, announced that the 16-year-old son of the Imam of Khash "was playing with a firearm" at his father's house and lost his life due to a "sudden gunshot."

  Since the start of nationwide protests against the government, many protesters, including #AbdolwahidRigi, in Sistan and Baluchestan, have been assassinated by direct gunfire from security forces or government plainclothes personnel.

