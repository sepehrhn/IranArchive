description: |-
  ⭕️
  جاویدنام: حماد ریگی کوته(قلندرزهی)،
  ۱۶ ساله، اهل خاش، سیستان و بلوچستان؛
  جاودانه شد: ۲۲ اردیبهشت ۱۴۰۲.

  حماد روز ۲۲ اردیبهشت در منطقه کارواندر مورد اصابت گلوله سرنشینان یک پژو ۴۰۵ به شکمش قرار گرفت و مجروح شد. او در مسیر انتقال به بیمارستان جان باخت.
  حماد فرزند امام جمعه #مسجدالخلیل خاش بود. #محمدعثمان_ریگی (قلندرزهی)؛ پدر حماد در جریان خیزش ملی ایرانیان علیه حکومت با خطبه‌های انتقادی‌اش از منتقدان جدی حکومت بود.
  پیکر حماد چند ساعت بعد از مرگ او با همراهی مردم شبانه به خاک سپرده شد.
  قوه قضاییه با تکذیب علت کشته شدن حماد اعلام کرد که فرزند ۱۶ ساله امام جمعه خاش «در حال بازی با اسلحه» در منزل پدرش به علت «شلیک ناگهانی اسلحه» جان باخته است.
  از زمان آغاز اعتراضات سراسری علیه حکومت معترضان زیادی از جمله #عبدالواحد_ریگی در سیستان و بلوچستان با شلیک مستقیم نیروهای امنیتی یا نیروهای لباس شخصی‌ حکومت
  ترور شده‌اند.

