description: |-
  دنیا حسینی (آزاد) متولد اهواز و ساکن تهران در تاریخ ۲۵ بهمن در منزل شخصی خود توسط نیروهای امنیتی بازداشت و پس از یک روز حبس در کلانتری مطهری تهران به زندان اوین منتقل شده است. او پیش‌تر در جریان جنگ ۱۲ روزه نیز بازداشت و به قید وثیقه آزاد شده بود. اطلاعی از وضعیت پرونده و سلامتی او در دست نیست. صدایش باشیم.

