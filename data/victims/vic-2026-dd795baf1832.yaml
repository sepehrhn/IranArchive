description: |-
  آرتین پریوش (دولت آبادی) دانشجوی انصرافی دانشگاه صنعتی شریف  روز ۱۰ بهمن ماه هنگام خروج از خانه‌ توسط نیروهای امنیتی ربوده شده و تاکنون هیچ اطلاعی از محل بازداشت و وضعیت سلامتی او در دست نیست. او پیش‌تر در جریان اعتراضات ۱۴۰۱ نیز بازداشت شد و به دلیل فشارهای امنیتی از دانشگاه انصراف داد. صدایش باشیم.

