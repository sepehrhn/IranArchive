description: |-
  •
  جاویدنام: سینا ملایری،
  ۳۴ ساله و اهل اراک؛
  جاودانه شد: ۳۰ مهر ۱۴۰۱.

  سینا در اعتراضات سراسری ضد حکومتی در اراک با ضربات باتوم ماموران حکومت کشته شد.
  در مراسم خاکسپاری او که دوم آبان برگزار شد مردم شعار می‌دادند: «این گل پرپر شده- هدیه به میهن شده»
  سینا ملایری دانشجوی پزشکی بود. او هوادار تیم فوتبال آلومینیوم اراک بود.
  مراسم چهلم سینا ۱۱ آذر علیرغم تهدید نیروهای امنیتی با حضور شمار زیادی از مردم برگزار شد. مردم شعارهای ضد حکومتی همچون : «بسیجی، سپاهی داعش ما شمایی!» و «مرگ بر حکومت بچه‌کش» سر دادند.

