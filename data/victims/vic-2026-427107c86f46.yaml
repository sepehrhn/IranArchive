  Sina Malayeri,
  34 years old and from Arak;
  He was killed on 22 October 2022.

  Sina was killed by batons of government agents during the nationwide anti-government protests in Arak.
  At his funeral, which was held on October 24th, people chanted: " This plucked flower - is a gift to the motherland"
  Sina Malayeri was a medical student. He was a fan of Aluminium Arak FC.
  Sina’s 40 day of funeral was held on December 2nd with the presence of a large number of people despite the threat of the security forces. People chant anti-government slogans such as: "Basij and IRGC, you are like ISIS army for us!" And they chanted "Death to the child-killing government".

