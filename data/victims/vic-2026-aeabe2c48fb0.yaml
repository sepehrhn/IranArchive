description: |-
  •

  جاویدنام: سعید (علی) اسعدی،
  ۲۰ ساله، اهل بجنورد، خراسان شمالی؛ (کرد کُرمانج)
  جاودانه شد: ۲۴ آبان ۱۴۰۱.

  سعید در جریان اعتراضات سراسری ضد حکومتی در بجنورد مورد اصابت گلوله جنگی نظامیان حکومت به شکمش قرار گرفت و مجروح شد. دوستانش او را در حالی که به شدت خونریزی داشت به درمانگاهی در نزدیکی محل حادثه بردند اما کادر درمان در را به رویش بستند و مانع از ورود او به درمانگاه شدند.
  سعید در مقابل در بسته درمانگاه و چشمان کادر درمان ، در حالی که دوستانش از او می‌خواستند هوشیار بماند و نخوابد؛ بر اثر شدت جراحت و خونریزی جان باخت. از این لحظه فیلمی در فضای مجازی وجود دارد که صحنه جان دادن سعید مقابل در بسته درمانگاه را نشان می‌دهد.
  پس از پخش این ویدئو نیروهای امنیتی حکومت با دوربین صدا و سیما به سراغ پدر سعید رفتند و او را وادار کردند در مقابل دوربینشان بگوید پسرش که برای کار به تهران رفته بود در اثر تصادف در تهران جان باخته است.
  به خانواده اسعدی اجازه ندادند پیکر سعید را در بجنورد به خاک بسپارند. پیکر سعید روز ۲۵ آبان در روستای زادگاهش «کلاب» به خاک سپرده شد.

