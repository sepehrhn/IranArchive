  Saeed (Ali) Asadi,
  20 years old, from Bojnourd, North Khorasan; (Kurdish-Kurmanji)
  He was killed on 15th November 2022.

  During the nationwide anti-government protests in Bojnourd, Saeed was shot in the abdomen by government military bullets and wounded. His friends rushed him to a nearby clinic while he was bleeding heavily, but the medical staff closed the door on him and prevented his entry into the clinic.
  Saeed, in front of the closed clinic door and the eyes of the medical staff, while his friends begged him to stay awake and not fall asleep, lost his life due to the severity of his injuries and bleeding. There is a video in the virtual space from that moment, showing the scene of Saeed's passing away in front of the closed clinic door.
  After the release of this video, government security forces approached Saeed's father with a TV camera and forced him to say in front of their camera that his son, who had gone to Tehran for work, had died in a car accident in Tehran.

