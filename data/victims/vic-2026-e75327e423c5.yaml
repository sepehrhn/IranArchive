  Sadegh Brahui
  unknown age, from Sistan and Baluchestan;
  He was killed on 4th November 2022.

  On the day of #BloodyFridayOfKash, during a protest demonstration after the first congregational prayer in front of the governorate of Khash, Sadegh was shot by #IRGC snipers who were stationed on the roofs of buildings around the governorate and killed.

