description: 14-year-old Kurdish child who was critically wounded during protests when government forces shot her directly with a war bullet that hit her pelvis area. After two weeks in a coma, she died due to severe injuries and inadequate medical care. She was an honor student at Setaregan School in Kermanshah. Her body was buried on Sunday 5 Bahman under pressure and threats from security agencies.
