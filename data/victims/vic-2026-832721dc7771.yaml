description: |-
  •
  جاویدنام: علی اشگبار،
  ۲۵ ساله، ساکن تهران؛
  جاودانه شد: ۱۸ آذر ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در تهران، روز پنجشنبه ۱۷ آذر مصادف با روزی که جاویدنام #محسن_شکاری توسط حکومت اعدام شد؛ علی هنگام رفتن به محل کارش در بازار تهران بر اثر استنشاق گازی که نظامیان حکومت برای سرکوب معترضان از آن استفاده کره بودند، دچار مسمومیت شد. او به نزدیکانش گفته بود گازی که استنشاق کرده گاز اشک‌آور نبوده است، بلکه گازی سبز رنگ بوده است. علی صبح روز بعد جان باخت.
  در برگه پزشکی قانونی علت مرگ علی مسمومیت مکرر دارویی و غذایی قید شده است.
  نیروهای امنیتی خانواده علی را تحت فشار قرار دادند که علت مرگ او را خودکشی اعلام کنند. آنها به خانواده اشگبار گفتند که مرگ علی اتفاقی بوده و آنها نباید پیگیری یا شکایت کنند.
  نیروهای حکومتی تا به حال چند بار سنگ مزار علی را خراب کردند و عکسش را کندند.
  از علی ویدیویی در فضای مجازی وجود دارد که در حالی که ترک موتوری نشسته است می‌گوید: « یه ویدیو می‌گیرم برای فردای شهادتم که مثل حمیدرضا روحی …»

