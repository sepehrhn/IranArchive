  Ali Ashgbar,
  25 years old, residing in Tehran;
  He was killed on 9th December 2022.

  During the nationwide anti-government protests in Tehran, on Thursday, December 8, coinciding with the day when  #MohsenShekari was executed by the government, Ali, on his way to work in the Tehran Bazaar, suffered from poisoning due to inhaling gas used by government forces to suppress protesters. He had told his relatives that the gas he inhaled was not tear gas but green gas. Ali lost his life the next morning.

  The cause of Ali's death was recorded as repeated poisoning by medication and food on the legal medical certificate.

  Security forces pressured Ali's family to declare his death as a suicide. They told the Ashgbar family that Ali's death was accidental, and they should not pursue it or file a complaint.

  Government forces have vandalized Ali's grave several times and defaced his photo.

  There is a video of Ali in the public domain where he is sitting on a motorcycle and says, "I'm recording a video for tomorrow, just like Hamidreza Rouhi..."

