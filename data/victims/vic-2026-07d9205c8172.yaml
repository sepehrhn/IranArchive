description: |-
  •
  جاویدنام: احد ابراهیمی پورعبدلی،
  ۳۵ ساله، اهل روستای «حسن گاویار میربگ»، نورآباد دلفان، استان لرستان؛
  جاودانه شد: ۱۱ دی‌ماه ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی، احد روز پنجشنبه ۱۱ دی‌ماه در میدان بعثت نورآباد هدف اصابت گلوله نیروهای سرکوب بسیج قرار گرفت.

  او قصد داشت مانع شلیک یک بسیجی سرکوبگر به سایر معترضان شود؛ به همین دلیل او را از پشت گرفت و خودش هدف اصابت سه گلوله از فاصله نزدیک قرار گرفت که یکی از آن‌ها به قفسه سینه‌اش اصابت کرد.

  نیروهای امنیتی احد را به بیمارستان منتقل کردند، اما نه تنها مانع جراحی او توسط پزشک (دکتر شیرخانی) شدند، بلکه حتی اجازه ندادند کادر درمان جلوی خونریزی را بگیرد.

  برای تحویل پیکر احد، نیروهای امنیتی به همراه امام جمعه شهر و بازجو-خبرنگار به خانه والدین او رفتند و آن‌ها را وادار به اعتراف اجباری کردند. از آن‌ها خواسته شد اعلام کنند احد «بسیجی شهید» بوده و «نیروی منافق» او را کشته است.

  سپس ساعت ۱۱ صبح روز یکشنبه ۱۴ دی‌ماه پیکر احد را به آرامستان «بهشت زهرا» نورآباد بردند و از خانواده خواستند برای خاکسپاری به آنجا مراجعه کنند.

  احد هنرمند بود. گچ‌بری و گچ‌کاری حرفه‌اش بود، اما به دلیل نبود کار در یک قصابی مشغول به کار بود.

