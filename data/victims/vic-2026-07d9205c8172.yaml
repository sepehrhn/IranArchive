  Ahad Ebrahimi Pourabdoli,
  35 years old, from Hasan Gaviar Mirbag village, Nurabad Delfan, Lorestan Province;
  Killed on: 1 January 2026

  During the National Revolution against the Islamic Republic, Ahad was shot on Thursday, 1 January in Besat Square in Nurabad by Basij suppression forces.

  He attempted to prevent a Basij attacker from shooting other protesters and, in doing so, grabbed him from behind. He was then hit by three bullets fired at close range, one of which struck his chest.

  Security forces transferred Ahad to the hospital, but not only did they prevent his surgery by Dr. Shirkhani, they also did not allow the medical staff to stop his bleeding.

  For the handover of Ahad's body, security forces, accompanied by the city’s Friday prayer leader and an interrogator-journalist, went to his parents’ home and forced them into coerced statements.

