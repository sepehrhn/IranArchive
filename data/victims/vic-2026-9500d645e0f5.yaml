description: |-
  •
  جاویدنام: امیرحسین پرنیان (میرکازهی ریگی)،
  ۱۹ ساله و اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  امیرحسین حوالی ساعت ۱۹:۳۰ در ضلع شرقی مسجد مکی مورد اصابت گلوله تک‌تیرانداز سپاه قرار گرفت. گلوله به چشم او اصابت کرد و از پشتش خارج شد.
  او توسط ماشین یکی از حاضران در محل به بیمارستان منتقل شد. در مسیر بیمارستان و در خیابان خیام ماشین راننده حامل امیرحسین را به گلوله بستند. راننده زخمی شد اما توانست امیرحسین را به بیمارستان برساند. نیم‌ساعت بعد اطلاع دادند که امیرحسین جان سپرده است.
  امیرحسین تازه در رشته تجربی دیپلم گرفته بود.

