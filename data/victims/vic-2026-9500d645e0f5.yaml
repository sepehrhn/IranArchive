  Amir Hossein Parnian (Mir Kazahi Rigi),
  19 Years old from Hamedan;
  Was killed on Sep 30, 2022.

  Amir Hossein was graduated from natural science institute newly. It was at eastern area of Maki mosque around 19:30 that Amir Hossein was shot by IRI regime armed forces. One of witnesses decided to take him to a hospital by his car but regime armed forced opens fire on his car as well. Though the driver was injured but he could take Amir Hossein to the hospital. Unfortunately Amir Hossein lost his life after he reached the hospital.

