  Hamidreza Karimi,
  37 years old, from Firuzabad, Fars Province;
  He was killed on 18th September 2023.

  On the anniversary of the Iranians’ national uprising against the Islamic Republic government, Hamidreza invited truck drivers to join nationwide strikes through videos. Security forces, after identifying him, raided his hideout on September 17. Despite being hit by three bullets in a confrontation with law enforcement, Hamidreza managed to escape on a motorcycle. However, the next day, around noon, authorities raided his hiding place again in Farashband county, shot him with military-grade bullets, and killed him.

  Security forces abducted Hamidreza’s body and clandestinely buried him in a cemetery 150 kilometers away from his residence. They even denied his family the permission to hold mourning ceremonies.

