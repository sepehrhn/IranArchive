  جاویدنام: حمیدرضا کریمی،
  ۳۷ ساله، اهل فیروزآباد، استان فارس؛
  جاودانه شد: ۲۷ شهریور ۱۴۰۲.

  در سالگرد خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی حمیدرضا با انتشار ویدیوهایی رانندگان کامیون را دعوت به
  پیوستن به اعتصابات سراسری می‌کرد. نیروهای امنیتی پس از شناسایی او روز ۲۶ شهریور به محل اختفای او یورش بردند. حمیدرضا که در پی درگیری با نیروهای انتظامی مورد اصابت سه گلوله قرار گرفته بود توانست با موتور از محل درگیری بگریزد. روز بعد اما ماموران حوالی ساعت دوازده در شهرستان فراشبند دوباره به محل اختفای او یورش بردند و با گلوله جنگی به او شکلیک کرده و او را کشتند.
  نیروهای امنیتی پیکر حمیدرضا را ربودند و مخفیانه در آرامستانی با فاصله ۱۵۰ کیلومتر دورتر از محل سکونت او به خاک سپردند. آنها حتی به خانواده حمیدرضا اجازه برگزاری مراسم سوگواری ندادند.

