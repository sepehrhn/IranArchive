description: |-
  میثم فتحی‌زاده ۱۶ دی ماه توسط نیروهای امنیتی از محل کار خود ربوده شده و طی چهل روز گذشته با وجود بیماری اعصاب و دیسک کمر و گردن، بدون دسترسی به پزشک و وکیل در بازداشت باقی مانده است. او   سابقه دستگیری در سال ۱۴۰۱ و ۱۴ دی ماه ۱۴۰۴ را نیز دارد. کلیه اموال و مدارک شخصی او توسط دادستانی ضبط شده  است. صدای او و خانواده‌ی منتظرش باشیم.

