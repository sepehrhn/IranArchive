description: |-
  محمدرضا اکبری ۲۴ سال دارد و ساکن بیرجند است. او در تاریخ ۲۲ دی در خانه‌ی پدری خود توسط نیروهای امنیتی بازداشت و به زندان مرکزی بیرجند منتقل شده‌. مادر محمدرضا  پنج روز پس از بازداشت او دچار سکته قلبی شده. او به دلیل فشار شدید برای همکاری و پذیرش اتهام‌ها،  اقدام به اعتصاب غذا کرده است. صدایش باشیم.

