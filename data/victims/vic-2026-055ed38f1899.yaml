  Mahdis Hosseini (Mohadeseh Janberari)
  17 years old, from Amol, Mazandaran;
  She was killed on 2th November 2022.

  Mahdis, also known as Mohadeseh, was shot and injured by government forces during the nationwide protests following the murder of Mahsa Amini on the 30th of Shahrivar in Amol.
  After receiving continuous medical treatment under the supervision of Sepah's intelligence forces, Mahdis was threatened and summoned by phone. She was in such a state of fear and anxiety that she wouldn't even go to the bathroom alone. As a result, her mother took a few days off from work to be with her.

  On the evening of the 11th of Aban, when Mahdis' mother returned from work, she found her lying down with blood coming out of her nose and her mouth covered in blood.

  The government's intelligence forces immediately forced Mahdis' mother to say that her daughter had taken pills and committed suicide due to a disagreement with her ex-boyfriend. However, she had previously stated that someone had come to the house in her absence and killed her daughter.

