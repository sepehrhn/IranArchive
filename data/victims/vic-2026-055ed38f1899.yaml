description: |-
  ⭕️
  جاویدنام: مهدیس حسینی (محدثه جان‌براری)،
  ۱۷ ساله و اهل آمل، مازندران؛
  جاودانه شد: ۱۱ آبان ۱۴۰۱.

  مهدیس در جریان اعتراضات سراسری به قتل حکومتی #مهسا_امینی؛ روز ۳۰ شهریور در آمل مورد اصابت گلوله نیروهای حکومتی قرار گرفت و مجروح شد.
  پس از مداوا مداوم تحت نظر نیروهای اطلاعات سپاه بود و تلفنی تهدید و احضار می‌شد. مهسا چنان دچار ترس و اضطرابِ شرایط شده بود که به تنهایی حمام هم نمی‌رفت. به همین خاطر مادرش چند روز مرخصی گرفت تا کنارش باشد.
  شامگاه یازدهم آبان ماه وقتی مادر مهدیس از کار برگشت او را در حالی یافت که دراز کشیده بود و خون از بینی‌‌اش آمده بود و کف از دهانش.
  نیروهای اطلاعات حکومت بلافاصله مادر مهدیس را وادار کردند که بگوید دخترش به دلیل اختلاف با دوست‌پسر سابقش قرص خورده و خودکشی کرده است. در حالی پیشتر گفته بود در نبود او کسی به خانه آمده و دخترش را کشته است.

  *چنانچه اطلاعات بیشتری دارید  لطفا با ما در میان بگذارید!

