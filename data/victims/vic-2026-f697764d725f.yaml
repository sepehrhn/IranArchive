description: |-
  علی چهاربند ۳۳ ساله و ساکن شهرستان چناران در استان خراسان رضوی در تاریخ ۲ اسفندماه با هجوم مأموران به منزلش در مقابل چشمان پسر ۵ ساله‌اش با خشونت بازداشت شده است. علی در حال حاضر در زندان وکیل‌ آباد در بلاتکلیفی به سر می‌برد و گفته می‌شود برایش حکم سنگینی در نظر گرفته‌اند. خانواده و به خصوص پسر کوچکش نگرانی و اضطراب زیادی در مورد او دارند. صدایش باشیم.

