description: |-
  •
  جاویدنام: یاسر عزتی،
  ۳۳ ساله، اهل همدان، ساکن شهرک اندیشه، تهران
  جاودانه شد: ۱۹ دی ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ یاسر شامگاه جمعه ۱۹ دی ماه در فاز سه اندیشه هدف اصابت گلوله نیروهای سرکوب حکومت قرار گرفت.گلوله اول از پشت به او اصابت کرد و سپس تیر خلاص از نزدیک به سینه‌اش شلیک شد.
  خانواده عزتی  پیکر فرزندشان را در کهریزک و از میان انبوهی از پیکرهای کشته‌شدگان پیدا کردند.
  یاسر سالها در اندیشه صاحب یک کیترینگ بود اما سال گذشته به دلیل فشارهای اقتصادی آن را جمع کرد و یک سوپرمارکت کوچک باز کرد. او مجرد بود.

