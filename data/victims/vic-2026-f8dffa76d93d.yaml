  Yaser Ezzati,
  33 years old, from Hamedan; resident of Andisheh Township, Tehran;
  Killed on: 9 January 2026

  During the National Revolution against the Islamic Republic, Yaser was shot by government suppressive forces on the evening of Friday, 9 January 2026, in Phase Three of Andisheh. The first bullet struck him from behind, followed by a close-range execution shot to his chest.

  The Ezzati family later found Yaser’s body in Kahrizak, among a large number of victims’ bodies.

  Yaser had run a catering business in Andisheh for many years, but due to economic pressures he closed it the previous year and opened a small grocery store. He was single.

