  Behzad Azizi,
  19 years old, from the village of Dargah-e Sheykhan, Baneh, Kurdistan;
  He was killed on 22th March 2023.

  Behzad was a driver. On Thursday, March 22, after transporting some cross-border couriers to the "Kileh" border areas, on his way back to his place of residence along the Baneh-Bouin route, at the "Karimabad" checkpoint, which had been set up recently after the start of nationwide protests, he was shot at from a few meters away by Sepah forces (#IRGC). A bullet struck Behzad in the head, and he tragically lost his life.

  After transferring Behzad's body to the forensic medicine in Baneh, security forces forced his family to bury their son's remains in the cemetery of his hometown.

