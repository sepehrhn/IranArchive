description: |-
  •
  جاویدنام: بهزاد عزیزی،
  ۱۹ ساله، اهل روستای درگاه شیخان، بانه، کردستان؛
  جاودانه شد: دوم فروردین ۱۴۰۲.

  بهزاد راننده بود. او روز چهارشنبه دوم فروردین بعد از رساندن تعدادی از کولبران به مناطق مرزی «کیله»؛ در هنگام بازگشت به محل سکونت خود در مسیر بانه-بویین، در ایست بازرسی «کریم‌آباد» که به تازگی و پس از آغاز اعتراضات سراسری دایر شده، از فاصله چند متری هدف تیراندازی نیروهای سپاه قرار گرفت. گلوله به سر بهزاد اصابت کرد و او در دم جان باخت.

  پس از انتقال پیکر بهزاد به پزشکی قانونی بانه، نیروهای امنیتی خانواده او را مجبور کردند شبانه پیکر فرزندشان را در  آرامستان روستای زادگاهش به خاک بسپارند.

