  Ali Baniasad,
  20 Years old form Nehzat Abad, Ahvaz;
  was killed on Oct 19, 2022.

  Ali was an Arab young from Ahvaz who was killed on Oct 18 or 19. He was on a picnic along with his friends somewhere around Hooral-Azim where he was arrested due to suspicion of carrying gun.
  During the time Ali was arrested his kidneys got problem in functioning. Lack of medical aids and caring made his body swelled. He was carried to the hospital when it was too late and host his life in Golestan hospital of Ahvaz.
  On Oct 19, someone who introduced himself as Islamic revolutionary court agent called Ali’s family regarding his death and instructed them to get Ali’s dead body.

