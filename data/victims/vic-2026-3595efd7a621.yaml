description: |-
  •
  جاویدنام: علی بنی‌اسد،
  ۲۰ ساله و اهل نهضت‌آباد اهواز؛
  جاودانه شد: ۲۷ مهر ۱۴۰۱.

  علی بنی‌اسد جوان ۲۰ ساله عرب اهوازی احتمالا روز ۱۹ یا ۲۰ مهر در حالی که با دوستانش برای پیک‌نیک به هورالعظیم رفته بود؛ به ظن داشتن سلاح بازداشت شد.
  کلیه‌های علی زیر بازداشت دچار مشکل شد و به دلیل عدم رسیدگی و اعزام به بیمارستان بدنش ورم کرد و شرایطش وخیم شد. او در بیمارستان «گلستان» اهواز درگذشت.
  روز ۲۷ مهر کسی که در تماس تلفنی خود را منتسب به دادگاه انقلاب معرفی کرده بود به خانواده بنی‌اسد گفت که فرزندشان جانش را از دست داده و آنها باید برای دریافت پیکر او مراجعه کنند.

