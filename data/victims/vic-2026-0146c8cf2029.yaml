  Mohammad Ahmadi Gagosh,
  43 years old, from Mahabad, West Azarbaijan;
  He was killed on November 18, 2022.

  During the nationwide anti-government protests in Mahabad, Mohammad was hit by a bullet to his head on the rooftop of his house and was killed.

  Mohammad's family buried his body themselves in Mahabad cemetery to prevent it from falling into the hands of security forces.
  Mohammad's funeral turned into a scene of confrontation between angry mourners and government crackdown forces, leading to the people setting fire to the Ansar Basij base affiliated with the Revolutionary Guard in Mahabad.

