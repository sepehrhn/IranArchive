description: |-
  •
  جاویدنام: محمد احمدی گاگش،
  ۴۳ ساله و اهل مهاباد، آذربایجان غربی؛
  جاودانه شد: ۲۷ آبان ۱۴۰۱.

  محمد در جریان اعتراضات سراسری ضد حکومتی در مهاباد؛ روی پشت بام خانه‌اش مورد اصابت گلوله به سرش قرار گرفت و کشته شد.
  خانواده محمد همان رو پیکر او را در آرامستان مهاباد به خاک سپردند تا به دست نیروهای امنیتی نیفتد.
  مراسم خاکسپاری محمد تبدیل به صحنه درگیری میان مردم سوگوار خشمگین و ماموران سرکوب حکومت شد و مردم پایگاه بسیج انصار وابسته به سپاه در مهاباد را به آتش کشیدند.

