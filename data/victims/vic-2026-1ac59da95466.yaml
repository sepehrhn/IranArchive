  Nematollah Barahui,
  32 years old, from Zahedan;
  He was killed on 30th September 2022.

  Nematollah, during the extensive gathering of Zahedan's people on 30th September, known as #BloodyFridayZahedan, was tragically shot by three bullets from Revolutionary Guards. (#IRGC). He was hit in the chest and back and lost his life.

  Nematollah was a shopkeeper. He was single, and his family had plans for his engagement.

