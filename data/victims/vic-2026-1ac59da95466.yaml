  نعمت‌الله در تجمع گسترده مردم زاهدان، روز ۸ مهر موسوم به #جمعه_خونین_زاهدان در چهارراه بعثت و کوثر مورد اصابت سه گلوله نظامیان سپاه به دست، سینه و کمر قرار گرفت و کشته شد.
  نعمت‌الله مغازه‌دار بود. او مجرد بود و خانواده‌اش می‌خواستند برایش به خواستگاری بروند.

