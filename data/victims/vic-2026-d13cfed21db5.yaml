description: |-
  &rlm;جاویدنام #فرزین_پوست‌آشکن دورکی، آرایشگر ۲۶ ساله و اهل چهارمحال و بختیاری، ۱۸ دی ۱۴۰۴ در اصفهان با شلیک ماموران خامنه‌ای کشته شد. نکته وحشتناک اینکه سرکوبگران چند روز بعد از قتل، پیکر بی‌جان فرزین را با گوش‌های بریده، به‌دلیل داشتن پرسینگ، به خانواده‌اش تحویل دادند. صدرحمت به داعش و طالبان…
  #جاویدنام

