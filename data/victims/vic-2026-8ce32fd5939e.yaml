  Esmaeil Jarizahi (Rigi),
  20 years old, from Zahedan,
  He was Killed on 10 November 2022.

  Esmaeil, along with his friend “#OmidAladeh”, was riding a motorcycle around 2:00 PM near the entrance of Zahedan on November 10th, when government security forces opened fire on them without warning, killing them both.

