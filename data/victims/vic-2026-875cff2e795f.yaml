description: "•\nجاویدنام: حمیدرضا صیادی،\n۳۹ ساله، ساکن فردیس کرج؛\nجاودانه شد: ۶ آذر ۱۴۰۱.\n\nحمیدرضا در اعتراضات سراسری ضد حکومتی در فردیس کرج حضور فعال داشت. او علیرغم اینکه روز سوم آذر  با اصابت ضربات باتوم نیروهای امنیتی در اعتراضات مجروح شد، روز پنجم آذر باز هم در اعتراضات شرکت کرد. روز ششم آذر حمیدرضا طبق روال معمول به مغازه‌اش رفت. او در مغازه‌اش کار فنی و تاسیساتی می‌کرد. حوالی ظهر همسایه‌ها متوجه می‌شوند کرکره مغازه حمیدرضا تا نیمه بالاست. آنها که نگران او شده بودند داخل مغازه‌اش می‌شوند و می‌بینند پیکر حمیدرضا وسط مغازه‌اش افتاده است. وقتی او را به بیمارستان می‌رسانند کادر درمان اعلام می‌کنند که او جان باخته است.\nپس از اعلام جان باختن حمیدرضا، خانواده او درخواست اهدای عضو می‌کنند. در بررسی پزشکی اعلام می‌کنند تنها چشمان حمیدرضا زنده و قابل اهدا هستند که با رضایت همسر او «آیرین بهرامی» اهدا می‌شوند.\nدر گواهی فوت حمیدرضا علت مرگ او اعلام نشده است. خانواده صیادی بر این باورند که حمیدرضا بر اثر ضرب و شتم توسط نیروهای امنیتی دچار خونریزی داخلی شده است اما به دلیل اینکه نگران بوده است بازداشت شود به بیمارستان مراجعه نکرده است.\nحمیدرضا متاهل و داری پسری خردسال بود.\nپیکر او در آرامستان «بهشت سکینه» کرج به خاک سپرده شد.\n\n#حمید_رضا_صیادی\n#حمیدرضا_صیادی\n#انقلاب_ملی_ایران_۱۴۰۱\n#انقلاب_ملی_ایران\n#کرج #فردیس\n#مهسا_امینی\n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nHamidreza Sayyadi,\n39 years old, residing in Fardis, Karaj,\nIm\nHe was killed on 27th November 2022.\n\_\nHamidreza actively participated in the nationwide anti-government protests in Fardis, Karaj. Despite being injured by security forces during the protests on the 24rd of November, he joined the protests again on the 26th of November. \nOn the 27th of November, Hamidreza followed his usual routine and went to his shop. He worked in technical and installation services in his shop. Around noon, neighbors noticed that the shop's shutter was halfway up. Concerned for his well-being, they entered his shop and found Hamidreza's lifeless body in the middle of the shop. When they rushed him to the hospital, medical staff announced that he had passed away.\n\_\n👇👇👇\nContinue in the comments \n\_\n\n\_\n#HamidrezaSayyadi\n#IranRevolution2022 \n#IranRevolution \n#Karaj #Fardis\n#MahsaAmini"
