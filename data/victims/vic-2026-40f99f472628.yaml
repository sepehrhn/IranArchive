description: "⁨\t•\nجاویدنام: ساسان آزادور،\n۲۲ ساله، اهل و ساکن اصفهان؛\nجاودانه شد: ۱۰ اردیبهشت ۱۴۰۵\n\nدر جریان خیزش ملی علیه حکومت جمهوری اسلامی، ساسان شامگاه جمعه ۱۹ دی‌ماه در اصفهان توسط نیروهای امنیتی بازداشت شد.\n\nاو توسط شعبه یک دادگاه انقلاب اصفهان به ریاست قاضی #مرتضی_براتی با اتهامات «همکاری با دشمن، تخریب اموال و تشویق به اعتراض» به اعدام محکوم شد. یکی از مصادیق این اتهامات این بود که او «قصد داشته» خودروی پلیس را آتش بزند.\n\nساسان پس از بازداشت، تحت شکنجه‌های شدید جسمی و روانی علیه خود اعتراف کرد و قاضی تنها با استناد به این اعترافات برای او حکم اعدام صادر کرد؛ حکمی که علیرغم وجود ابهامات حقوقی فراوان، توسط دیوان عالی کشور نیز تأیید شد و روز ۳۱ فروردین به خانواده آزادور ابلاغ شد.\n\nدیدار آخر خانواده ساسان با او روز یکشنبه ۶ اردیبهشت بود.\n\nساسان روز پنجشنبه ۱۰ اردیبهشت ۱۴۰۵، پس از اذان صبح، در زندان دستگرد اصفهان اعدام شد.\n\nساسان کاراته‌کا بود و در این رشته مقام‌های استانی داشت.\nاو در یکی از استوری‌های اینستاگرامش نوشته بود:\n«و هزاران امید میان استخوان‌هایم آواز می‌خواند.»\n\n#ساسان_آزادور\n#ساسان_آزادور_جونقانی \n#مرتضی_براتی\n#انقلاب_ملی_ایران_۱۴۰۴\n#انقلاب_شیر_و_خورشید\n#اصفهان #زندان_دستگرد\n#اعدام \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nSasan Azadvar,\n22 years old, from and living in Isfahan;\nKilled on: April 30, 2026\n\nDuring the National Revolution against the Islamic Republic, Sasan was arrested by security forces on the evening of Friday, January 9, in Isfahan.\n\nHe was sentenced to death by Branch 1 of the Revolutionary Court of Isfahan, presided over by Judge Morteza Barati, on charges of “cooperation with the enemy,” “destruction of property,” and “encouraging protests.” One of the cited accusations was that he had “intended” to set a police vehicle on fire.\n\nAfter his arrest, Sasan was subjected to severe physical and psychological torture and was forced to confess against himself. The judge issued the death sentence solely based on these confessions. Despite serious legal ambiguities, the sentence was upheld by the Supreme Court and was officially communicated to his family on April 20.\n\nHis family’s last visit with him took place on Sunday, April 26.\n\nSasan was executed at dawn on Thursday, April 30, 2026, in Dastgerd Prison in Isfahan.\n\nContinue in the Comments\n👇👇👇⁩"
