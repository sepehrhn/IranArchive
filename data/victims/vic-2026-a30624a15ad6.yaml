  Ardalan Ghasemi,
  44 years old from Gilangharb, Kermanshah;
  was killed on 10 November 2022.

  Ardalan and his friend were shot by government mercenaries while writing slogans against the government in Taghestan Boulevard, Kermanshah. Two bullets hit him in the stomach and one in the shoulder.
  Both were transferred to Taleghani Hospital in Kermanshah. Ardalan Ghasemi passed away after a few hours due to heavy bleeding without undergoing surgery.
  His body was handed over to his family for 16 million Tomans and on the condition of not informing people. The security agents forced his family to sign a contract that included "Ardalan Ghasemi was shot by police officers while carrying weapons for rioters."
  Ardalan Ghasemi worked in a passenger cooperative company.

