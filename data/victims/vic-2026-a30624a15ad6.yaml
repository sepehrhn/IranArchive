description: |-
  •
  جاویدنام اردلان قاسمی،
  ۴۴ ساله اهل گیلانغرب کرمانشاه؛
  جاودانه شد: ۱۹ آبان ۱۴۰۱

  اردلان و دوستش در حین شعارنویسی علیه حکومت در بلوار طاقستان کرمانشاه از سوی نظامیان حکومتی به رگبار گلوله بسته شدند. دو گلوله به شکم و یکی به کتف اردلان اصابت کرد. او و دوستش را به بیمارستان طالقانی کرمانشاه منتقل کردند. اردلان بعد از چند ساعت بدون اینکه مورد جراحی قرار بگیرد بر اثر شدت خونریزی جان سپرد.
  پیکر او را در ازای ۱۶ میلیون تومان و به شرط عدم خبررسانی به خانواده‌اش تحویل دادند. ماموران امنیتی خانواده او را وادار به امضای متنی کردند که در آن نوشته شده بود«اردلان قاسمی در حین حمل اسلحه‌ برای اغتشاش‌گران هدف تیراندازی ماموران انتظامی قرار گرفت»
  پیکر اردلان روز شنبه ۲۱ آبان ماه تحت تدابیر شدید امنیتی به شهرستان گیلان غرب، شهر زادگاه او انتقال یافت و در آرامستان «طاقیل» این شهر به خاک سپرده شد.

  اردلان قاسمی در یک شرکت تعاونی مسافربری به کار اشتغال داشت.

