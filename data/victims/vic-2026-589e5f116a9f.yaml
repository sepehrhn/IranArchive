description: |-
  •
  جاویدنام: حمید گلی،
  ۴۶ ساله و اهل سنندج؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  حمید در جریان اعتراضات سراسری در تهران بر اثر اصابت ضربات باتوم به کما رفت. او چند روز در یکی از بیمارستان‌های تجربش بستری بود اما به دلیل شدت جراحات جان باخت.
  از زمان و محل دقیق کشته شدن حمید اطلاعی در دست نیست اما در برگه فوت او تاریخ فوت پنجم آبان ذکر شده است.
  علت مرگ حمید در برگه فوت خونریزی مغزی و شکستگی جمجمه در اثر اصابت جسم سخت نوشته شده است.
  قرار بود پیکر حمید روز دوشنبه ۲۳ آبان در آرامستان «بهشت محمدی» سنندج به خاک سپرده شود اما با فشار نهادهای امنیتی ساعت ۳:۳۰ صبح با حضور تعداد اندکی از خانواده و بستگان او برگزار شد.

