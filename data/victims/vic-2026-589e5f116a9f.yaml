  Hamid Goli
  46 years old, from Sanandaj
  He was killed on 27 October 2022.

  Hamid fell into a coma due to being hit by baton strikes during the nationwide protests in Tehran. He was hospitalized for several days in one of the medical centers in “Tajrish”, but unfortunately succumbed to his injuries due to their severity.

  The exact time and place of Hamid's death are unknown, but his death certificate indicates the date of the 27th October. The cause of his death, as stated in the death certificate, was cerebral hemorrhage and skull fracture due to a severe blow.

  It was planned to bury Hamid's body on Tuesday, 23 Aban, in the "Behesht-e-Mohammadi" cemetery in Sanandaj. However, under pressure from security forces, the burial took place at 3:30 AM with the presence of a few family members and relatives.

