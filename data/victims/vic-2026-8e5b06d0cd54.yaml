  Mohammad Ghaemifar,
  18 years old, from Dezful, Khuzestan;
  He was killed on 6th November 2022.

  During the nationwide anti-government protests on 22st October in Dezful, Mohammad was hit by a bullet and severely injured. He spent fifteen days in the ICU of a hospital. Government intelligence agents had warned his family not to publicize the situation if they wanted help for their son's treatment.

  Mohammad passed away on the 6th of November. His body was buried secretly and early in the morning on the 7th of November in the "Behesht Ali" Cemetery in Dezful.
  Security forces pressured Mohammad's family to declare that their son was a Basiji member and had died in a car accident.
  The 40th-day memorial ceremony for Mohammad was held on the 8th of November , with a widespread presence of people chanting anti-government slogans.

  Mohammad Ghaemifar was a goalkeeper for the "Amin" football team in Dezful. He aspired to become the goalkeeper for the "Esteghlal" team.

  Mohammad supported his family financially by working at a fruit shop.

