description: |-
  ⭕️
  جاویدنام: محمد قائمی‌فر،
  ۱۸ ساله و اهل دزفول، خوزستان؛
  جاودانه شد: ۱۵ آبان.

  محمد در جریان اعتراضات سراسری ضد حکومتی روز ۳۰ مهر در دزفول مورد اصابت گلوله قرار گرفت و به شدت مجروح شد. او پانزده روز در آی‌سی‌یو بیمارستان بستری بود. ماموران اطلاعات حکومت به خانواده‌اش گفته بودند اگر می‌خواهید برای درمان فرزندتان کاری کنیم اطلاع‌رسانی نکنید.
  محمد روز پانزده آبان جان سپرد. پیکر او ۱۶ آبان، ساعت پنج صبح و مخفیانه در آرامستان «بهشت علی» دزفول به خاک سپرده شد.
  نیروهای امنیتی خانواده قائمی‌فر را تحت فشار گذاشتند که بگویند فرزندشان بسیجی بوده و در حادثه تصادف جان باخته است.
  مراسم چهلم محمد ۱۷ آذر با حضور گسترده مردمی که شعارهای ضد حکومتی می‌دادند برگزار شد.
  محمد قائمی‌فر دروازه‌بان تیم فوتبال «امین» دزفول بود. او آرزو داشت دروازه‌بان تیم استقلال بشود.
  محمد با کار در میوه‌فروشی کمک خرج خانواده‌اش بود.

