  Taher Azizi,
  30 years old, from Piranshahr, West Azerbaijan;
  He was Killed on 20 November 2022.

  Taher lost his life on the evening of Monday, 29th Aban, during the nationwide anti-government protests, as a result of gunfire by Sepah's military forces. Accompanied by grieving protesters, Taher's family laid him to rest, chanting the heroic anthem:
  "Oh fearless and brave Kurdish sons and daughters,
  Rise up and rebel like lions!".
  Taher's 40th-day memorial ceremony was held on the ninth day of Dey in Piranshahr.
  Taher Azizi was married and had a six-year-old son.

