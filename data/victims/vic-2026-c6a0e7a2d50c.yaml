description: |-
  •
  جاویدنام: طاهر عزیزی،
  ۳۰ ساله و اهل پیرانشهر، آذربایجان غربی؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  طاهر شامگاه یکشنبه ۲۹ آبان در جریان اعتراضات سراسری ضد حکومتی بر اثر شلیک نظامیان سپاه جان باخت.
  خانواده طاهر با همراهی سوگواران معترض شبانه پیکر او را با سرود حماسی:
  « پسر و دختر کرد نترس و دلیر
  بلند شو قیام کن همچو شیر! » به خاک سپردند.
  مراسم چهلم طاهر روز نهم دی در پیرانشهر برگزار شد.
  طاهر عزیزی متاهل و دارای یک پسر شش ساله بود.

