  Pouya Rajabnia,
  24 Years old from Babol, Mazandaran,
  was killed on Oct 01.

  Pouya was living in taxi driving Littoral Boulevard of Babol. There is no further details about who he died but being directly shot by IRI regime suppressor during the protest.
  Intelligence services of IRI did not permit his family to arrange any type of funeral ceremony for their son and Pouya was buried in ignorance and silence.

  *In case you have more information about Poya, kindly share it with us.

