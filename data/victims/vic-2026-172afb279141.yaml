  Abdolvahid Tohidnia, son of Abdolrahim,
  18 years old, from Zahedan, Sistan and Baluchestan;
  He was killed on 30th September 2022.

  Abdolvahid lost his life on #BloodyFridayZahedan during the nationwide anti-government protests in Zahedan when he was shot in the chest inside the Maki Mosque.

