  Alireza Hosseininejad,
  27 years old, residing in Tehran;
  He was killed on 9th December 2022.

  Amidst the national uprising of Iranians against the Islamic Republic following the killing of #MahsaAmini, Alireza went out on December 7 to participate in the protests and never returned home.
  After extensive inquiries, Alireza’s lifeless body was found in the #Kahrizak morgue two days later by his family.
  Security forces informed Alireza’s family that he had lost his life in a car accident, despite no reports or evidence of Alireza being hospitalized or involved in an accident. The cause of death was stated as „impact of a hard object to the head“ in the forensic medical certificate.
  On December 10, Alireza’s body was laid to rest in „Behesht Zahra“ Cemetery in Tehran, with the presence of security forces who prevented his family from seeing his body.

