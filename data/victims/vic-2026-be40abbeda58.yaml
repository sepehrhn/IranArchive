  جاویدنام: علیرضا حسینی‌نژاد،
  ۲۷ ساله، ساکن تهران؛
  جاودانه شد: ۱۸ آذر ۱۴۰۱.

  در جریان خیزش ملی ایرانیان علیه حکومت به دنبال کشته شدن #مهسا_امینی ، علیرضا روز ۱۶ آذر برای شرکت در تظاهرات از خانه خارج شد و دیگر به خانه بازنگشت.
  خانواده علیرضا پس از پیگیری‌های فراوان دو روز بعد پیکر بی‌جان علیرضا را در سردخانه کهریزک یافتند.
  نیروهای امنیتی به خانواده علیرضا گفتند که او بر اثر سانحه تصادف جان باخته است؛ در حالیکه هیچ گزارش یا شواهدی مبنی بر تصادف یا بستری شدن علیرضا در بیمارستان وجود نداشت. در گواهی پزشکی قانونی علت مرگ «اصابت جسم سخت به سر» ذکر شد.
  پیکر علیرضا روز ۱۹ آذر با حضور نیروهای امنیتی که مانع شدند خانواده او پیکرش را ببینند در آرامستان «بهشت زهرا» تهران به خاک سپرده شد.

