  Saman Ghaderpour
  37 years old, from Oshnaviehe (Sheno), West Azarbaijan
  He was killed on 29 October 2022.

  Saman, who was detained during the nationwide anti-government protests in Tehran, lost his life on 29th November under the torture of the interrogators. Security institutions requested Saman's family to come to Tehran on Monday, 31th October, for the identification of his body. Saman's uncle identified his body at Behesht Zahra morgue, where visible signs of injuries and bruising were present on his face. Government intelligence forces told Saman's uncle that he had died due to a cardiac arrest. After coordinating with the Ashnaviyeh Intelligence Office, they delivered Saman's body, wrapped in a shroud, to his family on Wednesday.

  Saman's burial ceremony took place in Ashnaviyeh Cemetery, while they didn't even allow his mother to see the face of her deceased son.

