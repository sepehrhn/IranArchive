  جاویدنام: سامان قادرپور،
  ۳۷ ساله و اهل اشنویه (شنو)، آذربایجان غربی؛
  جاودانه شد: ۷ آبان ۱۴۰۱.

  سامان که در جریان اعتراضات سراسری ضد حکومتی در تهران بازداشت شده بود؛ روز هفتم آبان ماه زیر شکنجه بازجویان حکومت جان باخت.
  نهادهای امنیتی روز دوشنبه نهم آبان ماه طی تماسی تلفنی از خانواده قادرپور خواستند که برای شناسایی پیکر سامان به تهران بروند. عموی سامان پیکر او را در حالی که آثار زخم و کبودی روی صورتش مشهود بود در سردخانه بهشت زهرا شناسایی کرد. نیروهای اطلاعات حکومت به عموی سامان گفتند که او در اثر ایست قلبی جان سپرده است. آنها بعد از هماهنگی با اداره آگاهی اشنویه پیکر کفن‌پوش شده سامان را روز سه شنبه به خانواده‌اش تحویل دادند.
  مراسم خاکسپاری سامان در آرامستان اشنویه در حالی برگزار شد که حتی به مادر او اجازه ندادند صورت فرزند جان‌باخته‌اش را ببیند.

