  جاویدنام: غزاله قاسمی،
  ۲۶ ساله، ساکن تهران؛
  جاودانه شد: ۹ مهر ۱۴۰۱.

  غزاله در جریان اعتراضات سراسری ضد حکومتی روز ۹ مهر در تهران با اصابت ضربات باتوم نیروهای امنیتی به سرش کشته شد.
  پیکر او در آرامستان «بهشت زهرا» تهران به خاک سپرده شد.
  غزاله کارشناس زیست‌شناسی بود و در یک کلینیک حیوانات کار می‌کرد. او هنرمند و تاتو آرتیست بود.

