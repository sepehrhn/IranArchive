  Ghazaleh Ghasemi,
  26 years old, residing in Tehran;
  She was killed on 1th October 2022.

  Ghazaleh lost her life on October 1st during the nationwide anti-government protests in Tehran when she was struck by baton blows from security forces.
  Her body was laid to rest in „Behesht-e Zahra“Cemetery, Tehran.

  Ghazaleh was a biology expert and worked at an animal clinic. She was also an artist and a tattoo artist.

