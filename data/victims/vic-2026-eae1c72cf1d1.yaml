description: "⁨\t•\nجاویدنام: یسنا(فروغ) اسکندری،\n۴۴ ساله، ساکن تهران؛\nجاودانه شد: ۱۸ دی‌ماه ۱۴۰۴\n\nدر جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ یسنا شامگاه پنجشنبه ۱۸ دی‌ماه در خیابان کاشانی تهران هدف اصابت گلوله نیروهای سرکوب از پشت به کمرش قرار گرفت.\n\nخواهر یسنا ساعت ۲۱:۳۰ شامگاه پنجشنبه با او تماس گرفت. او در پاسخ با خوشحالی گفت که در خیابان کاشانی است و جمعیت زیادی برای تظاهرات آمده‌اند. حدود ساعت ۱۰ شب تماس‌ها قطع شد. حکومت چراغ‌های خیابان را خاموش و اینترنت را قطع کرد و معترضان را به رگبار گلوله بست.\n\nخانواده یسنا چند روز به‌دنبال او گشتند تا سرانجام روز دوشنبه ۲۲ دی‌ماه که چهره‌ او را در مانیتور کهریزک شناسایی کردند. پیکر یسنا را که دیدند «مژه‌هایش یخ زده بود، چشمانش باز بود، لبخندی روی لبش نشسته بود و روی کمرش رد اصابت گلوله دیده می‌شد.»\n\nمادر یسنا بیمارستان‌های اطراف را جست‌وجو کرد و کوله‌پشتی او را در بیمارستان «سینا» خیابان کاشانی پیدا کرد. در کوله‌اش چند بطری کوچک آب معدنی بود که قصد داشت به معترضان بدهد، و رسید یک داروخانه که نشان می‌داد برای خود ماسک خریده است.\n\nکادر درمان بیمارستان سینا گفته‌اند که آن شب تا ساعت ۱۱، دست‌کم ۳۸ نفر را آورده بودند که در دم جان باخته بودند. به گفته آن‌ها، گلوله‌ای که به یسنا اصابت کرده از نوع سنگین و چرخشی بوده و کمر او را متلاشی کرده بود، به‌طوری‌که محل اصابت به اندازه کف دست آسیب دیده بود.\n\nپیکر یسنا در آرامستان «بهشت‌زهرا»، قطعه ۴۸، ردیف ۸۳ به خاک سپرده شد. \n\nنیروهای امنیتی به خانه خانواده اسکندری مراجعه کردند تا از آن‌ها بخواهند یسنا را «شهید» اعلام کنند، اما خانواده اجازه ورود به آن‌ها ندادند.\n\nیسنا دانش‌آموخته حقوق، هنرمند و نقاش بود. به گفته اطرافیانش، زنی آرام بود که تنها می‌خواست خلوتی برای خود داشته باشد و نقاشی بکشد. او برای ابتدایی‌ترین حقوق خود با دست خالی به خیابان رفت، اما پاسخی که گرفت گلوله بود. یسنا در بیو اینستاگرامش نوشته بود: «تو اگر دغدغه‌ات مردم شام و یمن است- من دلم پیش عزیزی است که نامش وطن است.»\n\n#فروغ_اسکندری\n#یسنا_اسکندری\n#انقلاب_ملی_ایران_۱۴۰۴\n#انقلاب_شیر_و_خورشید\n#تهران #کاشانی\n#کهریزک #ایران\n#زن_زندگی_آزادی\n#هنرمند #نقاش\n#حقوق_بشر\n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\