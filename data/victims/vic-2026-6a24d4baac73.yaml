  Danial Shahbakhsh,
  11 years old and from Zahedan, Sistan and Baluchistan Province;
  He was killed on 30 September 2022.

  Danial Shahbakhsh, the son of Abdolhamid, was killed in Musalla on "Bloody Friday of Zahedan" when the security forces shot him in the heart.
  Unfortunately, there is no picture of Danial.

