  ۱۱ ساله و اهل زاهدان، سیستان و بلوچستان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  دانیال شه‌بخش فرزند عبدالحمید روز «جمعه خونین زاهدان» در مصلی با اصابت گلوله جنگی نیروهای نظامی حکومت به قلبش کشته شد.
  متاسفانه تصویری از دانیال موجود نیست.

