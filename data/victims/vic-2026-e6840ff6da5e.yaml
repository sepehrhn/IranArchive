  Hossein Alali,
  31 years old, from Shiraz, residing in Bandar Abbas;
  He was killed on 21th March 2023.

  Hossein was actively involved in the nationwide protests against the Islamic Republic government in Bandar Abbas. On one of the protest days, he was hit by a large number of rubber bullets in both legs. Because he needed medical treatment and, on the other hand, had been identified by security forces and was under pursuit, he lived in hiding in a house in Bandar Abbas for the last two months of the year 1401. In the last two months of the year 1401, he lived in hiding in a house in Bandar Abbas. In the last week of Esfand (March 2023), military forces of the government raided his residence and pushed him from the fourth floor downwards.

  Hossein was in a coma for a week, hospitalized. He lost his life on March 21, due to the severity of his injuries.

