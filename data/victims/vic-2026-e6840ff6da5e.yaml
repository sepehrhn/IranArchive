description: |-
  •
  جاویدنام: حسین آل‌علی،
  ۳۱ ساله، اهل شیراز، ساکن بندرعباس؛
  جاودانه شد: اول فروردین ۱۴۰۲.

  حسین در اعتراضات سراسری علیه حکومت جمهوری اسلامی در بندرعباس حضور فعال داشت. او در یکی از روزهای اعتراضات از ناحیه هر دو پا مورد اصابت تعداد زیادی گلوله ساچمه‌ای قرار گرفت و از آنجا که نیاز به مداوا داشت و از سوی دیگر توسط نیروهای امنیتی شناسایی شده و تحت تعقیب بود؛ دو ماه آخر سال ۱۴۰۱ در خانه‌ای در بندرعباس زندگی مخفی داشت. هفته آخر اسفند نیروهای نظامی حکومت به محل سکونت او یورش بردند و او را از طبقه چهارم به پایین پرت کردند.
  حسین یک هفته در کما، در بیمارستان بستری بود. او روز اول فروردین بر اثر شدت جراحات جان باخت.
  نیروهای امنیتی از پدر حسین تعهد گرفتند که اعلام کند پسرش در سانحه تصادف جان باخته است.
  پیکر حسین روز پنجشنبه سوم فروردین در شرایط امنیتی در آرامستان «سعدی» شیراز قطعه طوبی به خاک سپرده شد.
  در مراسم چهلمین روز کشته شدن حسین که سر مزار او در شیراز برگزار شد؛ سوگواران معترض شعارهایی همچون: «خامنه‌ای ضحاک/ می‌کشیمت زیر خاک» و «مرگ بر حکومت بچه‌کش» سر دادند.
  حسین‌ شش سال اخیر ساکن بندرعباس بود و آنجا کافی‌شاپ داشت. او فارغ‌التحصیل کاردانی معماری و ورزشکار بود.

