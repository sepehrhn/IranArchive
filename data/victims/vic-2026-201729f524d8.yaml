description: |-
  ⭕️
  جاویدنام: امیرعلی موسی‌کاظمی،
  ۲ سال و‌ ۳ ماه، ساکن تهران؛
  جاودانه شد: ۱۲ اسفند ۱۴۰۱.

  خانواده موسی‌کاظمی همراه با یک خانواده دیگر روز ۱۱ اسفند عازم سفر از تهران به اصفهان بودند که ماشینشان مورد اصابت گلوله ماموران یگان ویژه قرار گرفت. آنها سوار دو ماشین بودند. ماشین جلویی پرشیایی بود که راننده و پدر و مادر امیرعلی و برادر دوقلویش در آن بودند. پدر امیرعلی در حال خواباندن او بود که حوالی تالاب گاوخونی و شهر ورزنه ماشین سنگین یگان ویژه که شباهتی به ماشین پلیس نداشت ناگهان از پشت تپه‌ای جلوی خودرو ظاهر شد. راننده که گمان کرده بود گیر «خفت‌گیرهای» جاده‌ای افتادند تصمیم گرفت مسیرش را تغییر بدهد که نیروهای یگان به ماشین شلیک کردند. گلوله به سر امیررضا اصابت کرد و از سر او رد شد و او را در خواب کشت.
  نیروی انتظامی در توجیه این اقدام اعلام کرد ماموران به خودرویی که پلاک غیر بومی داشت مشکوک شدند و چون راننده به فرمان ایست توجه نکرد به آن شلیک کردند.
  نسیم باقری، مادر امیرعلی در پستی اینستاگرامی راجع به برخورد عاملان قتل فرزندش و قاضی پرونده با آنها نوشت:
  «پسرمو کشتین..همسر داغدارمو تا نصف شب اسیر اینور اونور کردین. وجدان تو شماها مرده. دریغ از ذره‌ای انسانیت. صورت معصوم و زخمی بچمو دیدین.. سر کوچولوش که تیکه تیکه کردین دیدین…مصیبتی ک با بی لیاقتیتون نصیب ما کردین دیدین در آخر جای همدردی و اظهار پشیمونی همسرمو هل دادین و خواستین بهش انگ بزنین ک بتونین کار خودتونو بپوشانین اون قاضی که مثلا سوگند خورده ک عدالت رعایت کنه چجوری اولش همه اینا رو دید اما ب جای اینک قاتلای بچمو مجازات کنه پدر بچمو هل داد و ازش تشت (تست) اعتیاد و الکل خواست … چشید روسیاهی موند براتون بیشتر ک … از هیچکدومتون نمیگذرم… لعنت بهتون. ما ک میدونیم عدالتی برقرار نخواهد شد… هیچوقت شما مجازات نمیشین.. مجازات فقط برای مردم عادیه…. ولی چرخ گردون روزگار بد میچرخه…آه مادرای داغدار و پسر تنهای من ک برادرش رو ازش گرفتین دامنتونو میگیره.»

  از زمان آغاز خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی شلیک‌های بی‌ضابطه و بی‌دلیل به اتومبیل‌ها در جاده‌ها و افرادی که حکومت در نهایت آنها را «مشکوک» می‌خواند چندین برابر شده است.

