description: |-
  •
  جاویدنام: حسین شیرازی‌پور،
  ۳۹ ساله و ساکن شیراز؛
  جاودانه شد: ۲۹ آبان ۱۴۰۱.

  حسین روز ۲۸ آبان ماه، در مراسم خاکسپاری #سجاد_قائمی_بهمن_بیگلو در آرامستان «کشن» مورد اصابت گلوله نظامیان سپاه به گردنش قرار گرفت و مجروح شد. او یک روز بعد در بیمارستانی در شیراز بر اثر شدت جراحات وارده جان باخت.
  ماموران امنیتی خانواده حسین را تحت فشار قرار دادند که اعلام کنند حسین سکته کرده است. در نهایت رسانه‌های حکومتی اعلام کردن حسین رهگذری بود که اتفاقی مورد اصابت گلوله ساچمه‌ای قرار گرفت و جان باخت.
  پیکر حسین دوم آذر ماه شبانه و در خفا به خاک سپرده شد.
  حسین مکانیک بود. او متاهل و دارای یک پسر ۶ ساله بود.

