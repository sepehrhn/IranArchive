  Hossein Shirazipour
  39 year old,residing in Shiraz, He was killed on 20 November 2022.

  On the 28th of Aban, during the funeral ceremony of #SajadGhaemiBahmanBeigloo in the "Keshen" cemetery, Hossein was shot in the neck by the military forces of the Sepah (Revolutionary Guards) and was seriously injured. He succumbed to his injuries the following day at a hospital in Shiraz.

  The security forces pressured Hossein's family to announce that he had suffered a heart attack. Ultimately, the government-controlled media claimed that Hossein Shirazipour was an innocent bystander who was accidentally hit by a stray bullet and lost his life.
  Hossein's body was secretly buried in the night of 23 November in Shiraz. Hossein was a car mechanic. He was married and had a six-year-old son.

