description: |-
  محمدامین کورکی، اهل سیرجان در استان کرمان، در ۱۹ دی‌ماه بازداشت شده است. او در بلاتکلیفی به سر می‌برد و هیچ‌گونه اطلاع‌رسانی‌ای در مورد وضعیتش انجام نمی‌شود. محمدامین در یک فست‌فودی کار می‌کرده که ورشکست شده و بدهی بالا آورده است و او ماهانه مجبور به پرداخت قسط و بدهی زیادی است. محمد امین درست در ۵ دی‌ماه سال ۱۳۸۲، مصادف با زلزلهٔ بم به دنیا آمده است و مادرش را پنج سال پیش در یک تصادف از دست داد. صدایش باشیم.

  @akhbar_bazdashtiha

