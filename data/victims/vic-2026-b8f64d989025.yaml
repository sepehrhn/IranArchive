  Abolfazl Bauo
  16-year-old from Qaimshahr, he was killed on 22 October, 2022.

  Abolfazl was killed in the nationwide anti-government demonstration in Qaimshahr by a bullet shot by security agents in his heart.
  His body was handed over to them on the condition of the family's silence.
  If you have any information, please share it with us.

