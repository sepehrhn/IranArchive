description: |-
  •
  جاویدنام: حمید فولادوند،
  ۳۱ ساله، اهل دورود استان لرستان، ساکن پاکدشت ورامین؛
  جاودانه شد: اول مهر ۱۴۰۱.

  حمید روز ۳۰ شهریور در جریان اعتراضات سراسری به قتل حکومتی #مهسا_امینی در پاکدشت؛ با شلیک گلوله ماموران نظامی حکومت به گردنش به شدت مجروح شد و دو روز بعد در بیمارستان پاکدشت جان سپرد.
  پیکر حمید را روز چهارم مهر در «گلستان شهدا ده امام» به خاک سپردند.
  مراسم چهلم او ۱۲ آبان ۱۴۰۱ بر سر مزارش برگزار شد.

