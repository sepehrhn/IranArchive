  Hamid Fouladvand,
  31 years old, from Dorud, Lorestan province, resident of Pakdasht, Varamin;
  He was killed on 23 September 2022.

  On September 21, Hamid was seriously injured in the neck by the gunshots of government military agents during nationwide protests against the government murder of #MahsaAmini in Pakdasht and died two days later in Pakdasht hospital.
  Hamid's body was buried in Ten Imam cemetery of Pakdasht on September 26.
  His 40th day memorial ceremony was held on November 3.

