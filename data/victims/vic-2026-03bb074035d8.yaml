  Yasser Bahadorzehi
  17 years old and from Zahedan;
  He was killed on 5 October 2022.

  Yasser was a teenager with a severe disability. He was killed by IRGC sniper during the protests on Friday, October 5, around Khash governorate. His body was left by the government security agents behind the governor's office and was found the next morning by people.

