description: "•\nجاویدنام: رضا ده‌بوید،\n۲۹ ساله، اهل و ساکن ساری؛\nجاودانه شد: ۱۳ آذر ماه ۱۴۰۱.\n\nرضا ده‌بوید آذرماه از سوی وزارت اطلاعات ساری جهت پاره‌ای توضیحات احضار شد. پیکر او را خانواده‌اش در حالی که روی سرش اثر گلوله، روی گردنش اثر طناب و آثار شکنجه بود و اندام‌های داخلی‌اش از بدنش خارج شده بود از بیمارستان تحویل گرفتند. ماموران اطلاعات حکومت او را زیر شکنجه کشتند و پیکرش را در بیمارستان رها کردند.\nآنها خانواده ده‌بوید را وادار کردند کشته شدن پسرشان را انکار کنند. رسانه‌های حکومتی نوشتند که نیروی انتظامی پیکر مجروح رضا را در خیابان پیدا کرد و به بیمارستان رساند اما تلاش کادر درمان فایده نداشت و او در بیمارستان جان باخت. \nپیکر رضا را در آرامستان «ملا مجدالدین» به خاک سپردند.\n\n#رضا_دهبوید\n#انقلاب_ملی_ایران۱۴۰۱\n#انقلاب_ملی_ایران \n#ساری\n#مهسا_امینی \n\n♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️♦️\n\nReza Dehbovid,\n29 years old, from and residing in Sari;\nHe was killed on 4th December 2022.\n\_\nIn Dezember, Reza Dehbovid was summoned by the Ministry of Intelligence in Sari for some explanations. His family received his body, which bore the marks of gunshot wounds on his head, rope marks on his neck, and signs of torture, while his internal organs were displaced from his body, from the hospital. Government intelligence agents killed him under torture and abandoned his body at the hospital.\n\_\nThey forced Dehbovid’s family to deny their son's murder. Government media reported that the police found Reza's injured body on the street and took him to the hospital, but the medical staff's efforts were in vain, and he passed away at the hospital.\n\_\nReza's body was buried at the \"Molla Majdoddin\" cemetery.\n\_\n#RezaDehbovid\n#IranRevolution2022 \n#IranRevolution \n#Sari\n#MahsaAmini"
