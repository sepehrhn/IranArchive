description: |-
  جاویدنام #شمشاد_اخلاصی_علی_قیارلو از ترکان قشقایی متولد دی ماه ۶۷
  ۱۹ دی ۱۴۰۴ یک روز پیش از تولد ۳۷ سالگی‌اش در شیراز با شلیک مستقیم مأموران جمهوری اسلامی کشته شد.

  این قتل در محدوده فلکه قهرمانان شهرک میان‌رود شیراز رخ داده است.

  پس از این جنایت، نهادهای امنیتی با اعمال فشار بر خانواده او، تلاش کردند مراسم خاکسپاری را محدود، کنترل‌شده و بدون حضور گسترده مردم برگزار کنند.

  #جاویدنام

  @JavidnamaneVatan
