  ۳۰۷۸. نوید سلطان‌پور
   در جریان اعتراضات دی‌ماه به خیابان آمد، در همان روزها، یکی از دوستانش در نزدیکی او کشته شد. پس از آن، ناچار به زندگی مخفیانه روی آورد تا اینکه در شهر «مشهد» ربوده شد.
