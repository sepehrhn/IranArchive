  Isa Biglari,
  39 years old, from Sarvabad, Sanandaj,
  He was Killed on 15 November 2022.

  Isa was shot and killed by government forces during the nationwide anti-government protests in Sanandaj on the evening of November 15th, 2022.
  Isa's body was buried on November 16th, 2022, in "Behesht-e Mohammadieh" cemetery in Sanandaj, in the presence of his family and a large gathering of mourning protesters.
  On the day of the burial, Isa's father Emotionally shouted slogans of "Death to Khamenei" and "Death to the mercenaries (Jashakaneh)". The protesters joined in solidarity with the Biglari family, chanting, "Don't cry for your son, uncle ! We will seek revenge for him."
  Isa was married and a father of three children.
  On the gravestone of Isa, it was inscribed:
  "Standing up and die is better than living on your knees, and I will never kneel even if the sky's ceiling is shorter than my height."

