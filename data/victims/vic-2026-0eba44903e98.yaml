description: |-
  •
  جاویدنام: عیسی بیگلری،
  ۳۹ ساله و اهل سروآباد سنندج،
  جاودانه شد: ۲۴ آبان.

  عیسی در اعتراضات سراسری ضد حکومتی در سنندج؛ شامگاه ۲۴ بهمن مورد اصابت گلوله نظامیان حکومت قرار گرفت و جان باخت.
  پیکر عیسی روز ۲۵ آبان با حضور خانواده و جمع گسترده‌ای از سوگواران معترض در «بهشت محمدی» سنندج برگزار شد.
  پدر عیسی در روز خاکسپاری سوگوارانه فریاد «مرگ بر خامنه‌ای و مرگ بر جاشه‌کان (مزدوران)» سر داد. معترضان هم با شعار «دایه برای فرزندت گریه نکن! انتقامش را خواهیم گرفت» با خانواده بیگلری همدلی و همراهی کردند.
  عیسی متاهل و پدر سه فرزند بود.
  روی سنگ مزار عیسی نوشتند:
  «ایستاده مردن بهتر از زانو زده زیستن است و من هرگز زانو نخواهم زد حتی اگر سقف آسمان از قامتم کوتاهتر باشد.»

