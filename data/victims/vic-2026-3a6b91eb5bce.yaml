description: مهدی محمودی تتو کار و جودوکار قهرمان کشور است. او در تاریخ ۲۱ دی بازداشت شده و از آن زمان تنها یک بار از زندان گنبدکاووس امکان تماس با خانواده را داشته و درخواست کمک کرده. مهدی طی ۳۸ روز گذشته از حق ملاقات و تماس محروم بوده. او دچار میگرن حاد است و خانواده‌اش نگران وضعیت سلامت او هستند. صدایش باشیم.
