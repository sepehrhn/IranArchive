description: |-
  جاویدنام&rlm;⁧ #سعید_تروندجوان⁩، ۳۳ ساله، اهل مهران از توابع استان ایلام و پیمانکار شرکت نفت در آبادان.
  در جریان اعتراضات روز پنج‌شنبه ۱۸ دی‌ماه ۱۴۰۴ در خیابان امیری آبادان، بر اثر اصابت مستقیم ساچمه شکاری از فاصله کمتر از سه متر، کشته شد.

  &rlm;پیکر او به مدت پنج روز در اختیار نهادهای امنیتی بود و خانواده‌اش تنها پس از تهدید و گرفتن تعهدهای سنگین موفق به تحویل گرفتن جنازه شدند. مراسم خاکسپاری وی روز سه‌شنبه ۲۳ دی‌ماه برگزار شد.

  &rlm;سعید تروندجوان پدر یک کودک سه‌ساله به نام آریامهر بود.

  &rlm;به گفته نزدیکان خانواده، تحویل پیکر سعید به این دلیل انجام شد که مقامات تصور می‌کردند خانواده پذیرفته‌اند او به‌عنوان «شهید» معرفی شود. همچنین برای برگزاری مراسم تشییع، از ۲۲ نفر از بزرگان ایل تعهد کتبی گرفته شد تا هیچ شعاری داده نشود و هیچ‌گونه اعتراضی صورت نگیرد.
  #جاویدنام

  @JavidnamaneVatan

  ❤20

