description: |-
  •
  جاویدنام: اصغر هژیر لطیف،
  ۳۹ ساله، اهل همدان و ساکن تهران؛
  جاودانه شد: ۲۵ آبان ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی روز ۲۵ آبان، حوالی بازار اصغر به کمک زنی رفت که ماموران نظامی حکومت او را در کوچه‌ای دور از محل اعتراضات مورد تعرض قرار داده بودند. متعرضان مسلح حکومتی از فاصله نزدیک به قلب و ریه او شلیک کردند و وقتی افتاد با باتوم به سرش ضربه زدند. او پس از انتقال به بیمارستان جان باخت.
  پیکر اصغر در آرامستان «امام‌زاده جعفر » شهر فردوسیه، شهریار به خاک سپرده شد.
  اصغر در میدان تره‌بار کار می‌کرد. او پدر پسری خردسال بود.

