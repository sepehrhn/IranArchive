  Asghar Hajir Latif
  39 years old, from Hamedan
  Residence inTehran;
  He was killed on 16 November 2022.

  During the nationwide anti-government protests. He went to help a woman in the vicinity of Asghar Bazaar, who had been sexually assaulted by government military personnel in a street away from the protest site. The government's armed assailants shot him at close range, hitting his heart and lungs, and when he fell, they struck him on the head with a baton. He succumbed to his injuries after being transferred to the hospital.
  Asghar's body was buried in the “Imamzadeh Jafar “Cemetery in Ferdowsiye, Shahriar.

  Asghar worked in the loading square. He was the father of a young boy.

