  Heidar Mahali
  Age unknown, from Shinabad, Piranshahr
  He was killed on 19 November 2022.

  Heidar Mahali was hit by a bullet fired by military forces of the Sepah (Islamic Revolutionary Guard Corps) during the burial ceremony of #KarvanGhaderShokri The military forces had launched an armed attack on the mourners.

