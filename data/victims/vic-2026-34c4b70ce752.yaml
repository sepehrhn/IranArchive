description: |-
  •
  جاویدنام: امیر زرگر،
  ۲۳ ساله، اهل شهریار، تهران، ساکن فردوسیه؛
  جاودانه شد: ۲۴ بهمن ۱۴۰۱.

  نیروهای لباس شخصی حکومت روز ۱۶ بهمن ماه با یک پرشیا سفید بی‌پلاک مقابل مغازه امیر با دو گلوله جنگی به پای او شلیک کردند و متواری شدند. بدن مجروح امیر را ساعاتی بعد به بیمارستان رساندند. علیرغم اینکه پای او را در بیمارستان قطع کردند دچار عفونت شدید شد و روز ۲۴ بهمن جان باخت.
  امیر از آبان ۱۳۹۸ در اعتراضات علیه حکومت حضور فعال داشت، به ویژه بعد از اینکه نیروهای امنیتی دوستش جاویدنام #مهرداد_معین_فر را کشتند.
  در جریان اعتراضات سراسری ضد حکومتی که اواخر شهریور ۱۴۰۱ و به دنبال قتل حکومتی جاویدنام #مهسا_امینی آغاز شد؛ امیر در یکی از این روزها در ماه مهر و در تظاهرات شهریار به کمک زنی رفت که نیروهای نظامی حکومت او را مورد ضرب و شتم قرار داده بودند. آنها پس از اینکه همان جا امیر را کتک زدند او را به مسجدی بردند و چنان مورد ضرب و شتم قرار دادند که چند روز در بیمارستان بستری بود. او پس از مرخصی از بیمارستان مجدد به اعتراضات خیابانی پیوست.
  نیروهای امنیتی حکومت امیر را شناسایی کردند. آنها او را تلفنی تهدید به مرگ کرده بودند.
  خانواده امیر برای پیگیری قتل او شکایت کردند اما نیروهای اطلاعات حکومت تهدیدشان کردند که از شکایت و پیگیری دست بکشند.
  خدمت سربازی اجباری امیر ناتمام ماند. امیر ورزشکار بود و در رشته بوکس حرفه‌ای بود.

