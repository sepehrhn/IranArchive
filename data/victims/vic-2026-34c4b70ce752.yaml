  Amir Zargar
  23 years old, from Shahriar, Tehran Province, Living in Ferdowsieh;
  He was killed on 13th February 2023.

  On the 5th of February , government plainclothes forces fired two military bullets at Amir's leg in front of his shop using a white unlicensed Peugeot Persia and then fled. Amir's wounded body was taken to the hospital hours later. Despite having his leg amputated at the hospital, he suffered from severe infection and passed away on the 13th of February.

  Amir had been actively participating in protests against the government since October 2019, especially after the security forces killed his friend, the martyr #MehrdadMoeinFar, during nationwide anti-government protests.

