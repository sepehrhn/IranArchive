  Jan Bibi Naroui,
  Age unknown, from Zahedan;
  She was killed on probably November 2022. buzz

  During the nationwide anti-government protests in Zahedan on September 30, known as #BloodyZahedanFriday, Jan Bibi experienced respiratory problems and lost her life nearly two months later due to inhaling tear gas and toxic substances fired by Sepah military forces (#IRGC ) at Makki Mosque in Zahedan.

