  Samad Bargei-Nia,
  52 years old, from Piranshahr, West Azarbaijan province;
  He was killed on 28 September 2022.

  Samad was shot by government law enforcement agents during the nationwide protests on September 20th. He was hospitalized at Khomeini Hospital in Urmia for a week due to severe injuries and passed away.
  His funeral was held on Friday, October 7th with the presence of security forces.

