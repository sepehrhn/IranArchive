  جاویدنام: صمد برگی‌نیا،
  ۵۲ ساله و اهل پیرانشهر، آذربایجان غربی؛
  جاودانه شد: ۶ مهر ۱۴۰۱.

  صمد در اعتراضات سراسری روز ۲۹ شهریور مورد اصابت گلوله ماموران انتظامی حکومت قرار گرفت. او پس از یک هفته بستری در بیمارستان «خمینی» شهر ارومیه به دلیل شدت جراحات جان سپرد.
  مراسم خاکسپاری او روز پنجشنبه ۷ مهر با حضور نیروهای امنیتی برگزار شد.

