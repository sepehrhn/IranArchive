  Aryan Moridi (Aryan), 19 years old from Salas_Babajani County, Kermanshah province;
  He was killed on 9 October 2022.

  On October 9th at 20:45, during the nationwide anti-government protests in Salas_e Babajani county , Aryan was hit by a bullet from the Kalashnikov rifles of the terrorist group Sepah. The bullet entered from the left shoulder and exited from the right side, causing internal artery and lung damage.
  Aryan was first taken to the hospital in Talebabajani, but due to the lack of facilities and a surgeon, he was transferred to the "Hazrat-e Rasul" hospital in Javanrud. There, the accumulated blood in his lungs was drained and he was sent back to "Taleghani" hospital in Kermanshah. There, resuscitation was performed on him, but unfortunately it was unsuccessful and Aryan passed away at 24:00.
  Aryan's body was buried in the "Qolqole" cemetery at the entrance of Salas_e Babajani county.

