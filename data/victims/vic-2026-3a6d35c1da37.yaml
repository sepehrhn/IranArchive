description: |-
  •
  جاویدنام: آریان مریدی (آرین)،
  ۱۹ ساله و اهل و ثلاث‌باباجانی استان کرمانشاه؛
  جاودانه شد: ۱۷ مهر ۱۴۰۱.

  آریان ساعت ۲۰:۴۵ روز ۱۷ مهر در اعتراضات سراسری ضد حکومتی در شهر ثلاث‌باباجانی مورد اصابت گلوله جنگی کلاشنیکف ماموران گروه تروریستی سپاه قرار گرفت. گلوله از سمت چپ شانه وارد و از سمت راست خارج شد و موجب قطع شریان‌های داخلی و ریه او شد.
  او را ابتدا به بیمارستان شهر ثلاث‌باباجانی اعزام کردند، اما به دلیل نبود امکانات و پزشک جراح به بیمارستان «حضرت رسول» جوانرود منتقل شد. آنجا خون‌های جمع شده در ریه‌اش تخلیه شد و سپس به بیمارستان «طالقانی» کرمانشاه فرستاده شد. آنجا عملیات احیا روی او انجام شد اما متاسفانه بی‌نتیجه بود. آریان ساعت ۲۴:۰۰ جان سپرد.
  پیکر او در آرامستان «قلقله» در ورودی شهر ثلاث‌بابا‌جانی به خاک سپرده شد.
  مراسم یادبود چهلمین روز کشته شدن او ۲۷ آبان بود که به دلیل جو امنیتی شدید حاکم و وجود نیروهای امنیتی در ورودی آرامستان، برگزار نشد.
  آریان تازه ۱۹ ساله شده بود و قرار بود امسال در آزمون کنکور شرکت کند.

