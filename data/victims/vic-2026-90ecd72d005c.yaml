  Motaleb Saeedpirou
  40 years old, from Baneh, Kurdistan;
  He was killed on 27th October 2022.

  in front of his house by #IRGC (Islamic Revolutionary Guard Corps) forces. Motaleb intended to get into his personal car when the IRGC officers first broke the car windows and then, as he tried to flee from them with the car, they shot him at close range in the chest with a military bullet, resulting in his death.
  A video capturing the moment of his killing has been recorded, showing that there was no gathering or demonstration at the location where Motaleb was killed.
  His body was buried on 28 October in “Juman Village “Cemetery, located in Baneh.

