description: |-
  •
  جاویدنام: مطلب سعیدپیرو،
  ۴۰ ساله و اهل بانه، کردستان؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  نظامیان سپاه مطلب را روز پنجم آبان، مقابل خانه‌اش کشتند. مطلب می‌خواست سوار ماشین شخصی‌اش بشود که ماموران سپاه اول شیشه‌های ماشینش را شکستند و بعد در حالی که او سعی داشت با ماشین از دست آنها بگریزد با شلیک گلوله جنگی از فاصله نزدیک به سینه‌اش او را کشتند.
  ویدیویی از لحظه کشته شدن او ثبت شده است که نشان می‌دهد در جایی که مطلب را کشتند هیچ تجمعی نبود.
  پیکر مطلب را ششم آبان ماه در آرامستان روستای جومان شهر بانه به خاک سپردند.

