  Javidnama: Ismail Rigi Haqiqi,
  22 years old, resident of Zahedan;
  He became eternal on 20 Aban 1401.

  Ismail, during the nationwide anti-government protests, was hit by the bullets of Sepah (Islamic Revolutionary Guard Corps) soldiers on the 20th of Aban in Makki Mosque, Zahedan, and was killed.

