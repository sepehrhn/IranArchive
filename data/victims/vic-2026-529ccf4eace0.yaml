description: |-
  •
  جاویدنام: کیمیا مقدسی،
  ۲۰ ساله، ساکن تهران؛
  جاودانه شد: ۳ آبان ۱۴۰۱.

  در جریان اعتراضات سراسری ضد حکومتی در تهران؛ کیمیا مورد اصابت دو گلوله نیروهای امنیتی حکومت به قلب و پیشانی‌اش قرار گرفت و کشته شد.
  نیروهای حکومتی پیکر کیمیا را ربودند، اعضای بدنش را خارج کردند و سپس پیکر او را به شرط اعلام «سکته قلبی» به عنوان علت مرگ به خانواده‌اش تحویل دادند.
  پیکر کیمیا در آرامستان «بهشت زهرا» تهران به خاک سپرده شد.
  کیمیا دانشجوی رشته کامپیوتر و علاقمند به هنر، موسیقی و شعر بود.

