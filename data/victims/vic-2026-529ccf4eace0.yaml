  Kimia Moghaddasi,
  20 years old, Residing in Tehran,
  She was killed on 25th October 2022.

  During the nationwide anti-government protests in Tehran, Kimia was struck by two bullets from government security forces, one in the heart and one in the forehead, resulting in her untimely death.
  Government forces abducted her body, removed its organs, and then returned it to her family, falsely claiming "cardiac arrest" as the cause of death.

  Kimia was laid to rest in Behesht Zahra Cemetery in Tehran. She was a student of computer science and had a passion for art, music, and poetry.

