description: |-
  یلدا (رقیه) خادمی‌فر آشپز کافه و از اتباع عزیزی‌ست که سال‌هاست‌ همراه خانواده در ایران زندگی کرده. او در تاریخ ۱۹ دی در خیابان طبرسی مشهد  توسط نیروهای امنیتی بازداشت شده و اطلاعی از وضعیت سلامت و امنیت جانی او در دست نیست. او تنها یک مادر سال‌خورده دارد که امکان و توان پیگیری نداشته. صدایش باشیم.

