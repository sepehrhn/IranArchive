description: |-
  ⭕️
  جا‌ویدنام: امیرحسین ململی (قربانی).
  ۱۸ ساله، اهل ایذه، ساکن فولادشهر اصفهان؛
  جاودانه شد: ۱۳ آبان ۱۴۰۱.

  امیرحسین روز ۱۲ آبان، در مراسم یادبود چهلمین روز قتل حکومتی جاویدنام #آروین_ململی_گلزاری، توسط نیروهای امنیتی حکومت ربوده شد. پیکر او ۱۳ آبان روی پشت‌بام خانه قدیمی‌شان در ایذه، در فاصله ۳۰۰ کیلومتری محل زندگی‌اش در فولادشهر، توسط همسایه‌شان پیدا شد.
  صبح روز ۱۳ آبان کارگرانی که پشت‌بام خانه‌ نزدیک به خانه خانواده قربانی را قیرگونی می‌کردند متوجه کسی روی پشت‌بام خانه همسایه دراز کشیده است. وقتی پس از چند ساعت حرکتی از او نمی‌بینند به صاحبخانه خبر می‌دهند و بالای سر او می‌روند. آنها با پیکر بی‌جان امیرحسین مواجه می‌شوند در حالی که کفش و جوراب‌هایش مرتب کنارش قرار داده شده بود. همسایه که امیرحسین را می‌شناسد با خانواده او در فولادشهر تماس می‌گیرد و به آنها خبر می‌دهد.
  آروین دوست صمیمی امیرحسین بود. بعد از کشته شدن او امیرحسین به روایت دوستانش بسیار خشمگین بود و حاضر نبود با اینکه شناسایی شده بود؛ حتی برای شرکت در اعتراضات چهره‌اش را بپوشاند. در یکی از اعتراضات صورت و لب‌هایش با اصابت گلوله ساچمه‌ای آسیب دیده بود.
  پزشکی قانونی ابتدا مرگ امیرحسین را مشکوک اعلام کرد ولی بعدا علت مرگ را خودکشی اعلام کرد. روی پیکر امیرحسین آثار شکنجه مشهود بود. لب‌هایش سیاه و بازوانش کبود بودند.
  پیکر امیرحسین روز ۱۸ آبان در آرامستان ایذه و در کنار مزار دوست صمیمی‌اش جاویدنام آروین ململی گلزاری به خاک سپرده شد.
  علیرضا سال آخر هنرستان بود و در رشته جوشکاری تحصیل می‌کرد. او پسری شجاع، شاد و ورزشکار بود. خانواده او منزلشان در ایذه را اجاره داده بودند و خودشان ساکن فولادشهر اصفهان بودند.

