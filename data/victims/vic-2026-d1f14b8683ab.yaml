  Amirhossein Malmali (Qorbani),
  18 years old, from Izeh and residing in Fuladshahr, Isfahan;
  He was killed on 4th November 2022.

  Amirhossein was kidnapped on November 3rd by government security forces during the commemoration ceremony of the fortieth day of the government's murder of #ArvinMalmaliGolzari .His body was found on November 4th on the rooftop of their old house in Izeh, 300 kilometers away from his residence in Fooladshahr, by his neighbor.

