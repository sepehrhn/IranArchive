  Hamed Sedighi,
  20 years old, Citizen of Afghan, Resident of Dargahan, Qeshm Island
  He was killed on 17th November 2022.

  Hamed was shot in the head and chest during the nationwide anti-government protests in Dargahan, Qeshm Island, and he was killed. Government security forces took Hamed's body hostage and threatened his family, stating that if they informed anyone about Hamed's killing, their properties would be confiscated, and they would be deported to Afghanistan.

  Hamed's body was laid to rest in Dargahan Cemetery on the 20th November , accompanied by a large gathering of mourners.

  Hamed was a student and had been working since the age of 12. He owned a jacket shop in Dargahan.

