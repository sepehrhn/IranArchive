description: |-
  •
  جاویدنام: حامد صدیقی،
  ۲۰ ساله، تبعه افغانستان و ساکن درگهان جزیره قشم؛
  جاودانه شد: ۲۶ آبان ۱۴۰۱.

  حامد در جریان اعتراضات سراسری ضد حکومتی در شهر درگهان جزیره قشم روز ۲۶ آبان مورد اصابت دو گلوله به سر و سینه‌اش قرار گرفت و کشته شد.
  ماموران امنیتی حکومت پیکر حامد را گروگان گرفتند و خانواده حامد را تهدید کردند که چنانچه راجع به کشته شدن حامد اطلاع‌رسانی کنند اموال آنها را مصادره و خودشان را به افغانستان بر می‌گردانند.
  پیکر حامد روز ۲۹ آبان با حضور گسترده سوگواران در آرامستان درگهان به خاک سپرده شد.
  حامد هم درس می‌خواند و هم از ۱۲ سالگی کار می‌کرد. او در درگهان مغازه کاپشن‌فروشی داشت.

