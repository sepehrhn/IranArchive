description: |-
  •
  جاویدنامان: منصوره حیدری و بهروز منصوری،
  زوج اهل بوشهر؛
  جاودانه شدند: ۱۸ دی ۱۴۰۴

  عصر روز ۱۸ دی‌ماه ۱۴۰۴، منصوره حیدری و بهروز منصوری، زوج جوان بوشهری که به خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی در شهر خود پیوسته بودند، در مقابل مسجد قرآن در خیابان عاشوری بوشهر هدف شلیک مستقیم گلوله جنگی قرار گرفتند و در همان محل جان باختند.
  نیروهای سرکوب از داخل مسجد، معترضان را به رگبار گلوله بستند. منصوره و بهروز در صف اول معترضان قرار داشتند.

  آن‌ها والدین دو کودک ۷ و ۱۰ ساله بودند که برای شرکت در خیزش مردمی، فرزندانشان را به خانواده سپرده بودند.
  منصوره حیدری پرستار بیمارستان تأمین اجتماعی بوشهر بود.

