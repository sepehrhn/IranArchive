  Mansoureh Heydari and Behrouz Mansouri,
  A couple from Bushehr;
  They were killed on January 18, 2026.

  On the afternoon of January 18, 2026, Mansoureh Heydari and Behrouz Mansouri, a young couple from Bushehr who had joined the national uprising of Iranians against the Islamic Republic government in their city, were directly shot with live ammunition in front of the Quran Mosque on Ashouri Street in Bushehr and were killed at the scene.
  Regime forces opened fire on protesters from inside the mosque. Mansoureh and Behrouz were standing in the front line of the protesters.

  They were the parents of two children, aged 7 and 10, whom they had left with their family in order to take part in the popular uprising.
  Mansoureh Heydari was a nurse at the Social Security Hospital in Bushehr.

