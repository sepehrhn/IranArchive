description: |-
  ⭕️
  جاویدنام: عبدالله محمودپور،
  ۱۶ ساله و اهل روستای بالو ارومیه،
  جاودانه شد: ۳۱ شهریور ۱۴۰۱.

  عبدالله روز ۳۰ شهریور در اعتراضات سراسری به قتل حکومتی #مهسا_امینی در روستای بالو بر اثر تیراندازی نیروهای امنیتی سپاه به شدت مجروح و به بیمارستان ارومیه منتقل شد. او یک روز بعد بر اثر شدت جراحات درگذشت.

  پیکر او و جاویدنام #دانش_رهنما دیگر جانباخته تظاهرات ارومیه روز پنجشنبه ۳۱ شهریور در آرامستان روستای بالو به خاک سپرده شد.

