  Abdullah Mahmoudpour,
  16 years old، from Balu a village  in Urmia.
  He was killed on 21 September 2022.

  Abdullah was severely injured by the gunfire of security forces of the Revolutionary Guards in the nationwide protests, following the killing of #MahsaAmini, in Balu village on  September 21. He was transferred to Urmia hospital where he succumbed to his injuries on September 22.

  His body and another victim of the Urmia protests, #DaneshRahnama, were buried on  Friday, September 22, in Balu village cemetery.


