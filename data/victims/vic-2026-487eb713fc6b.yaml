description: |-
  •
  جاویدنام: مهدی ببرنژاد،
  ۲۲ ساله و اهل قوچان استان خراسان؛ جاودانه شد: ۳۰ شهریور ۱۴۰۱.

  مهدی در تظاهرات قوچان که با قتل حکومتی #مهسا_امینی در سراسر ایران آغاز شد؛ با شلیک گلوله مزدوران حکومت مجروح شد. او را به بیمارستان رساندند اما اجازه ندادند به اتاق عمل برود و آنقدر منتظر ماندند تا جان بدهد.
  مهدی از کودکی پدرش را از دست داده و نان‌آور خانواده بود. او کشتی‌گیر بود و بدن‌سازی می‌کرد. نزدیکانش گفته‌اند او از اولین نفراتی بود که به خیابان آمد و با این حال که پیش از او دو نفر دیگر تیر خورده بودند، نترسید و در خیابان ماند.

