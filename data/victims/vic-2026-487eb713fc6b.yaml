  Mehdi Babrnejad,
  22 years old and from Quchan, Khorasan Razavi province;
  He was killed on 21 September 2022.

  Mehdi was injured by the gunshots of government mercenaries during the protests which had started with the murder of #MahsaAmini in Quchan. They brought him to the hospital but they didn’t permit the required operations; the waited until he passed away.
  Mehdi had lost his father when he was a child and was the main source of income of his family. He was a wrestler and he was interested in bodybuilding. His relatives said that he was one of the first people who came to the streets and even though two other people were shot before him, he was not afraid and stayed on the street.

