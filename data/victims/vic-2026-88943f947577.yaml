  Mehdi Zaker,
  Age: Unknown, from Dehloran, Ilam
  He was killed on 2th November 2022.

  Mehdi was killed by government forces during the nationwide anti-government protests on 2th November ok in Dehloran. Mehdi was a senior instrument engineer at the Asalouyeh refinery.

