  Mehran Rahmani,
  22 years old, from Mahabad, West Azarbaijan;
  He was killed on 18th November 2022.

  Mehran was injured during the nationwide anti-government protests in Mahabad on November 16th. He was shot in the abdomen by government forces in the "Bri Shilanan" neighborhood. Initially, he was taken to a hospital in Mahabad, but in a phone call with his sister, he was informed that he would be transferred to "Khomeini" Hospital in Urmia due to the lack of certain facilities.

