description: |-
  •
  جاویدنام مهران رحمانی،
  ۲۲ ساله، اهل مهاباد، آذربایجان غربی؛
  جاودانه شد: ۲۷ آبان ۱۴۰۱.

  مهران در جریان اعتراضات سراسری ضد حکومتی در مهاباد روز ۲۵ آبان در محله «بری‌شیلانان» مورد اصابت گلوله نظامیان حکومت به شکمش قرار گرفت و مجروح شد. او را ابتدا به بیمارستانی در مهاباد بردند اما در گفتگوی تلفنی با خواهرش به او گفت به دلیل عدم وجود بعضی امکانات او را به بیمارستان «خمینی» ارومیه منتقل می‌کنند.
  مهران دو روز بعد، روز ۲۷ آبان بر اثر شدت جراحات ناشی از اصابت گلوله در بیمارستان «خمینی» ارومیه جان باخت.
  نیروهای امنیتی به خانواده رحمانی اجازه ندادند پیکر مهران را کنار سایر کشته‌شدگان اعتراضات در مهاباد به خاک بسپارند. آنها به خانواده مهران گفتند تنها به این شرط پیکر او را به خانواده‌اش تحویل می‌دهند که خاکسپاری در روستایی دورافتاده باشد. خانواده مهران تحت فشارهای شدید امنیتی قرار داشتند تا جایی که با دوربین صدا و سیما به خانه آنها رفتند تا از آنها اعتراف اجباری بگیرند. خانواده رحمانی اما تن به خواسته ماموران امنیتی ندادند.
  پیکر مهران روز ۲۸ آبان و با حضور گسترده سوگواران معترضی که شعار «مرگ بر دیکتاتور» می‌دادند؛ در آرامستان روستا «قالو‌ زندان» به خاک سپرده شد.
  مهران فرزند اول خانواده بود. او یک خواهر و یک برادر داشت.
  او فوق دیپلم حقوق قضایی داشت و مغازه روسری فروشی داشت. از زمان آغاز اعتراضات ضد حکومتی بعد از کشته شدن #مهسا_امینی؛ درآمد مغازه مهران کم شده بود و او کاشی‌کاری می‌کرد.
  مهران آرزو داشت خواننده رپ بشود. او به بازیگری هم علاقه داشت.
  مهران نامزد داشت و قرار بود امسال مراسم عروسی‌اش را برگزار کند.

