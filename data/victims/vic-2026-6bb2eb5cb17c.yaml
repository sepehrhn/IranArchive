description: |-
  •
  جاویدنام: مجید طوس‌پرور،
  ۲۷ ساله، ساکن اسلام‌شهر، شهرک امام حسین؛
  جاودانه شد: ۲ بهمن ۱۴۰۱.

  در جریان اعتراضات سراسری ضدحکومتی، شامگاه ۱۴ آذر مجید بنر خامنه‌ای را آتش زد. دو روز بعد وقتی ماموران امنیتی برای بازداشت او رفتند موفق به فرار شد و پس از آن زندگی مخفی‌اش را آغاز کرد.محل اختفای مجید توسط آدم‌فروشان حکومتی لو رفت و نیروهای امنیتی او را بازداشت کردند. روز دوم بهمن با خانواد مجید تماس گرفتند و‌ گفتند او تصادف کرده و پیکرش در جاده احمدآباد-اسلام‌شهر پیدا شده است. وقتی خانواده مجید برای تحویل پیکر او به بیمارستان مراجعه کردند با حضور ماموران امنیتی مواجه شدند که آنها را تهدید به سکوت کردند و تعهد گرفتند تا مراسمی اجرا نکنند. آنها بدون اینکه به خانواده‌ مجید اجازه دیدن پیکر عزیزشان را بدهند وادارشان کردند روز ۳ بهمن او را در سکوت و غریبانه در آرامستان «دارالسلام» اسلامشهر به خاک بسپارند. پزشکی قانونی علت مرگ مجید را در جواز دفن «نامعلوم» اعلام کرد.
  مجید فرزند آخر خانواده‌ بود. او دیپلم حسابداری داشت و کارمند بانک ملی بود. ورزشکار بود و مربی ورزش نوجوانان. عضو کمک‌رسان یک سرای سالمندان هم بود. او آرزوی آزادی ایران را در سر داشت.
  مجید در یکی از پست‌های اینستاگرامی‌اش نوشت:
  «در مسیری قدم بردار که برای خانواده‌ات افتخار، برای دشمنانت حسادت و برای خودت حس خوب داشته باشد.»
  او در مسیری قدم برداشت که که نه تنها افتخار خانواده که افتخار ملت ایران شد.

