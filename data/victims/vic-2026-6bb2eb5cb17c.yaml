  Majid Toosparvar,
  27 years old,residing in Eslamshahr
  He was killed on 22th January 2023.

  During the nationwide anti-government protests, Majid set fire to Khamenei's banner.  Two days later, the security agents tried to arrest him but he managed to escape. After that he started his secret life. Majid's hiding place was revealed by government members. The security forces arrested him.  On 22 jan, they called Majid's family and claimed Majid had an accident and his body was found on the Ahmedabad-Eslamshahr road.

