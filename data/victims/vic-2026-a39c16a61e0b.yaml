  Hadi Chaksari,
  30 years old, from Amol, Mazandaran;
  He was killed on 27th October 2022.

  Hadi worked at the Malt Café fast food restaurant on Haraz Street. He left his workplace to buy medicine and was on his way to a pharmacy located a few hundred meters away from his workplace. On Aftab Street in Amol, he was shot in the chest with a military pistol bullet from a distance of four meters by government security forces.

  Security forces pressured Hadi's family through Amir Sadrnejad, a member of the Basij militia, to announce that Hadi was a Basij member and was assassinated by protesters.
  Hadi's body was buried on the seventh day of his passing in the "Emamzadeh Ebrahim" cemetery.

  Hadi held a master's degree in civil engineering.

