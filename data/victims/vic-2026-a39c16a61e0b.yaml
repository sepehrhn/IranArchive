description: |-
  •
  جاویدنام: هادی چاکسری،
  ۳۰ ساله و اهل آمل، مازندران؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  هادی در فست‌فود کافه مالت در خیابان هراز کار می‌کرد. او برای خرید دارو از محل کارش خارج شد تا به داروخانه‌ای که چند صد متر دورتر از محل کارش بود برود که با شلیک گلوله کلت نظامیان حکومت به سینه‌اش از فاصله چهار متری، در خیابان آفتاب آمل کشته شد.
  نیروهای امنیتی خانواده هادی را از طریق امیر صدرنژاد که بسیجی است تحت فشار قرار دادند تا اعلام کنند هادی بسیجی بوده و توسط معترضان ترور شده است.
  پیکر هادی را روز هفتم آبان در آرامستان «امامزاده ابراهیم»
  به خاک سپردند.
  مدرک تحصیلی هادی فوق لیسانس عمران بود.

