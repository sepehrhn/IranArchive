description: |-
  •
  جاویدنام: زانیار ابوبکری،
  ۲۲ ساله و اهل مهاباد، آذربایجان غربی؛
  جاودانه شد: ۵ آبان ۱۴۰۱.

  زانیار در اعتراضات سراسری ضد حکومتی، بعد از خاکسپاری #اسماعیل_مولوی در مهاباد با اصابت گلوله جنگی نظامیان سپاه، مقابل چشمان مادرش کشته شد.
  ماموران اطلاعاتی حکومت همان شب به خانه زانیار رفتند تا به آنها بگویند زانیار خودکشی کرده است، غافل از اینکه مادر او شاهد کشته شدن فرزندش به دست ماموران سپاه بود.نیروهای امنیتی در نهایت اعلام کردند معترضان زانیار را کشته‌اند.
  پزشکی قانونی علت مرگ زانیار را پارگی سیاهرگ بر اثر اصابت گلوله جنگی عنوان کرد.
  پیکر زانیار ابوبکری روز پنجشنبه، پنجم آبان با حضور گسترده سوگواران خشمگین که شعارهای ضد حکومتی می‌دادند در آرامستان مهاباد به خاک سپرده شد.
  زانیار اوایل امسال نامزد کرده بود. آنها قرار بود ۲۵ آبان ماه ازدواج کنند.
  زانیار کارگر بود. حقوق کارگری او اما همچون اکثر همسالانش کفاف هیچ کدام از آرزوهای یک جوان در آستانه ازدواج را نمی‌داد. او حتی نتوانسته بود برای دریافت وام ازدواج ضامن پیدا کند. زانیار معترض بود. او برای حق خود به قیام علیه حکومت جمهوری اسلامی پیوسته بود.
  او ورزشکار بود. بدنسازی می‌کرد و کشتی می‌گرفت. او عاشق حیوانات خانگی بود و رابطه صمیمانه‌ای با خانواده‌اش داشت.
  حکومت جمهوری اسلامی ۲۰ روز مانده به عروسی‌اش جان و جوانی‌‌اش را گرفت.

