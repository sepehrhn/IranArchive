  Zaniar Abubakri
  22 years old, from Mahabad, West Azarbaijan
  He was killed on 27 October 2022.

  Zaniar, during the nationwide anti-government protests, was killed by a military bullet fired by the Revolutionary Guards in front of his mother's eyes after the burial of Ismail Moulavi in Mahabad.
  Government intelligence agents went to Zaniar's house that night to tell them that Zaniar had committed suicide, unaware that his mother had witnessed her son's killing at the hands of the Revolutionary Guards. The security forces ultimately announced that the protesters had killed Zaniar.
  The forensic medicine attributed Zaniar's cause of death to a rupture of the diaphragm due to a gunshot wound.

