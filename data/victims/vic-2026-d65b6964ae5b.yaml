  سن نامشخص، اهل زاهدان؛
  جاودانه شد: ۸ مهر ۱۴۰۱.

  عبدالصمد روز «جمعه خونین» زاهدان در مصلی مکی توسط ماموران سپاه کشته شد.
  عبدالصمد متاهل و دارای سه کودک بود. دختر خردسال او در ویدیویی قاتلین پدرش را مخاطب قرار داد و‌گفت:
  «هانیه ثابتی‌زاده هستم. چرا پدرم را سر نماز شهید کردین؟»

