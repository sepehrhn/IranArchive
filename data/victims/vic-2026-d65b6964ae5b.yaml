  Abdul Samad Sabetizadeh (Shahoozahi) son of Shir Ali,
  Age unknown from Zahedan;
  Was killed on Sep 30, 2022.

  Abdul Samad was killed by IRI regime suppressor right at Maki praying area on bloody Friday of Zahedan. He was married and father of three children. In a video message Haniyeh, his youngest daughter addressed the regime suppressor and asked the reason of his father martyrdom while parying.
