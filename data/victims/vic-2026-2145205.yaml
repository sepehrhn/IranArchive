description: Young married man returning home with his wife in Daneshgah Square when attacked by Basij forces with batons and pellets. 34 pellets fired at his face, head and face completely destroyed with batons in front of his wife. Regime took the bodies and held memorial services claiming them as their own martyrs, even circulating announcements around Daneshgah Square and conducting their own burial ceremonies. Couple was monarchist, not regime supporters. Left behind a 9th grade child.
