description: |-
  امیر حسین رضایی در تاریخ ۲۲ دی ماه ۱۴۰۴ توسط سپاه استان کرمانشاه احضار شده و از آن زمان تاکنون هیچ خبری از او در دست نیست. در حوزه صنعت مرغداری فعالیت دارد و از سال ۹۸ به دلیل اعتراضات، زیر فشار نهادهای اطلاعاتی و امنیتی بوده است. نگرانی‌های بسیاری در مورد وضعیت سلامتی و امنیت جانی او وجود دارد. صدایش باشیم.

