description: |-
  •
  جاویدنام: امیر (عارف) قربان‌پور،
  ۳۴ ساله، اهل لشتِ نشاء، گیلان؛
  جاودانه شد: ۸ آبان ۱۴۰۱.

  عارف در اعتراضات سراسری ضد حکومتی در شهرستان لشت‌نشاء هنگامی که از محل کار به سمت خانه‌اش می‌رفت مورد اصابت گلوله از سوی معاون پاسگاه لشت نشاء به سرش قرار گرفت. مردم او را به بیمارستان رساندند و خانواده‌اش پس از یک روز جستجو و بی‌خبری پیکرش را در سردخانه بیمارستان لاهیجان یافتند. نیروهای امنیتی پیکر او را ۴ روز گروگان گرفتند و در نهایت خانواده‌اش را وادار کردند پیکر او را در سکوت به خاک بسپارند.
  علیرغم شدت فشارهایی که نیروهای امنیتی حکومت به خانواده عارف وارد کردند آنها از ضارب او شکایت کردند. لشت‌نشا شهر کوچکی است و عده زیادی شاهد بودند که معاون رئیس پاسگاه ضارب عارف بود. نیروهای امنیتی ابتدا همه دوربین‌هایی که در محل کشته شدن عارف وجود داشت از پایه کندند و بردند. سپس به خانواده قربان‌پور گفتند شاهد بیاورند. هیچ‌کدام از افرادی که شاهد کشته شدن عارف با گلوله معاون پاسگاه بودند حاضر به دادن شهادت نشدند.
  عارف کارگر ساده ساختمان بود. او و دختر هشت‌ ساله‌اش سارینا با هم زندگی می‌کردند.

