  Amir (Aref) Ghorbanpour,
  34 years old, from Lasht-e-Nesha, Gilan;
  He was killed on November 8th, 2022.

  Aref was hit by a bullet to his head by a deputy at the police station in Lasht-e-Nesha during the nationwide anti-government protests while he was going home from work. People took him to the hospital and after a day of searching and being kept uninformed, his family found his body in the morgue of Lahijan Hospital. Security forces held his body hostage for 4 days and finally forced his family to bury him in silence.

  Despite the intense pressure exerted by the government's security forces on Aref's family, they filed a complaint against his assailant. Lasht-e-Nesha is a small town and many people witnessed that the deputy of the police station was Aref's shooter.

