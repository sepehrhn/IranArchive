  Mohammad Amin Heshmatian
  age unknown, from Sonqor and Koliai city, Kermanshah, resident of Mehrshahr Karaj;
  He was killed on 3 November 2022.

  Mohammad Amin was killed by government soldiers on November 3th and during the commemoration of the 40th day of the killing of #HadithNajafi. Government intelligence agents pressured Mohammad Amin's family to announce that he died by suicide.
  Mohammad Amin's body was buried in his native village "Sahnaleh" of Sonqor and Kolyai counties.
  Mohammad Amin was married and had a young daughter. He had an apparatus shop in Mahdasht Karaj.

