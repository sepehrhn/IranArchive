description: |-
  •
  جاویدنام: محمدامین حشمتیان،
  سن نامشخص، اهل شهرستان سنقر و کلیایی، کرمانشاه، ساکن مهرشهر کرج؛
  جاودانه شد: ۱۲ آبان ۱۴۰۱.

  محمدامین روز ۱۲ آبان و در مراسم یادبود چهلمین روز کشته شدن #حدیث_نجفی با اصابت گلوله نظامیان حکومت کشته شد. ماموران اطلاعات حکومت خانواده محمدامین را تحت فشار گذاشتند که اعلام کنند او به دلیل خودکشی جان باخته است.
  پیکر محمدامین در روستای زادگاهش «سهنله» از توابع شهرستان سنقر و کلیایی به خاک سپرده شد.
  محمدامین متاهل و دارای یک دختر خردسال بود. او یک مغازه آپاراتی در ماهدشت کرج داشت.

