  ساعت هشت شب یکشنبه دهم مهر نیروهای گارد ضد شورش به همراه نیروهای پایگاه بسیج متعلق به محمد شاهوزهی در منطقه کریم‌آباد شهر زاهدان بدون هشدار قبلی به سلمان شلیک کردند و او را کشتند.
  سلمان در بازار زاهدان مغازه پارچه‌فروشی داشت.

