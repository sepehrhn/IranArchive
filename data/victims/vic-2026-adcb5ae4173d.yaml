  Salman Maleki (Salman Arab) son of Mohammad
  25 Years old from Zahedan;
  Was killed on Oct 02, 2022.

  Salman was a draper in Zahedan bazaar. It was on Sunday night around 22:00 that Salman was shot and killed at Karimabad of Zahedan. Riot police along with the IRGC armed forces related to Mohammad Shahoozahi shot Salman without any warning.

