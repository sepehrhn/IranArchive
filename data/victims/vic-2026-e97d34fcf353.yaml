description: |-
  •
  جاویدنام: محمد ریگی،
  سن نامشخص، اهل منطقه جاده قدیم زاهدان، سیستان و بلوچستان؛
  جاودانه شد: ۱۶ اسفند ۱۴۰۱.

  محمد در جریان اعتراضات سراسری ضد حکومتی در زاهدان، روز سه‌شنبه ۱۶ اسفند مورد تعقیب نیروهای لباس شخصی اداره اطلاعات قرار گرفت. او که گمان کرده بود سارقان به دنبالش هستند سعی کرد فرار کند اما ماموران بدون هشدار به اتومبیل او تیراندازی کردند. مرمی گلوله به محمد اصابت کرد و او را کشت.
  فرمانده انتظامی سیستان و بلوچستان در گفتگو با رسانه‌های حکومتی جهت تبرئه خود محمد را عامل اصلی سرقت‌های مسلحانه در زاهدان خواند.

  از زمان آغاز خیزش ملی ایرانیان علیه حکومت جمهوری اسلامی شلیک‌های بی‌ضابطه و بی‌دلیل به اتومبیل‌ها در جاده‌ها و افرادی که حکومت در نهایت آنها را «مشکوک» می‌خواند چندین برابر شده است

