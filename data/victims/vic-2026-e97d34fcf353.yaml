  Mohammad Rigi,
  Age undisclosed, from the Old Road area of Zahedan, Sistan and Baluchestan;
  He was killed on 7th March 2023.

  During the nationwide anti-government protests in Zahedan, on Wednesday, March 7th, Mohammad was pursued by plainclothes intelligence officers. Thinking that thieves were after him, he attempted to escape, but officers shot at his car without warning. Mohammad was hit by a bullet and killed.
  The commander of the police in Sistan and Baluchestan, in an interview with government media outlets, labeled Mohammad as the main instigator of armed robberies in Zahedan to absolve himself.

  Since the beginning of the Iranian people's uprising against the Islamic Republic government, indiscriminate and unjustified shootings at vehicles on roads and individuals labeled "suspicious" by the government have increased multiple-fold.

