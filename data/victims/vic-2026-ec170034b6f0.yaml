  جاویدنام: زهرا آزادپور،
  ۲۷ ساله، اهل اردبیل، ساکن کرج؛
  جاودانه شد: ۱۹ دی ۱۴۰۴

  در جریان خیزش ملی علیه حکومت جمهوری اسلامی؛ زهرا شامگاه جمعه ۱۹ دی‌ماه در فردیس کرج، هدف اصابت گلوله نیروهای سرکوب حکومت قرار گرفت و جان باخت.

  خانواده زهرا پیکر او را پس از سه روز در کهریزک یافتند و تحت شرایط امنیتی، همراه با تهدید و اجبار به تعهد، در آرامستان «دارالسلام» اسلامشهر به خاک سپردند.

  زهرا فوتبالیست و کوهنورد بود؛ عاشق موتورسواری.
  او بازیکن شماره ۷۷ تیم «مهرگان پردیس» بود و سابقه بازی در تیم‌های «آذرخش» و «صبا» را نیز در کارنامه حرفه‌ای خود داشت.
  زهرا طرفدار دوآتشه تیم استقلال بود و رویای بازی در تیم فوتبال زنان استقلال را داشت.

  او قله‌های بسیاری را فتح کرده بود: سبلان، دماوند، اسپلیت و…

  زهرا برای آنچه به دست آورده بود، کم نجنگیده بود؛ از جلب رضایت خانواده تا ایستادن در برابر سنت‌ها و قوانین زن‌ستیز جمهوری اسلامی و شکستن تابوهایی که برایش کم‌هزینه نبود.
  آزادی ایران قله‌ای بود که زهرا جانش را بر سر آن گذاشت. زندگی او سراسر مبارزه بود.

