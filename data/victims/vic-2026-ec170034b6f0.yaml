  Zahra Azadpour,
  27 years old, from Ardabil, living in Karaj;
  Killed on: January 9, 2026

  During the National Revolution against the Islamic Republic, Zahra was shot and killed by security forces on the evening of Friday, January 9, in Fardis, Karaj.

  Her family found her body after three days in Kahrizak and, under heavy security pressure, threats, and forced commitments, buried her in Dar al-Salam Cemetery in Eslamshahr.

  Zahra was a football player and a mountaineer; she also loved motorcycling.
  She wore jersey number 77 for the Mehrgan Pardis team and had previously played for Azarakhsh and Saba teams.
  Zahra was a passionate supporter of Esteghlal and dreamed of playing for the women’s Esteghlal team.

  She had summited many peaks, including Sabalan, Damavand, and Split.

