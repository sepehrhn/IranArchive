description: |-
  ⭕️
  جاویدنام: علیرضا فیلی،
  ۱۷ ساله، اهل ایلام، ساکن اندیشه، شهریار، تهران؛
  جاودانه شد: ۲۹ مهر ۱۴۰۱.

  در گوشی موبایل علیرضا ویدیویی از زدودن عکس خمینی و خامنه‌ای در مدرسه بود که باعث‌ شد تعدادی بسیجی با صورت پوشیده به مدرسه علیرضا یورش ببرند، او‌را مورد ضرب و شتم قرار دهند و گوشی‌اش را بگیرند و تهدیدش کنند.
  بعد از تهدید آنها علیرضا به درخواست پدرش به مدرسه نمی‌رود.
  روز ۲۹ مهر پدر علیرضا پیکر به دار آویخته شده فرزندش را در حالی پیدا کرد که دکمه‌های پیراهنش کنده شده بود، جیب پشتی شلوارش پاره شده بود و لباسهایش خاکی بود.
  پدر علیرضا خودکشی فرزندش را تکذیب کرد.
  علیرضای ۱۷ ساله را ربودند، شکنجه کردند، کشتند و بعد در مغازه پدرش طناب به دور گردنش انداختند که سناریو خودکشی بسازند.

