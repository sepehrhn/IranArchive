  Alireza Fili
  17 years old, from Ilam, resident of Andisheh, Shahryar, Tehran;
  He was killed on 21 October 2022.

  There was a video of Khomeini and Khamenei's photo being removed from the wall of a class room in a school. Because of this video, the Basij forces with covered faces attacked Alireza’s school, beat him, took his phone and threatened him.
  After their threats, Alireza did not go to school with his father’s consent.
  On 21st of October, Alireza's father found the hanged body of his son with his shirt buttons torn, the back pocket of his pants torn, and his clothes soiled.
  Alireza's father denied his son's suicide.
  17-year-old Alireza was kidnapped, tortured, killed, and then they tied a rope around his neck in his father's shop to create a suicide scenario.

