description: Car mechanic, 49 years old, married with children. Family found out on the night of the 19th that a war bullet had hit his side. Two agents were placed over him at Valiasr Hospital in Qaemshahr until he died from severe bleeding. Permission to bury was given with a commitment that he was a Basij member and had gone to the pharmacy to get medicine for his mother. He was a monarchist supporter from Dowatishah, resident of Mazandaran, buried in Imamzadeh Seyyed Mehdi, Mehdiabad, Arteh city.
