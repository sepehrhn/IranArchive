  Kabir Rigi,
  40 years old, from Shirabad, Zahedan;
  He was killed on 28 September 2022.

  During the nationwide anti-government protests, Kabir was hit by the bullets of Sepah (#IRGC)soldiers on September 28th in Zahedan and was killed.

