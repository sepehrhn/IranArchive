description: |-
  سید محمود زمزم  تیر ماه ۱۴۰۴ در منزل بازداشت شد و ماه‌ها بدون حکم در زندان نگه داشته شد.  دی ماه ۱۴۰۴ با ‌ احکام سنگین ۸ سال، ۵ سال و تبعید به بشاگرد استان هرمزگان مواجه شد. اتهاماتش شامل تبلیغ علیه نظام جمهوری اسلامی، اهانت به مقدسات و فعالیت به نفع گروه‌های معاند بوده است.  او ۴۹ سال دارد و پدر سه فرزند است. صدای او و خانواده‌اش باشیم.

