name: Quality Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, typecheck, build, and smoke test
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NUXT_PUBLIC_SITE_URL: https://iranarchive.net
          NUXT_PUBLIC_MEDIA_REPO_REF: ${{ github.sha }}
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
